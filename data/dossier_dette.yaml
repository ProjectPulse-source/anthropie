# Les six questions du dossier dette publique (la sixième, « Quels futurs ? », ajoutée le 09/11/2026), dans l'ordre de la barre. Source UNIQUE de leurs libellés :
# lue par la barre des pages (layouts/shortcodes/dossier-dette.html) et par la bande du dossier dans l'index /ressources/
# (layouts/ressources/list.html, `bande_donnees: dossier_dette`). Avant, les libellés n'existaient que dans le shortcode ;
# l'index en aurait porté une copie, qui aurait dérivé.
# titre : libellé de l'onglet (question courte) · court : téléphone · nom : question complète, lue par les lecteurs
# d'écran · role : sous-titre de l'onglet.
volets:
