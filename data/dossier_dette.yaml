    court: { fr: "Hausse", en: "Rise" }
    nom: { fr: "pourquoi la dette publique augmente-t-elle ?", en: "why does public debt rise?" }
    role: { fr: "dynamique", en: "dynamics" }
  - volet: "1"
    url: { fr: "/cout-de-la-dette-publique/", en: "/en/cost-of-french-public-debt/" }
    titre: { fr: "Combien coûte-t-elle ?", en: "What does it cost?" }
    court: { fr: "Coût", en: "Cost" }
    nom: { fr: "combien coûte la dette publique ?", en: "what does public debt cost?" }
    role: { fr: "charge d'intérêts", en: "interest burden" }
  - volet: "2"
    url: { fr: "/qui-paie-la-dette-publique/", en: "/en/who-really-pays-public-debt/" }
