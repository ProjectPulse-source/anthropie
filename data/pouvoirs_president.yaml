# ── Inventaire de l'article 19, ACTE PAR ACTE, en CITATIONS (arbitrages de phase A et de la relecture juridique) ──
# Le générateur (scripts/update_pouvoirs_president.py) relit le texte archivé de chaque article et ARRÊTE si une
# citation n'y figure pas mot pour mot (G2). Une case vide (null) dit seulement que l'article lui-même ne contient pas
# cet élément : elle ne dit rien d'autres articles, ni de la pratique.
# Un renvoi de l'article 19 peut contenir plusieurs actes (art. 8, 11, 18, 56 : deux chacun). `principal: true`
# désigne le premier acte que l'article attribue au président : c'est lui qui représente le renvoi dans le compte PAR
# RENVOI (convention du jeu publié le 06/10/2026, conservée par l'arbitrage de la relecture juridique).
# Colonnes (attributs cumulables, jamais exclusifs) :
#   acte           — ce que le texte fait faire au président ;
#   condition      — une proposition, une consultation ou un acte d'un autre acteur que le texte exige AVANT l'acte
#                    (définition élargie le 11/10 : la présentation de la démission, art. 8, est un acte du Premier
#                    ministre, ni une proposition ni une consultation) ;
#   autre_autorite — un autre acteur (autorité, électeurs) que le texte fait intervenir pour la suite ou l'issue, Y
#                    COMPRIS de façon facultative (art. 18 : débat possible, sans vote) ;
#   partage        — d'autres autorités disposent aussi de ce pouvoir, nommées par le texte ;
#   limite         — un autre encadrement écrit : temps, objet ou effet (n'entre dans aucun compte).
# Chaque citation porte : temporalite (avant | pendant | après | permanent), facultatif (true si le texte dit « peut »
# ou subordonne l'élément à une circonstance), justification (pourquoi cette colonne ; garde G6). `contexte` restitue
# entre crochets le sujet d'une citation coupée (B13). `vides` justifie les cases vides des colonnes condition,
# autre_autorite et limite (G6) : une case vide est une lecture, pas un oubli.
# Statut de chaque case : « lu sur le texte » par l'équipe de rédaction, jamais « validé » ; aucune relecture par un
# juriste à ce jour (décision humaine ouverte).
inventaire_19:
  - id: "8-nommer"
    renvoi: "8, al. 1"
    principal: true
    pouvoir: "Nommer le Premier ministre"
    ancre: nommer-premier-ministre
    acte: {art: "8", cite: "Le Président de la République nomme le Premier ministre."}
    condition: null
    autre_autorite: null
    partage: null
    limite: null
    vides:
      condition: "La première phrase de l'article 8 n'exige ni proposition, ni consultation, ni acte préalable d'un autre acteur."
      autre_autorite: "L'article 8 ne fait intervenir aucun autre acteur après la nomination ; la responsabilité du Gouvernement devant le Parlement relève de l'article 20 (deuxième niveau de lecture)."
      limite: "La phrase ne fixe ni délai, ni objet, ni effet à la nomination."
  - id: "8-fin"
    renvoi: "8, al. 1"
    pouvoir: "Mettre fin aux fonctions du Premier ministre"
    court: "Mettre fin aux fonctions du Premier ministre"
    ancre: nommer-premier-ministre
    acte: {art: "8", cite: "Il met fin à ses fonctions"}
    condition:
      - {art: "8", cite: "sur la présentation par celui-ci de la démission du Gouvernement", temporalite: avant, facultatif: false,
         justification: "Acte d'un autre acteur (le Premier ministre) que le texte exige avant la fin des fonctions : ni une proposition ni une consultation, d'où la définition élargie de la colonne."}
    autre_autorite: null
    partage: null
    limite: null
    vides:
      autre_autorite: "La deuxième phrase de l'article 8 ne fait intervenir personne après l'acte."
      limite: "Aucun délai, objet ou effet écrit ; l'obligation de démission de l'article 50 relève du deuxième niveau de lecture."
  - id: "11-projet"
    renvoi: "11"
    principal: true
    pouvoir: "Soumettre un projet de loi au référendum"
    court: "Référendum sur un projet de loi"
    ancre: referendum
    acte: {art: "11", cite: "peut soumettre au référendum tout projet de loi"}
    condition:
      - {art: "11", cite: "sur proposition du Gouvernement pendant la durée des sessions ou sur proposition conjointe des deux assemblées", temporalite: avant, facultatif: false,
         justification: "Proposition d'un autre acteur exigée avant que le président puisse soumettre le texte."}
    autre_autorite:
      - {art: "11", cite: "celui-ci fait, devant chaque assemblée, une déclaration qui est suivie d'un débat", contexte: "le Gouvernement, lorsque le référendum est organisé sur sa proposition", temporalite: après, facultatif: false,
         justification: "Le Gouvernement et les assemblées interviennent après la décision de soumettre, lorsque le référendum est organisé sur proposition du Gouvernement."}
      - {art: "11", cite: "Lorsque le référendum a conclu à l'adoption du projet ou de la proposition de loi", temporalite: après, facultatif: false,
         justification: "Les électeurs décident de l'issue."}
    partage: null
    limite:
      - {art: "11", cite: "portant sur l'organisation des pouvoirs publics, sur des réformes relatives à la politique économique, sociale ou environnementale de la nation et aux services publics qui y concourent", temporalite: permanent, facultatif: false,
         justification: "Objet limité par le texte."}
      - {art: "11", cite: "le Président de la République promulgue la loi dans les quinze jours qui suivent la proclamation des résultats de la consultation", temporalite: après, facultatif: false,
         justification: "La promulgation est un acte du président, non d'un autre acteur ; le texte l'enferme dans un délai : limite de temps."}
  - id: "11-initiative"
    renvoi: "11"
    pouvoir: "Soumettre au référendum une proposition de loi d'initiative partagée"
    court: "Référendum d'initiative partagée"
    ancre: referendum
    acte: {art: "11", cite: "le Président de la République la soumet au référendum"}
    condition:
      - {art: "11", cite: "à l'initiative d'un cinquième des membres du Parlement, soutenue par un dixième des électeurs inscrits sur les listes électorales", temporalite: avant, facultatif: false,
         justification: "Initiative de parlementaires soutenue par des électeurs, exigée avant l'acte."}
      - {art: "11", cite: "celles dans lesquelles le Conseil constitutionnel contrôle le respect des dispositions de l'alinéa précédent", temporalite: avant, facultatif: false,
         justification: "Contrôle du Conseil constitutionnel prévu avant la soumission."}
      - {art: "11", cite: "Si la proposition de loi n'a pas été examinée par les deux assemblées dans un délai fixé par la loi organique", temporalite: avant, facultatif: false,
         justification: "L'acte suppose que les deux assemblées n'aient pas examiné la proposition : compétence liée du président (« la soumet »)."}
    autre_autorite:
      - {art: "11", cite: "Lorsque la proposition de loi n'est pas adoptée par le peuple français", temporalite: après, facultatif: false,
         justification: "Les électeurs décident de l'issue."}
    partage: null
    limite:
      - {art: "11", cite: "ne peut avoir pour objet l'abrogation d'une disposition législative promulguée depuis moins d'un an", temporalite: permanent, facultatif: false,
         justification: "Limite d'objet."}
      - {art: "11", cite: "aucune nouvelle proposition de référendum portant sur le même sujet ne peut être présentée avant l'expiration d'un délai de deux ans suivant la date du scrutin", temporalite: après, facultatif: false,
         justification: "Limite de temps après un rejet."}
  - id: "12"
    renvoi: "12"
    principal: true
    pouvoir: "Dissoudre l'Assemblée nationale"
    ancre: dissolution
    acte: {art: "12", cite: "prononcer la dissolution de l'Assemblée nationale"}
    condition:
      - {art: "12", cite: "après consultation du Premier ministre et des Présidents des Assemblées", temporalite: avant, facultatif: false,
         justification: "Consultation exigée avant l'acte ; le texte n'exige pas d'accord."}
    autre_autorite:
      - {art: "12", cite: "Les élections générales ont lieu", temporalite: après, facultatif: false,
         justification: "Les électeurs interviennent pour la suite."}
      - {art: "12", cite: "L'Assemblée nationale se réunit de plein droit le deuxième jeudi qui suit son élection.", temporalite: après, facultatif: false,
         justification: "La nouvelle Assemblée se réunit sans convocation du président : seconde intervention écrite pour la suite."}
    partage: null
    limite:
      - {art: "12", cite: "vingt jours au moins et quarante jours au plus après la dissolution", temporalite: après, facultatif: false,
         justification: "Délai des élections : limite de temps."}
      - {art: "12", cite: "Il ne peut être procédé à une nouvelle dissolution dans l'année qui suit ces élections.", temporalite: après, facultatif: false,
         justification: "Limite de temps sur l'acte suivant."}
  - id: "16"
    renvoi: "16"
    principal: true
    pouvoir: "Exercer les pouvoirs exceptionnels"
    ancre: pouvoirs-exceptionnels
    acte: {art: "16", cite: "le Président de la République prend les mesures exigées par ces circonstances"}
    condition:
      - {art: "16", cite: "après consultation officielle du Premier ministre, des Présidents des Assemblées ainsi que du Conseil constitutionnel", temporalite: avant, facultatif: false,
         justification: "Premier temps, la décision d'y recourir : consultation exigée avant."}
      - {art: "16", cite: "Le Conseil constitutionnel est consulté à leur sujet.", contexte: "les mesures", temporalite: pendant, facultatif: false,
         justification: "Deuxième temps, les mesures : consultation du Conseil constitutionnel sur chacune, distincte de la consultation initiale."}
    autre_autorite:
      - {art: "16", cite: "Le Parlement se réunit de plein droit.", temporalite: pendant, facultatif: false,
         justification: "Le Parlement intervient de droit pendant l'exercice des pouvoirs."}
      - {art: "16", cite: "le Conseil constitutionnel peut être saisi par le Président de l'Assemblée nationale, le Président du Sénat, soixante députés ou soixante sénateurs", contexte: "après trente jours", temporalite: après, facultatif: true,
         justification: "Troisième temps, le maintien : saisine possible par d'autres acteurs après trente jours."}
      - {art: "16", cite: "Il procède de plein droit à cet examen et se prononce dans les mêmes conditions au terme de soixante jours d'exercice des pouvoirs exceptionnels", contexte: "le Conseil constitutionnel", temporalite: après, facultatif: false,
         justification: "Troisième temps, le maintien : examen de plein droit, avis public ; l'article ne donne à cet avis aucun effet qui mette fin aux pouvoirs exceptionnels."}
    partage: null
    limite:
      - {art: "16", cite: "d'une manière grave et immédiate et que le fonctionnement régulier des pouvoirs publics constitutionnels est interrompu", temporalite: avant, facultatif: false,
         justification: "Conditions de fond cumulées : ni proposition ni consultation, donc encadrement d'objet."}
      - {art: "16", cite: "dans les moindres délais", temporalite: pendant, facultatif: false,
         justification: "But assigné aux mesures : encadrement d'objet et de temps."}
      - {art: "16", cite: "L'Assemblée nationale ne peut être dissoute pendant l'exercice des pouvoirs exceptionnels.", temporalite: pendant, facultatif: false,
         justification: "Effet sur un autre pouvoir du président."}
  - id: "18-message"
    renvoi: "18"
    principal: true
    pouvoir: "Adresser un message au Parlement"
    ancre: messages-parlement
