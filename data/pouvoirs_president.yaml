# Base des pouvoirs du président de la République — source unique de la page
# /pouvoirs-du-president-de-la-republique/ (shortcode pouvoirs-president).
#
# Décision : registre GEO-PLUS, D3, tour 5 (D:\PRO\06_PROMOTION\ARBITRAGE_CONTRE_EXPERTISE_GEO-PLUS_2026-09-29.md).
# PÉRIMÈTRE FERMÉ : les pouvoirs que la page traite, pas une encyclopédie constitutionnelle.
#   - sans_contreseing : la liste de l'article 19, complète (art. 8 al. 1, 11, 12, 16, 18, 54, 56, 61) ;
#   - contresigne      : les pouvoirs que les lecteurs croient propres alors qu'ils sont contresignés ;
#   - gouvernement     : ce que la Constitution confie au Gouvernement et au Premier ministre.
#
# RÈGLE DE PREUVE : chaque article cité est LU sur Légifrance (API PISTE, MCP `sources`, outil
# legifrance_article), dans sa version en vigueur, au moment d'écrire. `lu_le` porte la date de
# lecture, `empreinte` le SHA-256 de la réponse archivée par l'outil. Une entrée dont un article
# n'a pas de `lu_le` NE S'AFFICHE PAS, et le build l'annonce (warnf).
#
# Rédaction : les champs ne disent que ce que le texte dit. Pratique, doctrine et jurisprudence
# n'y entrent pas tant qu'elles n'ont pas été lues à leur source ; là où le texte se tait, le
# champ le dit (« le texte ne précise pas… »).
#
# portee_texte : ce que l'acte produit, dit en une phrase fidèle au texte. La catégorie exclusive de « portée »
#   (produit, déclenche, nomme, saisit) a été RETIRÉE le 05/10/2026 : des catégories exclusives fabriquaient un
#   résultat (arbitrage PRO-20261005-164029, P3). Les attributs cumulables sont dans inventaire_19.

