# Base des pouvoirs du président de la République — source unique de la page
# /pouvoirs-du-president-de-la-republique/ (shortcode pouvoirs-president).
#
# Décision : registre GEO-PLUS, D3, tour 5 (D:\PRO\06_PROMOTION\ARBITRAGE_CONTRE_EXPERTISE_GEO-PLUS_2026-09-29.md).
# Refonte du 11/10/2026 (phase B) : arbitrages D:\PRO\06_PROMOTION\RECHERCHE_LYCEES_LECTURE_2026-10-09\REFONTE_PILOTE\
# PRESIDENT\ARBITRAGE_CE_PRESIDENT_PHASE_A.md et ARBITRAGE_CE_PRESIDENT_RELECTURE_JURIDIQUE.md (le second l'emporte).
# PÉRIMÈTRE FERMÉ : les pouvoirs que la page traite, pas une encyclopédie constitutionnelle.
#   - sans_contreseing : la liste de l'article 19, complète (art. 8 al. 1, 11, 12, 16, 18, 54, 56, 61) ;
#   - contresigne      : les pouvoirs que les lecteurs croient propres alors qu'ils sont contresignés ;
#   - gouvernement     : ce que la Constitution confie au Gouvernement et au Premier ministre.
#
# TROIS NIVEAUX DE LECTURE (arbitrage de phase A, Q4) : niveau 1, le texte de l'article visé par l'article 19 (seul
# périmètre de la matrice et des comptes) ; niveau 2, la chaîne constitutionnelle et organique (champ `chaine` des
# fiches) ; niveau 3, l'exercice politique, la jurisprudence et la pratique (prose de la page, jamais dans un compte).
#
# RÈGLE DE PREUVE : chaque texte cité est LU sur Légifrance (API PISTE, MCP `sources`, outils legifrance_article et
# décision du Conseil d'État), dans sa version en vigueur, au moment d'écrire. `lu_le` porte la date de lecture,
# `empreinte` le SHA-256 de la réponse archivée par l'outil (D:/PRO/02_FABRIQUE/sources/archive/<mois>/). Une entrée
# dont un texte n'a pas de `lu_le` NE S'AFFICHE PAS, et le build l'annonce (warnf).
#   Clé = numéro d'article de la Constitution, ou identifiant propre (ord58-1067-1…) avec `num` = numéro dans son
#   texte ; `texte` = libellé de la source ; `etat` (VIGUEUR par défaut) = état attendu dans l'archive (une version
#   ancienne se déclare MODIFIE) ; `cetatext` = décision de justice (base JADE) ; `ordre` = rang dans la liste des
#   sources de la page.
#
# Rédaction : les champs ne disent que ce que le texte dit. Pratique, doctrine et jurisprudence n'y entrent pas tant
# qu'elles n'ont pas été lues à leur source ; là où le texte se tait, le champ le dit (« le texte ne précise pas… »).
# INTERDIT (arbitrage de la relecture juridique, garde G5) : « sans tiers », « aucun tiers », « ni tiers » au sens
# général ; dire « sans proposition, consultation ou acte d'un autre acteur avant l'acte, ni intervention prévue d'un
# autre acteur pour la suite ».

