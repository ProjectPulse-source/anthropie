    condition: null
    autre_autorite: null
    partage: null
    limite:
      - {art: "56", cite: "Il a voix prépondérante en cas de partage.", contexte: "le président du Conseil", temporalite: permanent, facultatif: false,
         justification: "Effet de la désignation."}
    vides:
      condition: "La procédure de l'article 13 est « applicable à ces nominations », celles des membres ; l'article 56 n'en prévoit aucune pour la désignation du président du Conseil, qui n'est pas non plus dans la liste de la loi organique n° 2010-837."
      autre_autorite: "Aucun autre acteur n'intervient après la désignation dans l'article 56. Le choix parmi les membres est une contrainte organique (ord. 58-1067, art. 1), au deuxième niveau de lecture."
  - id: "61"
    renvoi: "61"
    principal: true
    pouvoir: "Déférer une loi au Conseil constitutionnel"
    ancre: saisir-cc-loi
    acte: {art: "61", cite: "les lois peuvent être déférées au Conseil constitutionnel, avant leur promulgation, par le Président de la République"}
    condition: null
    autre_autorite:
      - {art: "61", cite: "le Conseil constitutionnel doit statuer dans le délai d'un mois", temporalite: après, facultatif: false,
         justification: "Le Conseil constitutionnel décide de l'issue."}
    partage:
      - {art: "61", cite: "le Premier ministre, le Président de l'Assemblée nationale, le Président du Sénat ou soixante députés ou soixante sénateurs", temporalite: permanent, facultatif: false,
         justification: "D'autres autorités peuvent déférer de même."}
    limite:
      - {art: "61", cite: "avant leur promulgation", temporalite: avant, facultatif: false,
         justification: "Limite de temps de la saisine."}
      - {art: "61", cite: "la saisine du Conseil constitutionnel suspend le délai de promulgation", temporalite: après, facultatif: false,
         justification: "Effet juridique de la saisine, non un acteur."}
    vides:
      condition: "Aucune proposition ni consultation n'est exigée pour déférer."

# ── Qui fixe les règles (attribution POSITIVE par le texte ; aucune phrase « il ne peut pas ») ──
regles:
  - {art: "34", cite: "La loi fixe les règles concernant", objet: "les matières de l'article 34, dont l'impôt"}
  - {art: "34", cite: "l'assiette, le taux et les modalités de recouvrement des impositions de toutes natures", objet: "l'impôt"}
  - {art: "37", cite: "Les matières autres que celles qui sont du domaine de la loi ont un caractère réglementaire.", objet: "le reste"}
  - {art: "21", cite: "il exerce le pouvoir réglementaire", objet: "le Premier ministre"}
  - {art: "38", cite: "Le Gouvernement peut, pour l'exécution de son programme, demander au Parlement l'autorisation de prendre par ordonnances, pendant un délai limité, des mesures qui sont normalement du domaine de la loi.", objet: "les ordonnances"}
  - {art: "13", cite: "Le Président de la République signe les ordonnances et les décrets délibérés en Conseil des ministres.", objet: "le président, pour une catégorie de décrets"}
  - {art: "19", cite: "sont contresignés par le Premier ministre et, le cas échéant, par les ministres responsables", objet: "le contreseing"}
  - {art: "49", cite: "Dans ce cas, ce projet est considéré comme adopté, sauf si une motion de censure, déposée dans les vingt-quatre heures qui suivent, est votée", objet: "la loi de finances adoptée sans vote sur le texte (art. 49, al. 3)"}
  - {art: "47", cite: "Si le Parlement ne s'est pas prononcé dans un délai de soixante-dix jours, les dispositions du projet peuvent être mises en vigueur par ordonnance.", objet: "la loi de finances mise en vigueur par ordonnance"}

groupes:
  - id: sans_contreseing
    titre: "Les actes que le président signe sans contreseing"
    chapo: "L'article 19 les énumère : ce sont les seuls actes du président que ni le Premier ministre ni un ministre ne contresignent. Sans contreseing ne veut pas dire sans condition."
  - id: contresigne
    titre: "Les pouvoirs qu'on lui prête en propre, et qui sont contresignés"
    chapo: "Les autres actes du président sont soumis au contreseing du Premier ministre et, le cas échéant, des ministres responsables (art. 19)."
  - id: gouvernement
    titre: "Ce que la Constitution confie au Gouvernement"
    chapo: "Plusieurs décisions que l'on attribue au président appartiennent, dans le texte, au Gouvernement ou au Premier ministre."

# Fiches : bref (réponse courte, seule visible ; le reste de la fiche se lit en repli) · décide (qui décide) · condition (ce que le texte exige avant l'acte) · tiers (qui intervient ensuite) ·
# portee_texte (ce que l'acte produit) · chaine (facultatif : au-delà de l'article, niveau 2 ou jurisprudence lue).
# Toute citation entre « » figure mot pour mot (casse près) dans l'un des textes de `articles` (garde G2 étendue).
pouvoirs:
  # ── Sans contreseing (art. 19) ──────────────────────────────────────────────
  - id: nommer-premier-ministre
    groupe: sans_contreseing
    question: "Le président peut-il nommer et renvoyer le Premier ministre ?"
    bref: "Nommer, oui : sa seule signature suffit. Renvoyer, non : l'article 8 ne prévoit que la démission que le Premier ministre présente. L'article 50 l'oblige à la présenter quand l'Assemblée nationale vote la censure ; ce n'est pas une révocation par le président."
    pouvoir: "Nommer le Premier ministre, mettre fin à ses fonctions"
    articles: ["8", "19", "20", "50"]
    decide: "Le président, pour deux actes de l'article 8 : « Le Président de la République nomme le Premier ministre. Il met fin à ses fonctions sur la présentation par celui-ci de la démission du Gouvernement. »"
    condition: "Pour nommer, l'article 8 n'exige ni proposition ni consultation. Pour mettre fin aux fonctions, il exige un acte du Premier ministre : la présentation de la démission du Gouvernement."
    tiers: "L'article 8 ne fait intervenir aucun autre acteur après la nomination. Le Gouvernement nommé est responsable devant le Parlement « dans les conditions et suivant les procédures prévues aux articles 49 et 50 » (art. 20)."
    portee_texte: "La nomination prend effet par sa seule signature. Pour la fin des fonctions, la présentation de la démission est la seule voie que l'article 8 décrit."
    chaine: "L'article 50 décrit le cas où cette démission devient obligatoire : lorsque l'Assemblée nationale adopte une motion de censure ou désapprouve le programme ou une déclaration de politique générale, « le Premier ministre doit remettre au Président de la République la démission du Gouvernement ». L'obligation pèse sur le Premier ministre et naît d'un vote de l'Assemblée : ce n'est pas une révocation par le président."

  - id: referendum
    groupe: sans_contreseing
    question: "Le président peut-il organiser un référendum seul ?"
    bref: "Pas de sa seule initiative : il faut une proposition du Gouvernement ou des deux assemblées, ou bien une initiative d'un cinquième des parlementaires soutenue par un dixième des électeurs inscrits. Ce sont ensuite les électeurs qui tranchent, et seulement sur les sujets que l'article énumère."
    pouvoir: "Soumettre un texte au référendum (article 11)"
    articles: ["11", "19", "60", "61", "7", "ord58-1067-46"]
    decide: "Le président soumet le texte au référendum ; les électeurs l'adoptent ou le rejettent."
    condition: "Deux voies. Pour un projet de loi, une proposition du Gouvernement « pendant la durée des sessions » ou une proposition conjointe des deux assemblées, publiées au Journal officiel. Pour une proposition de loi d'initiative partagée, l'initiative « d'un cinquième des membres du Parlement, soutenue par un dixième des électeurs inscrits sur les listes électorales », le contrôle du Conseil constitutionnel, puis l'absence d'examen par les deux assemblées dans le délai de la loi organique."
    tiers: "Lorsque le référendum est organisé sur proposition du Gouvernement, celui-ci fait devant chaque assemblée « une déclaration qui est suivie d'un débat ». Puis les électeurs votent. Si le texte est adopté, le président « promulgue la loi dans les quinze jours qui suivent la proclamation des résultats de la consultation » : la promulgation est son acte, enfermé dans un délai."
    portee_texte: "L'objet est limité : organisation des pouvoirs publics, réformes relatives à la politique économique, sociale ou environnementale et aux services publics qui y concourent, autorisation de ratifier certains traités. Dans l'initiative partagée, le texte l'oblige : si les deux assemblées n'ont pas examiné la proposition dans le délai, il « la soumet » au référendum."
    chaine: "Le Conseil constitutionnel « veille à la régularité des opérations de référendum » et en proclame les résultats (art. 60) ; il « est consulté par le Gouvernement sur l'organisation des opérations de référendum » (ordonnance n° 58-1067, art. 46) ; il contrôle les propositions d'initiative partagée « avant qu'elles ne soient soumises au référendum » (art. 61). En cas de vacance ou d'empêchement, les fonctions du président sont exercées par intérim, « à l'exception de celles prévues aux articles 11 et 12 » (art. 7)."

  - id: dissolution
    groupe: sans_contreseing
    question: "Le président peut-il dissoudre l'Assemblée nationale sans l'accord du Premier ministre ?"
    bref: "Oui, sans l'accord de personne : il doit seulement consulter le Premier ministre et les présidents des deux assemblées. Les électeurs votent ensuite, vingt à quarante jours plus tard, et une nouvelle dissolution est impossible dans l'année qui suit ces élections."
    pouvoir: "Dissoudre l'Assemblée nationale"
    articles: ["12", "16", "7", "19"]
    decide: "Le président."
    condition: "Il doit consulter le Premier ministre et les présidents des assemblées : « après consultation du Premier ministre et des Présidents des Assemblées ». La consultation est exigée, pas l'accord."
    tiers: "Les électeurs : « Les élections générales ont lieu vingt jours au moins et quarante jours au plus après la dissolution. » Puis la nouvelle Assemblée « se réunit de plein droit le deuxième jeudi qui suit son élection »."
    portee_texte: "La dissolution prend effet par sa seule décision ; la majorité qui sortira des urnes appartient aux électeurs. « Il ne peut être procédé à une nouvelle dissolution dans l'année qui suit ces élections. »"
    chaine: "« L'Assemblée nationale ne peut être dissoute pendant l'exercice des pouvoirs exceptionnels » (art. 16). En cas de vacance ou d'empêchement, les fonctions du président sont exercées par intérim, « à l'exception de celles prévues aux articles 11 et 12 » (art. 7)."

  - id: pouvoirs-exceptionnels
    groupe: sans_contreseing
    question: "Que sont les pouvoirs exceptionnels de l'article 16 ?"
    bref: "Ce sont les mesures que le président peut prendre face à une menace grave et immédiate, quand les pouvoirs publics ne fonctionnent plus régulièrement, et seulement après des consultations officielles. Le Parlement se réunit alors de plein droit ; le Conseil constitutionnel peut être saisi après trente jours pour examiner si les conditions demeurent, et procède à cet examen de plein droit après soixante. Le texte ne donne à son avis aucun effet qui mette fin à ces pouvoirs."
    pouvoir: "Exercer les pouvoirs exceptionnels"
    articles: ["16", "19", "ce-1962-rubin"]
    decide: "Le président prend « les mesures exigées par ces circonstances »."
    condition: "Trois temps. Pour y recourir, deux conditions cumulées — une menace grave et immédiate sur les institutions, l'indépendance de la Nation, l'intégrité du territoire ou l'exécution des engagements internationaux, et l'interruption du « fonctionnement régulier des pouvoirs publics constitutionnels » — et la « consultation officielle du Premier ministre, des Présidents des Assemblées ainsi que du Conseil constitutionnel ». Pour chaque mesure : « Le Conseil constitutionnel est consulté à leur sujet. »"
    tiers: "« Le Parlement se réunit de plein droit. » Pour le maintien : après trente jours, le Conseil constitutionnel peut être saisi par le président de l'Assemblée nationale, le président du Sénat, soixante députés ou soixante sénateurs, pour examiner si les conditions demeurent réunies ; il le fait de plein droit après soixante jours et à tout moment au-delà, et se prononce « par un avis public »."
    portee_texte: "Le pouvoir est borné par son but : rendre aux pouvoirs publics, « dans les moindres délais », les moyens d'accomplir leur mission. Sa durée est examinée par le Conseil constitutionnel ; l'article ne donne à cet avis public aucun effet qui mette fin aux pouvoirs exceptionnels."
    chaine: "Le juge administratif s'est déclaré incompétent pour la décision d'y recourir, acte de gouvernement « dont il n'appartient au Conseil d'Etat ni d'apprécier la légalité, ni de contrôler la durée d'application », et pour une mesure prise dans les matières de l'article 34, qui « présente le caractère d'un acte législatif » (Conseil d'État, Assemblée, 2 mars 1962, Rubin de Servens)."

  - id: messages-parlement
    groupe: sans_contreseing
    question: "Le président peut-il s'adresser au Parlement ?"
    bref: "Oui, de deux façons : un message lu devant les deux assemblées, ou une déclaration devant le Parlement réuni en Congrès. Aucun vote ne suit ; seule la déclaration peut être suivie d'un débat, hors de sa présence."
    pouvoir: "Adresser un message au Parlement, parler devant le Congrès"
    articles: ["18", "19"]
    decide: "Le président, sous deux formes : des messages « qu'il fait lire » aux deux assemblées, ou une déclaration devant le Parlement « réuni à cet effet en Congrès »."
    condition: "L'article n'exige ni proposition ni consultation, pour l'une comme pour l'autre. Hors session, les assemblées « sont réunies spécialement à cet effet »."
    tiers: "Le message est lu devant les assemblées, et ces messages « ne donnent lieu à aucun débat ». La déclaration devant le Congrès peut être suivie, « hors sa présence », d'un débat « qui ne fait l'objet d'aucun vote » : une intervention possible, non obligatoire."
    portee_texte: "L'effet est celui d'une parole : aucun vote ne suit, ni sur le message ni sur la déclaration."

  - id: saisir-cc-traite
    groupe: sans_contreseing
    question: "Le président peut-il faire contrôler seul un traité ?"
    bref: "Il peut saisir le Conseil constitutionnel, comme le Premier ministre, le président de chaque assemblée, soixante députés ou soixante sénateurs ; c'est le Conseil qui décide. Si une clause est jugée contraire à la Constitution, la ratification attend une révision de la Constitution."
    pouvoir: "Saisir le Conseil constitutionnel d'un engagement international"
    articles: ["54", "19"]
    decide: "Le Conseil constitutionnel."
    condition: "Rien n'est exigé avant la saisine. Le Premier ministre, le président de chaque assemblée, soixante députés ou soixante sénateurs peuvent aussi saisir le Conseil."
    tiers: "Le Conseil constitutionnel, qui examine ; puis, s'il déclare une clause contraire à la Constitution, le pouvoir constituant, puisque l'autorisation de ratifier « ne peut intervenir qu'après la révision de la Constitution »."
    portee_texte: "Le président obtient l'examen, pas la décision."

  - id: nommer-conseil-constitutionnel
    groupe: sans_contreseing
    question: "Qui nomme les membres du Conseil constitutionnel ?"
    bref: "Il nomme trois des neuf membres, mais les commissions des deux assemblées peuvent l'empêcher si leurs votes négatifs, additionnés, atteignent trois cinquièmes des suffrages exprimés. Il désigne aussi le président du Conseil, sans avis préalable, mais parmi les membres du Conseil."
    pouvoir: "Nommer trois membres du Conseil constitutionnel, désigner son président"
    articles: ["56", "13", "19", "ord58-1067-1"]
    decide: "Deux actes distincts. Le président nomme trois des neuf membres ; trois autres sont nommés par le président de l'Assemblée nationale, trois par le président du Sénat. Il désigne aussi le président du Conseil : « Le Président est nommé par le Président de la République. »"
    condition: "Pour les trois membres, avant la nomination, « la procédure prévue au dernier alinéa de l'article 13 est applicable à ces nominations » : avis public de la commission compétente de chaque assemblée, et nomination impossible « lorsque l'addition des votes négatifs dans chaque commission représente au moins trois cinquièmes des suffrages exprimés au sein des deux commissions » (art. 13). Pour la désignation du président du Conseil, l'article 56 ne prévoit aucun avis."
    tiers: "Après la nomination, l'article 56 ne fait intervenir aucun autre acteur. Le mandat des membres « dure neuf ans et n'est pas renouvelable » ; le président du Conseil « a voix prépondérante en cas de partage »."
    portee_texte: "Le choix lui appartient ; pour les membres, une opposition qualifiée des deux commissions peut l'empêcher."
    chaine: "Le président du Conseil est « nommé par décision du Président de la République » et « choisi parmi les membres du conseil, nommés ou de droit » (ordonnance n° 58-1067, art. 1) : la désignation porte sur une personne déjà membre, nommée ou membre de droit comme les anciens présidents de la République."

  - id: saisir-cc-loi
    groupe: sans_contreseing
    question: "Le président peut-il faire contrôler une loi avant sa promulgation ?"
    bref: "Avant la promulgation, il peut déférer une loi au Conseil constitutionnel, comme d'autres autorités. C'est le Conseil qui juge, en un mois, si elle est conforme à la Constitution, et la saisine suspend le délai de promulgation."
    pouvoir: "Déférer une loi au Conseil constitutionnel avant sa promulgation"
    articles: ["61", "10", "19"]
    decide: "Le Conseil constitutionnel, qui se prononce sur la conformité de la loi à la Constitution."
    condition: "Aucune proposition ni consultation n'est exigée ; le moment est écrit : « avant leur promulgation ». Le Premier ministre, les présidents des deux assemblées, soixante députés ou soixante sénateurs peuvent aussi déférer la loi."
    tiers: "Le Conseil constitutionnel, qui « doit statuer dans le délai d'un mois » (huit jours en cas d'urgence, à la demande du Gouvernement)."
    portee_texte: "La saisine « suspend le délai de promulgation ». Elle obtient un contrôle de constitutionnalité, pas un jugement d'opportunité."

  # ── Contresignés ────────────────────────────────────────────────────────────
  - id: nommer-ministres
    groupe: contresigne
    question: "Le président choisit-il seul les ministres ?"
    bref: "Non : il nomme les ministres et met fin à leurs fonctions sur la proposition du Premier ministre, qui contresigne."
    pouvoir: "Nommer les ministres et mettre fin à leurs fonctions"
    articles: ["8", "19"]
    decide: "Le président, « sur la proposition du Premier ministre » (art. 8, al. 2)."
    condition: "Une proposition du Premier ministre."
    tiers: "Le Premier ministre, qui propose et contresigne."
    portee_texte: "Ni la nomination ni le renvoi d'un ministre ne sont dans la liste de l'article 19."

  - id: promulguer
    groupe: contresigne
    question: "Le président peut-il refuser de promulguer une loi ?"
    bref: "Le texte ne prévoit pas de veto : il doit promulguer dans les quinze jours, délai que suspend une saisine du Conseil constitutionnel (article 61). Il peut seulement demander une nouvelle délibération, que le Parlement ne peut refuser et dont l'issue lui appartient."
    pouvoir: "Promulguer les lois, demander une nouvelle délibération"
    articles: ["10", "61", "19"]
    decide: "Le président promulgue ; le Parlement délibère à nouveau s'il le demande."
    condition: "Aucune proposition ni consultation n'est exigée avant l'acte."
    tiers: "Le Parlement : la nouvelle délibération « ne peut être refusée », et c'est lui qui vote à nouveau."
    portee_texte: "Il promulgue dans les quinze jours qui suivent la transmission de la loi définitivement adoptée ; avant l'expiration de ce délai, il peut demander une nouvelle délibération de la loi ou de certains articles. Le texte fixe ce délai et ouvre une seconde lecture, dont l'issue appartient au Parlement ; il ne prévoit pas de veto. Saisi avant la promulgation, le Conseil constitutionnel la retarde : la saisine « suspend le délai de promulgation » (art. 61)."

  - id: decrets-ordonnances
    groupe: contresigne
    question: "Le président peut-il gouverner par décret ?"
    bref: "En partie. Il signe les ordonnances et les décrets délibérés en Conseil des ministres, contresignés par le Premier ministre et les ministres responsables ; les autres décrets réglementaires relèvent du Premier ministre."
    pouvoir: "Signer les ordonnances et les décrets délibérés en Conseil des ministres"
    articles: ["13", "9", "21", "19", "ce-1992-meyet", "ce-2024-470962"]
    decide: "Le président signe « les ordonnances et les décrets délibérés en Conseil des ministres », qu'il préside (art. 9). Les autres décrets réglementaires relèvent du Premier ministre, qui exerce le pouvoir réglementaire « sous réserve des dispositions de l'article 13 » (art. 21)."
    condition: "Une délibération en Conseil des ministres. Un décret ainsi délibéré doit être signé par le président « alors même qu'aucun texte n'imposait cette délibération » (Conseil d'État, Assemblée, 10 septembre 1992, Meyet ; règle reprise le 5 février 2024)."
    tiers: "Le Premier ministre et les ministres responsables, qui contresignent."
    portee_texte: "La frontière passe par ce qui est délibéré en Conseil des ministres. Le texte dit « signe » ; il ne précise pas si le président peut refuser."
    chaine: "Les dispositions d'un décret délibéré en Conseil des ministres ne peuvent, « en principe », être modifiées que par un décret délibéré de même ; il en va autrement si ce décret prévoit qu'elles peuvent l'être « par décret en Conseil d'Etat ou par décret simple », ou si leur codification montre qu'elles en relèvent (Conseil d'État, 5 février 2024, n° 470962)."

  - id: nominations-emplois
    groupe: contresigne
    question: "Le président nomme-t-il seul les hauts fonctionnaires ?"
    bref: "Non. Ses nominations sont contresignées, et il n'est pas seul à nommer : le Premier ministre nomme aussi aux emplois civils et militaires, sous réserve de l'article 13 (article 21), et une partie des nominations du président peut lui être déléguée. Certaines passent en outre par un avis des commissions parlementaires ou par le Conseil supérieur de la magistrature."
    pouvoir: "Nommer aux emplois civils et militaires de l'État"
    articles: ["13", "21", "19", "65", "ord58-1136-1", "ord58-1136-2", "ord58-1136-3"]
    decide: "Le président : « Il nomme aux emplois civils et militaires de l'Etat » (art. 13). En Conseil des ministres pour les emplois que l'article 13 énumère (conseillers d'État, ambassadeurs, préfets, recteurs, directeurs d'administration centrale, officiers généraux…) et ceux qu'une loi organique y ajoute ; par décret du président pour d'autres. Pour les autres emplois, l'exercice de ce pouvoir peut être délégué au Premier ministre, qui nomme « sous réserve des dispositions de l'article 13 » (art. 21)."
    condition: "Délibération en Conseil des ministres pour les emplois énumérés. Pour les emplois qu'une loi organique désigne, avis public de la commission compétente de chaque assemblée, qui peut empêcher la nomination par trois cinquièmes des suffrages exprimés. Pour les magistrats du siège, le Conseil supérieur de la magistrature « fait des propositions » (Cour de cassation, premiers présidents de cour d'appel, présidents de tribunal) ou rend un « avis conforme » ; pour ceux du parquet, il « donne son avis » (art. 65)."
    tiers: "Le Premier ministre et les ministres responsables, qui contresignent."
    portee_texte: "Dans le texte, le pouvoir de nomination est général ; il est contresigné, peut être délégué au Premier ministre et, pour certains emplois, passe par un avis parlementaire ou par le Conseil supérieur de la magistrature."
    chaine: "L'ordonnance n° 58-1136 (loi organique) ajoute des emplois pourvus en Conseil des ministres (art. 1) ; fait nommer « par décret du Président de la République » les membres du Conseil d'État et de la Cour des comptes, les magistrats de l'ordre judiciaire, les professeurs de l'enseignement supérieur et les officiers (art. 2) ; permet que la nomination aux autres emplois soit déléguée au Premier ministre « par décret du Président de la République » (art. 3)."

  - id: chef-des-armees
    groupe: contresigne
    question: "Le président décide-t-il seul en matière militaire ?"
    bref: "Il est le chef des armées, mais le Gouvernement dispose de la force armée et le Premier ministre est responsable de la Défense nationale ; ses actes sont contresignés."
    pouvoir: "Chef des armées"
    articles: ["15", "20", "21", "19"]
    decide: "Le président est le chef des armées et préside les conseils et comités supérieurs de la Défense nationale (art. 15)."
    condition: "Aucune proposition ni consultation n'est écrite pour la qualité de chef des armées ; ses actes sont contresignés."
    tiers: "Le Gouvernement « dispose […] de la force armée » (art. 20) ; le Premier ministre « est responsable de la Défense nationale » (art. 21)."
    portee_texte: "La Constitution répartit le militaire entre trois titres : chef des armées, disposition de la force armée, responsabilité de la Défense nationale. Aucun ne se lit seul."

  - id: grace
    groupe: contresigne
    question: "Le président peut-il gracier seul ?"
    bref: "Non, pas par sa seule signature. Le président décide de la grâce, uniquement à titre individuel, mais l'acte doit être contresigné."
    pouvoir: "Droit de grâce"
    articles: ["17", "17-1958", "19"]
    decide: "Le président."
    condition: "Aucune proposition ni consultation n'est exigée avant l'acte."
    tiers: "Le Premier ministre et le ministre responsable, qui contresignent."
    portee_texte: "Le texte en borne l'objet : « à titre individuel », précision ajoutée en 2008 (le texte de 1958 disait seulement qu'il « a le droit de faire grâce »). Un pouvoir personnel dans l'image, un acte contresigné dans le texte."

  - id: traites
    groupe: contresigne
    question: "Le président peut-il signer seul un traité ?"
    bref: "Il négocie et ratifie les traités, mais la ratification est contresignée et, pour une partie des traités (paix, commerce, finances de l'État, territoire, entre autres), elle suppose une loi."
    pouvoir: "Négocier et ratifier les traités"
    articles: ["52", "53", "54", "19"]
    decide: "Le président « négocie et ratifie les traités » ; il « est informé de toute négociation tendant à la conclusion d'un accord international non soumis à ratification » (art. 52)."
    condition: "Pour les traités de paix, de commerce, ceux qui engagent les finances de l'État, modifient des dispositions de nature législative, touchent à l'état des personnes ou au territoire, une loi : ils « ne peuvent être ratifiés ou approuvés qu'en vertu d'une loi » (art. 53). Si le Conseil constitutionnel a déclaré une clause contraire à la Constitution, l'autorisation de ratifier n'intervient qu'après révision (art. 54)."
    tiers: "Le Parlement, qui vote la loi d'autorisation pour les traités de l'article 53 ; le Premier ministre et les ministres responsables, qui contresignent ; le Conseil constitutionnel s'il est saisi."
    portee_texte: "Ratifier n'est pas dans la liste de l'article 19 : la ratification est contresignée et, pour une partie des traités, suppose une loi."

  # ── Gouvernement ────────────────────────────────────────────────────────────
  - id: politique-nation
    groupe: gouvernement
    question: "Que confie la Constitution au Gouvernement ?"
    bref: "Le Gouvernement détermine et conduit la politique de la Nation, et il en répond devant le Parlement. Le président veille au respect de la Constitution et assure, par son arbitrage, le fonctionnement régulier des pouvoirs publics."
    pouvoir: "Déterminer et conduire la politique de la Nation"
    articles: ["20", "21", "22", "5"]
    decide: "Le Gouvernement (art. 20), dont le Premier ministre dirige l'action et assure l'exécution des lois (art. 21)."
    condition: "Aucune condition préalable n'est écrite ; le Gouvernement répond ensuite de sa politique devant le Parlement (art. 20)."
    tiers: "L'Assemblée nationale, devant laquelle il répond ; les ministres, qui contresignent les actes du Premier ministre lorsqu'ils sont « chargés de leur exécution » (art. 22)."
    portee_texte: "Le président veille au respect de la Constitution et assure, par son arbitrage, le fonctionnement régulier des pouvoirs publics (art. 5) ; le texte attribue au Gouvernement la détermination et la conduite de la politique de la Nation."
