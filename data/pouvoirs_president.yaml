      condition: "Le deuxième alinéa n'exige ni proposition ni consultation ; la réunion des assemblées hors session est une modalité, non une condition préalable posée à un autre acteur."
  - id: "54"
    renvoi: "54"
    principal: true
    pouvoir: "Saisir le Conseil constitutionnel d'un engagement international"
    court: "Saisir le Conseil constitutionnel d'un traité"
