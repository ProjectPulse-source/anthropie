    condition: null
    autre_autorite:
      - {art: "54", cite: "a déclaré qu'un engagement international comporte une clause contraire à la Constitution", contexte: "si le Conseil constitutionnel", temporalite: après, facultatif: false,
         justification: "Le Conseil constitutionnel décide de l'issue de la saisine."}
    partage:
