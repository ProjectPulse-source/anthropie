         justification: "Avis public des commissions compétentes, qui précède la nomination et peut l'empêcher aux trois cinquièmes (art. 13) : d'où son rang avant l'acte."}
    autre_autorite: null
    partage:
      - {art: "56", cite: "trois par le président de l'Assemblée nationale, trois par le président du Sénat", temporalite: permanent, facultatif: false,
