# Pages de comité (/offre-culturelle/<id>/) — texte éditorial par livre, repris de la maquette D validée le 14/10/2026 ;
# question et raison réécrites le 25/10 (contre-expertise CSE-12 : une curiosité, puis une promesse de lecture ; faits relus dans content/livres/)
# (06_PROMOTION/PARTENARIATS/CSE/MAQUETTES_2026-10-14/_gen_version_d.py). Le titre, la couverture et la clé du guichet
# (promo_slug) se lisent dans content/livres/ : seuls le thème, la question et la raison de lire sont écrits ici.
# Clé = nom du fichier du livre dans content/livres/.

[livres.livresque-des-mots]
theme = "Littérature"
question = "Et si 4 656 citations formaient une conversation à travers les siècles ?"
raison = "1 387 voix se répondent, des romans aux chansons et au cinéma : une anthologie à explorer au fil de ses curiosités."

[livres.lodyssee-des-idees]
theme = "Culture générale"
question = "Comment naissent les idées qui changent notre façon de penser ?"
raison = "250 escales et sept chemins de lecture : penseurs, inventions et bascules qui se répondent, de Socrate à Turing."
# Aperçu (CSE-13) : ce que la fiche dit en plus de l'accroche, tiré de content/livres/lodyssee-des-idees.md.
apercu = "Une œuvre, une vie, une invention, une crise : chaque escale éclaire une manière d'habiter le monde, d'Euclide à Darwin, de Machiavel à Beauvoir. On peut le lire dans l'ordre, l'ouvrir au gré d'un nom ou le parcourir par ses sept chemins : les signes, le pouvoir, l'argent, la liberté, le sacré, l'opinion, la condition humaine."

[livres.la-societe-du-premier-coup]
theme = "École et société"
question = "Pourquoi certains peuvent-ils échouer et recommencer, quand d'autres paient chaque erreur ?"
raison = "Une autre manière de comprendre les inégalités : le nombre d'essais dont chacun dispose."

[livres.anthropie-ordre-ici-dette-ailleurs]
theme = "Histoire longue"
question = "Quand un problème semble résolu ici, où son coût est-il passé ?"
raison = "Sept âges d'histoire pour suivre comment nos sociétés déplacent ce qu'elles croient avoir résolu."
# Aperçu (CSE-13 : des situations familières au lieu du vocabulaire du cadre), exemples de la FAQ de la fiche.
apercu = "Une ville paraît propre parce que ses déchets partent ailleurs. Un réseau fonctionne, un budget se tient, et leur coût se retrouve en d'autres lieux, en d'autres temps ou chez d'autres groupes sociaux. À travers sept âges de l'histoire humaine, ce livre suit une même question : quand nous créons de l'ordre ici, quel désordre déplaçons-nous ailleurs ?"

[livres.dette-publique-qui-paie-vraiment]
theme = "Économie"
question = "On parle sans cesse du montant de la dette. Mais qui en paie réellement le coût ?"
raison = "Une enquête sur les canaux par lesquels ce coût se déplace, vers les générations futures et les groupes sociaux les moins mobiles."
# Aperçu (CSE-13 : des mécanismes à découvrir, sans reposer « qui paie ? »), d'après la description et la FAQ de la fiche.
apercu = "Qui supporte les intérêts ? Que se passe-t-il quand l'État emprunte davantage ? Comment une décision budgétaire d'aujourd'hui pèse-t-elle sur les générations suivantes ? Le livre suit les mécanismes par lesquels ce transfert devient invisible, sur les finances publiques françaises, puis sur la Grèce, le Japon, les États-Unis, la Norvège et la Chine."

[livres.un-president-peut-il-tenir-ses-promesses]
theme = "Institutions"
question = "Entre une promesse et son résultat, où se trouve le pouvoir ?"
raison = "Neuf promesses suivies une à une, pour voir ce qu'un président décide, doit faire voter ou doit négocier."
