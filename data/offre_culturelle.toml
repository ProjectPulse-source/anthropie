[livres.livresque-des-mots]
theme = "Littérature"
question = "Et si 4 656 citations formaient une conversation à travers les siècles ?"
raison = "1 387 voix se répondent, des romans aux chansons et au cinéma : une anthologie à explorer au fil de ses curiosités."

[livres.lodyssee-des-idees]
theme = "Culture générale"
question = "Comment naissent les idées qui changent notre façon de penser ?"
raison = "250 escales et sept chemins de lecture : penseurs, inventions et bascules qui se répondent, de Socrate à Turing."

[livres.la-societe-du-premier-coup]
theme = "École et société"
question = "Pourquoi certains peuvent-ils échouer et recommencer, quand d'autres paient chaque erreur ?"
raison = "Une autre manière de comprendre les inégalités : le nombre d'essais dont chacun dispose."

[livres.anthropie-ordre-ici-dette-ailleurs]
theme = "Histoire longue"
question = "Quand un problème semble résolu ici, où son coût est-il passé ?"
raison = "Sept âges d'histoire pour suivre comment nos sociétés déplacent ce qu'elles croient avoir résolu."

[livres.dette-publique-qui-paie-vraiment]
theme = "Économie"
question = "On parle sans cesse du montant de la dette. Mais qui en paie réellement le coût ?"
raison = "Une enquête sur les canaux par lesquels ce coût se déplace, vers les générations futures et les groupes sociaux les moins mobiles."

[livres.un-president-peut-il-tenir-ses-promesses]
theme = "Institutions"
question = "Entre une promesse et son résultat, où se trouve le pouvoir ?"
raison = "Neuf promesses suivies une à une, pour voir ce qu'un président décide, doit faire voter ou doit négocier."
