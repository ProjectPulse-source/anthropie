# Thèmes de /publications/ (variante B retenue par l'auteur, 01/10/2026).
# Un thème se DÉDUIT du working paper qu'une fiche déclare déjà dans `related` : aucune saisie par publication, une
# fiche porte autant de thèmes que de papiers correspondants (thèmes, pas tiroirs exclusifs — avis externe du 01/10).
# AWP-01 et AWP-07 (le cadre, sa formalisation) ne font pas de thème : ils concernent presque tous les textes.
# AWP-05 non plus : aucune publication ne s'y rattache aujourd'hui.
# Ordre = ordre des filtres.
# `ressource` : la page de données du site qui documente le thème (carte de partage, titre et texte alternatif lus sur la page) ;
# `livre` : le livre du fil. Lus par le montage de /publications/ (maquette F4.2, 26/11/2026). Un thème sans ressource
# n'ouvre pas d'ensemble, sauf s'il est celui de la dernière publication.
