# English layer of data/pouvoirs_president.yaml (page /en/what-can-the-french-president-decide-alone/), 06/10/2026,
# rebuilt act by act on 11/10/2026 (phase B of the redesign).
#
# One key per French entry, same ids: the generator (scripts/update_pouvoirs_president.py, guard G2-EN) STOPS if an
# entry is missing, if a cell present in French is absent in English (or the reverse, or with a different number of
# quotations), if an English citation of the Constitution is not found word for word in the English translation
# published by the Conseil constitutionnel (scripts/sources_promesses_en/), or if a passage in curly quotes “…” inside
# a fiche is not found in that translation of one of the fiche's articles. French passages kept in « … » (organic
# laws, case law, French wording) are checked against the French texts, like the French page.
#
# Wording: the fields say only what the text says, as in the French base; where the published translation departs
# from the French text, the fiche says so. Forbidden (guard G5): "without any third party", "no third party".

