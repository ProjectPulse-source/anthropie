# entry is missing, if an English citation of the Constitution (cite) is not found word for word in the English
# translation published by the Conseil constitutionnel (scripts/sources_promesses_en/), or if a passage in curly quotes
# “…” inside a fiche is not found in that translation of one of the fiche's articles. French passages kept in « … » are
# checked against the French text, like the French page.
#
# Wording: the fields say only what the text says, as in the French base; where the published translation departs
# from the French text, the fiche says so.

