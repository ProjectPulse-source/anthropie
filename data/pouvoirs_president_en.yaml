groupes:
  sans_contreseing:
    titre: "Acts the president signs without countersignature"
    chapo: "Article 19 lists them: they are the only instruments of the president that neither the Prime Minister nor a minister countersigns. Without countersignature does not mean without condition."
  contresigne:
    titre: "Powers attributed to him personally that are countersigned"
    chapo: "The president's other instruments are countersigned by the Prime Minister and, where required, by the ministers concerned (art. 19)."
  gouvernement:
    titre: "What the Constitution entrusts to the Government"
    chapo: "Several decisions attributed to the president belong, in the text, to the Government or to the Prime Minister."

pouvoirs:
  nommer-premier-ministre:
    question: "Can the president appoint and dismiss the Prime Minister?"
    bref: "Appoint, yes: his signature alone is enough. Dismiss, no: article 8 provides only for the resignation the Prime Minister tenders. Article 50 obliges him to tender it when the National Assembly passes a resolution of no-confidence; it is not a dismissal by the president."
    pouvoir: "Appoint the Prime Minister, terminate his appointment"
    decide: "The president, for two acts of article 8: “The President of the Republic shall appoint the Prime Minister. He shall terminate the appointment of the Prime Minister when the latter tenders the resignation of the Government.”"
    condition: "To appoint, article 8 requires neither a recommendation nor a consultation. To terminate the appointment, it requires an act of the Prime Minister: tendering the resignation of the Government."
    tiers: "Article 8 brings in no other actor after the appointment. The Government appointed is accountable to Parliament “in accordance with the terms and procedures set out in articles 49 and 50” (art. 20)."
    portee_texte: "The appointment takes effect by his signature alone. For the end of the appointment, the tendering of the resignation is the only route article 8 describes."
    chaine: "Article 50 describes the case in which this resignation becomes compulsory: when the National Assembly passes a resolution of no-confidence or fails to endorse the Government programme or a general policy statement, “the Prime Minister shall tender the resignation of the Government to the President of the Republic”. The obligation falls on the Prime Minister and arises from a vote of the Assembly: it is not a dismissal by the president."
  referendum:
    question: "Can the president call a referendum alone?"
    bref: "Not on his own initiative: it takes a recommendation from the Government or from the two Houses, or else an initiative of one fifth of the members of Parliament supported by one tenth of the registered voters. The voters then decide, and only on the subjects the article lists."
    pouvoir: "Submit a text to a referendum (article 11)"
    decide: "The president submits the text to a referendum; the voters adopt or reject it."
    condition: "Two routes. For a government bill, a recommendation from the Government “when Parliament is in session” or a joint motion of the two Houses, published in the Journal officiel. For a shared-initiative private members' bill, the initiative “of one fifth of the members of Parliament, supported by one tenth of the voters enrolled on the electoral lists”, review by the Constitutional Council, then the absence of consideration by the two Houses within the period set by the Institutional Act."
    tiers: "Where the referendum is held on the recommendation of the Government, the latter makes before each House a statement which “shall be followed by a debate”. Then the voters vote. If the text is adopted, the president “shall promulgate the resulting statute within fifteen days following the proclamation of the results of the vote”: promulgation is his own act, bound by a time limit."
    portee_texte: "The subject is limited: organisation of the public authorities, reforms relating to the economic, social or environmental policy of the Nation and to the public services contributing thereto, authorisation to ratify certain treaties. In the shared-initiative referendum, if the two Houses have not considered the bill within the period, the French text uses the indicative « la soumet » (submits it), whereas the English translation published by the Conseil constitutionnel reads “may submit it to a referendum”."
    chaine: "The Constitutional Council “shall ensure the proper conduct of referendum proceedings” and proclaims the results (art. 60); it is consulted by the Government on the organisation of referendum proceedings (Ordinance no. 58-1067, art. 46: « est consulté par le Gouvernement sur l'organisation des opérations de référendum »); it reviews shared-initiative bills “before they are submitted to referendum” (art. 61). During a vacancy or incapacity, the president's functions are exercised in the interim, except those of articles 11 and 12 (art. 7)."
  dissolution:
    question: "Can the president dissolve the National Assembly without the Prime Minister's agreement?"
    bref: "Yes, without anyone's agreement: he must only consult the Prime Minister and the presidents of the two Houses. The voters then vote, twenty to forty days later, and no further dissolution may take place in the year following those elections."
    pouvoir: "Dissolve the National Assembly"
    decide: "The president."
    condition: "He must consult the Prime Minister and the Presidents of the Houses: “after consulting the Prime Minister and the Presidents of the Houses of Parliament”. Consultation is required, not agreement."
    tiers: "The voters: “A general election shall take place no fewer than twenty days and no more than forty days after the dissolution.” Then the new Assembly “shall sit as of right on the second Thursday following its election”."
    portee_texte: "The dissolution takes effect by his decision alone; the majority that emerges from the polls belongs to the voters. “No further dissolution shall take place within a year following said election.”"
    chaine: "“The National Assembly shall not be dissolved during the exercise of such emergency powers” (art. 16). During a vacancy or incapacity, the president's functions are exercised in the interim, except those of articles 11 and 12 (art. 7)."
  pouvoirs-exceptionnels:
    question: "What are the emergency powers of article 16?"
    bref: "They are the measures the president may take in the face of a serious and immediate threat, when the public authorities no longer function properly, and only after formal consultations. Parliament then sits as of right; the Constitutional Council may be asked after thirty days to examine whether the conditions still apply, and carries out that examination as of right after sixty. The text gives its opinion no effect that would end these powers."
    pouvoir: "Exercise emergency powers"
    decide: "The president “shall take measures required by these circumstances”."
    condition: "Three stages. To use them, two cumulative conditions — a serious and immediate threat to the institutions, the independence of the Nation, the integrity of its territory or the fulfilment of its international commitments, and the interruption of “the proper functioning of the constitutional public authorities” — and formal consultation of the Prime Minister, the Presidents of the Houses and the Constitutional Council. For each measure: “The Constitutional Council shall be consulted with regard to such measures.”"
    tiers: "“Parliament shall sit as of right.” For their continuation: after thirty days, the matter may be referred to the Constitutional Council by the President of the National Assembly, the President of the Senate, sixty deputies or sixty senators, to decide whether the conditions still apply; it does so as of right after sixty days and at any moment thereafter, “by public announcement”."
    portee_texte: "The power is bounded by its purpose: to provide the public authorities, “as swiftly as possible”, with the means to carry out their duties. Its duration is examined by the Constitutional Council; the article gives this public announcement no effect that would end the emergency powers."
    chaine: "The administrative courts have declared themselves without jurisdiction over the decision to use article 16, an act of government « dont il n'appartient au Conseil d'Etat ni d'apprécier la légalité, ni de contrôler la durée d'application » (whose legality and duration the Conseil d'État may neither assess nor review), and over a measure taken in the matters of article 34, which « présente le caractère d'un acte législatif » (has the character of a legislative act) (Conseil d'État, Assembly, 2 March 1962, Rubin de Servens; our translation)."
  messages-parlement:
    question: "Can the president address Parliament?"
    bref: "Yes, in two ways: a message read out before the two Houses, or a statement before Parliament convened in Congress. No vote follows; only the statement may be followed by a debate, in his absence."
    pouvoir: "Send a message to Parliament, speak before Congress"
    decide: "The president, in two forms: messages “which he shall cause to be read aloud” to the two Houses, or a statement before Parliament “convened in Congress for this purpose”."
    condition: "The article requires neither a recommendation nor a consultation, for either form. When not in session, the Houses “shall be convened especially for this purpose”."
    tiers: "The message is read aloud before the Houses, and such messages “shall not give rise to any debate”. The statement before Congress may be followed, “in his absence”, by a debate “without vote”: a possible intervention, not a compulsory one."
    portee_texte: "The effect is that of speech: no vote follows, either on the message or on the statement."
  saisir-cc-traite:
    question: "Can the president have a treaty reviewed on his own?"
    bref: "He may refer it to the Constitutional Council, as may the Prime Minister, the president of either House, sixty Members of the National Assembly or sixty Senators; the Council decides. If a clause is held unconstitutional, ratification must wait for a revision of the Constitution."
    pouvoir: "Refer an international undertaking to the Constitutional Council"
    decide: "The Constitutional Council."
    condition: "Nothing is required before the referral. The Prime Minister, the President of each House, sixty deputies or sixty senators can also refer it to the Council."
    tiers: "The Constitutional Council, which reviews; then, if it holds that a clause is contrary to the Constitution, the body that amends the Constitution, since authorisation to ratify “may be given only after amending the Constitution”."
    portee_texte: "The president obtains the review, not the decision."
  nommer-conseil-constitutionnel:
    question: "Who appoints the members of the Constitutional Council?"
    bref: "He appoints three of the nine members, but the committees of the two Houses may prevent it if their negative votes, added together, reach three fifths of the votes cast. He also designates the president of the Council, without prior opinion, but from among the Council's members."
    pouvoir: "Appoint three members of the Constitutional Council, appoint its President"
    decide: "Two separate acts. The president appoints three of the nine members; three others are appointed by the President of the National Assembly, three by the President of the Senate. He also appoints the President of the Council: “The President shall be appointed by the President of the Republic.”"
    condition: "For the three members, before the appointment, “The procedure provided for in the last paragraph of article 13 shall be applied to these appointments”: public consultation of the relevant standing committee in each House, and no appointment “when the sum of the negative votes in each committee represents at least three fifths of the votes cast by the two committees” (art. 13). For the appointment of the President of the Council, article 56 provides for no consultation."
    tiers: "After the appointment, article 56 brings in no other actor. Members hold “a non-renewable term of nine years”; the President of the Council “shall have a casting vote in the event of a tie”."
    portee_texte: "The choice is his; for the members, a qualified opposition of the two committees can prevent it."
    chaine: "The President of the Council is « nommé par décision du Président de la République » and « choisi parmi les membres du conseil, nommés ou de droit » (appointed by decision of the President of the Republic, chosen from among the members of the Council, appointed or ex officio: Ordinance no. 58-1067, art. 1, our translation): the appointment concerns a person who is already a member, appointed or ex officio like former Presidents of the Republic."
  saisir-cc-loi:
    question: "Can the president have a law reviewed before it is promulgated?"
    bref: "Before promulgation, he may refer a statute to the Constitutional Council, as may other authorities. The Council rules, within a month, on whether it is constitutional, and the referral suspends the time limit for promulgation."
    pouvoir: "Refer a law to the Constitutional Council before its promulgation"
    decide: "The Constitutional Council, which rules on the conformity of the law with the Constitution."
    condition: "No recommendation or consultation is required; the moment is written: “before their promulgation”. The Prime Minister, the Presidents of the two Houses, sixty deputies or sixty senators can also refer the law."
    tiers: "The Constitutional Council, which “must deliver its ruling within one month” (eight days in cases of urgency, at the Government's request)."
    portee_texte: "Referral “shall suspend the time allotted for promulgation”. It obtains a review of constitutionality, not a judgement of expediency."
  nommer-ministres:
    question: "Does the president choose ministers alone?"
    bref: "No: he appoints the ministers and ends their appointment on the recommendation of the Prime Minister, who countersigns."
    pouvoir: "Appoint the ministers and terminate their appointments"
    decide: "The president, “On the recommendation of the Prime Minister” (art. 8, para. 2)."
    condition: "A recommendation of the Prime Minister."
    tiers: "The Prime Minister, who recommends and countersigns."
    portee_texte: "Neither the appointment nor the dismissal of a minister is in the list of article 19."
  promulguer:
    question: "Can the president refuse to promulgate a law?"
    bref: "The text provides for no veto: he must promulgate within fifteen days, a time limit suspended if the law is referred to the Constitutional Council (article 61). He may only ask for a further deliberation, which Parliament may not refuse and whose outcome is Parliament's to decide."
    pouvoir: "Promulgate laws, ask for a new deliberation"
    decide: "The president promulgates; Parliament deliberates again if he asks."
    condition: "No recommendation or consultation is required before the act."
    tiers: "Parliament: “Such reopening of debate shall not be refused”, and Parliament votes again."
    portee_texte: "He promulgates within fifteen days following the final passage of an Act and its transmission to the Government; before this time limit expires, he may ask Parliament to reopen debate on the Act or any sections thereof. The text sets this time limit and opens a second reading, whose outcome belongs to Parliament; it provides for no veto. A referral to the Constitutional Council before promulgation delays it: referral “shall suspend the time allotted for promulgation” (art. 61)."
  decrets-ordonnances:
    question: "Can the president govern by decree?"
    bref: "In part. He signs the ordinances and the decrees deliberated upon in the Council of Ministers, countersigned by the Prime Minister and the ministers responsible; other regulatory decrees fall to the Prime Minister."
    pouvoir: "Sign the Ordinances and Decrees deliberated upon in the Council of Ministers"
    decide: "The president “shall sign the Ordinances and Decrees deliberated upon in the Council of Ministers”, over which he presides (art. 9). Other regulatory decrees fall to the Prime Minister, who has power to make regulations “Subject to article 13” (art. 21)."
    condition: "A deliberation in the Council of Ministers. A decree so deliberated must be signed by the president « alors même qu'aucun texte n'imposait cette délibération » (even though no text required that deliberation: Conseil d'État, Assembly, 10 September 1992, Meyet, our translation; rule restated on 5 February 2024)."
    tiers: "The Prime Minister and the ministers responsible, who countersign."
    portee_texte: "The boundary runs through what is deliberated upon in the Council of Ministers. The text says “shall sign”; it does not specify whether the president may refuse."
    chaine: "The provisions of a decree deliberated upon in the Council of Ministers may, « en principe » (in principle), be amended only by a decree deliberated upon in the same way; it is otherwise if that decree provides that they may be amended « par décret en Conseil d'Etat ou par décret simple » (by a decree in the Conseil d'État or by a simple decree), or if their codification shows that they fall under such decrees (Conseil d'État, 5 February 2024, no. 470962; our translation)."
  nominations-emplois:
    question: "Does the president alone appoint senior officials?"
    bref: "No. His appointments are countersigned, and he is not the only one who appoints: the Prime Minister also makes appointments to civil and military posts, subject to article 13 (article 21), and some of the president's appointments may be delegated to him. Some appointments also go through an opinion of the parliamentary committees or through the High Council of the Judiciary."
    pouvoir: "Make appointments to the civil and military posts of the State"
    decide: "The president: “He shall make appointments to the civil and military posts of the State” (art. 13). In the Council of Ministers for the posts that article 13 lists (Conseillers d'État, ambassadors, prefects, recteurs, directors of central government departments, highest-ranking military officers…) and those an Institutional Act adds; by presidential decree for others. For the remaining posts, this power may be delegated to the Prime Minister, who makes appointments “Subject to article 13” (art. 21)."
    condition: "Deliberation in the Council of Ministers for the listed posts. For the posts an Institutional Act designates, public consultation of the relevant standing committee in each House, which can prevent the appointment by three fifths of the votes cast. For judges, the High Council of the Judiciary “shall make recommendations” (Cour de cassation, Chief Presidents of Courts of Appeal, Presidents of the Tribunaux de grande instance) or is consulted; for public prosecutors, it “shall give its opinion” (art. 65)."
    tiers: "The Prime Minister and the ministers responsible, who countersign."
    portee_texte: "In the text, the power of appointment is general; it is countersigned, may be delegated to the Prime Minister and, for certain posts, goes through a parliamentary consultation or through the High Council of the Judiciary."
    chaine: "Ordinance no. 58-1136 (an Institutional Act) adds posts filled in the Council of Ministers (art. 1); has the members of the Conseil d'État and the Cour des comptes, judges and prosecutors, university professors and military officers appointed « par décret du Président de la République » (by decree of the President of the Republic, art. 2); allows appointment to the other posts to be delegated to the Prime Minister by such a decree (art. 3). Our translation."
  chef-des-armees:
    question: "Does the president decide alone in military matters?"
    bref: "He is Commander-in-Chief, but the Government has the armed forces at its disposal and the Prime Minister is responsible for national defence; his instruments are countersigned."
    pouvoir: "Commander-in-Chief of the Armed Forces"
    decide: "The president “shall be Commander-in-Chief of the Armed Forces” and presides over the higher national defence councils and committees (art. 15)."
    condition: "No recommendation or consultation is written for the capacity of Commander-in-Chief; his instruments are countersigned."
    tiers: "The Government “shall have at its disposal the civil service and the armed forces” (art. 20); the Prime Minister “shall be responsible for national defence” (art. 21)."
    portee_texte: "The Constitution spreads military matters over three titles: Commander-in-Chief, disposal of the armed forces, responsibility for national defence. None can be read in isolation."
  grace:
    question: "Can the president grant a pardon alone?"
    bref: "No, not by his signature alone. The president decides on pardons, and only individual pardons, but the instrument must be countersigned."
    pouvoir: "Power of pardon"
    decide: "The president."
    condition: "No recommendation or consultation is required before the act."
    tiers: "The Prime Minister and the minister responsible, who countersign."
    portee_texte: "The text limits its object to individual pardons (“in an individual capacity”, in the published translation), a precision added in 2008 (the 1958 text said only that he « a le droit de faire grâce », has the right to grant pardons). A personal power in the image, a countersigned act in the text."
  traites:
    question: "Can the president sign a treaty alone?"
    bref: "He negotiates and ratifies treaties, but ratification is countersigned and, for part of the treaties (peace, commerce, State finances, territory, among others), it requires an Act of Parliament."
    pouvoir: "Negotiate and ratify treaties"
    decide: "The president “shall negotiate and ratify treaties”; he “shall be informed of any negotiations for the conclusion of an international agreement not subject to ratification” (art. 52)."
    condition: "For peace treaties, trade agreements, those committing the finances of the State, modifying provisions which are the preserve of statute law, relating to the status of persons or to territory, a statute: they “may be ratified or approved only by an Act of Parliament” (art. 53). If the Constitutional Council has held that a clause is contrary to the Constitution, authorisation to ratify comes only after amending the Constitution (art. 54)."
    tiers: "Parliament, which passes the authorising Act for the treaties of article 53; the Prime Minister and the ministers responsible, who countersign; the Constitutional Council if a referral is made."
    portee_texte: "Ratifying is not in the list of article 19: ratification is countersigned and, for some treaties, requires an Act of Parliament."
  politique-nation:
    question: "What does the Constitution entrust to the Government?"
    bref: "The Government determines and conducts the policy of the Nation, and answers for it to Parliament. The president ensures due respect for the Constitution and ensures, by his arbitration, the proper functioning of the public authorities."
    pouvoir: "Determine and conduct the policy of the Nation"
    decide: "The Government (art. 20), whose action the Prime Minister directs, and who ensures the implementation of legislation (art. 21)."
    condition: "No prior condition is written; the Government then answers for its policy to Parliament (art. 20)."
    tiers: "The National Assembly, to which it answers; the ministers, who countersign the Prime Minister's instruments where they are responsible for their implementation (art. 22)."
    portee_texte: "The president “shall ensure due respect for the Constitution” and ensures, by his arbitration, the proper functioning of the public authorities (art. 5); the text gives the Government the determination and conduct of the policy of the Nation."
