# Statut professionnel — utilisé pour JSON-LD jobTitle et eyebrow accueil
jobTitleFr = "Économiste — Chercheur indépendant et essayiste"
jobTitleEn = "Economist — Independent researcher and essayist"

# Description courte — utilisée pour JSON-LD description
descriptionFr = "Économiste, chercheur indépendant et essayiste. Auteur du cadre anthropique."
descriptionEn = "Economist, independent researcher and essayist. Author of the framework of anthropy."

# Domaines de compétence — utilisé pour JSON-LD knowsAbout (résolu par langue dans head.html)
# Trois territoires, chacun avec un livre et des pages (auteur, 05/10/2026 ; arbitrage
# D:\PRO\06_PROMOTION\ARBITRAGE_CONTRE_EXPERTISE_DOCTRINE_PROMOTION_2026-10-05.md, D1).
# Un quatrième ne s'ajoute que lorsqu'il a un dossier sur le site.
knowsAbout = ["dette publique", "pouvoirs du président de la République et promesses électorales", "anthropie et coûts déplacés"]
knowsAboutEn = ["public debt", "powers of the French President and campaign promises", "anthropy and displaced costs"]

