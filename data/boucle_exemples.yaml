- id: rome
  fr:
    bouton: "Rome"
    forme: "trajectoire historique reconstruite"
    statut: "Lecture illustrative, d’après *Anthropie* (2025) et [AWP-02](/awp/awp-02/)&nbsp;: à l’échelle d’une civilisation, la boucle ne se teste pas, faute de réceptacle borné et de latence nommée d’avance."
    texte: "Dans la lecture qu’en propose *Anthropie*, Rome achète l’ordre de son centre en faisant payer le prix ailleurs&nbsp;: la Pax Romana se finance par l’impôt et le tribut des provinces, le blé d’Afrique, le travail des esclaves et vingt ans de service des soldats. Le livre décrit cette charge comme une dette qui s’accumule, celle d’un empire de plus en plus difficile à gouverner, jusqu’à ce que Rome épuise les réserves qui alimentaient le transfert, «&nbsp;lorsqu’il n’y eut plus assez d’ailleurs à brûler&nbsp;». Le désordre revient alors vers le centre sous d’autres formes&nbsp;: une monnaie dégradée au III<sup>e</sup>&nbsp;siècle, puis une guerre confiée à des fédérés, dont l’un, Alaric, saccage Rome en 410. Ni ce recours aux fédérés ni le tournant chrétien de Constantin n’empêchent la chute de l’Occident en 476&nbsp;; l’Orient tiendra jusqu’en 1453. Saturation et retour restent marqués d’un «&nbsp;?&nbsp;»&nbsp;: c’est la thèse du livre, et d’autres historiens donnent le premier rôle aux invasions. La chute de l’Occident est un fait&nbsp;; qu’elle soit l’issue de cette boucle reste une interprétation."
    alt: "La spirale appliquée à Rome, lecture illustrative, sans tour antérieur. E1, déplacement vers les provinces et les esclaves, et E2, dette systémique accumulée, documentés ; E3, plus assez d’ailleurs, et E4, métal dégradé et sac de 410, marqués comme hypothèses ; E5, en 476 l’Ouest tombe et l’Est tient, documenté comme fait, mais le lien qui y mène reste une hypothèse ; E1′, le recours aux fédérés, hypothèse."
  en:
    bouton: "Rome"
    forme: "a reconstructed historical trajectory"
    statut: "An illustrative reading, after *Anthropie* (2025) and [AWP-02](/en/awp/awp-02/): at the scale of a civilisation the loop cannot be tested, for want of a bounded receptacle and of a latency named in advance."
    texte: "In the reading *Anthropie* offers, Rome buys order at its centre by having the price paid elsewhere: the Pax Romana is financed by the taxes and tribute of the provinces, African grain, the labour of slaves and twenty years of soldiers’ service. The book describes this burden as an accumulating debt, that of an empire ever harder to govern, until Rome exhausts the reserves that fed the transfer, “when there was no longer enough elsewhere to burn”. Disorder then returns to the centre in other forms: a debased coinage in the third century, then a war entrusted to federates, one of whom, Alaric, sacks Rome in 410. Neither this reliance on federates nor Constantine’s Christian turn prevents the fall of the West in 476; the East holds until 1453. Saturation and return stay marked with a “?”: this is the book’s thesis, and other historians give the leading role to the invasions. The fall of the West is a fact; that it was the outcome of this loop remains an interpretation."
    alt: "The spiral applied to Rome, an illustrative reading, with no earlier turn. E1, displacement towards the provinces and slaves, and E2, systemic debt building up, documented; E3, no more elsewhere, and E4, debased coin and the sack of 410, marked as hypotheses; E5, in 476 the West falls and the East holds, documented as a fact, though the link leading to it remains a hypothesis; E1′, the reliance on federates, a hypothesis."
- id: dette
  fr:
    bouton: "Dette publique"
    forme: "accumulation ouverte"
    statut: "Boucle ouverte, d’après [AWP-09](/awp/awp-09/)&nbsp;: les comptes publics documentent les deux premiers états, au sens patrimonial&nbsp;; la charge nette finale reste non établie."
    texte: "De 1995 à 2025, la dette des administrations publiques françaises est passée de 57,8&nbsp;% à 115,6&nbsp;% du PIB, surtout sous l’effet des déficits hors intérêts, et moins d’un cinquième des déficits a correspondu à un accroissement net des actifs publics. Les générations suivantes héritent donc d’une dette sans patrimoine équivalent en face&nbsp;: c’est en ce sens, patrimonial et étroit, que les comptes établissent un [report dans le temps](/dette-publique-generations-futures/). Le ratio dette/PIB ne mesure pas, à lui seul, la charge transmise, et il ne monte pas à sens unique&nbsp;: depuis 2017, la croissance l’allège chaque année, hormis 2020, sans réduire la dette en euros. La hausse des intérêts depuis 2022 peut se lire comme le début d’un retour&nbsp;; mais le refinancement de la dette à des taux plus élevés suffit aussi à l’expliquer, et rien n’établit que la capacité de l’État à porter sa dette soit saturée. Qui paiera finalement dépendra des ajustements choisis."
    alt: "La spirale appliquée à la dette publique française, sans tour antérieur. E1, report patrimonial vers l’avenir sur l’axe temporel, et E2, dette accumulée avec peu d’actifs, documentés ; E3, saturation non établie, et E4, retour non testé, hypothèses ; E5 et E1′ non évalués, en gris."
  en:
    bouton: "Public debt"
    forme: "open accumulation"
    statut: "An open loop, after [AWP-09](/en/awp/awp-09/): the public accounts document the first two states, in a balance-sheet sense; the final net burden remains unestablished."
    texte: "From 1995 to 2025, French general government debt rose from 57.8% to 115.6% of GDP, mainly through deficits excluding interest, and less than one fifth of the deficits matched a net increase in public assets. Later generations therefore inherit debt without equivalent wealth on the other side: it is in this narrow, balance-sheet sense that the accounts establish a [shift over time](/en/public-debt-future-generations/). The debt-to-GDP ratio does not by itself measure the burden passed on, and it does not rise in one direction only: since 2017 growth has reduced it every year except 2020, without reducing the debt in euros. The rise in interest since 2022 can be read as the start of a return; but refinancing the debt at higher rates is enough to explain it too, and nothing establishes that the state’s capacity to carry its debt is saturated. Who finally pays will depend on the adjustments chosen."
    alt: "The spiral applied to French public debt, with no earlier turn. E1, a balance-sheet shift to the future on the temporal axis, and E2, debt building up with few assets, documented; E3, saturation not established, and E4, return not tested, hypotheses; E5 and E1′ not assessed, grey."
- id: energie
  fr:
    bouton: "Environnement"
    forme: "des régimes qui coexistent"
    statut: "D’après [AWP-04](/awp/awp-04/), relu par AWP-07&nbsp;: le nouveau déplacement est documenté, la suite ne l’est pas."
    texte: "Le régime fossile n’est pas un tour passé&nbsp;: il continue, et la transition s’enroule autour de lui, car chaque source d’énergie s’est ajoutée aux précédentes au lieu de les remplacer, montre Jean-Baptiste Fressoz, que suit AWP-04. La figure trace donc deux brins actifs, et le tour en clair est la transition. Son déplacement est documenté, sans être chiffré en net&nbsp;: vers les territoires miniers du lithium et du cobalt, et vers l’avenir, par des panneaux, des batteries et des déchets nucléaires qui resteront à traiter dans des décennies. Il se lit dans les comptes&nbsp;: la France a réduit ses émissions territoriales bien plus que son empreinte carbone, qui inclut les biens importés. La pression sur les nappes de l’Atacama ou les déchets sans filière mature sont des signaux, non des seuils nommés&nbsp;: des hypothèses, marquées d’un «&nbsp;?&nbsp;», et aucun retour n’est établi. L’[effet rebond](/effet-rebond/), enfin, ne referme pas le cercle&nbsp;: la consommation qu’induit un gain d’efficacité est une charge nouvelle, qui alimente le tour en cours."
    alt: "La spirale appliquée à la transition énergétique. Un second brin en double trait, le régime fossile toujours actif, accompagne le tour en cours et le dépasse. Tour en clair, la transition : E1, déplacement vers les mines et les déchets futurs sur les axes spatial et temporel, documenté ; E2, accumulation non mesurée, et E3, signaux sans seuil nommé, hypothèses ; E4 et E5 non évalués, en gris ; E1′, hypothèse."
  en:
    bouton: "Environment"
    forme: "coexisting regimes"
    statut: "After [AWP-04](/en/awp/awp-04/), reread by AWP-07: the new displacement is documented, what follows is not."
    texte: "The fossil regime is not a past turn: it carries on, and the transition coils around it, since each energy source has been added to the previous ones instead of replacing them, as Jean-Baptiste Fressoz shows and AWP-04 follows. The figure therefore draws two active strands, and the turn in full is the transition. Its displacement is documented, though not quantified in net terms: towards the mining territories of lithium and cobalt, and towards the future, through panels, batteries and nuclear waste that will still need handling decades from now. It shows in the accounts: France has cut its territorial emissions far more than its carbon footprint, which includes imported goods. The strain on the Atacama aquifers or waste with no mature recycling route are signals, not named thresholds: hypotheses, marked with a “?”, and no return is established. The [rebound effect](/en/rebound-effect/), finally, does not close the circle: the consumption that an efficiency gain induces is a new load, which feeds the turn under way."
    alt: "The spiral applied to the energy transition. A second strand drawn as a double line, the fossil regime still active, runs alongside the current turn and beyond it. Turn in full, the transition: E1, displacement towards mines and future waste on the spatial and temporal axes, documented; E2, accumulation not measured, and E3, signals with no threshold named, hypotheses; E4 and E5 not assessed, grey; E1′, a hypothesis."
- id: numerique
  fr:
    bouton: "Numérique"
    forme: "déplacement et verrouillage"
    statut: "D’après [AWP-06](/awp/awp-06/)&nbsp;: boucle ouverte, établie sur ses deux premiers états."
    texte: "Le numérique paraît immatériel parce que sa matière a été déplacée hors du champ de l’usager&nbsp;: le service, écrit AWP-06, «&nbsp;n’a pas allégé la matière, il a appris à la faire travailler ailleurs&nbsp;». Le déplacement suit les trois axes à la fois&nbsp;: vers les territoires qui accueillent les centres de données, vers l’avenir par des engagements de réseau et de foncier qui courent sur plusieurs décennies, vers des populations, des mines aux sites de fin de vie, qui n’en sont ni les productrices ni les bénéficiaires. La charge s’accumule par décisions ponctuelles, chacune raisonnable sur place, dont le cumul réduit les marges de manœuvre du territoire&nbsp;; optimiser un registre, l’électricité par exemple, peut reporter la contrainte vers l’eau, le foncier ou la matière. Au-delà, rien n’est établi&nbsp;: ni saturation ni retour vers les opérateurs, et maintenir, rediriger, fermer ou démanteler ces infrastructures reste une décision ouverte. La charge cognitive reportée sur l’usager n’est pas codée ici&nbsp;: AWP-06 en fait un réceptacle, pas encore une [dette](/dette-technologique/) constituée."
    alt: "La spirale appliquée au numérique, sans tour antérieur. E1, déplacement de la matière vers d’autres territoires, vers l’avenir et vers des populations exposées, et E2, engagements qui se cumulent, documentés ; E3, saturation non établie, E4, retour non établi, E5, options ouvertes, et E1′, hypothèses."
  en:
    bouton: "Digital"
    forme: "displacement and lock-in"
    statut: "After [AWP-06](/en/awp/awp-06/): an open loop, established on its first two states."
    texte: "Digital services look immaterial because their matter has been moved out of the user’s field of view: the service, AWP-06 writes, “has not lightened matter, it has learned to make it work elsewhere”. The displacement runs along all three axes at once: towards the territories that host data centres, towards the future through grid and land commitments that run for several decades, towards populations, from mines to end-of-life sites, who neither produce nor benefit from it. The load builds up through one-off decisions, each reasonable on the spot, whose sum narrows the territory’s room for manoeuvre; optimising one register, electricity for instance, can shift the constraint to water, land or matter. Beyond that, nothing is established: neither saturation nor a return to the operators, and whether to maintain, redirect, close or dismantle these infrastructures remains an open decision. The cognitive load shifted onto users is not coded here: AWP-06 treats it as a receptacle, not yet as a constituted [debt](/en/technological-debt/)."
    alt: "The spiral applied to digital infrastructure, with no earlier turn. E1, displacement of matter towards other territories, the future and exposed populations, and E2, commitments piling up, documented; E3, saturation not established, E4, return not established, E5, options left open, and E1′, hypotheses."
