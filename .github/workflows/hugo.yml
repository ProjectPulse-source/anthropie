name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Appelable par un autre workflow (dette-insee.yml) : un push signe par le
  # GITHUB_TOKEN ne declenche pas le `on: push` ci-dessus, donc une donnee
  # publiee par un robot n'atteindrait jamais la page sans cet appel explicite.
  workflow_call:
    inputs:
      ref:
        description: "Commit a construire. Vide = le SHA qui a declenche le run."
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.0
    steps:
      - name: Install Hugo Extended
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Vide hors workflow_call : checkout retombe alors sur le SHA
          # declencheur, comportement inchange pour un push ou un dispatch.
          # Appele, ce parametre evite de construire la version d'AVANT la
          # donnee qui vient d'etre poussee.
          ref: ${{ inputs.ref }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Hugo
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      # Porte deterministe (2026-09-02) : un depot incoherent ne se deploie pas. Trois controles
      # hors reseau, quelques secondes : compteurs de corpus, parite registre <-> fiches
      # (livres, AWP, articles), encodage console des scripts. Les controles reseau (Wikidata,
      # noeuds externes) restent locaux : python scripts/check-all.py --reseau.
      - name: Contrôles de cohérence (bloquants)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-all.py --ci

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
