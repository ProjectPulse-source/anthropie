name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Appelable par un autre workflow (dette-insee.yml) : un push signe par le
  # GITHUB_TOKEN ne declenche pas le `on: push` ci-dessus, donc une donnee
  # publiee par un robot n'atteindrait jamais la page sans cet appel explicite.
  workflow_call:
    inputs:
      ref:
        description: "Commit a construire. Vide = le SHA qui a declenche le run."
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04   # epingle -- voir docs/MIGRATION_RUNNER_UBUNTU26.md
    env:
      HUGO_VERSION: 0.147.0
    outputs:
      relecture: ${{ steps.relecture.outputs.json }}
    steps:
      - name: Install Hugo Extended
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Vide hors workflow_call : checkout retombe alors sur le SHA
          # declencheur, comportement inchange pour un push ou un dispatch.
          # Appele, ce parametre evite de construire la version d'AVANT la
          # donnee qui vient d'etre poussee.
          ref: ${{ inputs.ref }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Hugo
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      # Porte deterministe (2026-09-02) : un depot incoherent ne se deploie pas. Trois controles
      # hors reseau, quelques secondes : compteurs de corpus, parite registre <-> fiches
      # (livres, AWP, articles), encodage console des scripts. Les controles reseau (Wikidata,
      # noeuds externes) restent locaux : python scripts/check-all.py --reseau.
      - name: Contrôles de cohérence (bloquants)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-all.py --ci

      # Liens, paires de langue, canonical, indexabilite du site CONSTRUIT (arbitrage
      # ENTRANTE_2026-09-30_Architecture_Dette-02, E) : bloquant sur les defauts critiques.
      - name: Audit des liens du build (bloquant)
        run: python3 scripts/audit-liens-build.py public

      # Dates des ressources (16/10/2026, arbitrage PRO-20261016-174136) : sitemap, balisage de page et ligne visible
      # disent la meme date, relus sur le site CONSTRUIT. Bloquant : une date recopiee en dur un jour diverge en silence.
      - name: Dates des ressources (bloquant)
        run: python3 scripts/check-dates-build.py public

      # Pages ressources (arbitrage OPTIMUM-26, 11/10/2026, chantiers 1 et 2) : version telephone et pied commun de
      # chaque figure, motifs de langue connus, sur le texte SERVI. Bloquant sur les pages refondues
      # (`ressource.refonte`) ; les autres sont seulement inventoriees pour leur phase B.
      - name: Rendu des pages ressources (bloquant sur les pages refondues)
        run: python3 scripts/check-rendu-ressources.py public

      # Relecture attestee (chantier 4) : bloquant si une page refondue n'a pas d'instantane relu ; une phrase
      # changee depuis la relecture (mise a jour des donnees, retouche) n'arrete RIEN -- decision de l'auteur du
      # 11/10/2026 -- et devient une issue « Relecture ciblee » (tache `relecture` ci-dessous).
      - name: Relecture attestee des pages refondues
        id: relecture
        run: |
          python3 scripts/check-relecture.py public --json relecture.json
          echo "json=$(cat relecture.json)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  # Une issue par page dont des phrases ont change depuis leur relecture ; si elle est deja ouverte, son corps est
  # remplace (pas un commentaire par deploiement). Le deploiement n'attend pas cette tache. Les workflows qui
  # appellent celui-ci doivent accorder `issues: write` a leur tache `deploy`.
  relecture:
    needs: build
    if: needs.build.outputs.relecture != '' && needs.build.outputs.relecture != '[]'
    runs-on: ubuntu-24.04   # epingle -- voir docs/MIGRATION_RUNNER_UBUNTU26.md
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELECTURE: ${{ needs.build.outputs.relecture }}
        with:
          script: |
            const pages = JSON.parse(process.env.RELECTURE);
            const run = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const ouvertes = await github.paginate(github.rest.issues.listForRepo,
              {owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100});
            for (const p of pages) {
              const title = 'Relecture ciblee : ' + p.url;
              const body = p.phrases.length + ' phrase(s) servie(s) absente(s) de la relecture du ' + p.relu_le +
                ' (docs/relectures/). Les gardes de prose ont passe : ce sont des phrases a relire, pas des erreurs ' +
                'de donnees.\n\n' + p.phrases.map(s => '- ' + s).join('\n') +
                '\n\nRun : ' + run + '\n\nApres relecture : `python scripts/check-relecture.py public --instantane ' +
                p.url + '` sur un build local, commit, puis fermer cette issue.';
              const deja = ouvertes.find(i => i.title === title && !i.pull_request);
              if (deja) {
                await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: deja.number, body});
              } else {
                await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
              }
            }

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04   # epingle -- voir docs/MIGRATION_RUNNER_UBUNTU26.md
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # Le build valide ne suffit pas : la meme topologie doit etre observee sur le site SERVI
      # (arbitrage ENTRANTE_2026-09-30_Architecture_Dette-02, F). Apres deploiement, donc un echec
      # ne bloque rien : il rend le run rouge et signale l'ecart build / production.
      - name: Checkout (scripts du controle de fumee)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Controle de fumee de la production
        run: python3 scripts/smoke-production.py --attendre 300
