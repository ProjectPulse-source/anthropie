name: IndexNow notification

# Notifie Bing/Yandex/Naver, via l'API IndexNow, des URL dont le contenu a CHANGE.
#
# CORRIGE LE 2026-10-16 (arbitrage PRO-20261016-174136) : le workflow soumettait TOUTES les URL du sitemap a chaque
# push, puis chaque lundi -- l'erreur que la FAQ d'IndexNow repertorie (« Do not resubmit unchanged URLs »). Il ne
# soumet plus que les URL dont le `lastmod` du sitemap est posterieur a la derniere execution reussie, moins un jour
# de marge (scripts/indexnow_urls.py, qui en donne la raison). Le `lastmod` ne bouge que sur une modification reelle.
#
# Declencheurs : push touchant le contenu ; chaque jour, parce que les mises a jour de donnees sont poussees par le
# GITHUB_TOKEN, qui ne declenche aucun autre workflow (elles n'arrivaient ici que par le passage du lundi) ; a la
# main, avec `tout` pour une refonte du site entier, seul cas ou IndexNow admet une soumission complete.
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'data/**'
      - 'layouts/**'
      - 'config/**'
      - 'hugo.toml'
      - 'config.toml'
  workflow_dispatch:
    inputs:
      tout:
        description: "Soumettre toutes les URL (refonte du site entier seulement)"
        type: boolean
        default: false
  schedule:
    - cron: '30 8 * * *'  # chaque jour 08:30 UTC, apres maj-sources (06:40) et les workflows dette (07:17, 07:47)

permissions:
  contents: read
  actions: read   # lire la date de la derniere execution reussie

jobs:
  notify:
    runs-on: ubuntu-24.04   # epingle -- voir docs/MIGRATION_RUNNER_UBUNTU26.md
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Détecter la clé IndexNow dans static/
        id: detect-key
        run: |
          set -euo pipefail
          KEY_FILE=$(find static -maxdepth 1 -type f -name "[a-z0-9]*.txt" \
            -regextype posix-extended -regex 'static/[a-z0-9]{8,}\.txt' | head -1)
          if [ -z "$KEY_FILE" ]; then
            echo "::error::Aucun fichier clé IndexNow détecté dans static/"
            echo "Le fichier attendu doit être nommé <clé>.txt avec une clé alphanumérique de 8+ caractères."
            exit 1
          fi
          KEY=$(basename "$KEY_FILE" .txt)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Clé IndexNow détectée: $KEY"

      - name: Attendre le déploiement GitHub Pages (5 min)
        if: github.event_name == 'push'
        run: |
          echo "Attente de 5 minutes pour laisser Hugo + GitHub Pages déployer..."
          sleep 300

      - name: Choisir les URL modifiees depuis la derniere execution reussie
        id: extract-urls
        env:
          GH_TOKEN: ${{ github.token }}
          TOUT: ${{ github.event.inputs.tout }}
        run: |
          set -euo pipefail
          if [ "${TOUT:-false}" = "true" ]; then
            python3 scripts/indexnow_urls.py --tout --sortie urls.json
            exit 0
          fi
          # Derniere execution REUSSIE de ce workflow (l'execution courante n'est pas encore « success »).
          DERNIERE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/indexnow.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].run_started_at // empty')
          if [ -z "$DERNIERE" ]; then
            # Aucune execution reussie connue (premiere execution) : fenetre bornee a sept jours, jamais tout le site.
            DEPUIS=$(date -u -d '7 days ago' +%F)
            echo "::notice::Aucune execution reussie precedente : fenetre de sept jours ($DEPUIS)"
          else
            DEPUIS=$(date -u -d "${DERNIERE%%T*} - 1 day" +%F)
            echo "Derniere execution reussie : $DERNIERE ; fenetre depuis $DEPUIS (un jour de marge)"
          fi
          python3 scripts/indexnow_urls.py --depuis "$DEPUIS" --sortie urls.json

      - name: Envoyer le batch IndexNow
        env:
          KEY: ${{ steps.detect-key.outputs.key }}
        run: |
          set -euo pipefail

          if [ "$(python3 -c 'import json;print(len(json.load(open("urls.json"))))')" = "0" ]; then
            echo "::notice::Aucune URL modifiee depuis la derniere execution : rien a notifier"
            exit 0
          fi

          # Construction du payload JSON
          python3 <<'PY'
          import json
          import os

          with open("urls.json", encoding="utf-8") as f:
              urls = json.load(f)

          payload = {
              "host": "stephane-lalut.com",
              "key": os.environ["KEY"],
              "keyLocation": f"https://stephane-lalut.com/{os.environ['KEY']}.txt",
              "urlList": urls,
          }

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

          print(f"Payload IndexNow: {len(urls)} URLs")
          PY

          echo "Envoi du batch à api.indexnow.org..."
          HTTP_CODE=$(curl -sS -o response.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @payload.json) || HTTP_CODE="000"

          echo "HTTP $HTTP_CODE"
          echo "Réponse:"
          cat response.txt || true
          echo ""

          # 200, 202 = succès. 422 = clé invalide. 403 = key location invalide.
          case "$HTTP_CODE" in
            200|202)
              echo "::notice::IndexNow notification envoyée avec succès"
              ;;
            422)
              echo "::error::Clé IndexNow rejetée (422). Vérifier que le fichier .txt est bien accessible publiquement."
              exit 1
              ;;
            403)
              echo "::error::Key location rejetée (403). Vérifier l'URL du fichier .txt."
              exit 1
              ;;
            *)
              echo "::warning::HTTP $HTTP_CODE non standard. Voir la réponse ci-dessus."
              # Non bloquant - les codes non-200 peuvent arriver sans pour autant être un échec définitif
              ;;
          esac
