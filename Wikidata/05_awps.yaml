    faq_fr:  # source : content/awp/awp-01.md lignes 17-23
      - q: "Qu'est-ce que l'anthropie en sciences sociales ?"
        r: "L'anthropie est le principe selon lequel les systèmes sociaux déplacent le désordre plutôt qu'ils ne le résolvent. Tout ordre observable dans un système suppose un désordre exporté ailleurs — spatialement, temporellement ou socialement."
      - q: "Comment l'anthropie se distingue-t-elle de l'entropie ?"
        r: "L'anthropie n'est pas une métaphore physique. Elle désigne un mécanisme institutionnel observable : le déplacement délibéré ou structurel du désordre entre acteurs, territoires et générations."
      - q: "L'anthropie est-elle une théorie ou une hypothèse ?"
        r: "Une hypothèse de travail à valeur heuristique. Elle permet de poser des questions que d'autres cadres ne formulent pas, sans prétendre à l'exhaustivité d'une théorie achevée."
