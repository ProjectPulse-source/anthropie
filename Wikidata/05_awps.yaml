    faq_fr:
      - q: 'Qu''apporte le cadre anthropique au numérique ?'
        r: "Le cadre anthropique unifie matérialité, opacité et empreinte environnementale comme variantes d'un même mécanisme : le service numérique n'a pas allégé la matière, il l'a déplacée vers d'autres lieux, d'autres temps, d'autres groupes sociaux."
      - q: 'Qu''est-ce que les registres de coûts couplés ?'
        r: "Une grille testable des quatre registres — énergie, matière, territoire, attention — qui montre comment l'infrastructure numérique déplace simultanément le désordre selon plusieurs axes irréductibles. C'est l'apport central d'AWP-06."
      - q: 'Comment le coût devient-il dette technologique ?'
        r: 'Par engagement, garantie et irréversibilisation. Le derisking (Daniela Gabor) couple un mécanisme contemporain à une formation institutionnelle longue — l''État de marché — qui transforme un coût présent en dette future inéluctable.'
