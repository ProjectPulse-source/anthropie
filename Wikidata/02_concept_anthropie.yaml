canonical_label:
  fr: "Qu'est-ce que l'anthropie ?"  # source : content/quest-ce-que-lanthropie/_index.md ligne 2
  en: 'What is anthropy?'  # source : content/quest-ce-que-lanthropie/_index.en.md ligne 2

canonical_short_definition:
  fr: "L'anthropie est l'hypothèse selon laquelle les systèmes sociaux déplacent le désordre plutôt qu'ils ne le résolvent."  # source : config/_default/params.toml ligne 2 + content/quest-ce-que-lanthropie/_index.md ligne 3 (verbatim identique)
  en: 'Anthropy is the hypothesis that social systems displace disorder rather than resolve it.'  # source : config/_default/hugo.toml ligne 19 + content/quest-ce-que-lanthropie/_index.en.md ligne 4

canonical_definition_extended:
  fr: |
    L'anthropie est l'hypothèse selon laquelle les systèmes sociaux déplacent le désordre plutôt qu'ils ne le résolvent.
    Tout ordre observable dans un système social — qu'il s'agisse d'une institution, d'un territoire, d'une organisation ou d'une économie — suppose un désordre exporté ailleurs : vers d'autres lieux, vers d'autres temps ou vers d'autres groupes sociaux.
    L'anthropie ne prétend pas constituer une théorie achevée. Il s'agit d'une hypothèse de travail à valeur heuristique : elle permet de poser des questions que d'autres cadres analytiques ne formulent pas, ou qu'ils tendent à neutraliser.
  fr_source_file: 'content/quest-ce-que-lanthropie/_index.md'
  fr_source_lines: '21-25'
  en: |
    Anthropy is the hypothesis that social systems displace disorder rather than resolve it.
    Every observable order in a social system — whether an institution, a territory, an organisation, or an economy — implies disorder exported elsewhere: to other places, other times, or other social groups.
    Anthropy does not claim to constitute a fully developed theory. It is a working hypothesis with heuristic value: it makes it possible to ask questions that other analytical frameworks do not formulate, or tend to neutralise.
  en_source_file: 'content/quest-ce-que-lanthropie/_index.en.md'
  en_source_lines: '22-26'

