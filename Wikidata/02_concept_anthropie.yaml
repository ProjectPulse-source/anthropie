glossary_entries:
  # Source : content/glossaire/_index.md — 18 entrées (le prompt en annonçait 15 ; écart documenté en audit)
  - title: 'Anthropie'
    slug: 'anthropie'
    anchor_url: 'https://stephane-lalut.com/glossaire/#anthropie'
    short_definition: "Hypothèse selon laquelle les systèmes sociaux déplacent le désordre plutôt qu'ils ne le résolvent. Tout ordre observable suppose un désordre exporté ailleurs."
    refers_to_awp: null
    source_file: 'content/glossaire/_index.md'
    source_lines: '13-15'
  - title: 'Transfert anthropique'
    slug: 'transfert-anthropique'
    anchor_url: 'https://stephane-lalut.com/glossaire/#transfert-anthropique'
    short_definition: "Mécanisme par lequel le désordre est déplacé d'un lieu, d'un temps ou d'un groupe vers un autre."
    refers_to_awp: 'awp-01'
    source_file: 'content/glossaire/_index.md'
    source_lines: '17-20'
  - title: 'Externalisation entropique'
    slug: 'externalisation-entropique'
    anchor_url: 'https://stephane-lalut.com/glossaire/#externalisation-entropique'
    short_definition: "Forme spatiale du transfert anthropique. Le désordre est déplacé vers d'autres territoires."
    refers_to_awp: 'awp-04'
    source_file: 'content/glossaire/_index.md'
    source_lines: '22-25'
  - title: 'Dette anthropique'
    slug: 'dette-anthropique'
    anchor_url: 'https://stephane-lalut.com/glossaire/#dette-anthropique'
    short_definition: "Forme temporelle du transfert. Le désordre est reporté vers l'avenir — dette publique, sous-investissement, déficit de maintenance."
    refers_to_awp: 'awp-03'
    source_file: 'content/glossaire/_index.md'
    source_lines: '27-30'
  - title: 'Transfert social'
    slug: 'transfert-social'
    anchor_url: 'https://stephane-lalut.com/glossaire/#transfert-social'
    short_definition: "Forme sociale du transfert anthropique. Le désordre est déplacé vers des groupes moins capables de s'y soustraire."
    refers_to_awp: 'awp-01'
    source_file: 'content/glossaire/_index.md'
    source_lines: '32-35'
  - title: 'Ordre local'
    slug: 'ordre-local'
    anchor_url: 'https://stephane-lalut.com/glossaire/#ordre-local'
    short_definition: "Configuration sociale résultant du déplacement du désordre hors du périmètre considéré."
    refers_to_awp: 'awp-01'
    source_file: 'content/glossaire/_index.md'
    source_lines: '37-40'
  - title: 'Discipline du regard'
    slug: 'discipline-du-regard'
    anchor_url: 'https://stephane-lalut.com/glossaire/#discipline-du-regard'
    short_definition: "Posture analytique : devant tout ordre stable, demander où s'écoule le désordre."
    refers_to_awp: 'awp-01'
    source_file: 'content/glossaire/_index.md'
    source_lines: '42-45'
  - title: 'Saturation'
    slug: 'saturation'
    anchor_url: 'https://stephane-lalut.com/glossaire/#saturation'
    short_definition: "État d'un espace de déportation quand le coût marginal du transfert excède le bénéfice."
    refers_to_awp: 'awp-02'
    source_file: 'content/glossaire/_index.md'
    source_lines: '47-50'
  - title: 'Coût marginal croissant'
    slug: 'cout-marginal-croissant'
    anchor_url: 'https://stephane-lalut.com/glossaire/#cout-marginal-croissant'
    short_definition: "Premier critère de saturation : le transfert devient de plus en plus coûteux."
    refers_to_awp: 'awp-02'
    source_file: 'content/glossaire/_index.md'
    source_lines: '52-55'
  - title: 'Effet boomerang'
    slug: 'effet-boomerang'
    anchor_url: 'https://stephane-lalut.com/glossaire/#effet-boomerang'
    short_definition: "Second critère de saturation : le désordre déporté revient au système émetteur."
    refers_to_awp: 'awp-02'
    source_file: 'content/glossaire/_index.md'
    source_lines: '57-60'
  - title: 'Effet Jevons (paradoxe de Jevons)'
    slug: 'effet-jevons'
    anchor_url: 'https://stephane-lalut.com/glossaire/#effet-jevons'
    short_definition: "L'amélioration de l'efficacité d'une ressource tend à augmenter sa consommation totale."
    refers_to_awp: 'awp-04'
    source_file: 'content/glossaire/_index.md'
    source_lines: '62-65'
  - title: 'Métaprogramme'
    slug: 'metaprogramme'
    anchor_url: 'https://stephane-lalut.com/glossaire/#metaprogramme'
    short_definition: "Configuration contemporaine du transfert anthropique opérant à l'échelle numérique et planétaire."
    refers_to_awp: 'awp-02'
    source_file: 'content/glossaire/_index.md'
    source_lines: '67-70'
  - title: 'Ordre épistémique'
    slug: 'ordre-epistemique'
    anchor_url: 'https://stephane-lalut.com/glossaire/#ordre-epistemique'
    short_definition: "Système de hiérarchies de légitimité produit par le champ académique, supposant un désordre épistémique exporté vers ses marges."
    refers_to_awp: 'awp-05'
    source_file: 'content/glossaire/_index.md'
    source_lines: '72-75'
  - title: 'Espace de déportation'
    slug: 'espace-de-deportation'
    anchor_url: 'https://stephane-lalut.com/glossaire/#espace-de-deportation'
    short_definition: "Lieu, temps ou groupe social vers lequel le désordre est transféré."
    refers_to_awp: 'awp-02'
    source_file: 'content/glossaire/_index.md'
    source_lines: '77-80'
  - title: 'Configuration'
    slug: 'configuration'
    anchor_url: 'https://stephane-lalut.com/glossaire/#configuration'
    short_definition: "Agencement historique particulier des mécanismes de transfert anthropique. Sept configurations majeures sur 3,3 millions d'années."
    refers_to_awp: 'awp-02'
    source_file: 'content/glossaire/_index.md'
    source_lines: '82-85'
  - title: 'Derisking'
    slug: 'derisking'
    anchor_url: 'https://stephane-lalut.com/glossaire/#derisking'
    short_definition: "Mécanisme par lequel l'État altère le profil de risque d'un investissement privé (Daniela Gabor)."
    refers_to_awp: 'awp-06'
    source_file: 'content/glossaire/_index.md'
    source_lines: '87-90'
  - title: 'Communs négatifs'
    slug: 'communs-negatifs'
    anchor_url: 'https://stephane-lalut.com/glossaire/#communs-negatifs'
    short_definition: "Catégorie introduite par Alexandre Monnin pour désigner ce dont nous héritons sans avoir choisi."
    refers_to_awp: 'awp-06'
    source_file: 'content/glossaire/_index.md'
    source_lines: '92-95'
  - title: 'Registres de coûts couplés'
    slug: 'registres-de-couts-couples'
    anchor_url: 'https://stephane-lalut.com/glossaire/#registres-de-couts-couples'
    short_definition: "Grille testable des quatre registres — énergie, matière, territoire, attention — qui montre comment l'infrastructure numérique déplace simultanément le désordre."
    refers_to_awp: 'awp-06'
    source_file: 'content/glossaire/_index.md'
    source_lines: '97-100'

