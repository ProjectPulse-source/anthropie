<title id="czm-t">The scissors effect: debt stock and interest burden, 1995-Q2 2026</title><desc id="czm-d">Two curves as a percentage of GDP. Above, public debt rises from 57.8% of GDP in Q4 1995 to 119.0% in Q2 2026. Below, interest due by general government falls from 3.5% of GDP in 1995 to a trough of 1.3% in 2020, then climbs back to 2.2% in 2025.</desc>
