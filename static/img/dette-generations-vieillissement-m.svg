<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 829" role="img" font-variant-numeric="tabular-nums" aria-labelledby="gvm-t gvm-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="gvm-t">France : l'ajustement S2 qui stabiliserait la dette</title><desc id="gvm-d">Ajustement permanent du solde primaire structurel, à partir de 2027, qui stabiliserait la dette sur un horizon infini, en points de PIB, partagé entre la position budgétaire de départ et l'effet des variations futures des dépenses liées à l'âge, selon la Commission européenne (Debt Sustainability Monitor 2025), dans trois scénarios et dans l'édition précédente. Scénario de base : S2 3,1, dont position de départ 3,0 et effet des variations futures des dépenses liées à l'âge 0,1. Productivité plus faible : S2 3,8, dont position de départ 3,3 et effet des variations futures des dépenses liées à l'âge 0,5. Risque santé et dépendance : S2 5,4, dont position de départ 3,0 et effet des variations futures des dépenses liées à l'âge 2,4. Édition précédente (2024) : S2 3,4, dont position de départ 3,3 et effet des variations futures des dépenses liées à l'âge 0,1.</desc>
<rect width="300" height="829" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">France : l'ajustement S2 qui</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">stabiliserait la dette</text>
<rect x="0" y="71" width="12" height="12" fill="#eb6834"/>
<text x="18" y="82" font-size="13.5" fill="#55524f">position de départ (dépenses</text>
<text x="18" y="100" font-size="13.5" fill="#55524f">actuelles, retraites incluses)</text>
<rect x="0" y="111" width="12" height="12" fill="#8a8781"/>
<text x="18" y="122" font-size="13.5" fill="#55524f">effet des variations futures des</text>
<text x="18" y="140" font-size="13.5" fill="#55524f">dépenses liées à l'âge</text>
<text x="0" y="174" font-size="15" font-weight="600" fill="#26262f">Scénario de base</text>
<text x="0" y="193" font-size="13.5" font-weight="600" fill="#55524f">S2 : 3,1</text>
<rect x="0.0" y="201" width="197.6" height="16" fill="#eb6834"/>
<text x="202.6" y="214" font-size="13.5" font-weight="600" fill="#26262f">3,0</text>
<rect x="0.0" y="220" width="4.9" height="16" fill="#8a8781"/>
<text x="9.9" y="233" font-size="13.5" font-weight="600" fill="#26262f">0,1</text>
<text x="0" y="269" font-size="15" font-weight="600" fill="#26262f">Productivité plus faible</text>
<text x="0" y="288" font-size="13.5" font-weight="600" fill="#55524f">S2 : 3,8</text>
<rect x="0.0" y="296" width="214.9" height="16" fill="#eb6834"/>
<text x="219.9" y="309" font-size="13.5" font-weight="600" fill="#26262f">3,3</text>
<rect x="0.0" y="315" width="30.0" height="16" fill="#8a8781"/>
<text x="35.0" y="328" font-size="13.5" font-weight="600" fill="#26262f">0,5</text>
<text x="0" y="364" font-size="15" font-weight="600" fill="#26262f">Risque santé et dépendance</text>
<text x="0" y="383" font-size="13.5" font-weight="600" fill="#55524f">S2 : 5,4</text>
<rect x="0.0" y="391" width="196.8" height="16" fill="#eb6834"/>
<text x="201.8" y="404" font-size="13.5" font-weight="600" fill="#26262f">3,0</text>
<rect x="0.0" y="410" width="155.0" height="16" fill="#8a8781"/>
<text x="160.0" y="423" font-size="13.5" font-weight="600" fill="#26262f">2,4</text>
<text x="0" y="459" font-size="15" font-weight="600" fill="#26262f">Édition précédente (2024)</text>
<text x="0" y="478" font-size="13.5" font-weight="600" fill="#55524f">S2 : 3,4 · autre jeu de projections</text>
<rect x="0.0" y="486" width="216.7" height="16" fill="#eb6834"/>
<text x="221.7" y="499" font-size="13.5" font-weight="600" fill="#26262f">3,3</text>
<rect x="0.0" y="505" width="3.7" height="16" fill="#8a8781"/>
<text x="8.7" y="518" font-size="13.5" font-weight="600" fill="#26262f">0,1</text>
<text x="0" y="538" font-size="13.5" fill="#96928f">points de PIB</text>
<line x1="0" y1="552.0" x2="300" y2="552.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="573.0" font-size="13.5" fill="#55524f">Commission européenne, Debt</text>
<text class="pied-source" x="0" y="590.0" font-size="13.5" fill="#55524f">Sustainability Monitor 2025, France</text>
<text class="pied-note" x="0" y="611.0" font-size="13.5" fill="#55524f">La dépense actuelle de retraite est</text>
<text class="pied-note" x="0" y="628.0" font-size="13.5" fill="#55524f">dans la position de départ ; le second</text>
<text class="pied-note" x="0" y="645.0" font-size="13.5" fill="#55524f">terme ne mesure que l'évolution</text>
<text class="pied-note" x="0" y="662.0" font-size="13.5" fill="#55524f">projetée des dépenses liées à l'âge.</text>
<text class="pied-note" x="0" y="679.0" font-size="13.5" fill="#55524f">L'édition précédente est un autre jeu</text>
<text class="pied-note" x="0" y="696.0" font-size="13.5" fill="#55524f">de projections, non une évolution</text>
<text class="pied-note" x="0" y="713.0" font-size="13.5" fill="#55524f">observée. Projections conditionnelles</text>
<text class="pied-note" x="0" y="730.0" font-size="13.5" fill="#55524f">aux hypothèses de la Commission</text>
<text class="pied-note" x="0" y="747.0" font-size="13.5" fill="#55524f">(Ageing Report 2024, réforme des</text>
<text class="pied-note" x="0" y="764.0" font-size="13.5" fill="#55524f">retraites de 2023 appliquée).</text>
<text class="pied-licence" x="0" y="785.0" font-size="13.5" fill="#96928f">Compilation Stéphane Lalut, CC BY 4.0</text>
<text class="pied-licence" x="0" y="802.0" font-size="13.5" fill="#96928f">· stephane-lalut.com</text>
<text class="pied-licence" x="0" y="819.0" font-size="13.5" fill="#96928f">/dette-publique-generations-futures/</text>
</svg>
