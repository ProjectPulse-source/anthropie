<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 529" role="img" font-variant-numeric="tabular-nums" aria-labelledby="cs-t cs-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="cs-t">Investissement des administrations locales et transferts reçus, France, en % du PIB</title><desc id="cs-d">Deux courbes depuis 1995 : l&#x27;investissement local (formation brute de capital fixe) oscille autour de 2 % du PIB ; de 2013 à 2017, il passe de 2,4 % à 1,9 % du PIB et les transferts reçus de 3,3 % à 2,7 %. La série comparable des transferts s&#x27;arrête en 2017.</desc>
<rect width="720" height="529" fill="#ffffff"/>
<text x="0" y="18" font-size="13" font-weight="600" fill="#0A0A0E">Investissement des administrations locales et transferts reçus, France, en % du PIB</text>
<rect x="466.0" y="64" width="88.0" height="288" fill="#f3efe6"/>
<line x1="48" y1="310.9" x2="708" y2="310.9" stroke="#e1e0d9"/>
<text x="42.0" y="314.9" font-size="11" fill="#898781" text-anchor="end">2 %</text>
