<text x="370.0" y="109.1" font-size="11" fill="#52514e" text-anchor="end">de la taxe professionnelle</text>
<circle cx="532.0" cy="254.9" r="4" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
<text x="540.0" y="246.9" font-size="10" fill="#52514e" text-anchor="start">2017 : fin de la série comparable</text>
<text x="708.0" y="121.6" font-size="10" fill="#52514e" text-anchor="end">Transferts : série arrêtée</text>
<text x="708.0" y="134.6" font-size="10" fill="#52514e" text-anchor="end">en 2017 ; en 2018 et 2021,</text>
<text x="708.0" y="147.6" font-size="10" fill="#52514e" text-anchor="end">des dotations deviennent</text>
<text x="708.0" y="160.6" font-size="10" fill="#52514e" text-anchor="end">des fractions de TVA</text>
<text x="224.0" y="166.1" font-size="11" fill="#8a8f98" text-anchor="middle" font-weight="600">transferts reçus</text>
<text x="92.0" y="337.0" font-size="11" fill="#184f95" text-anchor="middle" font-weight="600">investissement local</text>
<line x1="0" y1="422.0" x2="720" y2="422.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="437.0" font-size="11" fill="#52514e">Eurostat gov_10a_main, administrations publiques locales (S1313) : investissement P51G, transferts courants reçus</text>
<text class="pied-source" x="0" y="451.0" font-size="11" fill="#52514e">D73REC ; France. Données relevées le 19 octobre 2026.</text>
<text class="pied-note" x="0" y="465.0" font-size="11" fill="#52514e">Transferts reçus : de l'État et de la sécurité sociale, toutes dotations confondues ; ce n'est pas la DGF. Série</text>
<text class="pied-note" x="0" y="479.0" font-size="11" fill="#52514e">comparable arrêtée en 2017 : en 2018 puis en 2021, des dotations sont remplacées par des fractions de TVA, comptées en</text>
<text class="pied-note" x="0" y="493.0" font-size="11" fill="#52514e">impôts. Ce reclassement change la catégorie de la recette ; il ne dit pas, à lui seul, si les ressources ont augmenté</text>
<text class="pied-note" x="0" y="507.0" font-size="11" fill="#52514e">ou baissé.</text>
