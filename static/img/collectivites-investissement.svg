<title id="cs-t">Investissement des collectivités et transferts reçus, France, en % du PIB</title><desc id="cs-d">Deux courbes depuis 1995 : l&#x27;investissement local oscille autour de 2 % du PIB, avec un creux marqué après 2013 ; les transferts reçus baissent de 2013 à 2017.</desc>
