<text x="42.0" y="232.6" font-size="11" fill="#898781" text-anchor="end">3 %</text>
<line x1="48" y1="146.3" x2="708" y2="146.3" stroke="#e1e0d9"/>
<text x="42.0" y="150.3" font-size="11" fill="#898781" text-anchor="end">4 %</text>
<line x1="48" y1="64.0" x2="708" y2="64.0" stroke="#e1e0d9"/>
<text x="42.0" y="68.0" font-size="11" fill="#898781" text-anchor="end">5 %</text>
<text x="48.0" y="367.0" font-size="11" fill="#898781" text-anchor="middle">1995</text>
<text x="158.0" y="367.0" font-size="11" fill="#898781" text-anchor="middle">2000</text>
<text x="268.0" y="367.0" font-size="11" fill="#898781" text-anchor="middle">2005</text>
<text x="378.0" y="367.0" font-size="11" fill="#898781" text-anchor="middle">2010</text>
<text x="488.0" y="367.0" font-size="11" fill="#898781" text-anchor="middle">2015</text>
<text x="598.0" y="367.0" font-size="11" fill="#898781" text-anchor="middle">2020</text>
<text x="708.0" y="367.0" font-size="11" fill="#898781" text-anchor="middle">2025</text>
<text x="510.0" y="384.0" font-size="11" fill="#52514e" text-anchor="middle">2014-2017</text>
<text x="510.0" y="397.0" font-size="11" fill="#52514e" text-anchor="middle">baisse des dotations</text>
<line x1="180.0" y1="64" x2="180.0" y2="352" stroke="#c3c2b7" stroke-dasharray="2 4"/>
<text x="180.0" y="58.0" font-size="10" fill="#898781" text-anchor="middle">municipales 2001</text>
<line x1="334.0" y1="64" x2="334.0" y2="352" stroke="#c3c2b7" stroke-dasharray="2 4"/>
<text x="334.0" y="58.0" font-size="10" fill="#898781" text-anchor="middle">municipales 2008</text>
<line x1="466.0" y1="64" x2="466.0" y2="352" stroke="#c3c2b7" stroke-dasharray="2 4"/>
<text x="466.0" y="58.0" font-size="10" fill="#898781" text-anchor="middle">municipales 2014</text>
<line x1="598.0" y1="64" x2="598.0" y2="352" stroke="#c3c2b7" stroke-dasharray="2 4"/>
<text x="598.0" y="58.0" font-size="10" fill="#898781" text-anchor="middle">municipales 2020</text>
