<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1107" role="img" font-variant-numeric="tabular-nums" aria-labelledby="qp-exp-m-t qp-exp-m-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="qp-exp-m-t">Un même effort de 10 milliards d'euros : qui le supporterait, selon la décision prise ?</title><desc id="qp-exp-m-d">Deux panneaux. A : pour un effort de 10 milliards d'euros réparti au prorata de chaque poste, la part du revenu disponible net que représenterait ce montant pour chaque dixième de niveau de vie, en 2023. Une baisse des dépenses d'enseignement pèse 2,75 % du revenu du premier dixième et 0,21 % du dernier ; une hausse des impôts sur les revenus et le patrimoine, 1,14 % du dernier ; les pensions restent entre 0,43 et 0,78 %. B : le rapport entre la décision la plus lourde et la plus légère pour un même groupe, en base 1. Il vaut ×5,5 au dernier dixième et au moins autant au premier, culmine à ×7,7 au 2e dixième, et descend à ×1,4 aux 7e et 8e dixièmes : c'est là que le levier retenu change le moins l'exposition moyenne du dixième.</desc>
