<text x="48.0" y="205.2" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">2,75 %</text>
<text x="40.0" y="375.0" font-size="13.5" fill="#898781" text-anchor="middle">1er</text>
<text x="150.2" y="375.0" font-size="13.5" fill="#898781" text-anchor="middle">5e</text>
<text x="288.0" y="375.0" font-size="13.5" fill="#898781" text-anchor="end">10e</text>
<line x1="0" y1="399.0" x2="16" y2="399.0" stroke="#eb6834" stroke-width="3"/>
<text x="22.0" y="404.0" font-size="13.5" fill="#52514e" text-anchor="start">Impôts sur les revenus et le patrimoine</text>
<text x="22.0" y="423.0" font-size="13.5" fill="#52514e" text-anchor="start">au 10e :</text>
<text x="90.0" y="423.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">1,14 %</text>
<line x1="0" y1="440.0" x2="16" y2="440.0" stroke="#898781" stroke-width="3"/>
<text x="22.0" y="445.0" font-size="13.5" fill="#52514e" text-anchor="start">Dépenses d'enseignement</text>
<text x="22.0" y="464.0" font-size="13.5" fill="#52514e" text-anchor="start">au 10e :</text>
<text x="90.0" y="464.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">0,21 %</text>
<line x1="0" y1="481.0" x2="16" y2="481.0" stroke="#184f95" stroke-width="3"/>
<text x="22.0" y="486.0" font-size="13.5" fill="#52514e" text-anchor="start">Pensions de retraite</text>
<text x="22.0" y="505.0" font-size="13.5" fill="#52514e" text-anchor="start">selon le dixième :</text>
<text x="148.0" y="505.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">0,43 à 0,78 %</text>
<text x="0.0" y="529.0" font-size="13.5" fill="#898781" text-anchor="start">○ point des impôts écarté au 1er</text>
<text x="0.0" y="547.0" font-size="13.5" fill="#898781" text-anchor="start">dixième (motif au pied)</text>
<line x1="0" y1="561.0" x2="300" y2="561.0" stroke="#c3c2b7"/>
<text x="0.0" y="585.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">B · De combien le choix change</text>
<text x="0.0" y="603.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">l'effort d'un même dixième</text>
<text x="0.0" y="621.0" font-size="13.5" fill="#898781" text-anchor="start">Décision la plus lourde ÷ la plus</text>
<text x="0.0" y="639.0" font-size="13.5" fill="#898781" text-anchor="start">légère · 1 : aucun écart</text>
