<text x="32.0" y="657.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">≥ ×5,5</text>
<text x="205.3" y="770.8" font-size="13.5" fill="#2b2a28" text-anchor="middle" font-weight="600">×1,4</text>
<text x="296.0" y="707.2" font-size="13.5" fill="#2b2a28" text-anchor="end" font-weight="600">×5,5</text>
<text x="77.6" y="693.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">×7,7</text>
<text x="40.0" y="802.0" font-size="13.5" fill="#898781" text-anchor="middle">1er</text>
<text x="205.3" y="802.0" font-size="13.5" fill="#52514e" text-anchor="middle">7e</text>
<text x="232.9" y="802.0" font-size="13.5" fill="#52514e" text-anchor="middle">8e</text>
<text x="288.0" y="802.0" font-size="13.5" fill="#898781" text-anchor="end">10e</text>
<text x="0.0" y="827.0" font-size="13.5" fill="#52514e" text-anchor="start">7e et 8e dixièmes : le choix du levier</text>
<text x="0.0" y="845.0" font-size="13.5" fill="#52514e" text-anchor="start">y change le moins l'exposition moyenne</text>
<text x="0.0" y="863.0" font-size="13.5" fill="#52514e" text-anchor="start">du dixième</text>
<line x1="0" y1="877.0" x2="300" y2="877.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="898.0" font-size="13.5" fill="#52514e">Insee, comptes nationaux distribués,</text>
<text class="pied-source" x="0" y="915.0" font-size="13.5" fill="#52514e">tableau CND.101, millésime 2023</text>
<text class="pied-note" x="0" y="936.0" font-size="13.5" fill="#52514e">Profil d'exposition, non une</text>
<text class="pied-note" x="0" y="953.0" font-size="13.5" fill="#52514e">simulation : ni comportement, ni effet</text>
<text class="pied-note" x="0" y="970.0" font-size="13.5" fill="#52514e">en retour.</text>
<text class="pied-note" x="0" y="991.0" font-size="13.5" fill="#52514e">Point des impôts écarté au 1er</text>
<text class="pied-note" x="0" y="1008.0" font-size="13.5" fill="#52514e">dixième : l'impôt sur le revenu du</text>
<text class="pied-note" x="0" y="1025.0" font-size="13.5" fill="#52514e">premier vingtième y est atypique ; le</text>
<text class="pied-note" x="0" y="1042.0" font-size="13.5" fill="#52514e">1er dixième porte « ≥ », borne</text>
<text class="pied-note" x="0" y="1059.0" font-size="13.5" fill="#52514e">inférieure calculée sur deux leviers.</text>
