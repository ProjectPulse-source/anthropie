<text x="0.0" y="126.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">disponible du dixième</text>
<text x="0.0" y="144.0" font-size="13.5" fill="#898781" text-anchor="start">Au prorata des montants existants,</text>
<text x="0.0" y="162.0" font-size="13.5" fill="#898781" text-anchor="start">2023</text>
