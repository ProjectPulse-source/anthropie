<text x="0" y="20" font-size="17" font-weight="600" fill="#2b2a28">Un même effort de 10 milliards</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#2b2a28">d'euros : qui le supporterait,</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#2b2a28">selon la décision prise ?</text>
