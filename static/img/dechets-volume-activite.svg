<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 397" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dr-t dr-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="dr-t">Déchets radioactifs : le volume ne dit pas où est la radioactivité</title><desc id="dr-d">Pour chaque catégorie, part du volume des déchets radioactifs et part de leur radioactivité déclarée, fin 2021 (dernière édition qui déclare l'activité), et filière de stockage. HA : 0,25 % du volume, 97,1 % de la radioactivité. MA-VL : 2,2 %, 2,7 %. FA-VL : 5,9 %, 0,01 %. FMA-VC : 55,7 %, 0,12 %. TFA : 35,9 %, &lt; 0,01 %.</desc>
<rect width="720" height="397" fill="#ffffff"/>
<text x="0" y="18" font-size="14" font-weight="600" fill="#26262f">Déchets radioactifs : le volume ne dit pas où est la radioactivité</text>
<text x="200" y="56" font-size="11" font-weight="600" fill="#55524f">Part du volume (fin</text>
<text x="200" y="69" font-size="11" font-weight="600" fill="#55524f">2021)</text>
<text x="370" y="56" font-size="11" font-weight="600" fill="#55524f">Part de la radioactivité</text>
<text x="370" y="69" font-size="11" font-weight="600" fill="#55524f">(fin 2021)</text>
<text x="540" y="56" font-size="11" font-weight="600" fill="#55524f">Stockage</text>
<text x="0" y="104" font-size="11" fill="#26262f">Haute activité (HA)</text>
<rect x="200" y="94" width="1.5" height="16" fill="#8a8781"/>
<text x="205.5" y="106" font-size="11" font-weight="600" fill="#26262f" text-anchor="start">0,25 %</text>
<rect x="370" y="94" width="136.0" height="16" fill="#eb6834"/>
<text x="502.0" y="106" font-size="11" font-weight="600" fill="#ffffff" text-anchor="end">97,1 %</text>
<text x="540" y="104" font-size="11" fill="#55524f">stockage géologique profond en</text>
<text x="540" y="117" font-size="11" fill="#55524f">projet (Cigéo)</text>
<text x="0" y="154" font-size="11" fill="#26262f">Moyenne activité, vie longue</text>
<text x="0" y="167" font-size="11" fill="#26262f">(MA-VL)</text>
<rect x="200" y="144" width="3.1" height="16" fill="#8a8781"/>
<text x="207.1" y="156" font-size="11" fill="#26262f" text-anchor="start">2,2 %</text>
<rect x="370" y="144" width="3.7" height="16" fill="#eb6834"/>
<text x="377.7" y="156" font-size="11" fill="#eb6834" text-anchor="start">2,7 %</text>
<text x="540" y="154" font-size="11" fill="#55524f">stockage géologique profond en</text>
<text x="540" y="167" font-size="11" fill="#55524f">projet (Cigéo)</text>
<text x="0" y="204" font-size="11" fill="#26262f">Faible activité, vie longue</text>
<text x="0" y="217" font-size="11" fill="#26262f">(FA-VL)</text>
<rect x="200" y="194" width="8.2" height="16" fill="#8a8781"/>
<text x="212.2" y="206" font-size="11" fill="#26262f" text-anchor="start">5,9 %</text>
<rect x="370" y="194" width="1.5" height="16" fill="#eb6834"/>
<text x="375.5" y="206" font-size="11" fill="#eb6834" text-anchor="start">0,01 %</text>
<text x="540" y="204" font-size="11" fill="#55524f">stockage à l'étude</text>
<text x="0" y="254" font-size="11" fill="#26262f">Faible et moyenne activité,</text>
<text x="0" y="267" font-size="11" fill="#26262f">vie courte (FMA-VC)</text>
<rect x="200" y="244" width="78.0" height="16" fill="#8a8781"/>
<text x="282.0" y="256" font-size="11" fill="#26262f" text-anchor="start">55,7 %</text>
<rect x="370" y="244" width="1.5" height="16" fill="#eb6834"/>
<text x="375.5" y="256" font-size="11" fill="#eb6834" text-anchor="start">0,12 %</text>
<text x="540" y="254" font-size="11" fill="#184f95">stockage en surface en service</text>
<text x="540" y="267" font-size="11" fill="#184f95">(Aube, depuis 1992)</text>
<text x="0" y="304" font-size="11" fill="#26262f">Très faible activité (TFA)</text>
<rect x="200" y="294" width="50.3" height="16" fill="#8a8781"/>
<text x="254.3" y="306" font-size="11" fill="#26262f" text-anchor="start">35,9 %</text>
<rect x="370" y="294" width="1.5" height="16" fill="#eb6834"/>
<text x="375.5" y="306" font-size="11" fill="#eb6834" text-anchor="start">&lt; 0,01 %</text>
<text x="540" y="304" font-size="11" fill="#184f95">stockage en service (Cires,</text>
<text x="540" y="317" font-size="11" fill="#184f95">depuis 2003)</text>
<line x1="0" y1="332.0" x2="720" y2="332.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="347.0" font-size="11" fill="#55524f">Andra, Inventaire national (données ouvertes, data.gouv.fr) ; filières : Andra, Les Essentiels 2026</text>
<text class="pied-note" x="0" y="361.0" font-size="11" fill="#55524f">Volume en équivalent conditionné et radioactivité déclarée, cinq catégories des bilans de l'Andra, même année. La</text>
<text class="pied-note" x="0" y="375.0" font-size="11" fill="#55524f">radioactivité ne mesure à elle seule ni le risque sanitaire ni le coût de gestion.</text>
