<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 389" role="img" font-variant-numeric="tabular-nums" aria-labelledby="bz-t bz-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="bz-t">Zone euro, 2016-2025 : taux, croissance et solde primaire de la France</title><desc id="bz-d">Moyennes annuelles 2016-2025, 21 pays de la zone euro, un point par pays, la France en orange. Taux implicite de la dette : France 1,74 %, médiane 2,10 %. Croissance du PIB nominal : France 3,2 %, médiane 5,7 %. Solde primaire : France −3,1 % du PIB, médiane −0,8 %. La France a le solde primaire le plus bas, l'une des deux croissances nominales les plus faibles et l'un des taux implicites les plus bas.</desc>
