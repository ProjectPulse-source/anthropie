<text x="111.1" y="257.3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#b8703f" text-anchor="middle">> 30%</text>
<circle cx="245.3" cy="172.8" r="3.8" fill="#184f95"/>
<text x="245.3" y="159.8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#52514e" text-anchor="middle">1996</text>
<text x="245.3" y="202.3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#b8703f" text-anchor="middle">> 60%</text>
<circle cx="390.7" cy="125.8" r="3.8" fill="#184f95"/>
<text x="390.7" y="112.8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#52514e" text-anchor="middle">2009</text>
<text x="390.7" y="176.2" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#b8703f" text-anchor="middle">> 80%</text>
