<line x1="44.0" y1="244.0" x2="592.0" y2="244.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="37.0" y="248.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781" text-anchor="end">25%</text>
