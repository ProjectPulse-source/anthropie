<text x="513.7" y="51.2" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#52514e" text-anchor="middle">2020</text>
<text x="513.7" y="114.5" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#b8703f" text-anchor="middle">> 100%</text>
