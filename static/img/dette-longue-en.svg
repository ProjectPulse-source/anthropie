<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" width="720" height="368" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dl-t dl-d">
<title id="dl-t">French public debt as a % of GDP, from 1978 to Q1 2026</title>
<desc id="dl-d">It starts at 21.6% of GDP in 1978, crosses 30% in 1984, 60% in 1996, 80% in 2009, 100% in 2020, and reaches 117.5% in Q1 2026. A dotted extension shows the path of the 2026 budget bill, reaching 118.0% in 2029: a forecast, not an observation.</desc>
