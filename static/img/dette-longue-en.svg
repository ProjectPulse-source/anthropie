<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 389" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dl-t dl-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="dl-t">French public debt as a % of GDP, from 1978 to Q2 2026</title>
<desc id="dl-d">It starts at 21.6% of GDP in 1978, crosses 30% in 1984, 60% in 1996, 80% in 2009, 100% in 2020, and reaches 119.0% in Q2 2026. Open circles, not joined to the curve, show the path of the 2027 budget bill, reaching 121.7% in 2027: a forecast, not an observation.</desc>
