<text x="720" y="281.0" font-size="11" font-weight="600" fill="#55524f" text-anchor="end">124.5</text>
<line x1="0" y1="304.0" x2="720" y2="304.0" stroke="#dcd8d3"/>
<text x="0" y="317.0" font-size="9" fill="#55524f">Eurostat gov_10a_main (B9, B8N, P51G, P51C, NP, P52_P53, D9), gov_10dd_edpt1 (GDP), general government, France, 1996-2025</text>
<text x="0" y="329.0" font-size="9" fill="#55524f">Accounting identity: it shows what deficits corresponded to, not what they produced; education does not count as an asset.</text>
