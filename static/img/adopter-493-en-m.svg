<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 887" role="img" font-variant-numeric="tabular-nums" aria-labelledby="a4m-t a4m-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="a4m-t">Uses of Article 49(3) on bills</title><desc id="a4m-d">Horizontal bars by legislature: uses on a Finance Bill or Social Security Financing Bill, and on another bill. 14th (2012-2017): 6 uses on 2 bills, none on a Finance Bill or Social Security Financing Bill; 15th (2017-2022): 1 use on 1 bill, none on a Finance Bill or Social Security Financing Bill; 16th (2022-2024): 23 uses on 6 bills, 21 of them on a Finance Bill or Social Security Financing Bill; 17th (since 2024), ongoing: 8 uses on 3 bills, all on a Finance Bill or Social Security Financing Bill, 1 motion of no confidence carried.</desc>
<rect width="300" height="887" fill="#ffffff"/>
<text x="0.0" y="20.0" font-size="17" fill="#0A0A0E" text-anchor="start" font-weight="600">Uses of Article 49(3) on bills</text>
<text x="0.0" y="60.0" font-size="13.5" fill="#52514e" text-anchor="start">number of uses, by legislature; each</text>
<text x="0.0" y="78.0" font-size="13.5" fill="#52514e" text-anchor="start">use is counted once</text>
<rect x="0" y="91" width="13" height="13" fill="#184f95"/>
<text x="20.0" y="103.0" font-size="13.5" fill="#52514e" text-anchor="start">Finance Bill or Social Security</text>
<text x="20.0" y="121.0" font-size="13.5" fill="#52514e" text-anchor="start">Financing Bill</text>
<rect x="0" y="131" width="13" height="13" fill="#c9c5c0"/>
<text x="20.0" y="143.0" font-size="13.5" fill="#52514e" text-anchor="start">other bill</text>
<text x="0.0" y="174.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">14th (2012-2017)</text>
<rect x="0.0" y="182" width="62.4" height="22" fill="#c9c5c0"/>
<text class="val" x="67.4" y="199.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">6</text>
<text class="val" x="0.0" y="223.0" font-size="13.5" fill="#52514e" text-anchor="start">6 uses on 2 bills</text>
<text class="val" x="0.0" y="242.0" font-size="13.5" fill="#52514e" text-anchor="start">none on a Finance Bill or Social</text>
<text class="val" x="0.0" y="261.0" font-size="13.5" fill="#52514e" text-anchor="start">Security Financing Bill</text>
<text x="0.0" y="285.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">15th (2017-2022)</text>
<rect x="0.0" y="293" width="10.4" height="22" fill="#c9c5c0"/>
<text class="val" x="15.4" y="310.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">1</text>
<text class="val" x="0.0" y="334.0" font-size="13.5" fill="#52514e" text-anchor="start">1 use on 1 bill</text>
<text class="val" x="0.0" y="353.0" font-size="13.5" fill="#52514e" text-anchor="start">none on a Finance Bill or Social</text>
<text class="val" x="0.0" y="372.0" font-size="13.5" fill="#52514e" text-anchor="start">Security Financing Bill</text>
<text x="0.0" y="396.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">16th (2022-2024)</text>
<rect x="0.0" y="404" width="218.4" height="22" fill="#184f95"/>
<rect x="218.4" y="404" width="20.8" height="22" fill="#c9c5c0"/>
<text class="val" x="244.2" y="421.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">23</text>
<text class="val" x="0.0" y="445.0" font-size="13.5" fill="#52514e" text-anchor="start">23 uses on 6 bills</text>
<text class="val" x="0.0" y="464.0" font-size="13.5" fill="#52514e" text-anchor="start">21 of them on a Finance Bill or</text>
<text class="val" x="0.0" y="483.0" font-size="13.5" fill="#52514e" text-anchor="start">Social Security Financing Bill</text>
<text x="0.0" y="507.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">17th (since 2024) *</text>
<rect x="0.0" y="515" width="83.2" height="22" fill="#184f95"/>
<text class="val" x="88.2" y="532.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">8</text>
<text class="val" x="0.0" y="556.0" font-size="13.5" fill="#52514e" text-anchor="start">8 uses on 3 bills</text>
<text class="val" x="0.0" y="575.0" font-size="13.5" fill="#52514e" text-anchor="start">all on a Finance Bill or Social</text>
<text class="val" x="0.0" y="594.0" font-size="13.5" fill="#52514e" text-anchor="start">Security Financing Bill</text>
<text class="val" x="0.0" y="613.0" font-size="13.5" fill="#52514e" text-anchor="start">1 motion of no confidence carried</text>
<text x="0.0" y="639.0" font-size="13.5" fill="#52514e" text-anchor="start">* ongoing on 6 October 2026</text>
<line x1="0" y1="661.0" x2="300" y2="661.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0.0" y="682.0" font-size="13.5" fill="#52514e" text-anchor="start">National Assembly: legislative files,</text>
<text class="pied-source" x="0.0" y="699.0" font-size="13.5" fill="#52514e" text-anchor="start">statistical bulletins, summary sheet</text>
<text class="pied-source" x="0.0" y="716.0" font-size="13.5" fill="#52514e" text-anchor="start">no. 64 (Government responsibility)</text>
<text class="pied-note" x="0.0" y="737.0" font-size="13.5" fill="#52514e" text-anchor="start">Categories of art. 49, para. 3: the</text>
<text class="pied-note" x="0.0" y="754.0" font-size="13.5" fill="#52514e" text-anchor="start">public finance programming act is &#x27;one</text>
<text class="pied-note" x="0.0" y="771.0" font-size="13.5" fill="#52514e" text-anchor="start">other bill&#x27;. Each use of Article 49(3)</text>
<text class="pied-note" x="0.0" y="788.0" font-size="13.5" fill="#52514e" text-anchor="start">is counted once; the same bill may be</text>
<text class="pied-note" x="0.0" y="805.0" font-size="13.5" fill="#52514e" text-anchor="start">subject to several uses, including</text>
<text class="pied-note" x="0.0" y="822.0" font-size="13.5" fill="#52514e" text-anchor="start">during the same reading. 17th ongoing</text>
<text class="pied-note" x="0.0" y="839.0" font-size="13.5" fill="#52514e" text-anchor="start">on 6 October 2026.</text>
