<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 897" role="img" font-variant-numeric="tabular-nums" aria-labelledby="a4m-t a4m-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="a4m-t">Bills made an issue of a vote of confidence (art. 49, para. 3)</title><desc id="a4m-d">Horizontal bars by legislature: uses on a Finance Bill or Social Security Financing Bill, and on another bill. 14th (2012-2017): 6 uses on 2 bills, none on a Finance Bill or Social Security Financing Bill; 15th (2017-2022): 1 use on 1 bill, none on a Finance Bill or Social Security Financing Bill; 16th (2022-2024): 23 uses on 6 bills, 21 of them on a Finance Bill or Social Security Financing Bill; 17th (since 2024), ongoing: 8 uses on 3 bills, all on a Finance Bill or Social Security Financing Bill, 1 motion of no confidence carried.</desc>
<rect width="300" height="897" fill="#ffffff"/>
