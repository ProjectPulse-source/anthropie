<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 773" role="img" font-variant-numeric="tabular-nums" aria-labelledby="qp-det-m-t qp-det-m-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="qp-det-m-t">Qui emprunte ? Qui détient les titres de l'État ?</title><desc id="qp-det-m-d">Deux panneaux séparés, sans lien de proportion entre eux. A, en valeur nominale : État 2 942 Md€ (82 %); Sécurité sociale 309 Md€ (9 %); Collectivités 275 Md€ (8 %); Autres 69 Md€ (2 %), sur 3 595,5 Md€, fin juin 2026. B, en valeur de marché, porteurs des titres négociables de l'État au 2e trimestre 2026 : Non-résidents 59,7 %; Autres porteurs résidents 18,7 %; Banques résidentes 10,5 %; Assureurs résidents 9,2 %; Fonds (OPCVM) résidents 2,0 %.</desc>
<rect width="300" height="773" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#2b2a28">Qui emprunte ? Qui détient les</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#2b2a28">titres de l'État ?</text>
<text x="0.0" y="88.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">A · Qui emprunte ? Dette par</text>
<text x="0.0" y="106.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">administration, fin juin 2026</text>
<text x="0.0" y="124.0" font-size="13.5" fill="#6f6c66" text-anchor="start">Valeur nominale, milliards d'euros</text>
<text x="0.0" y="146.0" font-size="13.5" fill="#52514e" text-anchor="start">État</text>
<rect x="0" y="152.0" width="150.0" height="12" rx="3" fill="#184f95"/>
<text x="156.0" y="163.0" font-size="13.5" fill="#184f95" text-anchor="start" font-weight="600">2 942 Md€ · 82 %</text>
<text x="0.0" y="186.0" font-size="13.5" fill="#52514e" text-anchor="start">Sécurité sociale</text>
<rect x="0" y="192.0" width="15.8" height="12" rx="3" fill="#184f95"/>
<text x="21.8" y="203.0" font-size="13.5" fill="#52514e" text-anchor="start">309 Md€ · 9 %</text>
<text x="0.0" y="226.0" font-size="13.5" fill="#52514e" text-anchor="start">Collectivités</text>
<rect x="0" y="232.0" width="14.0" height="12" rx="3" fill="#184f95"/>
<text x="20.0" y="243.0" font-size="13.5" fill="#52514e" text-anchor="start">275 Md€ · 8 %</text>
<text x="0.0" y="266.0" font-size="13.5" fill="#52514e" text-anchor="start">Autres</text>
<rect x="0" y="272.0" width="3.5" height="12" rx="3" fill="#184f95"/>
<text x="9.5" y="283.0" font-size="13.5" fill="#52514e" text-anchor="start">69 Md€ · 2 %</text>
<line x1="0" y1="300.0" x2="300" y2="300.0" stroke="#c3c2b7"/>
<text x="0.0" y="324.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">B · Qui détient les titres négociables</text>
<text x="0.0" y="342.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">de l'État ? 2e trimestre 2026</text>
<text x="0.0" y="360.0" font-size="13.5" fill="#6f6c66" text-anchor="start">Valeur de marché · par résidence du</text>
<text x="0.0" y="378.0" font-size="13.5" fill="#6f6c66" text-anchor="start">détenteur, non par nationalité</text>
<text x="0.0" y="400.0" font-size="13.5" fill="#52514e" text-anchor="start">Non-résidents</text>
<rect x="0" y="406.0" width="200.0" height="12" rx="3" fill="#eb6834"/>
<text x="206.0" y="417.0" font-size="13.5" fill="#b8420f" text-anchor="start" font-weight="600">59,7 %</text>
<text x="0.0" y="440.0" font-size="13.5" fill="#52514e" text-anchor="start">Autres porteurs résidents *</text>
<rect x="0" y="446.0" width="62.6" height="12" rx="3" fill="#eb6834"/>
<text x="68.6" y="457.0" font-size="13.5" fill="#52514e" text-anchor="start">18,7 %</text>
<text x="0.0" y="480.0" font-size="13.5" fill="#52514e" text-anchor="start">Banques résidentes</text>
<rect x="0" y="486.0" width="35.2" height="12" rx="3" fill="#eb6834"/>
<text x="41.2" y="497.0" font-size="13.5" fill="#52514e" text-anchor="start">10,5 %</text>
<text x="0.0" y="520.0" font-size="13.5" fill="#52514e" text-anchor="start">Assureurs résidents</text>
<rect x="0" y="526.0" width="30.8" height="12" rx="3" fill="#eb6834"/>
<text x="36.8" y="537.0" font-size="13.5" fill="#52514e" text-anchor="start">9,2 %</text>
<text x="0.0" y="560.0" font-size="13.5" fill="#52514e" text-anchor="start">Fonds (OPCVM) résidents</text>
<rect x="0" y="566.0" width="6.7" height="12" rx="3" fill="#eb6834"/>
<text x="12.7" y="577.0" font-size="13.5" fill="#52514e" text-anchor="start">2,0 %</text>
<text x="0.0" y="600.0" font-size="13.5" fill="#6f6c66" text-anchor="start">* dont la Banque de France : part non</text>
<text x="0.0" y="618.0" font-size="13.5" fill="#6f6c66" text-anchor="start">publiée par la source.</text>
<line x1="0" y1="632.0" x2="300" y2="632.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="653.0" font-size="13.5" fill="#52514e">A : INSEE, dette de Maastricht par</text>
<text class="pied-source" x="0" y="670.0" font-size="13.5" fill="#52514e">sous-secteur (29/09/2026) · B : Banque</text>
<text class="pied-source" x="0" y="687.0" font-size="13.5" fill="#52514e">de France, via l'AFT</text>
<text class="pied-note" x="0" y="708.0" font-size="13.5" fill="#52514e">Deux champs distincts. La détention ne</text>
<text class="pied-note" x="0" y="725.0" font-size="13.5" fill="#52514e">mesure pas la charge finale.</text>
