<text x="0.0" y="54.0" font-size="10" fill="#184f95" text-anchor="start">below zero: receives more than it pays in</text>
<text x="708.0" y="54.0" font-size="10" fill="#eb6834" text-anchor="end">above zero: pays in more than it receives</text>
