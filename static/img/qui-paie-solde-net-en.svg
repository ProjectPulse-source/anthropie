<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 509" role="img" font-variant-numeric="tabular-nums" aria-labelledby="qp-net-t qp-net-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="qp-net-t">Net contributors and net beneficiaries by decile, 2023</title>
<desc id="qp-net-d">Two panels. A: net transfers by standard-of-living decile, in thousand euros per consumption unit; on average, the first seven deciles receive more than they pay in, the last three pay in more than they receive, the last one by 58.4. B: share of people who are net beneficiaries, from 99% in the first decile to 18% in the last.</desc>
