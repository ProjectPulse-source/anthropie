<text class="pied-note" x="0" y="822.0" font-size="13.5" fill="#52514e">Statuses from the barometer's labels:</text>
<text class="pied-note" x="0" y="839.0" font-size="13.5" fill="#52514e">'pending' does not mean 'late'; 'no</text>
<text class="pied-note" x="0" y="856.0" font-size="13.5" fill="#52514e">measure to take' depends on the 'not</text>
<text class="pied-note" x="0" y="873.0" font-size="13.5" fill="#52514e">applicable' label and does not prove</text>
