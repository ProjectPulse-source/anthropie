<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 389" role="img" font-variant-numeric="tabular-nums" aria-labelledby="etu-h-t etu-h-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="etu-h-t">Jeunes hospitalisés pour un geste auto-infligé, 2012-2025</title><desc id="etu-h-d">Deux courbes, de 2012 à 2025, du nombre de patients hospitalisés pour un geste auto-infligé pour 100 000 habitants. Femmes de 18 à 24 ans : 235,8 en 2012, 200,3 en 2014, 206,7 en 2017, 234,5 en 2019, 359,7 en 2025, soit +53 % depuis 2019. Hommes de 18 à 24 ans : 142,7 en 2012, 120,0 en 2017, 130,2 en 2019, 149,5 en 2025, soit +15 % depuis 2019.</desc>
