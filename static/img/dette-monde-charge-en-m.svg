<title id="mc-m-t">Same debt, different burden: the EU in 2025</title><desc id="mc-m-d">Each dot is a country. The dotted line links the look-alike pair with the largest gap, picked out by the published rule: similar debt, very different burden. Two least-squares lines, one per group, over their observed range. Burden: Hungary 8.8%, Slovenia 2.7%, France 4.2%, Italy 8.0%.</desc>
