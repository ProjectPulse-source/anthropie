<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 423" role="img" aria-labelledby="ch-t ch-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="ch-t">La charge d'intérêts en milliards d'euros, 1995-2025</title>
<desc id="ch-d">Une courbe en milliards d'euros courants, de 1995 à 2025. La charge d'intérêts descend jusqu'au creux de 2020 (29,7 milliards), puis remonte fortement pour atteindre 66,6 milliards en 2025. Deux cercles évidés, non reliés à la courbe, portent la prévision du Gouvernement dans le projet de loi de finances pour 2027 : 79,2 milliards en 2026, 91 en 2027. Une prévision, non une observation, sur une base 2025 non réconciliée avec Eurostat.</desc>
<text x="0" y="22" font-size="13" font-weight="600" fill="#0A0A0E">Charge d'intérêts des administrations publiques, en milliards d'euros courants</text>
