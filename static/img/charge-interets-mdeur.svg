<line x1="0" y1="344.0" x2="720" y2="344.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="359.0" font-size="11" fill="#52514e">Eurostat, intérêts dus par les administrations publiques (gov_10a_main, D41PAY), 1995-2025 ; cercles évidés :</text>
<text class="pied-source" x="0" y="373.0" font-size="11" fill="#52514e">prévision du Gouvernement, projet de loi de finances pour 2027 (avis du HCFP, § 115)</text>
<text class="pied-note" x="0" y="387.0" font-size="11" fill="#52514e">Milliards d'euros courants, non corrigés de l'inflation. Cercles évidés : prévision du Gouvernement, dont la base 2025</text>
<text class="pied-note" x="0" y="401.0" font-size="11" fill="#52514e">n'est pas réconciliée avec Eurostat ; aucune variation ne se lit entre l'observé et le prévu.</text>
