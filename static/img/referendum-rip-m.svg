<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 579" role="img" font-variant-numeric="tabular-nums" aria-labelledby="rpm-t rpm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="rpm-t">Le référendum d&#x27;initiative partagée, 2015-2026</title><desc id="rpm-d">Saisines du Conseil constitutionnel : 7 ; jugées conformes : 1 ; soutien d&#x27;un dixième des inscrits réuni : 0 ; soumises au référendum : 0. La proposition conforme a recueilli 1 093 030 soutiens pour 4 717 396 requis, soit 23,2 % du seuil.</desc>
<rect width="300" height="579" fill="#ffffff"/>
<text x="0.0" y="20.0" font-size="17" fill="#0A0A0E" text-anchor="start" font-weight="600">Le référendum d&#x27;initiative</text>
<text x="0.0" y="42.0" font-size="17" fill="#0A0A0E" text-anchor="start" font-weight="600">partagée, 2015-2026</text>
<text x="0.0" y="82.0" font-size="13.5" fill="#52514e" text-anchor="start">Saisines du Conseil</text>
<rect x="0" y="88" width="260.0" height="20" fill="#184f95"/>
<text class="val" x="268.0" y="103.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">7</text>
<text x="0.0" y="130.0" font-size="13.5" fill="#52514e" text-anchor="start">Jugées conformes</text>
<rect x="0" y="136" width="37.1" height="20" fill="#184f95"/>
<text class="val" x="45.1" y="151.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">1</text>
<text x="0.0" y="178.0" font-size="13.5" fill="#52514e" text-anchor="start">Soutien d&#x27;un dixième des inscrits</text>
<text x="0.0" y="196.0" font-size="13.5" fill="#52514e" text-anchor="start">réuni</text>
<line x1="1" y1="202" x2="1" y2="222" stroke="#52514e" stroke-width="2"/>
<text class="val" x="8.0" y="217.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">0</text>
<text x="0.0" y="244.0" font-size="13.5" fill="#52514e" text-anchor="start">Soumises au référendum</text>
<line x1="1" y1="250" x2="1" y2="270" stroke="#52514e" stroke-width="2"/>
<text class="val" x="8.0" y="265.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">0</text>
<text x="0.0" y="292.0" font-size="13.5" fill="#0A0A0E" text-anchor="start" font-weight="600">2019-1 RIP</text>
<rect x="0" y="300" width="298" height="14" fill="none" stroke="#52514e"/>
<rect x="0" y="300" width="69.0" height="14" fill="#8a8f98"/>
<text class="val" x="0.0" y="333.0" font-size="13.5" fill="#52514e" text-anchor="start">Soutiens recueillis : 1 093 030</text>
<text class="val" x="0.0" y="352.0" font-size="13.5" fill="#52514e" text-anchor="start">Seuil : 4 717 396 (un dixième des</text>
<text class="val" x="0.0" y="371.0" font-size="13.5" fill="#52514e" text-anchor="start">inscrits)</text>
<text class="val" x="0.0" y="390.0" font-size="13.5" fill="#52514e" text-anchor="start">23,2 % du seuil</text>
<line x1="0" y1="404.0" x2="300" y2="404.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="425.0" font-size="13.5" fill="#52514e">Conseil constitutionnel, décisions</text>
<text class="pied-source" x="0" y="442.0" font-size="13.5" fill="#52514e">« RIP » (stock CONSTIT, arrêté au</text>
<text class="pied-source" x="0" y="459.0" font-size="13.5" fill="#52514e">05/10/2026) ; Constitution, art. 11</text>
<text class="pied-note" x="0" y="480.0" font-size="13.5" fill="#52514e">Trois autres propositions déposées</text>
<text class="pied-note" x="0" y="497.0" font-size="13.5" fill="#52514e">« en application de l'article 11 »</text>
<text class="pied-note" x="0" y="514.0" font-size="13.5" fill="#52514e">(Sénat, Assemblée) n'ont fait l'objet</text>
<text class="pied-note" x="0" y="531.0" font-size="13.5" fill="#52514e">d'aucune décision.</text>
