<circle cx="632.0" cy="220.5" r="5" fill="#0A0A0E" stroke="#ffffff" stroke-width="1.5"/>
<text x="632.0" y="211.5" font-size="12" font-weight="600" fill="#0A0A0E" text-anchor="middle">+6,5</text>
<text x="632.0" y="308.0" font-size="11" fill="#898781" text-anchor="middle">2025</text>
<line x1="0" y1="334.0" x2="720" y2="334.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="349.0" font-size="11" fill="#52514e">Calcul sur séries Eurostat (gov_10a_main, D41PAY) et INSEE (dette de Maastricht au 31 décembre), 2020-2025</text>
<text class="pied-note" x="0" y="363.0" font-size="11" fill="#52514e">Décomposition comptable encours / taux implicite (contributions à mi-chemin, calculées chaque année puis</text>
<text class="pied-note" x="0" y="377.0" font-size="11" fill="#52514e">additionnées). La part du taux implicite mêle refinancement, composition de la dette et indexation des titres indexés</text>
<text class="pied-note" x="0" y="391.0" font-size="11" fill="#52514e">sur l'inflation : elle ne mesure pas à elle seule l'effet des taux de marché.</text>
