<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 413" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dc-t dc-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="dc-t">D'où vient la hausse de la charge d'intérêts : encours ou taux implicite ?</title>
<desc id="dc-d">Barres empilées par année, de 2021 à 2025, en milliards d'euros : en bleu la contribution de la hausse de l'encours de dette, en orange celle du taux implicite ; le point noir est la variation de la charge d'intérêts. En 2021 : +5,1 (encours +3,5, taux implicite +1,6). En 2022 : +16,1 (encours +2,6, taux implicite +13,5). En 2023 : +2,5 (encours +2,3, taux implicite +0,2). En 2024 : +6,7 (encours +2,8, taux implicite +3,9). En 2025 : +6,5 (encours +4,0, taux implicite +2,5). Sur l'ensemble, de 2020 à 2025, la charge augmente de +36,9 milliards : +15,1 au titre de l'encours, +21,8 au titre du taux implicite. Décomposition comptable, non causale.</desc>
<rect width="720" height="413" fill="#ffffff"/>
<text x="0" y="22" font-size="15" font-weight="600" fill="#0A0A0E">D'où vient la hausse de la charge d'intérêts : encours ou taux implicite ?</text>
<text x="0" y="42" font-size="12" fill="#52514e">Variation annuelle de la charge, en milliards d'euros, et ce qui la compose</text>
<text x="0" y="64" font-size="13" font-weight="600" fill="#0A0A0E">De 2020 à 2025 : +36,9 Md€, dont +15,1 par l'encours et +21,8 par le taux implicite</text>
<rect x="0" y="72" width="12" height="12" fill="#184f95"/>
<text x="17" y="83" font-size="12" fill="#52514e">hausse de l'encours</text>
<rect x="156" y="72" width="12" height="12" fill="#eb6834"/>
<text x="173" y="83" font-size="12" fill="#52514e">hausse du taux implicite</text>
<circle cx="349" cy="78" r="5" fill="#0A0A0E"/>
<text x="360" y="83" font-size="12" fill="#52514e">variation de la charge</text>
<line x1="56" y1="290.0" x2="696" y2="290.0" stroke="#c3c2b7"/>
<text x="50" y="294.0" font-size="11" fill="#898781" text-anchor="end">0</text>
<line x1="56" y1="236.5" x2="696" y2="236.5" stroke="#e1e0d9"/>
<text x="50" y="240.5" font-size="11" fill="#898781" text-anchor="end">+5</text>
<line x1="56" y1="183.1" x2="696" y2="183.1" stroke="#e1e0d9"/>
<text x="50" y="187.1" font-size="11" fill="#898781" text-anchor="end">+10</text>
<line x1="56" y1="129.6" x2="696" y2="129.6" stroke="#e1e0d9"/>
<text x="50" y="133.6" font-size="11" fill="#898781" text-anchor="end">+15</text>
<rect x="92.0" y="252.3" width="56.0" height="37.7" fill="#184f95"/>
<rect x="92.0" y="235.5" width="56.0" height="16.8" fill="#eb6834"/>
<circle cx="120.0" cy="235.5" r="5" fill="#0A0A0E" stroke="#ffffff" stroke-width="1.5"/>
<text x="120.0" y="226.5" font-size="12" font-weight="600" fill="#0A0A0E" text-anchor="middle">+5,1</text>
<text x="120.0" y="308.0" font-size="11" fill="#898781" text-anchor="middle">2021</text>
<rect x="220.0" y="262.6" width="56.0" height="27.4" fill="#184f95"/>
<rect x="220.0" y="117.8" width="56.0" height="144.8" fill="#eb6834"/>
<circle cx="248.0" cy="117.8" r="5" fill="#0A0A0E" stroke="#ffffff" stroke-width="1.5"/>
<text x="248.0" y="108.8" font-size="12" font-weight="600" fill="#0A0A0E" text-anchor="middle">+16,1</text>
<text x="248.0" y="308.0" font-size="11" fill="#898781" text-anchor="middle">2022</text>
<rect x="348.0" y="265.6" width="56.0" height="24.4" fill="#184f95"/>
<rect x="348.0" y="263.3" width="56.0" height="2.3" fill="#eb6834"/>
<circle cx="376.0" cy="263.3" r="5" fill="#0A0A0E" stroke="#ffffff" stroke-width="1.5"/>
<text x="376.0" y="254.3" font-size="12" font-weight="600" fill="#0A0A0E" text-anchor="middle">+2,5</text>
<text x="376.0" y="308.0" font-size="11" fill="#898781" text-anchor="middle">2023</text>
<rect x="476.0" y="260.5" width="56.0" height="29.5" fill="#184f95"/>
<rect x="476.0" y="218.3" width="56.0" height="42.1" fill="#eb6834"/>
<circle cx="504.0" cy="218.3" r="5" fill="#0A0A0E" stroke="#ffffff" stroke-width="1.5"/>
<text x="504.0" y="209.3" font-size="12" font-weight="600" fill="#0A0A0E" text-anchor="middle">+6,7</text>
<text x="504.0" y="308.0" font-size="11" fill="#898781" text-anchor="middle">2024</text>
<rect x="604.0" y="247.1" width="56.0" height="42.9" fill="#184f95"/>
