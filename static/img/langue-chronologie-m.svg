<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1094" role="img" font-variant-numeric="tabular-nums" aria-labelledby="lan-cm-t lan-cm-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="lan-cm-t">Quand chaque mesure de la langue recule, tient ou progresse</title><desc id="lan-cm-d">Frise en deux panneaux, une ligne par mesure, sens de chaque intervalle ; repère : 2013, plus de la moitié des 12-17 ans équipés d'un smartphone. PIRLS, lecture (CM1) : 2001-2006 recul, sans test publié, 2006-2011 recul, sans test publié, 2011-2016 recul significatif, 2016-2021 sans évolution significative ; Dictée (erreurs en hausse = recul) (CM2) : 1987-2007 recul significatif, 2007-2015 recul, sans test publié, 2015-2021 recul, sans test publié ; Lecture, épreuves de 1987 (CM2) : 1987-1997 sans évolution significative, 1997-2007 recul significatif ; CEDRE, maîtrise de la langue (CM2) : 2003-2009 sans évolution significative, 2009-2015 sans évolution significative, 2015-2021 hausse significative ; Évaluation de début de sixième (6e) : 2017-2021 hausse, sans test publié, 2021-2025 recul, sans test publié ; CEDRE, langue et littératie (3e) : 2015-2021 sans évolution significative ; PISA, compréhension de l'écrit (15 ans) : 2000-2012 sans évolution significative, 2012-2025 recul significatif ; PISA, temps de lecture-plaisir (15 ans) : 2000-2009 recul significatif, 2009-2018 sans évolution significative ; PISA, plaisir de lire (indice) (15 ans) : 2009-2018 recul significatif ; Test d'entrée, français (GT) (seconde) : 2019-2021 hausse, sans test publié, 2021-2025 recul, sans test publié ; 20 livres ou plus dans l'année (15-24 ans) : 1988-1997 recul, sans test publié, 1997-2008 recul, sans test publié.</desc>
