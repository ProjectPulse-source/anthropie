<text x="0" y="600.0" font-size="13.5" fill="#55524f">international) ; DEPP (PIRLS 2021, NI</text>
<text x="0" y="617.0" font-size="13.5" fill="#55524f">23-21 ; test de positionnement de</text>
<text x="0" y="634.0" font-size="13.5" fill="#55524f">seconde, NI 26-22) ; OCDE (PISA 2025)</text>
<text x="0" y="655.0" font-size="13.5" fill="#55524f">Chaque évaluation a son échelle : les</text>
<text x="0" y="672.0" font-size="13.5" fill="#55524f">points ne se comparent pas d'une ligne</text>
<text x="0" y="689.0" font-size="13.5" fill="#55524f">à l'autre. Point plein :</text>
<text x="0" y="706.0" font-size="13.5" fill="#55524f">significativité publiée ; point creux</text>
