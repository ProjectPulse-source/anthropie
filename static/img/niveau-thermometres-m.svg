<text x="18" y="138" font-size="13.5" fill="#26262f">non significative </text>
<text x="0" y="168" font-size="14.5" fill="#26262f">TIMSS, mathématiques</text>
<text x="0" y="187" font-size="13.5" fill="#55524f">CM1 · 2019-2023</text>
<text x="300" y="187" font-size="16" font-weight="600" fill="#8a8781" text-anchor="end">−1</text>
<circle cx="6" cy="201" r="5" fill="#8a8781" stroke="#8a8781" stroke-width="1.6"/>
<text x="18" y="206" font-size="13.5" fill="#26262f">non significative </text>
