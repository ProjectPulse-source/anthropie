<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 771" role="img" font-variant-numeric="tabular-nums" aria-labelledby="niv-tm-t niv-tm-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="niv-tm-t">Quatre évaluations, leur dernière variation en France</title><desc id="niv-tm-d">Tableau, dernière variation de chaque évaluation en France, dans sa propre échelle : PIRLS, compréhension de l'écrit (CM1, 2016-2021) +3 points, non significative ; TIMSS, mathématiques (CM1, 2019-2023) −1 points, non significative ; TIMSS, mathématiques (quatrième, 2019-2023) −4 points, non significative ; Test de positionnement, mathématiques (entrée en seconde GT, 2021-2024) +7 points, hausse observée, sans test ; Test de positionnement, français (entrée en seconde GT, 2021-2024) −4 points, baisse observée, sans test ; PISA, culture mathématique (15 ans, 2022-2025) −16 points, baisse significative ; PISA, compréhension de l'écrit (15 ans, 2022-2025) −18 points, baisse significative.</desc>
