<text class="pied-note" x="0" y="484.0" font-size="13.5" fill="#55524f">Monthly averages. On 8 September 2025,</text>
<text class="pied-note" x="0" y="501.0" font-size="13.5" fill="#55524f">France borrowed at ten years at 3.49%</text>
<text class="pied-note" x="0" y="518.0" font-size="13.5" fill="#55524f">(Banque de France) and Greece at 3.34%</text>
<text class="pied-note" x="0" y="535.0" font-size="13.5" fill="#55524f">(Bank of Greece); on the 4th, a</text>
<text class="pied-note" x="0" y="552.0" font-size="13.5" fill="#55524f">like-for-like measure gave 3.50%</text>
<text class="pied-note" x="0" y="569.0" font-size="13.5" fill="#55524f">against 3.44%. A market price gives</text>
<text class="pied-note" x="0" y="586.0" font-size="13.5" fill="#55524f">the current cost of borrowing, not the</text>
<text class="pied-note" x="0" y="603.0" font-size="13.5" fill="#55524f">relative soundness of two countries.</text>
