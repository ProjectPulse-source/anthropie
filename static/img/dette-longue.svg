<text x="37.0" y="148.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781" text-anchor="end">75 %</text>
<line x1="44.0" y1="94.0" x2="592.0" y2="94.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="37.0" y="98.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781" text-anchor="end">100 %</text>
<line x1="44.0" y1="44.0" x2="592.0" y2="44.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="37.0" y="48.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781" text-anchor="end">125 %</text>
<line x1="44.0" y1="174.0" x2="592.0" y2="174.0" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="5 4"/>
<text x="50.0" y="169.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#898781">référence Maastricht, 60 %</text>
