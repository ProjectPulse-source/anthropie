<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" width="720" height="368" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dl-t dl-d">
<title id="dl-t">Dette publique française en % du PIB, de 1978 à T2 2026</title>
<desc id="dl-d">Elle part de 21,6 % du PIB en 1978, franchit 30 % en 1984, 60 % en 1996, 80 % en 2009, 100 % en 2020, et atteint 119,0 % au T2 2026. Un prolongement en pointillés montre la trajectoire du projet de loi de finances pour 2027, qui atteint 121,7 % en 2027 : une prévision, non une observation.</desc>
