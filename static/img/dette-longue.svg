<text x="126.3" y="256.8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#eb6834" text-anchor="middle">> 30 %</text>
<circle cx="290.9" cy="172.8" r="3.4" fill="#2a78d6"/>
<text x="290.9" y="161.8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#52514e" text-anchor="middle">1996</text>
<text x="290.9" y="201.9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#eb6834" text-anchor="middle">> 60 %</text>
<circle cx="469.1" cy="125.8" r="2.6" fill="#2a78d6"/>
<text x="469.1" y="114.8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#898781" text-anchor="middle">2009</text>
<text x="469.1" y="174.8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#eb6834" text-anchor="middle">> 80 %</text>
