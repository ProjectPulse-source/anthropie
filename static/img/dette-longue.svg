<text x="377.1" y="114.8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" fill="#898781" text-anchor="middle">2009</text>
<text x="377.1" y="178.1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#b8703f" text-anchor="middle">> 80 %</text>
