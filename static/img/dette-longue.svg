<text x="615.0" y="53.2" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#52514e" text-anchor="end">2020</text>
<text x="615.0" y="114.7" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#eb6834" text-anchor="end">> 100 %</text>
<circle cx="692.0" cy="59.0" r="5" fill="#eb6834"/>
<text x="687.0" y="48.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#52514e" text-anchor="end">T1 2026</text>
<text x="687.0" y="91.3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#eb6834" text-anchor="end">117,5 %</text>
<line x1="0" y1="324.0" x2="720" y2="324.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="0" y="337.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">INSEE, dette de Maastricht, 1978-T1 2026</text>
<text x="0" y="349.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">Dette au sens de Maastricht, toutes administrations publiques. « &gt; 80 % » : première fin d'année au-delà du seuil ; en trimestriel, il peut être franchi plus tôt.</text>
<text x="0" y="361.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#898781">Compilation Stéphane Lalut, CC BY 4.0 · stephane-lalut.com/cout-de-la-dette-publique/</text>
