<text x="519.3" y="314.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" fill="#898781" text-anchor="middle">crise sanitaire</text>
<line x1="0" y1="324.0" x2="720" y2="324.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="0" y="337.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">INSEE, dette de Maastricht, 1978-T2 2026</text>
<text x="0" y="349.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">Dette au sens de Maastricht, toutes administrations publiques. « &gt; 80 % » : première fin d'année au-delà du seuil ; en trimestriel, il peut être franchi plus tôt.</text>
