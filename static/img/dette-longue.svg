<circle cx="592.0" cy="50.6" r="4" fill="#ffffff" stroke="#184f95" stroke-width="2"/>
<text x="601.0" y="51.6" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#184f95">121,7 %</text>
<text x="601.0" y="66.6" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#898781">trajectoire PLF 2027</text>
