<text x="49.0" y="268.3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#eb6834" text-anchor="start">21,6 %</text>
<circle cx="126.3" cy="233.6" r="2.6" fill="#2a78d6"/>
