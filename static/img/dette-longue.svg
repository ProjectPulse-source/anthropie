<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" width="720" height="368" role="img" aria-labelledby="dl-t dl-d">
<title id="dl-t">Dette publique française en % du PIB, de 1978 à T1 2026</title>
<desc id="dl-d">Elle part de 21,6 % du PIB en 1978, franchit 30 % en 1984, 60 % en 1996, 80 % en 2009, 100 % en 2020, et atteint 117,5 % au T1 2026.</desc>
