<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 633" role="img" font-variant-numeric="tabular-nums" aria-labelledby="chm-t chm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="chm-t">La charge d'intérêts en milliards d'euros, 1995-2025</title><desc id="chm-d">Une courbe en milliards d'euros courants, de 1995 à 2025. La charge d'intérêts descend jusqu'au creux de 2020 (29,7 milliards), puis remonte fortement pour atteindre 66,6 milliards en 2025. Deux cercles évidés, non reliés à la courbe, portent la prévision du Gouvernement dans le projet de loi de finances pour 2027 : 79,2 milliards en 2026, 91 en 2027. Une prévision, non une observation, sur une base 2025 non réconciliée avec Eurostat.</desc>
<rect width="300" height="633" fill="#ffffff"/>
