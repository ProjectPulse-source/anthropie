<title id="etu-s-t">Jeunes traités par antidépresseurs ou régulateurs de l'humeur, 2015-2024</title><desc id="etu-s-d">Deux courbes, de 2015 à 2024, de la part des 20-24 ans traités par antidépresseurs ou régulateurs de l'humeur, hors pathologie psychiatrique repérée, en %. Femmes : 1,20 en 2015, 1,24 en 2017, 1,93 en 2021, 2,78 en 2024. Hommes : 0,69 en 2015, 0,70 en 2017, 0,81 en 2021, 1,10 en 2024.</desc>
