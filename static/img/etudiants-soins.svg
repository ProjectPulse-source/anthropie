<text class="pied-source" x="0" y="325.0" font-size="11" fill="#55524f">Assurance maladie, cartographie des pathologies et des dépenses : traitements antidépresseurs et régulateurs de</text>
<text class="pied-source" x="0" y="339.0" font-size="11" fill="#55524f">l'humeur « hors pathologies »</text>
<text class="pied-note" x="0" y="353.0" font-size="11" fill="#55524f">C'est-à-dire sans diagnostic psychiatrique repéré par une hospitalisation ou une affection de longue durée récente.</text>
<text class="pied-note" x="0" y="367.0" font-size="11" fill="#55524f">Ces séries ne distinguent pas les étudiants des autres jeunes.</text>
