<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 2740" role="img" font-variant-numeric="tabular-nums" aria-labelledby="formm-t formm-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="formm-t">Onze formules du 8 septembre 2025 : ce que les chiffres tranchent</title><desc id="formm-d">Séance de l'Assemblée nationale du 8 septembre 2025, onze formules, groupées en trois niveaux (mesurer, expliquer, conclure). « Pas de budget en équilibre depuis cinquante et un ans » (F. Bayrou) : Exact pour les administrations publiques : dernier excédent en 1974 (0,2 Md€), déficit chaque année depuis 1975. Hors intérêts, le solde a été positif quatre ans (1998 à 2001). Constat, pas d'inférence. « Un euro de déficit, c'est un euro de dette » (F. Bayrou) : Inexact année par année : écart de plus de 20 % du déficit 13 années sur 30 (ajustements entre flux et stock). Cumul 1996-2025 : 2 649 contre 2 758 Md€, proche. Constat, pas d'inférence. « 3 % de déficit, seuil à partir duquel la dette n'augmente plus » (F. Bayrou) : En euros, inexact : un déficit de 3 % représente environ 90 Md€ par an. En % du PIB, exact si la croissance nominale dépasse environ 2,74 % : 3,58 % en 2024, 1,90 % en 2025 (connu après). Condition décisive non dite. « La France s'endette à des taux supérieurs à ceux de la Grèce » (L. Wauquiez) : Exact le jour même : 3,49 % contre 3,34 % le 8 septembre 2025 (sources des deux banques centrales). Moyenne 2025 : écarts à l'Allemagne quasi égaux ; Grèce au-dessus de mars à mai 2026. Jugement de risque, non établi. « Dépenses restées stables depuis 2017 ; c'est la baisse des recettes » (C. Chatelain) : Exact sur 2017-2024 : dépenses −0,5 pt de PIB, recettes −2,9 pts (comptes de mai 2025). Depuis 2019 : dépenses +1,9 pt. Comptable : étayé ; causal : non établi. « 66 milliards en 2026 » contre « 75 milliards en 2026 » (É. Ciotti, F. Bayrou) : 75 : compatible avec la trajectoire de la Cour ; 66 : aucune prévision 2026 retrouvée. 66 égale le chiffre officiel de 2025 : un écho, pas une filiation prouvée. Pas d'inférence. « 50 milliards créés, plus de 100 versés aux créanciers, le double » (F. Bayrou) : Intérêts exacts : prévus par la Cour, 67 Md€ en 2025, 107 en 2029. Années alignées : surcroît de 2029 de 66 à 97 Md€ ; ce n'est plus le double, mais 1,1 à 1,6 fois. « Entièrement reversé » : non établi. « Plus de 1 000 milliards de dette en plus » depuis 2017 (B. Vallaud, M. Panot) : Exact sous toutes les variantes testées : de 1 064 à 1 155 Md€. « Nous ont coûté » : mesurer n'est pas attribuer. Attribution : non établie. « 1 200 milliards depuis 2017, après 400 sous François Hollande » (É. Ciotti) : 400 : exact (359) ; 1 200 : de justesse depuis janvier 2017 (1 155), pas depuis l'élection (1 064). Par an en points de PIB : 1,6 contre 1,7. Imputation à un mandat : non établie. « Bientôt plus pour les intérêts que pour former nos enfants » (L. Wauquiez) : Administrations : 40 % en 2024, pas avant 2029 ; État : 83 % en 2025. Plafonds de l'État pour 2026 : 92 % (mission qui inclut d'autres dépenses). Pour l'État, étayé, non décisif. « La charge laissée à nos enfants augmente de 18 millions par heure » (P. Christophe) : Sous-estimé pour la dette : 20,9 millions par heure. Proche du déficit prévu pour 2025 : environ 18,4. Question distributive : non établi.</desc>
