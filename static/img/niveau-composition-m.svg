<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 739" role="img" font-variant-numeric="tabular-nums" aria-labelledby="niv-cm-t niv-cm-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="niv-cm-t">PISA 2015-2025 : trois mesures de la baisse</title><desc id="niv-cm-d">Baisse du score moyen PISA de 2015 à 2025 : observée, à la répartition entre classes de 2015, puis à la composition de 2015 pour la classe, le sexe et la famille : mathématiques 35, 43, 36 points ; compréhension de l'écrit 43, 51, 44 points ; culture scientifique 12, 21, 13 points.</desc>
<rect width="300" height="739" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">PISA 2015-2025 : trois mesures</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">de la baisse</text>
<rect x="0" y="74" width="14" height="14" fill="#8a8781"/>
<text x="22" y="86" font-size="13.5" fill="#55524f">Baisse observée</text>
<rect x="0" y="96" width="14" height="14" fill="#eb6834"/>
<text x="22" y="108" font-size="13.5" fill="#55524f">À la répartition entre classes</text>
<text x="22" y="126" font-size="13.5" fill="#55524f">de 2015</text>
<rect x="0" y="136" width="14" height="14" fill="#c9c5c0"/>
<text x="22" y="148" font-size="13.5" fill="#55524f">À la composition de 2015</text>
<text x="22" y="166" font-size="13.5" fill="#55524f">(classe, sexe, famille)</text>
<text x="0" y="208" font-size="15" font-weight="600" fill="#26262f">Mathématiques</text>
<rect x="0" y="216" width="129.3" height="18" fill="#8a8781"/>
<text x="135.3" y="230" font-size="15" font-weight="600" fill="#8a8781">35</text>
<rect x="0" y="242" width="155.9" height="18" fill="#eb6834"/>
<text x="161.9" y="256" font-size="15" font-weight="600" fill="#eb6834">43</text>
<rect x="0" y="268" width="130.7" height="18" fill="#c9c5c0"/>
<text x="136.7" y="282" font-size="15" font-weight="600" fill="#55524f">36</text>
<text x="0" y="320" font-size="15" font-weight="600" fill="#26262f">Compréhension de l'écrit</text>
<rect x="0" y="328" width="157.6" height="18" fill="#8a8781"/>
<text x="163.6" y="342" font-size="15" font-weight="600" fill="#8a8781">43</text>
<rect x="0" y="354" width="187.1" height="18" fill="#eb6834"/>
<text x="193.1" y="368" font-size="15" font-weight="600" fill="#eb6834">51</text>
<rect x="0" y="380" width="159.6" height="18" fill="#c9c5c0"/>
<text x="165.6" y="394" font-size="15" font-weight="600" fill="#55524f">44</text>
<text x="0" y="432" font-size="15" font-weight="600" fill="#26262f">Culture scientifique</text>
<rect x="0" y="440" width="42.4" height="18" fill="#8a8781"/>
<text x="48.4" y="454" font-size="15" font-weight="600" fill="#8a8781">12</text>
<rect x="0" y="466" width="77.3" height="18" fill="#eb6834"/>
<text x="83.3" y="480" font-size="15" font-weight="600" fill="#eb6834">21</text>
<rect x="0" y="492" width="46.2" height="18" fill="#c9c5c0"/>
<text x="52.2" y="506" font-size="15" font-weight="600" fill="#55524f">13</text>
<line x1="0" y1="530.0" x2="300" y2="530.0" stroke="#dcd8d3"/>
<text x="0" y="551.0" font-size="13.5" fill="#55524f">OCDE, bases PISA 2015 et 2025 (données</text>
<text x="0" y="568.0" font-size="13.5" fill="#55524f">individuelles) ; calcul de l'auteur</text>
<text x="0" y="585.0" font-size="13.5" fill="#55524f">(valeurs plausibles, poids répliqués)</text>
<text x="0" y="606.0" font-size="13.5" fill="#55524f">Baisse du score moyen, en points. Une</text>
<text x="0" y="623.0" font-size="13.5" fill="#55524f">baisse observée et deux</text>
<text x="0" y="640.0" font-size="13.5" fill="#55524f">standardisations descriptives, trois</text>
<text x="0" y="657.0" font-size="13.5" fill="#55524f">questions : aucune n'est « la vraie</text>
<text x="0" y="674.0" font-size="13.5" fill="#55524f">baisse », aucune ne mesure l'effet du</text>
<text x="0" y="691.0" font-size="13.5" fill="#55524f">redoublement.</text>
