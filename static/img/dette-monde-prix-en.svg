<title id="mp-t">Average interest cost and recent inflation: Europe in 2025</title><desc id="mp-d">Outside the euro area, the implicit interest rate is closely associated with recent inflation; within the euro area, much less so: the Baltic states saw high inflation without a high rate. Sweden, outside the euro, has the same implicit interest rate as Germany. Association observed over one year, not causation.</desc>
