<text x="0" y="327.0" font-size="9" fill="#55524f">Baisse du score moyen, en points. Une baisse observée et deux standardisations descriptives, trois questions : aucune n'est « la vraie baisse », aucune ne mesure l'effet du redoublement.</text>
