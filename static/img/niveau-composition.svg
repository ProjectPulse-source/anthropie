<title id="niv-c-t">PISA 2015-2025 : trois mesures de la baisse, selon la composition retenue</title><desc id="niv-c-d">Baisse du score moyen PISA de 2015 à 2025 : observée, à la répartition entre classes de 2015, puis à la composition de 2015 pour la classe, le sexe et la famille : mathématiques 35, 43, 36 points ; compréhension de l'écrit 43, 51, 44 points ; culture scientifique 12, 21, 13 points.</desc>
