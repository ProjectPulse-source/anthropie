<title id="niv-c-t">PISA 2015-2025 : baisse observée et baisse à la répartition entre classes de 2015</title><desc id="niv-c-d">Baisse du score moyen PISA de 2015 à 2025, observée puis avec la répartition entre classes de 2015 : mathématiques 35 points, 43 ; compréhension de l'écrit 43 points, 51 ; culture scientifique 12 points, 21.</desc>
