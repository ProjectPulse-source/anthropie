<text class="pied-source" x="0" y="946.0" font-size="13.5" fill="#55524f">MESRE-SIES, État de l'enseignement</text>
<text class="pied-source" x="0" y="963.0" font-size="13.5" fill="#55524f">supérieur, de la recherche et de</text>
<text class="pied-source" x="0" y="980.0" font-size="13.5" fill="#55524f">l'innovation en France n° 18, tableau</text>
<text class="pied-source" x="0" y="997.0" font-size="13.5" fill="#55524f">13.03 ; France métropolitaine et DROM</text>
<text class="pied-note" x="0" y="1018.0" font-size="13.5" fill="#55524f">Champ : bacheliers 2023 inscrits dans</text>
<text class="pied-note" x="0" y="1035.0" font-size="13.5" fill="#55524f">le supérieur à la rentrée suivante ;</text>
<text class="pied-note" x="0" y="1052.0" font-size="13.5" fill="#55524f">ceux qui ne poursuivent pas n'y</text>
<text class="pied-note" x="0" y="1069.0" font-size="13.5" fill="#55524f">figurent pas. STS : apprentissage</text>
<text class="pied-note" x="0" y="1086.0" font-size="13.5" fill="#55524f">compris. Origine : catégorie</text>
<text class="pied-note" x="0" y="1103.0" font-size="13.5" fill="#55524f">socioprofessionnelle du parent,</text>
<text class="pied-note" x="0" y="1120.0" font-size="13.5" fill="#55524f">renseignée pour 88,9 % des inscrits ;</text>
<text class="pied-note" x="0" y="1137.0" font-size="13.5" fill="#55524f">les autres ne sont pas répartis par la</text>
<text class="pied-note" x="0" y="1154.0" font-size="13.5" fill="#55524f">source. Une inscription observée n'est</text>
<text class="pied-note" x="0" y="1171.0" font-size="13.5" fill="#55524f">pas un choix : elle dépend aussi de la</text>
<text class="pied-note" x="0" y="1188.0" font-size="13.5" fill="#55524f">série du baccalauréat, des</text>
<text class="pied-note" x="0" y="1205.0" font-size="13.5" fill="#55524f">candidatures et des admissions, que ce</text>
<text class="pied-note" x="0" y="1222.0" font-size="13.5" fill="#55524f">tableau ne croise pas. Taux arrondis :</text>
<text class="pied-note" x="0" y="1239.0" font-size="13.5" fill="#55524f">leur somme peut différer de 100 %.</text>
<text class="pied-note" x="0" y="1256.0" font-size="13.5" fill="#55524f">Catégories dans l'ordre de la source,</text>
<text class="pied-note" x="0" y="1273.0" font-size="13.5" fill="#55524f">sans hiérarchie.</text>
