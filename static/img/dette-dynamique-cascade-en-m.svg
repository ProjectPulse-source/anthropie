<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 660" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dcm-t dcm-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="dcm-t">Public debt: from 57.8% to 115.6% of GDP, 1995-2025</title><desc id="dcm-d">Waterfall chart in points of GDP. The debt starts at 57.8% at the end of 1995. Interest would have pushed it up by 73.9 points, but nominal GDP growth erased 72.8: their net effect is +1.2 points. Primary deficits, excluding interest, add 50.5 points, stock-flow adjustments +6.0. The debt reaches 115.6% at the end of 2025. Accounting decomposition, not a causal one.</desc>
<rect width="300" height="660" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">Public debt: from 57.8% to</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">115.6% of GDP, 1995-2025</text>
<text x="0" y="86" font-size="13.5" fill="#55524f">in points of GDP; + pushes up, − pulls</text>
<text x="0" y="104" font-size="13.5" fill="#55524f">down</text>
<text x="0" y="134" font-size="15" fill="#26262f">Debt, end 1995</text>
<text x="300" y="134" font-size="15" font-weight="600" fill="#26262f" text-anchor="end">57.8%</text>
<rect x="0.0" y="142" width="124.9" height="14" fill="#184f95"/>
<text x="0" y="186" font-size="15" fill="#26262f">Interest effect</text>
<text x="300" y="186" font-size="15" font-weight="600" fill="#26262f" text-anchor="end">+73.9</text>
<rect x="124.9" y="194" width="159.7" height="14" fill="#eb6834"/>
<text x="0" y="238" font-size="15" fill="#26262f">Nominal GDP growth</text>
<text x="300" y="238" font-size="15" font-weight="600" fill="#26262f" text-anchor="end">−72.8</text>
<rect x="127.4" y="246" width="157.2" height="14" fill="#8a8781"/>
<text x="0" y="290" font-size="15" fill="#26262f">Primary deficits</text>
<text x="300" y="290" font-size="15" font-weight="600" fill="#26262f" text-anchor="end">+50.5</text>
<rect x="127.4" y="298" width="109.2" height="14" fill="#eb6834"/>
<text x="0" y="342" font-size="15" fill="#26262f">Stock-flow adjustments</text>
<text x="300" y="342" font-size="15" font-weight="600" fill="#26262f" text-anchor="end">+6.0</text>
<rect x="236.6" y="350" width="13.0" height="14" fill="#eb6834"/>
<text x="0" y="394" font-size="15" fill="#26262f">Debt, end 2025</text>
<text x="300" y="394" font-size="15" font-weight="600" fill="#26262f" text-anchor="end">115.6%</text>
<rect x="0.0" y="402" width="249.6" height="14" fill="#184f95"/>
<line x1="0" y1="434.0" x2="300" y2="434.0" stroke="#dcd8d3"/>
<text x="0" y="455.0" font-size="13.5" fill="#55524f">Eurostat gov_10dd_edpt1 (debt),</text>
<text x="0" y="472.0" font-size="13.5" fill="#55524f">gov_10a_main (B9, D41PAY),</text>
<text x="0" y="489.0" font-size="13.5" fill="#55524f">notification GDP, France, 1996-2025;</text>
<text x="0" y="506.0" font-size="13.5" fill="#55524f">Eurostat releases of 22 April 2026 and</text>
<text x="0" y="523.0" font-size="13.5" fill="#55524f">21 July 2026</text>
<text x="0" y="544.0" font-size="13.5" fill="#55524f">Cumulative contributions to the ratio,</text>
<text x="0" y="561.0" font-size="13.5" fill="#55524f">in points of GDP: neither amounts paid</text>
<text x="0" y="578.0" font-size="13.5" fill="#55524f">nor causes. Totals computed before</text>
<text x="0" y="595.0" font-size="13.5" fill="#55524f">rounding, hence a possible gap of a</text>
<text x="0" y="612.0" font-size="13.5" fill="#55524f">tenth.</text>
<text x="0" y="633.0" font-size="13.5" fill="#96928f">Compiled by Stéphane Lalut, CC BY 4.0</text>
<text x="0" y="650.0" font-size="13.5" fill="#96928f">· stephane-lalut.com</text>
</svg>