<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 572" role="img" font-variant-numeric="tabular-nums" aria-labelledby="lan-pm-t lan-pm-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="lan-pm-t">Élèves qui déclarent ne pas lire pour leur plaisir, selon la classe (2023)</title><desc id="lan-pm-d">Barres, part des élèves qui déclarent ne pas lire pour leur plaisir en 2023 : Sixième 12 % ; Quatrième 28 % ; Seconde générale et technologique 32 % ; Seconde professionnelle 49 % ; Première année de CAP 47 %.</desc>
<rect width="300" height="572" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">Élèves qui déclarent ne pas</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">lire pour leur plaisir, selon</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#26262f">la classe (2023)</text>
<text x="0" y="104" font-size="14.5" fill="#26262f">Sixième</text>
<rect x="0" y="110" width="49.6" height="22" fill="#eb6834"/>
<text x="55.6" y="127" font-size="16" font-weight="600" fill="#26262f">12 %</text>
<text x="0" y="160" font-size="14.5" fill="#26262f">Quatrième</text>
<rect x="0" y="166" width="113.5" height="22" fill="#eb6834"/>
<text x="119.5" y="183" font-size="16" font-weight="600" fill="#26262f">28 %</text>
<text x="0" y="216" font-size="14.5" fill="#26262f">Seconde générale et technologique</text>
<rect x="0" y="222" width="128.7" height="22" fill="#eb6834"/>
<text x="134.7" y="239" font-size="16" font-weight="600" fill="#26262f">32 %</text>
<text x="0" y="272" font-size="14.5" fill="#26262f">Seconde professionnelle</text>
<rect x="0" y="278" width="195.0" height="22" fill="#eb6834"/>
<text x="201.0" y="295" font-size="16" font-weight="600" fill="#26262f">49 %</text>
<text x="0" y="328" font-size="14.5" fill="#26262f">Première année de CAP</text>
<rect x="0" y="334" width="188.4" height="22" fill="#eb6834"/>
<text x="194.4" y="351" font-size="16" font-weight="600" fill="#26262f">47 %</text>
<line x1="0" y1="380.0" x2="300" y2="380.0" stroke="#dcd8d3"/>
<text x="0" y="401.0" font-size="13.5" fill="#55524f">DEPP, Note d'Information 25.66, figure</text>
<text x="0" y="418.0" font-size="13.5" fill="#55524f">1.1 web (questionnaires des</text>
<text x="0" y="435.0" font-size="13.5" fill="#55524f">évaluations nationales, septembre</text>
<text x="0" y="452.0" font-size="13.5" fill="#55524f">2023)</text>
<text x="0" y="473.0" font-size="13.5" fill="#55524f">Une seule enquête : l'écart entre</text>
<text x="0" y="490.0" font-size="13.5" fill="#55524f">classes compare des élèves différents</text>
<text x="0" y="507.0" font-size="13.5" fill="#55524f">la même année, ce n'est pas une</text>
<text x="0" y="524.0" font-size="13.5" fill="#55524f">évolution dans le temps.</text>
<text x="0" y="545.0" font-size="13.5" fill="#96928f">Calcul Stéphane Lalut, CC BY 4.0 ·</text>
<text x="0" y="562.0" font-size="13.5" fill="#96928f">stephane-lalut.com</text>
</svg>