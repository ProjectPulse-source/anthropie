<title id="futurs-eventail-m-t">Public debt in 2030: several futures, under which assumptions?</title><desc id="futurs-eventail-m-d">Fan of debt paths simulated by the European Commission, 2025 to 2030: in 2030, 10th percentile 118.1%, 90th percentile 136.2%; Commission baseline 126.5% in 2030 and 140.8% in 2035; 2027 draft budget forecast: 120.9% in 2030; October 2024 commitment: 115.8% in 2029. Bands, from lightest to darkest: 10th to 90th, 20th to 80th and 40th to 60th percentiles of the paths simulated by the Commission (8, 6 and 2 in 10). Starting points in 2025: Commission 116.3%, 2027 draft budget 115.7%, 2024 commitment 114.7%.</desc>
