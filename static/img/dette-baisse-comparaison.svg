<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 465" role="img" font-variant-numeric="tabular-nums" aria-labelledby="bc-t bc-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="bc-t">Sept pays à plus de 90 % de dette fin 2015 : ce qui a fait bouger leur ratio en dix ans</title><desc id="bc-d">Pays dont la dette dépassait 90 % du PIB fin 2015. Pour chaque pays, en points de PIB cumulés de 2016-2025 : effet des taux et de la croissance, contribution du solde primaire (un excédent fait baisser le ratio, un déficit le fait monter), autres ajustements, et la variation du ratio, leur somme. Chypre : taux et croissance −46,2, solde primaire −23,3, autres ajustements +12,9, variation −56,6. Portugal : taux et croissance −33,3, solde primaire −15,5, autres ajustements +7,4, variation −41,4. Grèce : taux et croissance −30,4, solde primaire −15,2, autres ajustements +12,1, variation −33,5. Espagne : taux et croissance −22,5, solde primaire +19,1, autres ajustements +1,5, variation −1,8. Belgique : taux et croissance −23,8, solde primaire +17,0, autres ajustements +9,0, variation +2,2. Italie : taux et croissance −5,3, solde primaire +11,6, autres ajustements −4,0, variation +2,3. France : taux et croissance −15,1, solde primaire +30,6, autres ajustements +3,1, variation +18,6. L'effet des taux et de la croissance fait baisser le ratio partout ; dans les trois pays où le ratio a nettement baissé, il pèse environ deux fois plus que leurs excédents primaires.</desc>
