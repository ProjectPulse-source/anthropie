<title id="ce-t">Dette des administrations territoriales et part détenue par l’État central, en % du PIB</title><desc id="ce-d">Quatre petits graphiques, de 2000 à 2025. France : 7,2 % du PIB en 2000, 9,3 % en 2025 ; part détenue par l&#x27;État central en 2025 : 0,1 point de PIB. Allemagne : 21,7 % du PIB en 2000, 19,7 % en 2025 ; part détenue par l&#x27;État central en 2025 : 0,2 point de PIB. Italie : 5,3 % du PIB en 2000, 4,7 % en 2025 ; part détenue par l&#x27;État central en 2025 : 1,2 point de PIB. Espagne : 9,2 % du PIB en 2000, 21,4 % en 2025 ; part détenue par l&#x27;État central en 2025 : 12,6 points de PIB.</desc>
