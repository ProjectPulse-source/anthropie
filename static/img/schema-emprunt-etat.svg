<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 791" role="img" aria-labelledby="se-t se-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="se-t">Comment l'État emprunte, et qui reçoit les intérêts</title><desc id="se-d">Schéma en deux volets. Premier volet, le chemin d'un titre : l'Agence France Trésor vend les titres de l'État aux enchères à des banques agréées, les spécialistes en valeurs du Trésor ; elles les revendent aux investisseurs, en France et à l'étranger ; de 2015 à 2022 (achats nets), la Banque de France en a acheté sur ce marché, jamais directement à l'État, en payant avec des réserves créditées aux banques. Second volet, ce que l'État paie chaque année : les coupons, à chaque détenteur, Banque de France comprise ; la Banque de France paie de son côté les réserves placées par les banques, au taux de dépôt de la BCE, et reverse ses bénéfices à l'État selon ses résultats. À l'échéance, l'État rembourse chaque titre avec sa trésorerie ou un nouvel emprunt.</desc>
<rect width="720" height="791" fill="#ffffff"/>
<defs><marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#184f95"/></marker><marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs>
<text x="0" y="18" font-size="13" font-weight="600" fill="#0A0A0E">Comment l'État emprunte, et qui reçoit les intérêts</text>
<text x="0" y="50" font-size="12" font-weight="600" fill="#184f95">1. Le chemin d'un titre</text>
<rect x="0.0" y="64.0" width="150.0" height="84.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="75.0" y="102.7" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">L'État</text>
<text x="75.0" y="117.7" font-size="11" text-anchor="middle" fill="#52514e">Agence France Trésor</text>
<rect x="190.0" y="64.0" width="150.0" height="84.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="265.0" y="95.2" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">Spécialistes en</text>
<text x="265.0" y="110.2" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">valeurs du Trésor</text>
<text x="265.0" y="125.2" font-size="11" text-anchor="middle" fill="#52514e">banques agréées</text>
<rect x="380.0" y="64.0" width="150.0" height="84.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="455.0" y="87.7" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">Investisseurs</text>
<text x="455.0" y="102.7" font-size="11" text-anchor="middle" fill="#52514e">assureurs, banques,</text>
<text x="455.0" y="117.7" font-size="11" text-anchor="middle" fill="#52514e">fonds, en France et à</text>
<text x="455.0" y="132.7" font-size="11" text-anchor="middle" fill="#52514e">l'étranger</text>
<rect x="570.0" y="64.0" width="150.0" height="84.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="645.0" y="102.7" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">Banque de France</text>
<text x="645.0" y="117.7" font-size="11" text-anchor="middle" fill="#52514e">pour l'Eurosystème</text>
<path d="M153.0,94.0 L187.0,94.0" fill="none" stroke="#184f95" stroke-width="2" marker-end="url(#fb)"/>
<circle cx="170.0" cy="77.0" r="9" fill="#184f95"/>
<text x="170.0" y="81.0" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
<path d="M343.0,94.0 L377.0,94.0" fill="none" stroke="#184f95" stroke-width="2" marker-end="url(#fb)"/>
<circle cx="360.0" cy="77.0" r="9" fill="#184f95"/>
<text x="360.0" y="81.0" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
<path d="M533.0,94.0 L567.0,94.0" fill="none" stroke="#184f95" stroke-width="2" marker-end="url(#fb)"/>
<circle cx="550.0" cy="77.0" r="9" fill="#184f95"/>
<text x="550.0" y="81.0" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
<path d="M567.0,126.0 L533.0,126.0" fill="none" stroke="#898781" stroke-width="2" marker-end="url(#fg)"/>
<circle cx="550.0" cy="143.0" r="9" fill="#898781"/>
<text x="550.0" y="147.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">4</text>
<circle cx="8.0" cy="176.0" r="8" fill="#184f95"/>
<text x="8.0" y="180.0" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
<text x="24.0" y="180.0" font-size="12" fill="#0A0A0E">L'Agence France Trésor vend les titres de l'État, pour l'essentiel aux enchères (adjudication).</text>
<text x="24.0" y="196.0" font-size="12" fill="#0A0A0E">Seuls les spécialistes en valeurs du Trésor y achètent : l'État reçoit leur argent, c'est l'emprunt.</text>
<circle cx="8.0" cy="214.0" r="8" fill="#184f95"/>
<text x="8.0" y="218.0" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
<text x="24.0" y="218.0" font-size="12" fill="#0A0A0E">Ils les gardent ou les revendent aux investisseurs, sur le marché « secondaire ».</text>
<circle cx="8.0" cy="236.0" r="8" fill="#184f95"/>
<text x="8.0" y="240.0" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
<text x="24.0" y="240.0" font-size="12" fill="#0A0A0E">De 2015 à 2022 (achats nets), la Banque de France en a acheté sur ce marché pour l'Eurosystème (les</text>
<text x="24.0" y="256.0" font-size="12" fill="#0A0A0E">banques centrales de la zone euro), puis a remplacé les titres échus jusqu'en juillet 2023 ou fin</text>
<text x="24.0" y="272.0" font-size="12" fill="#0A0A0E">2024 selon le programme ; jamais à l'État lui-même : le traité européen l'interdit (article 123).</text>
<circle cx="8.0" cy="290.0" r="8" fill="#898781"/>
<text x="8.0" y="294.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">4</text>
<text x="24.0" y="294.0" font-size="12" fill="#0A0A0E">Elle les a payés en monnaie de banque centrale, créée pour l'achat : des réserves créditées à la</text>
<text x="24.0" y="310.0" font-size="12" fill="#0A0A0E">banque du vendeur.</text>
<text x="0" y="340.0" font-size="12" font-weight="600" fill="#b8420f">2. Les intérêts payés chaque année, et à qui</text>
<rect x="0.0" y="408.0" width="170.0" height="62.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="85.0" y="435.7" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">L'État</text>
<text x="85.0" y="450.7" font-size="11" text-anchor="middle" fill="#52514e">Agence France Trésor</text>
<rect x="275.0" y="356.0" width="170.0" height="62.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="360.0" y="376.2" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">Investisseurs</text>
<text x="360.0" y="391.2" font-size="11" text-anchor="middle" fill="#52514e">assureurs, banques, fonds,</text>
<text x="360.0" y="406.2" font-size="11" text-anchor="middle" fill="#52514e">en France et à l'étranger</text>
<rect x="275.0" y="460.0" width="170.0" height="62.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="360.0" y="487.7" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">Banque de France</text>
<text x="360.0" y="502.7" font-size="11" text-anchor="middle" fill="#52514e">pour l'Eurosystème</text>
<rect x="550.0" y="460.0" width="170.0" height="62.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="635.0" y="480.2" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">Banques</text>
<text x="635.0" y="495.2" font-size="11" text-anchor="middle" fill="#52514e">qui détiennent les</text>
<text x="635.0" y="510.2" font-size="11" text-anchor="middle" fill="#52514e">réserves</text>
<path d="M173.0,426.0 L272.0,387.0" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#fo)"/>
<path d="M173.0,452.0 L272.0,480.0" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#fo)"/>
<circle cx="222.5" cy="439.0" r="9" fill="#eb6834"/>
<text x="222.5" y="443.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">5</text>
<path d="M448.0,480.0 L547.0,480.0" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#fo)"/>
<circle cx="497.5" cy="468.0" r="9" fill="#eb6834"/>
<text x="497.5" y="472.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">6</text>
<path d="M305.0,525.0 L305.0,544.0 L85.0,544.0 L85.0,473.0" fill="none" stroke="#898781" stroke-width="2" marker-end="url(#fg)"/>
<circle cx="195.0" cy="544.0" r="9" fill="#898781"/>
<text x="195.0" y="548.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">7</text>
<circle cx="8.0" cy="578.0" r="8" fill="#eb6834"/>
<text x="8.0" y="582.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">5</text>
<text x="24.0" y="582.0" font-size="12" fill="#0A0A0E">Chaque année, l'État paie les intérêts de ses titres à chaque détenteur, Banque de France comprise.</text>
<text x="24.0" y="598.0" font-size="12" fill="#0A0A0E">À l'échéance, il rembourse le titre avec sa trésorerie ou un nouvel emprunt : retour en 1.</text>
<circle cx="8.0" cy="616.0" r="8" fill="#eb6834"/>
<text x="8.0" y="620.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">6</text>
<text x="24.0" y="620.0" font-size="12" fill="#0A0A0E">La Banque de France rémunère au taux de dépôt de la BCE les réserves placées à sa facilité de dépôt</text>
<text x="24.0" y="636.0" font-size="12" fill="#0A0A0E">(les réserves obligatoires ne sont plus rémunérées depuis septembre 2023).</text>
<circle cx="8.0" cy="654.0" r="8" fill="#898781"/>
<text x="8.0" y="658.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">7</text>
<text x="24.0" y="658.0" font-size="12" fill="#0A0A0E">Selon ses résultats, elle reverse à l'État un impôt et un dividende. Quand les réserves lui coûtent</text>
<text x="24.0" y="674.0" font-size="12" fill="#0A0A0E">plus que ses titres ne rapportent, ses résultats baissent : elle n'a versé aucun dividende au titre</text>
<text x="24.0" y="690.0" font-size="12" fill="#0A0A0E">des exercices 2022 à 2025.</text>
<line x1="0" y1="712.0" x2="720" y2="712.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="727.0" font-size="11" fill="#52514e">Schéma de l'auteur ; Agence France Trésor, Banque de France (comptes annuels), BCE, traité sur le fonctionnement de</text>
<text class="pied-source" x="0" y="741.0" font-size="11" fill="#52514e">l'UE (art. 123).</text>
<text class="pied-note" x="0" y="755.0" font-size="11" fill="#52514e">Schéma simplifié : l'État n'est qu'une partie des administrations publiques, et la Banque de France n'en fait pas</text>
<text class="pied-note" x="0" y="769.0" font-size="11" fill="#52514e">partie.</text>
