<line x1="0" y1="477.0" x2="720" y2="477.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="492.0" font-size="11" fill="#55524f">Ministère chargé de l'enseignement supérieur, données ouvertes Parcoursup, sessions 2023, 2024 et 2025 ; formations</text>
<text class="pied-source" x="0" y="506.0" font-size="11" fill="#55524f">présentes deux années de suite sous le même code et le même intitulé, avec un taux d'accès publié et des candidats</text>
<text class="pied-source" x="0" y="520.0" font-size="11" fill="#55524f">classés. Taux d'accès : part des candidats de la phase principale dont le rang de classement ne dépasse pas celui du</text>
<text class="pied-source" x="0" y="534.0" font-size="11" fill="#55524f">dernier appelé de leur groupe.</text>
<text class="pied-note" x="0" y="548.0" font-size="11" fill="#55524f">Lecture : une médiane de −11 points signifie que la moitié des classes préparatoires ont perdu 11 points de taux</text>
<text class="pied-note" x="0" y="562.0" font-size="11" fill="#55524f">d'accès ou plus ; un taux qui perd 11 points passe, par exemple, de 45 % à 34 %. Une médiane nulle ne veut pas dire</text>
<text class="pied-note" x="0" y="576.0" font-size="11" fill="#55524f">que chaque formation est restée stable. Les deux points d'une filière ne portent pas tout à fait sur les mêmes</text>
<text class="pied-note" x="0" y="590.0" font-size="11" fill="#55524f">formations ; les 172 formations que le ministère a classées dans une autre filière d'une session à l'autre ne sont pas</text>
<text class="pied-note" x="0" y="604.0" font-size="11" fill="#55524f">dessinées. Ces données ne disent ni la cause d'une baisse, ni si elle se reproduira, ni les chances d'un candidat.</text>
