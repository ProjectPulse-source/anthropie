<title id="gdm-t">Who holds French public debt</title><desc id="gdm-d">Shares of general government debt held by non-residents, by the Banque de France and by other residents, from 1995 to 2025. Non-residents: 38.5% in 1995, 57.1% at the peak in 2014, 54.3% in 2025. Banque de France: 1.7% in 1995, 22.6% in 2022, 16.5% in 2025. Other residents: 29.1% in 2025.</desc>
