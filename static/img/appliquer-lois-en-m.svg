<title id="alm-t">French laws that call for no implementing measure, by session</title><desc id="alm-d">Horizontal bars, one per session: laws directly applicable for both sources, laws classified differently by the barometer and the Senate, laws that call for measures. By session: 2017-2018: 41 laws, 11 directly applicable for both sources, 3 classified differently; 2018-2019: 49 laws, 22 directly applicable for both sources, 3 classified differently; 2019-2020: 43 laws, 15 directly applicable for both sources, 1 classified differently; 2020-2021: 51 laws, 17 directly applicable for both sources, 3 classified differently; 2021-2022: 64 laws, 15 directly applicable for both sources, 9 classified differently; 2022-2023: 44 laws, 10 directly applicable for both sources, 1 classified differently; 2023-2024: 51 laws, 21 directly applicable for both sources, 0 classified differently; 2024-2025: 56 laws, 19 directly applicable for both sources, 6 classified differently. In 2018-2019, the barometer counts 25 directly applicable laws out of 49. The values are in the table below the figure.</desc>
