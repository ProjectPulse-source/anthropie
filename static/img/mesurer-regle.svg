<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 441" role="img" font-variant-numeric="tabular-nums" aria-labelledby="mg-t mg-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="mg-t">Inscrits en catégorie A : série publiée et série hors bénéficiaires du RSA et jeunes en parcours</title><desc id="mg-d">Deux panneaux de 2018 à 2026, sur la même échelle : à gauche la catégorie A publiée, à droite la série hors bénéficiaires du RSA et hors jeunes en parcours. Une bande marque 2022 (nouveau formulaire d&#x27;actualisation), une ligne le 1er janvier 2025 (loi pour le plein emploi). Au 3e trimestre 2026, 3,4 M pour la catégorie A publiée et 2,4 M hors RSA.</desc>
<rect width="720" height="441" fill="#ffffff"/>
<text x="0.0" y="18.0" font-size="13" fill="#0A0A0E" text-anchor="start" font-weight="600">Inscrits en catégorie A : série publiée et série hors bénéficiaires du RSA et jeunes en parcours</text>
<text x="0.0" y="36.0" font-size="12" fill="#52514e" text-anchor="start">France hors Mayotte, moyenne trimestrielle des inscrits en fin de mois, CVS-CJO ; même échelle pour les deux panneaux</text>
<text x="56.0" y="70.0" font-size="11" fill="#184f95" text-anchor="start" font-weight="600">Catégorie A publiée</text>
