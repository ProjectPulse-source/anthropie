<title id="mg-t">Inscrits en catégorie A : série publiée et série hors bénéficiaires du RSA et jeunes en parcours</title><desc id="mg-d">Deux panneaux de 2018 à 2026, sur la même échelle : à gauche la catégorie A publiée, à droite la série hors bénéficiaires du RSA et hors jeunes en parcours ; dans chacun, une ligne marque le 1er janvier 2025, changement de règles.</desc>
