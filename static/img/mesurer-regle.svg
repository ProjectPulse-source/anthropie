<text x="0.0" y="336.0" font-size="10" fill="#52514e" text-anchor="start">Les deux séries sautent au 1er trimestre 2025 et reculent au 2e (actualisation automatique, janvier-mars 2025) ; leur écart ne mesure pas l&#x27;effet de la réforme.</text>
