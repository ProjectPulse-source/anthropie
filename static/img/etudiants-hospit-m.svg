<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 713" role="img" font-variant-numeric="tabular-nums" aria-labelledby="etu-hm-t etu-hm-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="etu-hm-t">Jeunes hospitalisés pour un geste auto-infligé, 2012-2025</title><desc id="etu-hm-d">Deux courbes, de 2012 à 2025, du nombre de patients hospitalisés pour un geste auto-infligé pour 100 000 habitants. Femmes de 18 à 24 ans : 235,8 en 2012, 200,3 en 2014, 206,7 en 2017, 234,5 en 2019, 359,7 en 2025, soit +53 % depuis 2019. Hommes de 18 à 24 ans : 142,7 en 2012, 120,0 en 2017, 130,2 en 2019, 149,5 en 2025, soit +15 % depuis 2019.</desc>
<rect width="300" height="713" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">Jeunes hospitalisés pour un</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">geste auto-infligé, 2012-2025</text>
<text x="0" y="64" font-size="13.5" fill="#55524f">Patients hospitalisés dans l'année,</text>
<text x="0" y="82" font-size="13.5" fill="#55524f">pour 100 000 habitants de 18 à 24 ans</text>
<text x="0" y="100" font-size="13.5" fill="#55524f">du même sexe</text>
