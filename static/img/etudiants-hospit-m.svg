<text aria-hidden="true" x="172.9" y="203.8" font-size="13.5" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">234,5</text><text x="172.9" y="203.8" font-size="13.5" text-anchor="middle" fill="#eb6834">234,5</text>
<text aria-hidden="true" x="172.9" y="255.9" font-size="13.5" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">130,2</text><text x="172.9" y="255.9" font-size="13.5" text-anchor="middle" fill="#184f95">130,2</text>
<text aria-hidden="true" x="292.0" y="140.1" font-size="16" font-weight="600" text-anchor="end" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">359,7</text><text x="292.0" y="140.1" font-size="16" font-weight="600" text-anchor="end" fill="#eb6834">359,7</text>
