<line x1="0" y1="470.0" x2="300" y2="470.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="491.0" font-size="13.5" fill="#55524f">DREES, patients hospitalisés pour</text>
<text class="pied-source" x="0" y="508.0" font-size="13.5" fill="#55524f">geste auto-infligé depuis 2012 (PMSI,</text>
<text class="pied-source" x="0" y="525.0" font-size="13.5" fill="#55524f">médecine, chirurgie, obstétrique) ;</text>
<text class="pied-source" x="0" y="542.0" font-size="13.5" fill="#55524f">taux recalculés à partir des effectifs</text>
<text class="pied-source" x="0" y="559.0" font-size="13.5" fill="#55524f">par âge détaillé</text>
<text class="pied-note" x="0" y="580.0" font-size="13.5" fill="#55524f">Geste auto-infligé : tentative de</text>
<text class="pied-note" x="0" y="597.0" font-size="13.5" fill="#55524f">suicide ou automutilation. Ces séries</text>
<text class="pied-note" x="0" y="614.0" font-size="13.5" fill="#55524f">ne distinguent pas les étudiants des</text>
<text class="pied-note" x="0" y="631.0" font-size="13.5" fill="#55524f">autres jeunes. 2020 : moins de</text>
<text class="pied-note" x="0" y="648.0" font-size="13.5" fill="#55524f">patients hospitalisés pendant</text>
<text class="pied-note" x="0" y="665.0" font-size="13.5" fill="#55524f">l'épidémie de covid.</text>
