<text x="30" y="284.5" font-size="13.5" fill="#96928f" text-anchor="end">100</text>
<line x1="34" y1="230.0" x2="292" y2="230.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="30" y="234.5" font-size="13.5" fill="#96928f" text-anchor="end">200</text>
<line x1="34" y1="180.0" x2="292" y2="180.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="30" y="184.5" font-size="13.5" fill="#96928f" text-anchor="end">300</text>
<line x1="34" y1="130.0" x2="292" y2="130.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="30" y="134.5" font-size="13.5" fill="#96928f" text-anchor="end">400</text>
