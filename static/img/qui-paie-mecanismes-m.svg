<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 778" role="img" font-variant-numeric="tabular-nums" aria-labelledby="qp-mec-m-t qp-mec-m-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="qp-mec-m-t">Par quels canaux la charge de la dette peut-elle être répartie ?</title><desc id="qp-mec-m-d">Schéma sans quantités. Quatre mécanismes, non exhaustifs, peuvent modifier la charge de la dette et sa répartition, et se combinent : l'ajustement budgétaire ordinaire, par les prélèvements (contribuables) ou par les dépenses et prestations (usagers, bénéficiaires) ; l'inflation non anticipée, effet de prix qui ne se décide pas seul (détenteurs de créances et de revenus mal indexés) ; la restructuration, cas extrême (porteurs des titres). Le refinancement renouvelle l'échéance aux taux du moment et ne permet pas, à lui seul, d'identifier qui supportera la charge. En regard figure ce que la dette a financé.</desc>
<rect width="300" height="778" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#2b2a28">Par quels canaux la charge de</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#2b2a28">la dette peut-elle être</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#2b2a28">répartie ?</text>
<rect x="1" y="96.0" width="298" height="48" rx="6" fill="#ffffff" stroke="#184f95" stroke-width="1.5"/>
<text x="12.0" y="117.0" font-size="15" fill="#2b2a28" text-anchor="start" font-weight="600">Charge de la dette et sa répartition</text>
<text x="12.0" y="136.0" font-size="13.5" fill="#52514e" text-anchor="start">intérêts, échéances</text>
<line x1="150" y1="144.0" x2="150" y2="160.0" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="0.0" y="180.0" font-size="13.5" fill="#898781" text-anchor="start" font-weight="600">Ajustement budgétaire ordinaire</text>
<rect x="1" y="186.0" width="298" height="48" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="12.0" y="207.0" font-size="15" fill="#2b2a28" text-anchor="start" font-weight="600">Prélèvements</text>
<text x="12.0" y="226.0" font-size="13.5" fill="#52514e" text-anchor="start">contribuables : impôts, cotisations</text>
<rect x="1" y="240.0" width="298" height="66" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="12.0" y="261.0" font-size="15" fill="#2b2a28" text-anchor="start" font-weight="600">Dépenses et prestations</text>
<text x="12.0" y="280.0" font-size="13.5" fill="#52514e" text-anchor="start">usagers, bénéficiaires : réduites,</text>
<text x="12.0" y="298.0" font-size="13.5" fill="#52514e" text-anchor="start">gelées, reportées</text>
<text x="0.0" y="326.0" font-size="13.5" fill="#898781" text-anchor="start" font-weight="600">Effet de prix, non décidé seul</text>
<rect x="1" y="332.0" width="298" height="66" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="12.0" y="353.0" font-size="15" fill="#2b2a28" text-anchor="start" font-weight="600">Inflation non anticipée</text>
<text x="12.0" y="372.0" font-size="13.5" fill="#52514e" text-anchor="start">détenteurs de créances et de revenus</text>
<text x="12.0" y="390.0" font-size="13.5" fill="#52514e" text-anchor="start">mal indexés</text>
<text x="0.0" y="418.0" font-size="13.5" fill="#898781" text-anchor="start" font-weight="600">Cas extrême</text>
<rect x="1" y="424.0" width="298" height="48" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="12.0" y="445.0" font-size="15" fill="#2b2a28" text-anchor="start" font-weight="600">Restructuration</text>
<text x="12.0" y="464.0" font-size="13.5" fill="#52514e" text-anchor="start">porteurs des titres</text>
<rect x="1" y="492.0" width="298" height="66" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="12.0" y="513.0" font-size="15" fill="#2b2a28" text-anchor="start" font-weight="600">Refinancement</text>
<text x="12.0" y="532.0" font-size="13.5" fill="#52514e" text-anchor="start">renouvelle l'échéance aux taux du</text>
<text x="12.0" y="550.0" font-size="13.5" fill="#52514e" text-anchor="start">moment, sans désigner de perdant</text>
<rect x="1" y="570.0" width="298" height="66" rx="6" fill="#f7f7f4" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="12.0" y="591.0" font-size="15" fill="#2b2a28" text-anchor="start" font-weight="600">En regard : ce que la dette a financé</text>
<text x="12.0" y="610.0" font-size="13.5" fill="#52514e" text-anchor="start">services, prestations,</text>
<text x="12.0" y="628.0" font-size="13.5" fill="#52514e" text-anchor="start">investissements, soutien en crise</text>
<line x1="0" y1="654.0" x2="300" y2="654.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="675.0" font-size="13.5" fill="#52514e">Synthèse de l'auteur · schéma non</text>
<text class="pied-source" x="0" y="692.0" font-size="13.5" fill="#52514e">quantitatif</text>
<text class="pied-note" x="0" y="713.0" font-size="13.5" fill="#52514e">Aucun poids relatif ni effet causal</text>
<text class="pied-note" x="0" y="730.0" font-size="13.5" fill="#52514e">n'est mesuré ici.</text>
<text class="pied-licence" x="0" y="751.0" font-size="13.5" fill="#898781">Stéphane Lalut, CC BY 4.0 ·</text>
<text class="pied-licence" x="0" y="768.0" font-size="13.5" fill="#898781">stephane-lalut.com</text>
</svg>
