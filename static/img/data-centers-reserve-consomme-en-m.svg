<text x="16" y="408" font-size="13.5" fill="#55524f">from 2030: 7.6 GW</text>
<text x="0" y="434" font-size="13.5" fill="#55524f">Suspended (grey): 0.2 GW ·</text>
<text x="0" y="452" font-size="13.5" fill="#55524f">abandoned since 2023: about 0.9</text>
<text x="0" y="470" font-size="13.5" fill="#55524f">GW</text>
