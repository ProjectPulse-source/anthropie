<rect x="0" y="424" width="11" height="11" fill="#9db7da"/>
<text x="16" y="434" font-size="13.5" fill="#55524f">from 2030: 7.6 GW</text>
<text x="0" y="460" font-size="13.5" fill="#55524f">Suspended (grey): 0.2 GW;</text>
<text x="0" y="478" font-size="13.5" fill="#55524f">abandoned since 2023: about</text>
<text x="0" y="496" font-size="13.5" fill="#55524f">0.9 GW</text>
