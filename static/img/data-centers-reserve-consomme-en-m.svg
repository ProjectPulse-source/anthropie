<text class="pied-source" x="0" y="918.0" font-size="13.5" fill="#55524f">measured on figure 2.3 of the Bilan</text>
<text class="pied-source" x="0" y="935.0" font-size="13.5" fill="#55524f">prévisionnel</text>
<text class="pied-note" x="0" y="956.0" font-size="13.5" fill="#55524f">Reserved capacity is neither power</text>
<text class="pied-note" x="0" y="973.0" font-size="13.5" fill="#55524f">drawn nor consumption: the two panels</text>
<text class="pied-note" x="0" y="990.0" font-size="13.5" fill="#55524f">are not comparable, and no ratio is</text>
<text class="pied-note" x="0" y="1007.0" font-size="13.5" fill="#55524f">computed between them. Pathways: RTE's</text>
<text class="pied-note" x="0" y="1024.0" font-size="13.5" fill="#55524f">assumptions, not measurements.</text>
