<text class="pied-source" x="0" y="937.0" font-size="13.5" fill="#55524f">RTE: Bilan prévisionnel 2025-2035</text>
<text class="pied-source" x="0" y="954.0" font-size="13.5" fill="#55524f">(Dec. 2025), Bilan électrique 2025</text>
<text class="pied-source" x="0" y="971.0" font-size="13.5" fill="#55524f">(Feb. 2026), web page “Les data</text>
