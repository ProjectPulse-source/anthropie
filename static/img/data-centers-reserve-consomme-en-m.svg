<text class="pied-source" x="0" y="1005.0" font-size="13.5" fill="#55524f">2026); November 2025 breakdown</text>
<text class="pied-source" x="0" y="1022.0" font-size="13.5" fill="#55524f">measured on figure 2.3 of the Bilan</text>
<text class="pied-source" x="0" y="1039.0" font-size="13.5" fill="#55524f">prévisionnel.</text>
<text class="pied-note" x="0" y="1060.0" font-size="13.5" fill="#55524f">Reserved capacity is neither power</text>
<text class="pied-note" x="0" y="1077.0" font-size="13.5" fill="#55524f">drawn nor consumption: the two panels</text>
<text class="pied-note" x="0" y="1094.0" font-size="13.5" fill="#55524f">are not comparable, and no ratio is</text>
<text class="pied-note" x="0" y="1111.0" font-size="13.5" fill="#55524f">computed between them. Pathways: RTE's</text>
<text class="pied-note" x="0" y="1128.0" font-size="13.5" fill="#55524f">assumptions, not measurements.</text>
