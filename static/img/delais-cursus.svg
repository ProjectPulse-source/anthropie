<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 331" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dc-t dc-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="dc-t">Former un médecin généraliste, et la durée d&#x27;un mandat présidentiel</title><desc id="dc-d">Deux barres de même échelle. En haut, le cursus de médecine générale : 3 ans de premier cycle, 3 ans de deuxième cycle, puis 4 ans d&#x27;internat de médecine générale dont la dernière en autonomie supervisée, soit 10 ans depuis la première année et 9 depuis l&#x27;admission en deuxième année. En bas, un mandat présidentiel de 5 ans. Comparaison d&#x27;échelle seulement.</desc>
<rect width="720" height="331" fill="#ffffff"/>
<text x="0.0" y="18.0" font-size="13" fill="#0A0A0E" text-anchor="start" font-weight="600">Former un médecin généraliste, et la durée d&#x27;un mandat présidentiel</text>
<text x="0.0" y="36.0" font-size="12" fill="#52514e" text-anchor="start">en années, durées minimales écrites dans les textes en vigueur</text>
<text x="0.0" y="91.0" font-size="11" fill="#0A0A0E" text-anchor="start" font-weight="600">Médecine générale</text>
<rect x="120.0" y="70" width="177.0" height="32" fill="#c9cdd3" stroke="#ffffff" stroke-width="2"/>
<text x="208.5" y="90.0" font-size="10" fill="#0A0A0E" text-anchor="middle">1er cycle</text>
<rect x="297.0" y="70" width="177.0" height="32" fill="#c9cdd3" stroke="#ffffff" stroke-width="2"/>
<text x="385.5" y="90.0" font-size="10" fill="#0A0A0E" text-anchor="middle">2e cycle</text>
<rect x="474.0" y="70" width="177.0" height="32" fill="#7fa3cf" stroke="#ffffff" stroke-width="2"/>
<rect x="651.0" y="70" width="59.0" height="32" fill="#184f95" stroke="#ffffff" stroke-width="2"/>
<rect x="475.0" y="70" width="234.0" height="32" fill="none" stroke="#184f95" stroke-width="1.5"/>
<text x="562.5" y="90.0" font-size="10" fill="#0A0A0E" text-anchor="middle">Internat de médecine générale</text>
<text x="592.0" y="64.0" font-size="10" fill="#184f95" text-anchor="middle" font-weight="600">Internat de médecine générale : 4 ans</text>
<text x="710.0" y="116.0" font-size="9.5" fill="#184f95" text-anchor="end">dernière année : autonomie supervisée</text>
<path d="M179.0 127 V132 H710.0 V127" fill="none" stroke="#52514e"/>
<text x="183.0" y="145.0" font-size="10" fill="#52514e" text-anchor="start">9 ans depuis l&#x27;admission en 2e année</text>
<text x="0.0" y="189.0" font-size="11" fill="#0A0A0E" text-anchor="start" font-weight="600">Mandat présidentiel</text>
<rect x="120.0" y="168" width="295.0" height="32" fill="#8a8f98"/>
<text x="267.5" y="188.0" font-size="10" fill="#ffffff" text-anchor="middle">5 ans</text>
<line x1="120.0" y1="201" x2="710.0" y2="201" stroke="#e1e0d9"/>
<text x="120.0" y="218.0" font-size="9" fill="#898781" text-anchor="middle">0</text>
<text x="179.0" y="218.0" font-size="9" fill="#898781" text-anchor="middle">1</text>
<text x="238.0" y="218.0" font-size="9" fill="#898781" text-anchor="middle">2</text>
<text x="297.0" y="218.0" font-size="9" fill="#898781" text-anchor="middle">3</text>
<text x="356.0" y="218.0" font-size="9" fill="#898781" text-anchor="middle">4</text>
<text x="415.0" y="218.0" font-size="9" fill="#898781" text-anchor="middle">5</text>
<text x="474.0" y="218.0" font-size="9" fill="#898781" text-anchor="middle">6</text>
<text x="533.0" y="218.0" font-size="9" fill="#898781" text-anchor="middle">7</text>
<text x="592.0" y="218.0" font-size="9" fill="#898781" text-anchor="middle">8</text>
<text x="651.0" y="218.0" font-size="9" fill="#898781" text-anchor="middle">9</text>
<text x="710.0" y="218.0" font-size="9" fill="#898781" text-anchor="middle">10</text>
<line x1="0" y1="238.0" x2="720" y2="238.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="253.0" font-size="11" fill="#52514e">Arrêté du 8 avril 2013, art. 1 ; code de l'éducation, art. L632-2 ; loi n° 2022-1616, art. 37 ; Constitution, art. 6</text>
<text class="pied-source" x="0" y="267.0" font-size="11" fill="#52514e">(Légifrance)</text>
<text class="pied-note" x="0" y="281.0" font-size="11" fill="#52514e">Durées minimales, sans redoublement, interruption ni passerelle, pour les étudiants entrés en internat à partir de la</text>
<text class="pied-note" x="0" y="295.0" font-size="11" fill="#52514e">rentrée 2023. Comparaison d'échelle seulement : ni l'effet d'une politique, ni la date de ses premiers effets ; les</text>
<text class="pied-note" x="0" y="309.0" font-size="11" fill="#52514e">internes soignent avant la fin du cursus.</text>
