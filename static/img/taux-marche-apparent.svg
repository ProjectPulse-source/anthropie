<text x="222.1" y="322.0" font-size="11" fill="#898781" text-anchor="middle">2005</text>
<text x="313.8" y="322.0" font-size="11" fill="#898781" text-anchor="middle">2010</text>
<text x="405.5" y="322.0" font-size="11" fill="#898781" text-anchor="middle">2015</text>
<text x="497.3" y="322.0" font-size="11" fill="#898781" text-anchor="middle">2020</text>
<text x="589.0" y="322.0" font-size="11" fill="#898781" text-anchor="middle">2025</text>
