<text x="0" y="389.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">Le taux à 10 ans, repère du coût des emprunts nouveaux ; le taux apparent, coût de tout le stock, ne le suit qu'au fil des refinancements.</text>
