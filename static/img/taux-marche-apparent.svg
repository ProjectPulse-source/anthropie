<text x="597.0" y="221.4" font-size="12" fill="#eb6834"><tspan font-weight="600">Taux apparent</tspan> 2,0 %</text>
<circle cx="497.3" cy="273.0" r="3.5" fill="#52514e"/>
<text x="497.3" y="291.0" font-size="11" fill="#52514e" text-anchor="middle">-0,1 % en 2020</text>
