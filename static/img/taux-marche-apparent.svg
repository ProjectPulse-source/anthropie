<text x="0" y="377.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">Eurostat irt_lt_mcby_a (taux à 10 ans)  ·  taux apparent : Eurostat gov_10a_main et INSEE, 1996-2025</text>
<text x="0" y="389.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">Le taux à 10 ans indique le prix de la dette nouvelle ; le taux apparent, celui de tout le stock, qui ne le suit qu'au fil des refinancements.</text>
