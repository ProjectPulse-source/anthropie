<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" role="img" aria-labelledby="tm-t tm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="tm-t">Taux à 10 ans et taux apparent de la dette publique, 1996-2025</title>
<desc id="tm-d">Deux courbes en pourcentage par an. Le taux à 10 ans passe de 6,3 % en 1996 à -0,1 % en 2020, puis remonte à 3,3 % en 2025. Le taux apparent, coût moyen du stock, passe de 6,5 % à 1,2 %, puis ne remonte qu'à 2,0 % en 2025.</desc>
<text x="46" y="22" font-size="13" fill="#52514e">Taux de marché à 10 ans et coût moyen du stock, en % par an</text>
