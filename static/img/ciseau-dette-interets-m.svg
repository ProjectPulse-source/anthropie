<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 577" role="img" font-variant-numeric="tabular-nums" aria-labelledby="czm-t czm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="czm-t">Le ciseau : encours et charge d'intérêts, 1995-T2 2026</title><desc id="czm-d">Deux courbes en pourcentage du PIB. En haut, la dette publique passe de 57,8 % du PIB en T4 1995 à 119,0 % au T2 2026. En bas, les intérêts versés par les administrations publiques passent de 3,5 % du PIB en 1995 à un creux de 1,3 % en 2020, puis remontent à 2,2 % en 2025.</desc>
