<text x="245.9" y="432.0" font-size="13.5" fill="#52514e" text-anchor="start">2025</text>
<text x="298.0" y="626.0" font-size="13.5" fill="#0A0A0E" text-anchor="end" font-weight="600">third quarter of 2026: 2.4m</text>
<text x="0.0" y="650.0" font-size="13.5" fill="#52514e" text-anchor="start">Band: new monthly updating form, 2022;</text>
<text x="0.0" y="668.0" font-size="13.5" fill="#52514e" text-anchor="start">dotted line: full employment act,</text>
<text x="0.0" y="686.0" font-size="13.5" fill="#52514e" text-anchor="start">1 January 2025.</text>
<text x="0.0" y="704.0" font-size="13.5" fill="#52514e" text-anchor="start">Both series jump in the first quarter</text>
<text x="0.0" y="722.0" font-size="13.5" fill="#52514e" text-anchor="start">of 2025 and fall back in the second</text>
<text x="0.0" y="740.0" font-size="13.5" fill="#52514e" text-anchor="start">(affected by the automatic updating of</text>
<text x="0.0" y="758.0" font-size="13.5" fill="#52514e" text-anchor="start">January to March 2025); their gap does</text>
<text x="0.0" y="776.0" font-size="13.5" fill="#52514e" text-anchor="start">not measure the effect of the reform.</text>
<line x1="0" y1="788.0" x2="300" y2="788.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="809.0" font-size="13.5" fill="#52514e">Dares and France Travail, quarterly</text>
<text class="pied-source" x="0" y="826.0" font-size="13.5" fill="#52514e">average of end-of-month registrants,</text>
<text class="pied-source" x="0" y="843.0" font-size="13.5" fill="#52514e">France excluding Mayotte, seasonally</text>
<text class="pied-source" x="0" y="860.0" font-size="13.5" fill="#52514e">and working-day adjusted (series</text>
<text class="pied-source" x="0" y="877.0" font-size="13.5" fill="#52514e">excluding RSA recipients and young</text>
<text class="pied-source" x="0" y="894.0" font-size="13.5" fill="#52514e">people in programmes since 2018)</text>
<text class="pied-note" x="0" y="915.0" font-size="13.5" fill="#52514e">Young people in programmes: on a youth</text>
<text class="pied-note" x="0" y="932.0" font-size="13.5" fill="#52514e">commitment contract (CEJ), a</text>
<text class="pied-note" x="0" y="949.0" font-size="13.5" fill="#52514e">contractual support pathway towards</text>
<text class="pied-note" x="0" y="966.0" font-size="13.5" fill="#52514e">employment and autonomy (Pacea) or</text>
<text class="pied-note" x="0" y="983.0" font-size="13.5" fill="#52514e">France Travail's individualised</text>
<text class="pied-note" x="0" y="1000.0" font-size="13.5" fill="#52514e">support for young people (AIJ),</text>
<text class="pied-note" x="0" y="1017.0" font-size="13.5" fill="#52514e">according to the Dares. RSA: minimum</text>
<text class="pied-note" x="0" y="1034.0" font-size="13.5" fill="#52514e">income benefit. Scope and period</text>
<text class="pied-note" x="0" y="1051.0" font-size="13.5" fill="#52514e">differ from the 2024 cross-tabulation</text>
<text class="pied-note" x="0" y="1068.0" font-size="13.5" fill="#52514e">figure. Series not labelled since</text>
<text class="pied-note" x="0" y="1085.0" font-size="13.5" fill="#52514e">1 January 2025 (2021 label, valid</text>
<text class="pied-note" x="0" y="1102.0" font-size="13.5" fill="#52514e">until 20 May 2026, suspended by</text>
<text class="pied-note" x="0" y="1119.0" font-size="13.5" fill="#52514e">France's official statistics authority).</text>
