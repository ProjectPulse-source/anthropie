<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1167" role="img" font-variant-numeric="tabular-nums" aria-labelledby="mgm-t mgm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="mgm-t">Category A registrants: published series and series excluding RSA recipients and young people in programmes</title><desc id="mgm-d">Two panels from 2018 to 2026, on the same scale: top, published category A; bottom, the series excluding RSA recipients and young people in programmes. A band marks 2022 (new monthly updating form), a line 1 January 2025 (full employment act). In the third quarter of 2026, 3.4m for published category A and 2.4m excluding RSA recipients and young people in programmes.</desc>
