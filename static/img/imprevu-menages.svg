<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 335" role="img" font-variant-numeric="tabular-nums" aria-labelledby="imp-t imp-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="imp-t">Ne pas pouvoir faire face à une dépense imprévue : le revenu ne dit pas tout (France, 2025)</title><desc id="imp-d">Part des personnes qui ne pourraient pas faire face à une dépense imprévue, France, 2025. Au-dessus du seuil de pauvreté : couple sans enfant 14,0 %, adulte seul 23,4 %, couple avec un enfant 18,6 %, parent seul 46,9 %. En dessous du seuil : couple sans enfant 50,1 %, adulte seul 58,4 %, couple avec un enfant 71,9 %, parent seul 77,0 %.</desc>
<rect width="720" height="335" fill="#ffffff"/>
<text x="0" y="18" font-size="14" font-weight="600" fill="#26262f">Ne pas pouvoir faire face à une dépense imprévue : le revenu ne dit pas tout (France, 2025)</text>
<text x="0" y="70" font-size="12" font-weight="600" fill="#55524f">Au-dessus du seuil de pauvreté</text>
<text x="0" y="105" font-size="11.5" fill="#26262f">Couple sans enfant</text>
<rect x="132" y="92" width="25.2" height="18" fill="#c9c5c0"/>
<text x="162.2" y="105" font-size="11.5" fill="#26262f">14,0 %</text>
<text x="0" y="145" font-size="11.5" fill="#26262f">Adulte seul</text>
<rect x="132" y="132" width="42.1" height="18" fill="#c9c5c0"/>
<text x="179.1" y="145" font-size="11.5" fill="#26262f">23,4 %</text>
<text x="0" y="185" font-size="11.5" fill="#26262f">Couple avec un enfant</text>
<rect x="132" y="172" width="33.5" height="18" fill="#8a8781"/>
<text x="170.5" y="185" font-size="11.5" font-weight="600" fill="#26262f">18,6 %</text>
<text x="0" y="225" font-size="11.5" fill="#26262f">Parent seul</text>
<rect x="132" y="212" width="84.4" height="18" fill="#eb6834"/>
<text x="221.4" y="225" font-size="11.5" font-weight="600" fill="#eb6834">46,9 %</text>
<line x1="132" y1="84" x2="132" y2="248" stroke="#dcd8d3" stroke-width="1"/>
<path d="M262.4,181 h6 v40 h-6" fill="none" stroke="#eb6834" stroke-width="1.4"/>
<text x="272.4" y="205" font-size="11.5" font-weight="600" fill="#eb6834">+28,3 points</text>
<text x="372" y="70" font-size="12" font-weight="600" fill="#55524f">En dessous du seuil de pauvreté</text>
<text x="372" y="105" font-size="11.5" fill="#26262f">Couple sans enfant</text>
<rect x="504" y="92" width="90.2" height="18" fill="#c9c5c0"/>
<text x="599.2" y="105" font-size="11.5" fill="#26262f">50,1 %</text>
<text x="372" y="145" font-size="11.5" fill="#26262f">Adulte seul</text>
<rect x="504" y="132" width="105.1" height="18" fill="#c9c5c0"/>
<text x="614.1" y="145" font-size="11.5" fill="#26262f">58,4 %</text>
<text x="372" y="185" font-size="11.5" fill="#26262f">Couple avec un enfant</text>
<rect x="504" y="172" width="129.4" height="18" fill="#8a8781"/>
<text x="638.4" y="185" font-size="11.5" font-weight="600" fill="#26262f">71,9 %</text>
<text x="372" y="225" font-size="11.5" fill="#26262f">Parent seul</text>
<rect x="504" y="212" width="138.6" height="18" fill="#eb6834"/>
<text x="647.6" y="225" font-size="11.5" font-weight="600" fill="#eb6834">77,0 %</text>
<line x1="504" y1="84" x2="504" y2="248" stroke="#dcd8d3" stroke-width="1"/>
<line x1="0" y1="270.0" x2="720" y2="270.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="285.0" font-size="11" fill="#55524f">Eurostat, enquête SILC (ilc_mdes04), en % des personnes</text>
<text class="pied-note" x="0" y="299.0" font-size="11" fill="#55524f">Déclaratif ; seuil de pauvreté : 60 % du revenu médian par unité de consommation ; montant de la dépense fixé par</text>
<text class="pied-note" x="0" y="313.0" font-size="11" fill="#55524f">l'enquête. Association, non cause : la position dans la tranche de revenu n'est pas contrôlée.</text>
