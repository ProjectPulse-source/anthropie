<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 363" role="img" font-variant-numeric="tabular-nums" aria-labelledby="imp-t imp-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="imp-t">Dépense imprévue : être au-dessus du seuil de pauvreté ne suffit pas (France, 2025)</title><desc id="imp-d">Part des personnes dont le ménage déclare ne pas pouvoir faire face à une dépense imprévue de 1 000 €, selon le type de foyer où elles vivent, France, 2025. Au-dessus du seuil de pauvreté : deux adultes sans enfant 14,0 %, un adulte sans enfant 23,4 %, deux adultes avec un enfant 18,6 %, un adulte avec un ou plusieurs enfants 46,9 %. En dessous du seuil : deux adultes sans enfant 50,1 %, un adulte sans enfant 58,4 %, deux adultes avec un enfant 71,9 %, un adulte avec un ou plusieurs enfants 77,0 %. Association, non cause : les groupes ne sont pas comparés à revenu égal (la distance au seuil n’est pas prise en compte).</desc>
<rect width="720" height="363" fill="#ffffff"/>
<text x="0" y="18" font-size="14" font-weight="600" fill="#26262f">Dépense imprévue : être au-dessus du seuil de pauvreté ne suffit pas (France, 2025)</text>
<text x="0" y="36" font-size="12" fill="#55524f">Part des personnes qui ne pourraient pas faire face à une dépense imprévue, selon le type de foyer où elles vivent</text>
<text x="0" y="70" font-size="12" font-weight="600" fill="#55524f">Au-dessus du seuil de pauvreté</text>
<text x="0" y="105" font-size="11.5" fill="#26262f">Deux adultes sans enfant</text>
<rect x="152" y="92" width="22.4" height="18" fill="#c9c5c0"/>
<text x="179.4" y="105" font-size="11.5" fill="#26262f">14,0 %</text>
<text x="0" y="145" font-size="11.5" fill="#26262f">Un adulte sans enfant</text>
<rect x="152" y="132" width="37.4" height="18" fill="#c9c5c0"/>
<text x="194.4" y="145" font-size="11.5" fill="#26262f">23,4 %</text>
<text x="0" y="185" font-size="11.5" fill="#26262f">Deux adultes, un enfant</text>
<rect x="152" y="172" width="29.8" height="18" fill="#8a8781"/>
<text x="186.8" y="185" font-size="11.5" font-weight="600" fill="#26262f">18,6 %</text>
<text x="0" y="225" font-size="11.5" fill="#26262f">Un adulte avec enfants</text>
<rect x="152" y="212" width="75.0" height="18" fill="#eb6834"/>
<text x="232.0" y="225" font-size="11.5" font-weight="600" fill="#b8420f">46,9 %</text>
<line x1="152" y1="84" x2="152" y2="248" stroke="#dcd8d3" stroke-width="1"/>
<path d="M279.0,181 h6 v40 h-6" fill="none" stroke="#eb6834" stroke-width="1.4"/>
<text x="289.0" y="205" font-size="11.5" font-weight="600" fill="#b8420f">28,3 points</text>
<text x="372" y="70" font-size="12" font-weight="600" fill="#55524f">En dessous du seuil de pauvreté</text>
<text x="372" y="105" font-size="11.5" fill="#26262f">Deux adultes sans enfant</text>
<rect x="524" y="92" width="80.2" height="18" fill="#c9c5c0"/>
<text x="609.2" y="105" font-size="11.5" fill="#26262f">50,1 %</text>
<text x="372" y="145" font-size="11.5" fill="#26262f">Un adulte sans enfant</text>
<rect x="524" y="132" width="93.4" height="18" fill="#c9c5c0"/>
<text x="622.4" y="145" font-size="11.5" fill="#26262f">58,4 %</text>
<text x="372" y="185" font-size="11.5" fill="#26262f">Deux adultes, un enfant</text>
<rect x="524" y="172" width="115.0" height="18" fill="#8a8781"/>
<text x="644.0" y="185" font-size="11.5" font-weight="600" fill="#26262f">71,9 %</text>
<text x="372" y="225" font-size="11.5" fill="#26262f">Un adulte avec enfants</text>
<rect x="524" y="212" width="123.2" height="18" fill="#eb6834"/>
<text x="652.2" y="225" font-size="11.5" font-weight="600" fill="#b8420f">77,0 %</text>
<line x1="524" y1="84" x2="524" y2="248" stroke="#dcd8d3" stroke-width="1"/>
<line x1="0" y1="270.0" x2="720" y2="270.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="285.0" font-size="11" fill="#55524f">Eurostat, enquête EU-SILC (ilc_mdes04), en % des personnes</text>
<text class="pied-note" x="0" y="299.0" font-size="11" fill="#55524f">Déclaration du ménage ; dépense de 1 000 € en France (enquête 2025) ; seuil de pauvreté : 60 % du revenu disponible</text>
<text class="pied-note" x="0" y="313.0" font-size="11" fill="#55524f">médian national par unité de consommation. « Un adulte avec enfants » : un ou plusieurs enfants, comparé à deux</text>
<text class="pied-note" x="0" y="327.0" font-size="11" fill="#55524f">adultes avec un enfant. Association, non cause : les groupes ne sont pas comparés à revenu égal (la distance au seuil</text>
<text class="pied-note" x="0" y="341.0" font-size="11" fill="#55524f">n’est pas prise en compte).</text>
