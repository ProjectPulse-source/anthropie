<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 447" role="img" font-variant-numeric="tabular-nums" aria-labelledby="tam-t tam-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="tam-t">Le taux implicite, 1996-2025</title><desc id="tam-d">Une courbe, en pourcentage par an. Le taux implicite de la dette descend de 6,5 % en 1996 à 1,2 % en 2020, son minimum sur la série, puis remonte à 2,0 % en 2025. La baisse court sur près de vingt-cinq ans ; la remontée sur les dernières années.</desc>
