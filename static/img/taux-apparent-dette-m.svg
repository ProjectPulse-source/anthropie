<line x1="34" y1="214.9" x2="286" y2="214.9" stroke="#e1e0d9"/>
<text x="29" y="219.9" font-size="13.5" fill="#898781" text-anchor="end">2</text>
<line x1="34" y1="157.7" x2="286" y2="157.7" stroke="#e1e0d9"/>
<text x="29" y="162.7" font-size="13.5" fill="#898781" text-anchor="end">4</text>
<line x1="34" y1="100.6" x2="286" y2="100.6" stroke="#e1e0d9"/>
<text x="29" y="105.6" font-size="13.5" fill="#898781" text-anchor="end">6</text>
<text x="34.0" y="291.0" font-size="13.5" fill="#898781" text-anchor="start">1996</text>
<text x="286.0" y="291.0" font-size="13.5" fill="#898781" text-anchor="end">2025</text>
