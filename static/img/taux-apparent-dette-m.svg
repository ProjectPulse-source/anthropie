<circle cx="34.0" cy="86.6" r="4" fill="#eb6834"/>
<text x="40.0" y="76.6" font-size="15" font-weight="600" fill="#0A0A0E" text-anchor="start">6,5 %</text>
<circle cx="242.6" cy="236.6" r="4" fill="#eb6834"/>
<text x="242.6" y="258.6" font-size="15" font-weight="600" fill="#0A0A0E" text-anchor="middle">1,2 %</text>
<circle cx="286.0" cy="214.6" r="4" fill="#eb6834"/>
<text x="286.0" y="202.6" font-size="15" font-weight="600" fill="#0A0A0E" text-anchor="end">2,0 %</text>
<line x1="0" y1="306.0" x2="300" y2="306.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="327.0" font-size="13.5" fill="#52514e">Calcul sur séries Eurostat</text>
<text class="pied-source" x="0" y="344.0" font-size="13.5" fill="#52514e">(gov_10a_main) et INSEE, 1996-2025</text>
<text class="pied-note" x="0" y="365.0" font-size="13.5" fill="#52514e">Taux implicite = intérêts de l'année /</text>
