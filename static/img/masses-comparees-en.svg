<title id="ma-t">Interest paid against the main public budgets, 1995-2024</title>
<desc id="ma-d">Four curves in billion euros, from 1995 to 2024. Health and education rise steadily and stay the highest. Interest paid falls until the early 2020s, then climbs back above the public order and safety function.</desc>
<text x="0" y="22" font-size="13" font-weight="600" fill="#0A0A0E">Interest paid compared with a few large functions of spending</text>
<text x="0" y="40" font-size="11" fill="#52514e">France · general government · billion euros, current prices</text>
