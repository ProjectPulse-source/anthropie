<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 529" role="img" font-variant-numeric="tabular-nums" aria-labelledby="cs-t cs-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="cs-t">Local government investment and transfers received, France, in % of GDP</title><desc id="cs-d">Two lines since 1995: local investment (gross fixed capital formation) hovers around 2% of GDP; from 2013 to 2017, it went from 2.4% to 1.9% of GDP and transfers received from 3.3% to 2.7%. The comparable transfer series stops in 2017.</desc>
