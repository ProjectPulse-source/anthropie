<line x1="0" y1="422.0" x2="720" y2="422.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="437.0" font-size="11" fill="#52514e">Eurostat gov_10a_main, local government (S1313): investment P51G, current transfers received D73REC; France. Data</text>
<text class="pied-source" x="0" y="451.0" font-size="11" fill="#52514e">retrieved on 7 October 2026.</text>
<text class="pied-note" x="0" y="465.0" font-size="11" fill="#52514e">Transfers received: from central government and social security, all grants together; this is not the DGF grant.</text>
<text class="pied-note" x="0" y="479.0" font-size="11" fill="#52514e">Comparable series stops in 2017: in 2018 and again in 2021, some grants were replaced by shares of VAT, counted as</text>
<text class="pied-note" x="0" y="493.0" font-size="11" fill="#52514e">taxes. This reclassification changes the category of the revenue; on its own, it does not say whether resources rose</text>
<text class="pied-note" x="0" y="507.0" font-size="11" fill="#52514e">or fell.</text>
