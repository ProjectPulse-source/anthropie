<title id="dcs-t">The cyclically adjusted primary deficit, according to three estimates, 1996-2025</title><desc id="dcs-d">Lines as % of potential GDP. Cyclically adjusted primary balance according to the IMF, since 1996; structural primary balance according to the European Commission and underlying primary balance according to the OECD, since 2010; in grey, the observed primary balance (Eurostat, % of GDP). Averages 2015-2019 then 2022-2025: Commission −1.1 then −3.0, IMF −0.5 then −3.1, OECD −1.8 then −3.4. Below zero, a deficit.</desc>
