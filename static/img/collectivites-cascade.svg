<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 378" role="img" font-variant-numeric="tabular-nums" aria-labelledby="cc-t cc-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="cc-t">D’où vient l’amélioration du solde des collectivités, 2013-2017</title><desc id="cc-d">Cascade en points de PIB : la baisse des transferts creuse le solde ; la hausse des impôts et la baisse des dépenses, surtout d&#x27;investissement, le remontent jusqu&#x27;à un léger excédent.</desc>
<rect width="720" height="378" fill="#ffffff"/>
