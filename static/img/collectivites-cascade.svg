<text x="617.7" y="315.0" font-size="11" fill="#898781" text-anchor="middle">1,0</text>
<rect x="435.8" y="46.7" width="51.1" height="23.8" fill="#52514e"/>
<text x="320.0" y="62.6" font-size="11" fill="#0A0A0E" text-anchor="end">Solde 2013</text>
<text x="492.9" y="62.6" font-size="11" fill="#52514e" text-anchor="start">−0,39</text>
<rect x="352.6" y="83.8" width="83.2" height="23.8" fill="#eb6834"/>
<text x="320.0" y="99.7" font-size="11" fill="#0A0A0E" text-anchor="end">Transferts reçus des autres administrations publiques</text>
