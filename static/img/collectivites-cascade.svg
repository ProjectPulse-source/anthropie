<text class="pied-source" x="0" y="369.0" font-size="11" fill="#52514e">Eurostat gov_10a_main, administrations publiques locales (S1313), France ; points calculés sur le PIB des mêmes</text>
<text class="pied-source" x="0" y="383.0" font-size="11" fill="#52514e">comptes. Données relevées le 7 octobre 2026.</text>
<text class="pied-note" x="0" y="397.0" font-size="11" fill="#52514e">Barres : contribution de chaque poste à la variation du solde ; pour une dépense, l'inverse de sa variation. Les</text>
<text class="pied-note" x="0" y="411.0" font-size="11" fill="#52514e">autres dépenses augmentent de 8,7 milliards d’euros (barre négative) et reculent de 0,32 point de PIB (barre</text>
<text class="pied-note" x="0" y="425.0" font-size="11" fill="#52514e">positive) : le PIB nominal augmente de 8,1 %. Lecture comptable : les postes reconstituent le solde ; ils ne disent</text>
<text class="pied-note" x="0" y="439.0" font-size="11" fill="#52514e">pas ce qui l'a décidé.</text>
