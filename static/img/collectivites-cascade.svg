<title id="cc-t">Solde des administrations locales, 2013-2017 : la même variation, en euros et en points de PIB</title><desc id="cc-d">Deux cascades, mêmes postes, même ordre. En milliards d&#x27;euros courants : solde de −8,3 en 2013 ; transferts reçus −8,9, impôts +18,2, autres recettes +1,6, investissement +7,5, autres dépenses −8,7 ; solde de 1,4 en 2017. En points de PIB : solde de −0,39 ; transferts −0,64, impôts +0,39, autres recettes −0,12, investissement +0,50, autres dépenses +0,32 ; solde de 0,06. Le PIB nominal augmente de 8,1 %.</desc>
