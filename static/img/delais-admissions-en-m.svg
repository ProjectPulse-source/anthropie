<title id="dam-t">Students admitted into the medical curriculum in France, 1972-2025</title><desc id="dam-d">Annual bars of students admitted to the second year of the first cycle: 8,588 places filled in 1972, a minimum of 3,500 in 1993, 9,361 in 2020; then from 10,806 to 11,133 admissions a year from 2021 to 2025.</desc>
