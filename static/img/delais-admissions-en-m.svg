<text class="pied-note" x="0.0" y="655.0" font-size="13.5" fill="#52514e" text-anchor="start">admitted. Each bar at the year</text>
<text class="pied-note" x="0.0" y="672.0" font-size="13.5" fill="#52514e" text-anchor="start">published by the source, no shift.</text>
