<text x="0" y="370" font-size="15" font-weight="600" fill="#26262f">fin 2023 : 30</text>
<text x="0" y="390" font-size="15" font-weight="600" fill="#26262f">environ 55 % d'ici fin 2027</text>
<text x="0" y="410" font-size="15" font-weight="600" fill="#184f95">total : 150,8</text>
<text x="0" y="430" font-size="15" fill="#55524f">prévision de départ : 145 à 170</text>
