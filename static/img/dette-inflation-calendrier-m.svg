<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 742" role="img" font-variant-numeric="tabular-nums" aria-labelledby="inflm-t inflm-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="inflm-t">Dette à taux fixe de fin 2020 : l'érosion, au fil des paiements</title><desc id="inflm-d">Courbe cumulée de l'érosion réelle des paiements promis, de 2021 à 2066, en milliards d'euros de 2020 : 30 fin 2023, 83 fin 2027, soit environ 55 %, 150,8 au total ; plage des prévisions publiées début 2021 : 145 à 170. Après 2023, l'écart de prix est supposé persister.</desc>
<rect width="300" height="742" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">Dette à taux fixe de fin</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">2020 : l'érosion, au fil des</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#26262f">paiements</text>
<text x="0" y="106" font-size="13.5" fill="#96928f">Md€ de 2020, cumul</text>
