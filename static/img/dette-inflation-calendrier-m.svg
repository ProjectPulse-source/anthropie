<text class="pied-source" x="0" y="503.0" font-size="13.5" fill="#55524f">AFT (encours au 31/12/2020), Eurostat</text>
<text class="pied-source" x="0" y="520.0" font-size="13.5" fill="#55524f">(IPCH mensuel, France), BCE (SPF,</text>
<text class="pied-source" x="0" y="537.0" font-size="13.5" fill="#55524f">janvier 2021) ; calcul de l'auteur</text>
<text class="pied-note" x="0" y="558.0" font-size="13.5" fill="#55524f">Somme non actualisée des écarts de</text>
<text class="pied-note" x="0" y="575.0" font-size="13.5" fill="#55524f">valeur réelle des paiements promis, en</text>
<text class="pied-note" x="0" y="592.0" font-size="13.5" fill="#55524f">Md€ de 2020 aux prix à la</text>
<text class="pied-note" x="0" y="609.0" font-size="13.5" fill="#55524f">consommation : ni de la dette effacée,</text>
<text class="pied-note" x="0" y="626.0" font-size="13.5" fill="#55524f">ni un gain budgétaire net, ni une</text>
<text class="pied-note" x="0" y="643.0" font-size="13.5" fill="#55524f">perte finale. Contrefactuel :</text>
<text class="pied-note" x="0" y="660.0" font-size="13.5" fill="#55524f">inflation anticipée début 2021 ; après</text>
<text class="pied-note" x="0" y="677.0" font-size="13.5" fill="#55524f">2023, l'écart de prix est supposé</text>
<text class="pied-note" x="0" y="694.0" font-size="13.5" fill="#55524f">persister.</text>
