<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1002" role="img" font-variant-numeric="tabular-nums" aria-labelledby="cpm-t cpm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="cpm-t">Draft budget bill for 2027: what it asks of local authorities</title><desc id="cpm-d">Amounts for 2027 of the five measures of the draft budget bill as tabled aimed at local authorities, in billions of euros: Progressive contribution (art. 37) 2.5; FCTVA, rate cut (art. 35) 2.1; Contributions from ministries 0.7; Assigned VAT, capping (art. 36) 0.6; DILICO, repayment spread out (art. 84) 0.3. Their arithmetic sum, 6.2, does not measure a net levy. The National Assembly had deleted the cut in the FCTVA rate (art. 35) and the progressive contribution to the budgetary effort (art. 37), had not adopted the capping of assigned VAT (art. 36) on 19 October 2026, then rejected the whole bill on 4 November 2026: all five measures are in the initial bill due before the Senate. State on 10 November 2026.</desc>
<rect width="300" height="1002" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">Draft budget bill for 2027:</text>
