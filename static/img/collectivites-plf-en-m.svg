<text x="0" y="467" font-size="15" font-weight="600" fill="#b8420f">0.6 bn</text>
<text x="0" y="486" font-size="13.5" fill="#0A0A0E">Assigned VAT, capping (art. 36)</text>
<text x="0" y="504" font-size="13.5" fill="#6f6c66">initial bill due before the Senate;</text>
