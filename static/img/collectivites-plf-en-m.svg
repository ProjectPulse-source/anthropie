<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 826" role="img" font-variant-numeric="tabular-nums" aria-labelledby="cpm-t cpm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="cpm-t">Draft budget bill for 2027: what it asked of local authorities</title><desc id="cpm-d">Amounts for 2027 of the five measures of the draft budget bill as tabled aimed at local authorities, in billions of euros: Progressive contribution (art. 37) 2.5; FCTVA, rate cut (art. 35) 2.1; Contributions from ministries 0.7; Assigned VAT, capping (art. 36) 0.6; DILICO, repayment spread out (art. 84) 0.3. Their arithmetic sum, 6.2, does not measure a net levy. Hollow bars: articles deleted or not adopted by the National Assembly on 19 October 2026; solid bars: measures not yet examined. State on 22 October 2026.</desc>
<rect width="300" height="826" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">Draft budget bill for 2027:</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">what it asked of local</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#0A0A0E">authorities</text>
<text x="0" y="105" font-size="13.5" fill="#898781">€ billion, amounts in the bill as</text>
<text x="0" y="124" font-size="13.5" fill="#898781">tabled</text>
<text x="0" y="143" font-size="13.5" fill="#898781">In grey: deleted or not adopted in</text>
<text x="0" y="162" font-size="13.5" fill="#898781">plenary</text>
<text x="0" y="181" font-size="13.5" fill="#eb6834">In orange: not yet examined</text>
<text x="0" y="207" font-size="15" font-weight="600" fill="#898781">2.5 bn</text>
<text x="0" y="226" font-size="13.5" fill="#0A0A0E">Progressive contribution (art. 37)</text>
<text x="0" y="244" font-size="13.5" fill="#898781">art. 37 deleted by the National</text>
<text x="0" y="262" font-size="13.5" fill="#898781">Assembly on 19 October 2026</text>
<text x="0" y="288" font-size="15" font-weight="600" fill="#898781">2.1 bn</text>
<text x="0" y="307" font-size="13.5" fill="#0A0A0E">FCTVA, rate cut (art. 35)</text>
<text x="0" y="325" font-size="13.5" fill="#898781">art. 35 deleted by the National</text>
<text x="0" y="343" font-size="13.5" fill="#898781">Assembly on 19 October 2026</text>
<text x="0" y="369" font-size="15" font-weight="600" fill="#eb6834">0.7 bn</text>
<text x="0" y="388" font-size="13.5" fill="#0A0A0E">Contributions from ministries</text>
<text x="0" y="406" font-size="13.5" fill="#898781">second part, not yet examined</text>
<text x="0" y="432" font-size="15" font-weight="600" fill="#898781">0.6 bn</text>
<text x="0" y="451" font-size="13.5" fill="#0A0A0E">Assigned VAT, capping (art. 36)</text>
<text x="0" y="469" font-size="13.5" fill="#898781">art. 36 not adopted by the National</text>
<text x="0" y="487" font-size="13.5" fill="#898781">Assembly on 19 October 2026</text>
<text x="0" y="513" font-size="15" font-weight="600" fill="#eb6834">0.3 bn</text>
<text x="0" y="532" font-size="13.5" fill="#0A0A0E">DILICO, repayment spread out (art. 84)</text>
<text x="0" y="550" font-size="13.5" fill="#898781">second part, not yet examined</text>
<line x1="0" y1="566.0" x2="300" y2="566.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="587.0" font-size="13.5" fill="#52514e">Draft budget bill for 2027 (no. 3210)</text>
<text class="pied-source" x="0" y="604.0" font-size="13.5" fill="#52514e">and opinion no. 2026-5 of the High</text>
<text class="pied-source" x="0" y="621.0" font-size="13.5" fill="#52514e">Council of Public Finance; state:</text>
<text class="pied-source" x="0" y="638.0" font-size="13.5" fill="#52514e">National Assembly, records of the</text>
<text class="pied-source" x="0" y="655.0" font-size="13.5" fill="#52514e">sittings of 19 October 2026. State on</text>
<text class="pied-source" x="0" y="672.0" font-size="13.5" fill="#52514e">22 October 2026.</text>
<text class="pied-note" x="0" y="693.0" font-size="13.5" fill="#52514e">Arithmetic sum of heterogeneous</text>
<text class="pied-note" x="0" y="710.0" font-size="13.5" fill="#52514e">amounts, each assessed against the</text>
<text class="pied-note" x="0" y="727.0" font-size="13.5" fill="#52514e">situation without the measure: it does</text>
<text class="pied-note" x="0" y="744.0" font-size="13.5" fill="#52514e">not measure a net levy. A deleted</text>
<text class="pied-note" x="0" y="761.0" font-size="13.5" fill="#52514e">provision may be reinstated before the</text>
<text class="pied-note" x="0" y="778.0" font-size="13.5" fill="#52514e">final act.</text>
