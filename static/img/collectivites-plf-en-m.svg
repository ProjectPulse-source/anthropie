<text x="0" y="64" font-size="17" font-weight="600" fill="#0A0A0E">authorities</text>
<text x="0" y="105" font-size="13.5" fill="#6f6c66">€ billion, amounts in the bill as</text>
<text x="0" y="124" font-size="13.5" fill="#6f6c66">tabled</text>
<text x="0" y="143" font-size="13.5" fill="#b8420f">In orange: in the initial bill due</text>
<text x="0" y="162" font-size="13.5" fill="#b8420f">before the Senate</text>
<text x="0" y="188" font-size="15" font-weight="600" fill="#b8420f">2.5 bn</text>
<text x="0" y="207" font-size="13.5" fill="#0A0A0E">Progressive contribution (art. 37)</text>
<text x="0" y="225" font-size="13.5" fill="#6f6c66">initial bill due before the Senate;</text>
<text x="0" y="243" font-size="13.5" fill="#6f6c66">Assembly: art. 37 deleted in plenary</text>
<text x="0" y="261" font-size="13.5" fill="#6f6c66">on 19 October 2026</text>
<text x="0" y="287" font-size="15" font-weight="600" fill="#b8420f">2.1 bn</text>
<text x="0" y="306" font-size="13.5" fill="#0A0A0E">FCTVA, rate cut (art. 35)</text>
<text x="0" y="324" font-size="13.5" fill="#6f6c66">initial bill due before the Senate;</text>
<text x="0" y="342" font-size="13.5" fill="#6f6c66">Assembly: art. 35 deleted in plenary</text>
<text x="0" y="360" font-size="13.5" fill="#6f6c66">on 19 October 2026</text>
<text x="0" y="386" font-size="15" font-weight="600" fill="#b8420f">0.7 bn</text>
<text x="0" y="405" font-size="13.5" fill="#0A0A0E">Contributions from ministries</text>
