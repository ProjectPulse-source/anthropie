<rect x="362.5" y="228" width="186.9" height="30" fill="#8a8781" stroke="#ffffff" stroke-width="1.5"/>
<text x="456.0" y="247.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">32,2</text>
<rect x="549.4" y="228" width="61.5" height="30" fill="#c9c5c0" stroke="#ffffff" stroke-width="1.5"/>
<text x="580.2" y="247.0" font-size="12" font-weight="600" fill="#26262f" text-anchor="middle">10,6</text>
<rect x="611.0" y="228" width="101.0" height="30" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/>
<text x="661.5" y="247.0" font-size="12" font-weight="600" fill="#26262f" text-anchor="middle">17,4</text>
<line x1="0" y1="265.0" x2="720" y2="265.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="122" y="291.0" font-size="11.5" fill="#26262f" text-anchor="end" font-weight="600">Ensemble</text>
<rect x="132.0" y="272" width="284.8" height="30" fill="#184f95" stroke="#ffffff" stroke-width="1.5"/>
<text x="274.4" y="291.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">49,1</text>
<rect x="416.8" y="272" width="147.3" height="30" fill="#8a8781" stroke="#ffffff" stroke-width="1.5"/>
