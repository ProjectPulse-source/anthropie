<rect x="564.1" y="272" width="62.6" height="30" fill="#c9c5c0" stroke="#ffffff" stroke-width="1.5"/>
<text x="595.4" y="291.0" font-size="12" font-weight="600" fill="#26262f" text-anchor="middle">10,8</text>
<rect x="626.7" y="272" width="85.3" height="30" fill="#eb6834" stroke="#ffffff" stroke-width="1.5"/>
<text x="669.4" y="291.0" font-size="12" font-weight="600" fill="#26262f" text-anchor="middle">14,7</text>
<line x1="0" y1="320.0" x2="720" y2="320.0" stroke="#dcd8d3"/>
<text x="0" y="333.0" font-size="9" fill="#55524f">MESRE-SIES, Note Flash n° 29, novembre 2025, tableaux nationaux, feuille « Devenir cohorte 2023 » (SISE, SCOLARITE, SIFA)</text>
<text x="0" y="345.0" font-size="9" fill="#55524f">Passés : inscrits en 2ᵉ ou 3ᵉ année de licence, ou entrés en études de santé depuis une licence accès santé. Recommencent : changements de discipline compris.</text>
<text x="0" y="357.0" font-size="9" fill="#55524f">Non retrouvés : absents des fichiers d'inscription (« sortie de l'enseignement supérieur » pour le SIES) ; certains étudient à l'étranger ou hors du champ suivi.</text>
<text x="0" y="369.0" font-size="9" fill="#55524f">Situation d'inscription un an après, non un diplôme. Le tableau ne croise pas l'origine sociale et le niveau scolaire à l'entrée.</text>
<text x="0" y="381.0" font-size="9" fill="#55524f">Taux arrondis : leur somme peut différer de 100 %. Origine non renseignée (3,8 % des inscrits) : pas de barre, comprise dans l'ensemble.</text>
<text x="0" y="393.0" font-size="9" fill="#96928f">Figure Stéphane Lalut, CC BY 4.0 · stephane-lalut.com/enseignants/ecole-et-parcours/</text>
</svg>