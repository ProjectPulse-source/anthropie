<title id="mg-t">Category A registrants: published series and series excluding RSA recipients and young people in programmes</title><desc id="mg-d">Two panels from 2018 to 2026, on the same scale: left, published category A; right, the series excluding RSA recipients and young people in programmes. A band marks 2022 (new monthly updating form), a line 1 January 2025 (full employment act). In the third quarter of 2026, 3.4m for published category A and 2.4m excluding RSA recipients and young people in programmes.</desc>
