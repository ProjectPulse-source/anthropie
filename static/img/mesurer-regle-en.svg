<text class="pied-source" x="0" y="393.0" font-size="11" fill="#52514e">Dares and France Travail, quarterly average of end-of-month registrants, France excluding Mayotte, seasonally and</text>
<text class="pied-source" x="0" y="407.0" font-size="11" fill="#52514e">working-day adjusted (series excluding RSA recipients and young people in programmes since 2018)</text>
<text class="pied-note" x="0" y="421.0" font-size="11" fill="#52514e">Young people in programmes: on a youth commitment contract (CEJ), a contractual support pathway towards employment and</text>
<text class="pied-note" x="0" y="435.0" font-size="11" fill="#52514e">autonomy (Pacea) or France Travail's individualised support for young people (AIJ), according to the Dares. RSA:</text>
<text class="pied-note" x="0" y="449.0" font-size="11" fill="#52514e">minimum income benefit. Scope and period differ from the 2024 cross-tabulation figure. Series not labelled since</text>
<text class="pied-note" x="0" y="463.0" font-size="11" fill="#52514e">1 January 2025 (2021 label, valid until 20 May 2026, suspended by France's official statistics authority).</text>
