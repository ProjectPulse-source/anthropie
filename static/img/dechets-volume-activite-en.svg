<text x="200" y="69" font-size="11" font-weight="600" fill="#55524f">(end-2021)</text>
<text x="370" y="56" font-size="11" font-weight="600" fill="#55524f">Share of radioactivity</text>
<text x="370" y="69" font-size="11" font-weight="600" fill="#55524f">(end-2021)</text>
