<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 397" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dr-t dr-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="dr-t">Radioactive waste: volume does not show where the radioactivity is</title><desc id="dr-d">For each category, share of the volume of radioactive waste and share of its declared radioactivity, end-2021 (latest edition declaring activity), and disposal route. HA: 0.25% of volume, 97.1% of radioactivity. MA-VL: 2.2%, 2.7%. FA-VL: 5.9%, 0.01%. FMA-VC: 55.7%, 0.12%. TFA: 35.9%, &lt; 0.01%.</desc>
