<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 514" role="img" font-variant-numeric="tabular-nums" aria-labelledby="mt-m-t mt-m-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="mt-m-t">Refinancing pressure, 2025</title><desc id="mt-m-d">Each dot is a country: further right, a larger share of the debt falls due within the year; higher up, the harmonised 10-year yield exceeds the implicit interest rate on the stock by more. If financing conditions stayed above the cost of the debt being replaced, refinancing would push the average cost up. Below zero, the indicator points the other way. A marker, not a forecast. France: 9.5% of debt due within a year, gap of 1.33 percentage points.</desc>
