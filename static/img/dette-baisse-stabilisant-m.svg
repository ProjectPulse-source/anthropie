<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 703" role="img" font-variant-numeric="tabular-nums" aria-labelledby="bs-m-t bs-m-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="bs-m-t">France : le solde primaire observé et celui qui aurait stabilisé la dette</title><desc id="bs-m-d">Deux courbes annuelles de 1996 à 2025, en % du PIB : le solde primaire observé, positif quatre fois (1998 à 2001), et le solde primaire qui aurait stabilisé le ratio de dette, qui va de −7,3 en 2021 à +6,1 en 2020. En 2025, le solde observé est de −2,9 et le solde stabilisant de +0,0 : un écart de 2,9 points de PIB.</desc>
<rect width="300" height="703" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">France : le solde primaire</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">observé et celui qui aurait</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#26262f">stabilisé la dette</text>
<line x1="0" y1="100.0" x2="16" y2="100.0" stroke="#eb6834" stroke-width="2.6"/>
<text x="22" y="105.0" font-size="13.5" fill="#55524f">solde primaire observé</text>
<line x1="0" y1="119.0" x2="16" y2="119.0" stroke="#8a8781" stroke-width="2.2"/>
<text x="22" y="124.0" font-size="13.5" fill="#55524f">solde qui aurait stabilisé le</text>
<text x="22" y="143.0" font-size="13.5" fill="#55524f">ratio cette année-là, hors autres</text>
<text x="22" y="162.0" font-size="13.5" fill="#55524f">ajustements</text>
<line x1="46" y1="380.0" x2="294" y2="380.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="41" y="385.0" font-size="13.5" fill="#96928f" text-anchor="end">−8 %</text>
<line x1="46" y1="330.0" x2="294" y2="330.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="41" y="335.0" font-size="13.5" fill="#96928f" text-anchor="end">−4 %</text>
<line x1="46" y1="280.0" x2="294" y2="280.0" stroke="#dcd8d3" stroke-width="1.4"/>
<text x="41" y="285.0" font-size="13.5" fill="#96928f" text-anchor="end">0 %</text>
<line x1="46" y1="230.0" x2="294" y2="230.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="41" y="235.0" font-size="13.5" fill="#96928f" text-anchor="end">+4 %</text>
<line x1="46" y1="180.0" x2="294" y2="180.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="41" y="185.0" font-size="13.5" fill="#96928f" text-anchor="end">+8 %</text>
<polyline points="50.1,254.0 58.4,260.7 66.7,270.3 74.9,268.7 83.2,283.8 91.5,269.4 99.7,264.8 108.0,264.8 116.3,280.5 124.5,277.3 132.8,286.2 141.1,285.1 149.3,265.5 157.6,223.8 165.9,280.0 174.1,280.6 182.4,261.0 190.7,268.2 198.9,270.9 207.2,280.6 215.5,272.8 223.7,289.7 232.0,291.3 240.3,300.0 248.5,203.7 256.8,371.4 265.1,333.5 273.3,344.8 281.6,301.7 289.9,280.2" fill="none" stroke="#8a8781" stroke-width="2.0" stroke-linejoin="round"/>
<polyline points="50.1,283.5 58.4,282.0 66.7,267.6 74.9,260.8 83.2,259.4 91.5,259.6 99.7,281.8 108.0,295.1 116.3,289.4 124.5,289.9 132.8,280.7 141.1,283.8 149.3,287.9 157.6,340.4 165.9,337.6 174.1,312.4 182.4,311.8 190.7,312.6 198.9,309.7 207.2,303.3 215.5,303.3 223.7,299.7 232.0,286.9 240.3,291.0 248.5,375.6 256.8,345.0 265.1,315.3 273.3,323.5 281.6,326.4 289.9,315.8" fill="none" stroke="#eb6834" stroke-width="2.4" stroke-linejoin="round"/>
<text x="50.1" y="399.0" font-size="13.5" fill="#55524f" text-anchor="start">1996</text>
<text x="165.9" y="399.0" font-size="13.5" fill="#55524f" text-anchor="middle">2010</text>
<text x="289.9" y="399.0" font-size="13.5" fill="#55524f" text-anchor="end">2025</text>
<circle cx="248.5" cy="203.7" r="3.6" fill="#8a8781" stroke="#ffffff" stroke-width="1"/>
<circle cx="256.8" cy="371.4" r="3.6" fill="#8a8781" stroke="#ffffff" stroke-width="1"/>
<circle cx="289.9" cy="280.2" r="3.6" fill="#8a8781" stroke="#ffffff" stroke-width="1"/>
<circle cx="289.9" cy="315.8" r="3.6" fill="#eb6834" stroke="#ffffff" stroke-width="1"/>
<text x="0" y="425.0" font-size="13.5" font-weight="600" fill="#26262f">2020, recul du PIB : repère +6,1 %</text>
<text x="0" y="444.0" font-size="13.5" font-weight="600" fill="#26262f">2021, rebond du PIB : repère −7,3 %</text>
<text x="0" y="463.0" font-size="13.5" font-weight="600" fill="#26262f">2025 : observé −2,9 %, repère</text>
<text x="0" y="482.0" font-size="13.5" font-weight="600" fill="#26262f">+0,0 %, écart 2,9 points</text>
<line x1="0" y1="494.0" x2="300" y2="494.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="515.0" font-size="13.5" fill="#55524f">Eurostat gov_10dd_edpt1 (dette, PIB),</text>
<text class="pied-source" x="0" y="532.0" font-size="13.5" fill="#55524f">gov_10a_main (B9, D41PAY), France,</text>
<text class="pied-source" x="0" y="549.0" font-size="13.5" fill="#55524f">1996-2025</text>
<text class="pied-note" x="0" y="570.0" font-size="13.5" fill="#55524f">En % du PIB ; solde stabilisant =</text>
<text class="pied-note" x="0" y="587.0" font-size="13.5" fill="#55524f">(taux implicite − croissance nominale)</text>
<text class="pied-note" x="0" y="604.0" font-size="13.5" fill="#55524f">/ (1 + croissance) × ratio dette/PIB</text>
<text class="pied-note" x="0" y="621.0" font-size="13.5" fill="#55524f">de fin d'année précédente, hors autres</text>
<text class="pied-note" x="0" y="638.0" font-size="13.5" fill="#55524f">ajustements (flux-stock). Un repère</text>
<text class="pied-note" x="0" y="655.0" font-size="13.5" fill="#55524f">comptable de l'année, non un objectif.</text>
