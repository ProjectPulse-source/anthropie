<circle cx="549.8" cy="204.4" r="4" fill="#eb6834"/>
<text x="557.8" y="221.4" font-size="12" fill="#eb6834"><tspan font-weight="600">Implicit rate</tspan> 2.0%</text>
<circle cx="464.7" cy="273.0" r="3.5" fill="#52514e"/>
<text x="464.7" y="291.0" font-size="11" fill="#52514e" text-anchor="middle">-0.1% en 2020</text>
<line x1="0" y1="364.0" x2="720" y2="364.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="0" y="377.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">Eurostat irt_lt_mcby_a (10-year yield)  ·  implicit rate: Eurostat gov_10a_main and INSEE, 1996-2025</text>
<text x="0" y="389.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">The 10-year yield benchmarks the cost of new borrowing; the implicit rate, the cost of the whole stock, follows it only as old debt is refinanced.</text>
