<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" role="img" font-variant-numeric="tabular-nums" aria-labelledby="tm-t tm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="tm-t">10-year rate and implicit interest rate on French public debt, 1996-2025</title>
<desc id="tm-d">Two curves in percent per year. The 10-year rate goes from 6.3% in 1996 to -0.1% in 2020, then climbs back to 3.3% in 2025. The implicit rate, the average cost of the stock, goes from 6.5% to 1.2%, then rises only to 2.0% in 2025.</desc>
<text x="46" y="22" font-size="13" fill="#52514e">10-year market yield and average cost of the stock, % per year</text>
<line x1="46" y1="268.2" x2="560" y2="268.2" stroke="#c3c2b7" stroke-width="1"/>
<text x="40" y="272.2" font-size="11" fill="#898781" text-anchor="end">0</text>
<line x1="46" y1="204.8" x2="560" y2="204.8" stroke="#e1e0d9" stroke-width="1"/>
<text x="40" y="208.8" font-size="11" fill="#898781" text-anchor="end">2</text>
<line x1="46" y1="141.2" x2="560" y2="141.2" stroke="#e1e0d9" stroke-width="1"/>
<text x="40" y="145.2" font-size="11" fill="#898781" text-anchor="end">4</text>
<line x1="46" y1="77.8" x2="560" y2="77.8" stroke="#e1e0d9" stroke-width="1"/>
<text x="40" y="81.8" font-size="11" fill="#898781" text-anchor="end">6</text>
<text x="124.3" y="322.0" font-size="11" fill="#898781" text-anchor="middle">2000</text>
<text x="209.4" y="322.0" font-size="11" fill="#898781" text-anchor="middle">2005</text>
<text x="294.5" y="322.0" font-size="11" fill="#898781" text-anchor="middle">2010</text>
<text x="379.6" y="322.0" font-size="11" fill="#898781" text-anchor="middle">2015</text>
<text x="464.7" y="322.0" font-size="11" fill="#898781" text-anchor="middle">2020</text>
<text x="549.8" y="322.0" font-size="11" fill="#898781" text-anchor="middle">2025</text>
