<rect x="210.0" y="213" width="6.6" height="15" fill="#8a8781"/>
<text x="220.6" y="224" font-size="10" font-weight="600" fill="#26262f">0.1</text>
<text x="680" y="261" font-size="10" fill="#96928f" text-anchor="end">points of GDP</text>
<line x1="0" y1="274.0" x2="720" y2="274.0" stroke="#dcd8d3"/>
