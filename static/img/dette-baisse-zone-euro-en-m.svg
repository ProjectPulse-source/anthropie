<title id="bz-m-t">Euro area, 2016-2025: France's interest rate, growth and primary balance</title><desc id="bz-m-d">Annual averages 2016-2025, 21 euro-area countries, one dot per country, France in orange. Implicit interest rate on debt: France 1.74%, median 2.10%. Nominal GDP growth: France 3.2%, median 5.7%. Primary balance: France −3.1% of GDP, median −0.8%. France has the lowest primary balance, one of the two weakest nominal growth rates and one of the lowest implicit interest rates.</desc>
