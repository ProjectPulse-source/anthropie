<title id="bz-m-t">Euro area, 2016-2025: France's interest rate, growth and primary balance</title><desc id="bz-m-d">Annual averages 2016-2025, 19 euro-area countries, one dot per country, France in orange. Implicit interest rate on debt: France 1.74%, median country 2.11%. Nominal GDP growth: France 3.2%, median country 5.5%. Primary balance: France −3.1% of GDP, median country −0.7%. France has the lowest primary balance, one of the two weakest nominal growth rates and one of the lowest interest rates.</desc>
