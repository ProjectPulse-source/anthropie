<title id="etu-lm-t">Lycéens présentant un risque important de dépression, 2018-2024</title><desc id="etu-lm-d">Deux séries, enquêtes de 2018, 2022 et 2024, de la part des lycéens présentant un risque important de dépression, en %. Lycéennes : 18,0 en 2018, 22,7 en 2022, 25,7 en 2024. Lycéens (garçons) : 8,6 en 2018, 8,0 en 2022, 11,7 en 2024.</desc>
