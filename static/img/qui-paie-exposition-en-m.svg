<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1059" role="img" font-variant-numeric="tabular-nums" aria-labelledby="qp-exp-m-t qp-exp-m-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="qp-exp-m-t">The same €10 billion adjustment: who would bear it, depending on the decision taken?</title><desc id="qp-exp-m-d">Two panels. A: for a 10 billion euro adjustment allocated pro rata to each item, the share of net disposable income this amount would represent for each standard-of-living decile, in 2023. A cut in education spending weighs 2.75% of the income of the first decile and 0.21% of the last; a rise in taxes on income and wealth, 1.14% of the last; pensions stay between 0.43 and 0.78%. B: the ratio of the heaviest to the lightest decision for the same group, base 1. It is ×5.5 in the last decile and at least as much in the first, peaks at ×7.7 in D2, and falls to ×1.4 in D7-D8: that is where the lever chosen changes the decile's average exposure least.</desc>
<rect width="300" height="1059" fill="#ffffff"/>
