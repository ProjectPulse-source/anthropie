<text x="0.0" y="831.0" font-size="13.5" fill="#52514e" text-anchor="start">changes the decile's average exposure</text>
<text x="0.0" y="849.0" font-size="13.5" fill="#52514e" text-anchor="start">least</text>
<line x1="0" y1="863.0" x2="300" y2="863.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="884.0" font-size="13.5" fill="#52514e">Insee, distributional national</text>
<text class="pied-source" x="0" y="901.0" font-size="13.5" fill="#52514e">accounts, table CND.101, 2023 vintage</text>
<text class="pied-note" x="0" y="922.0" font-size="13.5" fill="#52514e">An exposure profile, not a simulation:</text>
<text class="pied-note" x="0" y="939.0" font-size="13.5" fill="#52514e">no behaviour, no feedback effect.</text>
<text class="pied-note" x="0" y="960.0" font-size="13.5" fill="#52514e">D1 tax point excluded: income tax of</text>
<text class="pied-note" x="0" y="977.0" font-size="13.5" fill="#52514e">the first twentieth is atypical there;</text>
<text class="pied-note" x="0" y="994.0" font-size="13.5" fill="#52514e">D1 carries “≥”, a lower bound computed</text>
<text class="pied-note" x="0" y="1011.0" font-size="13.5" fill="#52514e">on two levers.</text>
