<text x="76.0" y="427.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">1.14%</text>
<line x1="0" y1="444.0" x2="16" y2="444.0" stroke="#898781" stroke-width="3"/>
