<text x="0" y="42" font-size="17" font-weight="600" fill="#2b2a28">adjustment: who would bear it,</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#2b2a28">depending on the decision</text>
<text x="0" y="86" font-size="17" font-weight="600" fill="#2b2a28">taken?</text>
<text x="0.0" y="130.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">A · Amount allocated, as a % of the</text>
<text x="0.0" y="148.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">decile's disposable income</text>
<text x="0.0" y="166.0" font-size="13.5" fill="#898781" text-anchor="start">Pro rata to existing amounts, 2023</text>
