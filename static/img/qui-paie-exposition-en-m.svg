<text x="0.0" y="607.0" font-size="13.5" fill="#898781" text-anchor="start">Heaviest decision ÷ lightest · 1: no</text>
<text x="0.0" y="625.0" font-size="13.5" fill="#898781" text-anchor="start">gap</text>
