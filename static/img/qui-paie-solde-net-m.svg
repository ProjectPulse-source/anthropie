<text x="0" y="20" font-size="17" font-weight="600" fill="#2b2a28">Qui reçoit plus qu'il ne</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#2b2a28">verse ? Par dixième, 2023</text>
<text x="0.0" y="86.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">A · Solde = prélèvements moins</text>
<text x="0.0" y="104.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">transferts reçus</text>
<text x="0.0" y="122.0" font-size="13.5" fill="#898781" text-anchor="start">Moyenne, milliers d'euros par UC ·</text>
<text x="0.0" y="140.0" font-size="13.5" fill="#898781" text-anchor="start">négatif : bénéficiaire net</text>
<rect x="0" y="150.0" width="12" height="12" fill="#184f95"/>
