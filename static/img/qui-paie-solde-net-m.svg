<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 918" role="img" font-variant-numeric="tabular-nums" aria-labelledby="qp-net-m-t qp-net-m-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="qp-net-m-t">Qui reçoit plus qu'il ne verse ? Par dixième, 2023</title><desc id="qp-net-m-d">Deux panneaux. A : solde des transferts publics par dixième de niveau de vie, en milliers d'euros par unité de consommation, égal à ce que le groupe verse moins ce qu'il reçoit : négatif quand il reçoit plus qu'il ne verse. En moyenne, les sept premiers dixièmes reçoivent plus qu'ils ne versent, le premier de 20,8 ; les trois derniers versent plus qu'ils ne reçoivent, le dernier de 58,4. B : part de personnes bénéficiaires nettes, de 99 % dans le premier dixième à 18 % dans le dernier.</desc>
