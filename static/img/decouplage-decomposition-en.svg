<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 441" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dc-t dc-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="dc-t">Energy consumption, 2000-2024: what pushed it up, what held it back</title><desc id="dc-d">Decomposition of the change in primary energy consumption from 2000 to 2024, as % of 2000 consumption. World: population effect +35.6%, GDP-per-head effect +65.0%, energy-intensity effect −42.6%, total change +57.9% (intensity itself fell by 28.5%). European Union (27 countries): population effect +4.6%, GDP-per-head effect +27.6%, energy-intensity effect −50.1%, total change −17.9%.</desc>
<rect width="720" height="441" fill="#ffffff"/>
<text x="0" y="18" font-size="14" font-weight="600" fill="#26262f">Energy consumption, 2000-2024: what pushed it up, what held it back</text>
<text x="250" y="46" font-size="11" fill="#55524f">effects and change, as % of 2000 consumption</text>
<text x="0" y="80" font-size="13" font-weight="600" fill="#26262f">World</text>
<text x="0" y="102" font-size="11" fill="#26262f">Population effect</text>
<rect x="445.6" y="90" width="115.9" height="16" fill="#eb6834"/>
<text x="565.4" y="102" font-size="11" font-weight="600" fill="#eb6834">+35.6%</text>
<text x="0" y="130" font-size="11" fill="#26262f">GDP-per-head effect</text>
<rect x="445.6" y="118" width="211.8" height="16" fill="#eb6834"/>
<text x="661.4" y="130" font-size="11" font-weight="600" fill="#eb6834">+65.0%</text>
<text x="0" y="152" font-size="11" fill="#26262f">Energy-intensity effect (energy</text>
<text x="0" y="164" font-size="11" fill="#26262f">per unit of GDP)</text>
<rect x="306.7" y="146" width="138.9" height="16" fill="#8a8781"/>
<text x="302.7" y="158" font-size="11" font-weight="600" fill="#26262f" text-anchor="end">−42.6%</text>
<text x="0" y="186" font-size="11" font-weight="600" fill="#26262f">Change in consumption</text>
<rect x="445.6" y="174" width="188.8" height="16" fill="#184f95"/>
<text x="638.4" y="186" font-size="11" font-weight="600" fill="#184f95">+57.9%</text>
<line x1="445.6" y1="86" x2="445.6" y2="194" stroke="#55524f"/>
<text x="0" y="222" font-size="13" font-weight="600" fill="#26262f">European Union (27 countries)</text>
<text x="0" y="244" font-size="11" fill="#26262f">Population effect</text>
<rect x="445.6" y="232" width="14.8" height="16" fill="#eb6834"/>
<text x="464.4" y="244" font-size="11" font-weight="600" fill="#eb6834">+4.6%</text>
<text x="0" y="272" font-size="11" fill="#26262f">GDP-per-head effect</text>
<rect x="445.6" y="260" width="90.0" height="16" fill="#eb6834"/>
<text x="539.5" y="272" font-size="11" font-weight="600" fill="#eb6834">+27.6%</text>
<text x="0" y="294" font-size="11" fill="#26262f">Energy-intensity effect (energy</text>
<text x="0" y="306" font-size="11" fill="#26262f">per unit of GDP)</text>
<rect x="282.3" y="288" width="163.2" height="16" fill="#8a8781"/>
<text x="278.3" y="300" font-size="11" font-weight="600" fill="#26262f" text-anchor="end">−50.1%</text>
<text x="0" y="328" font-size="11" font-weight="600" fill="#26262f">Change in consumption</text>
<rect x="387.1" y="316" width="58.4" height="16" fill="#184f95"/>
<text x="383.1" y="328" font-size="11" font-weight="600" fill="#26262f" text-anchor="end">−17.9%</text>
<line x1="445.6" y1="228" x2="445.6" y2="336" stroke="#55524f"/>
<line x1="0" y1="348.0" x2="720" y2="348.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="363.0" font-size="11" fill="#55524f">EIA, international data (energy, GDP at purchasing power parity in constant prices, population)</text>
<text class="pied-note" x="0" y="377.0" font-size="11" fill="#55524f">Primary energy consumed on the territory (energy embodied in imports not counted); hydro and wind electricity counted</text>
<text class="pied-note" x="0" y="391.0" font-size="11" fill="#55524f">at its electrical content, nuclear at the heat produced. Accounting decomposition (Divisia index), GDP at purchasing</text>
<text class="pied-note" x="0" y="405.0" font-size="11" fill="#55524f">power parity: it does not say why intensity falls. Values rounded to one decimal: their sum may differ from the total</text>
<text class="pied-note" x="0" y="419.0" font-size="11" fill="#55524f">by one tenth.</text>
<text class="pied-licence" x="0" y="433.0" font-size="11" fill="#96928f">Computed by Stéphane Lalut, CC BY 4.0 · stephane-lalut.com/en/decoupling-energy-growth/</text>
</svg>