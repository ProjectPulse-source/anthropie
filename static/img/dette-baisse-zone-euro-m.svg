<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 834" role="img" font-variant-numeric="tabular-nums" aria-labelledby="bz-m-t bz-m-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="bz-m-t">Zone euro, 2016-2025 : taux, croissance et solde primaire de la France</title><desc id="bz-m-d">Moyennes annuelles 2016-2025, 19 pays de la zone euro, un point par pays, la France en orange. Taux implicite de la dette : France 1,74 %, médiane 2,11 %. Croissance du PIB nominal : France 3,2 %, médiane 5,5 %. Solde primaire : France −3,1 % du PIB, médiane −0,7 %. La France a le solde primaire le plus bas, l'une des deux croissances nominales les plus faibles et l'un des taux implicites les plus bas.</desc>
