<text class="pied-source" x="0" y="612.0" font-size="13.5" fill="#55524f">Eurostat gov_10dd_edpt1 (dette, PIB),</text>
<text class="pied-source" x="0" y="629.0" font-size="13.5" fill="#55524f">gov_10a_main (B9, D41PAY), 2016-2025 ;</text>
<text class="pied-source" x="0" y="646.0" font-size="13.5" fill="#55524f">membres de la zone euro au 1er janvier</text>
<text class="pied-source" x="0" y="663.0" font-size="13.5" fill="#55524f">2026, hors Finlande et Irlande (années</text>
<text class="pied-source" x="0" y="680.0" font-size="13.5" fill="#55524f">rejetées par le contrôle)</text>
<text class="pied-note" x="0" y="701.0" font-size="13.5" fill="#55524f">Comparaison comptable : elle ne dit ni</text>
<text class="pied-note" x="0" y="718.0" font-size="13.5" fill="#55524f">si l'écart vient des dépenses ou des</text>
<text class="pied-note" x="0" y="735.0" font-size="13.5" fill="#55524f">recettes, ni quel ajustement serait</text>
<text class="pied-note" x="0" y="752.0" font-size="13.5" fill="#55524f">souhaitable. Taux implicite = intérêts</text>
<text class="pied-note" x="0" y="769.0" font-size="13.5" fill="#55524f">payés / dette de fin d'année</text>
<text class="pied-note" x="0" y="786.0" font-size="13.5" fill="#55524f">précédente.</text>
