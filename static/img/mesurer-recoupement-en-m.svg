<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 577" role="img" font-variant-numeric="tabular-nums" aria-labelledby="mrm-t mrm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="mrm-t">ILO-defined unemployment and category A registration in France, 2024</title><desc id="mrm-d">Bar in three segments, in thousands of people, 2024 average (Insee estimate): 863 people unemployed under the ILO definition not registered in category A, 1,427 in both at once, 1,466 category A registrants who are not unemployed under the ILO definition. Unemployed (ILO): 2,290, of whom 62% registered in category A. Category A registrants: 2,893, of whom 49% unemployed under the ILO definition.</desc>
<rect width="300" height="577" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">ILO-defined unemployment and</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">category A registration in</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#0A0A0E">France, 2024</text>
<text x="0.0" y="94.0" font-size="13.5" fill="#898781" text-anchor="start">Thousands of people, 2024 average</text>
<text x="0.0" y="128.0" font-size="13.5" fill="#52514e" text-anchor="start">ILO unemployed, not in A</text>
<rect x="0" y="136" width="129.5" height="22" fill="#c9cdd3"/>
<text x="135.5" y="152.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">863</text>
<text x="0.0" y="182.0" font-size="13.5" fill="#52514e" text-anchor="start">In both at once</text>
<rect x="0" y="190" width="214.1" height="22" fill="#184f95"/>
<text x="220.1" y="206.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">1,427</text>
<text x="0.0" y="236.0" font-size="13.5" fill="#52514e" text-anchor="start">In category A, not ILO unemployed</text>
<rect x="0" y="244" width="220.0" height="22" fill="#c9cdd3"/>
<text x="226.0" y="260.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">1,466</text>
<text x="0.0" y="296.0" font-size="13.5" fill="#0A0A0E" text-anchor="start" font-weight="600">ILO unemployed: 2,290,</text>
<text x="0.0" y="314.0" font-size="13.5" fill="#52514e" text-anchor="start">62% in A</text>
<text x="0.0" y="336.0" font-size="13.5" fill="#0A0A0E" text-anchor="start" font-weight="600">In category A: 2,893,</text>
<text x="0.0" y="354.0" font-size="13.5" fill="#52514e" text-anchor="start">49% ILO unemployed</text>
<line x1="0" y1="368.0" x2="300" y2="368.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="389.0" font-size="13.5" fill="#52514e">Insee Références, Emploi, chômage,</text>
<text class="pied-source" x="0" y="406.0" font-size="13.5" fill="#52514e">revenus du travail, 2026 ed., dossier</text>
<text class="pied-source" x="0" y="423.0" font-size="13.5" fill="#52514e">1 (in-depth study), figures 2 and 8</text>
<text class="pied-source" x="0" y="440.0" font-size="13.5" fill="#52514e">(Dares-Insee-France Travail matching)</text>
<text class="pied-note" x="0" y="461.0" font-size="13.5" fill="#52514e">Insee estimate, 2024 average, France</text>
<text class="pied-note" x="0" y="478.0" font-size="13.5" fill="#52514e">excluding Mayotte, aged 15-64,</text>
<text class="pied-note" x="0" y="495.0" font-size="13.5" fill="#52514e">ordinary households; two distinct</text>
<text class="pied-note" x="0" y="512.0" font-size="13.5" fill="#52514e">definitions; survey margin not</text>
