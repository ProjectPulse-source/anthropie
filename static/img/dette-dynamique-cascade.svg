<text x="542.5" y="306" font-size="10.5" fill="#55524f" text-anchor="middle">Ajustements flux-stock</text>
<rect x="621.8" y="130.9" width="64.8" height="159.1" fill="#184f95"/>
<text x="654.2" y="124.9" font-size="12" font-weight="600" fill="#26262f" text-anchor="middle">115,7 %</text>
<text x="654.2" y="306" font-size="10.5" fill="#55524f" text-anchor="middle">Dette fin</text>
<text x="654.2" y="319" font-size="10.5" fill="#55524f" text-anchor="middle">2025</text>
<text x="40" y="44" font-size="11" fill="#55524f">En points de PIB : bleu, le stock ; orange, ce qui le fait monter ; gris, ce qui le fait baisser.</text>
<line x1="0" y1="334.0" x2="720" y2="334.0" stroke="#dcd8d3"/>
<text x="0" y="347.0" font-size="9" fill="#55524f">Eurostat gov_10dd_edpt1 (dette), gov_10a_main (B9, D41PAY), nama_10_gdp (PIB), France, 1996-2025</text>
<text x="0" y="359.0" font-size="9" fill="#55524f">Décomposition comptable de la variation du ratio, non une attribution causale ; les termes se compensent en partie.</text>
