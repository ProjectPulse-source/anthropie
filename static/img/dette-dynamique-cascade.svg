<text x="34" y="238.0" font-size="10" fill="#96928f" text-anchor="end">40 %</text>
<line x1="40" y1="207.5" x2="710" y2="207.5" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="34" y="210.5" font-size="10" fill="#96928f" text-anchor="end">60 %</text>
<line x1="40" y1="180.0" x2="710" y2="180.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="34" y="183.0" font-size="10" fill="#96928f" text-anchor="end">80 %</text>
<line x1="40" y1="152.5" x2="710" y2="152.5" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="34" y="155.5" font-size="10" fill="#96928f" text-anchor="end">100 %</text>
<line x1="40" y1="125.0" x2="710" y2="125.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="34" y="128.0" font-size="10" fill="#96928f" text-anchor="end">120 %</text>
<line x1="40" y1="97.5" x2="710" y2="97.5" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="34" y="100.5" font-size="10" fill="#96928f" text-anchor="end">140 %</text>
<line x1="40" y1="70.0" x2="710" y2="70.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="34" y="73.0" font-size="10" fill="#96928f" text-anchor="end">160 %</text>
<rect x="63.5" y="210.9" width="64.8" height="79.1" fill="#184f95"/>
<text x="95.8" y="204.9" font-size="12" font-weight="600" fill="#26262f" text-anchor="middle">57,5 %</text>
<text x="95.8" y="306" font-size="10.5" fill="#55524f" text-anchor="middle">Dette fin</text>
<text x="95.8" y="319" font-size="10.5" fill="#55524f" text-anchor="middle">1995</text>
<line x1="128.2" y1="210.9" x2="175.1" y2="210.9" stroke="#96928f" stroke-dasharray="3 2"/>
<rect x="175.1" y="109.2" width="64.8" height="101.7" fill="#eb6834"/>
<text x="207.5" y="103.2" font-size="12" font-weight="600" fill="#26262f" text-anchor="middle">+74,0</text>
<text x="207.5" y="306" font-size="10.5" fill="#55524f" text-anchor="middle">Intérêts payés</text>
<line x1="239.9" y1="109.2" x2="286.8" y2="109.2" stroke="#96928f" stroke-dasharray="3 2"/>
<rect x="286.8" y="109.2" width="64.8" height="99.4" fill="#8a8781"/>
<text x="319.2" y="103.2" font-size="12" font-weight="600" fill="#26262f" text-anchor="middle">−72,3</text>
<text x="319.2" y="306" font-size="10.5" fill="#55524f" text-anchor="middle">Croissance du</text>
<text x="319.2" y="319" font-size="10.5" fill="#55524f" text-anchor="middle">PIB nominal</text>
<line x1="351.6" y1="208.7" x2="398.5" y2="208.7" stroke="#96928f" stroke-dasharray="3 2"/>
<rect x="398.5" y="139.2" width="64.8" height="69.5" fill="#eb6834"/>
<text x="430.8" y="133.2" font-size="12" font-weight="600" fill="#26262f" text-anchor="middle">+50,5</text>
<text x="430.8" y="306" font-size="10.5" fill="#55524f" text-anchor="middle">Déficits primaires</text>
<line x1="463.2" y1="139.2" x2="510.1" y2="139.2" stroke="#96928f" stroke-dasharray="3 2"/>
