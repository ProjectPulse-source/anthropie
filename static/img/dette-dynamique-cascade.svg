<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 382" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dc-t dc-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="dc-t">Pourquoi la dette a doublé : de 57,5 % à 115,7 % du PIB, 1995-2025</title><desc id="dc-d">Cascade en points de PIB. La dette part de 57,5 % fin 1995. Les intérêts l'auraient poussée de 74,0 points, mais la croissance du PIB nominal en a effacé 72,3 : leur effet net est de +1,6 point. Les déficits primaires, hors intérêts, ajoutent 50,5 points, les ajustements flux-stock +6,0. La dette atteint 115,7 % fin 2025. Décomposition comptable, non causale.</desc>
<rect width="720" height="382" fill="#ffffff"/>
<text x="0" y="18" font-size="15" font-weight="600" fill="#26262f">Pourquoi la dette a doublé : de 57,5 % à 115,7 % du PIB, 1995-2025</text>
