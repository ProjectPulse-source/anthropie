<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 413" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dc-t dc-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="dc-t">Pourquoi la dette a doublé : de 57,8 % à 115,6 % du PIB, 1995-2025</title><desc id="dc-d">Cascade en points de PIB. La dette part de 57,8 % fin 1995. Les intérêts l'auraient poussée de 73,9 points, mais la croissance du PIB nominal en a effacé 72,8 : leur effet net est de +1,2 point. Les déficits primaires, hors intérêts, ajoutent 50,5 points, les ajustements flux-stock +6,0. La dette atteint 115,6 % fin 2025. Décomposition comptable, non causale.</desc>
