<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 363" role="img" font-variant-numeric="tabular-nums" aria-labelledby="imp-t imp-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="imp-t">Unexpected expense: being above the poverty threshold is not enough (France, 2025)</title><desc id="imp-d">Share of people whose household says it could not face an unexpected expense of €1,000, by the type of household they live in, France, 2025. Above the poverty threshold: two adults without children 14.0%, one adult without children 23.4%, two adults with one child 18.6%, one adult with one or more children 46.9%. Below the threshold: two adults without children 50.1%, one adult without children 58.4%, two adults with one child 71.9%, one adult with one or more children 77.0%. Association, not cause: the groups are not compared at equal income (how far incomes lie from the threshold is not taken into account).</desc>
<rect width="720" height="363" fill="#ffffff"/>
