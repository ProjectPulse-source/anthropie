<title id="imp-t">Unable to face an unexpected expense: income is not the whole story (France, 2025)</title><desc id="imp-d">Share of people who could not face an unexpected expense, France, 2025. Above the poverty threshold: couple without children 14.0%, single adult 23.4%, couple with one child 18.6%, single parent 46.9%. Below the threshold: couple without children 50.1%, single adult 58.4%, couple with one child 71.9%, single parent 77.0%.</desc>
