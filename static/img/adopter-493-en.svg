<text class="pied-source" x="0" y="347.0" font-size="11" fill="#52514e">National Assembly: legislative files, statistical bulletins, summary sheet no. 64 (Government responsibility)</text>
<text class="pied-note" x="0" y="361.0" font-size="11" fill="#52514e">Categories of art. 49, para. 3: the public finance programming act is 'one other bill'. Each use of Article 49(3) is</text>
<text class="pied-note" x="0" y="375.0" font-size="11" fill="#52514e">counted once; the same bill may be subject to several uses, including during the same reading. 17th ongoing on</text>
