<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1269" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dtcm-t dtcm-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="dtcm-t">Data centers : puissance réservée et électricité consommée</title><desc id="dtcm-d">Deux panneaux, deux grandeurs. Puissance de raccordement réservée par les data centers auprès de RTE : environ 5 GW fin 2024, 14 GW en novembre 2025 (dont 6,1 GW pour une mise en service avant 2030, 7,6 GW à partir de 2030 et 0,2 GW suspendus), près de 18 GW en mai 2026 ; 0,8 GW déjà raccordés au réseau de RTE en juin 2026 (huit sites) ; environ 0,9 GW abandonnés depuis 2023. Consommation des data centers sur sites dédiés : 0,8 TWh en 2024 et près de 1 TWh en 2025 mesurés sur le réseau de RTE ; 4 à 5 TWh estimés pour l'ensemble en 2024 ; 10 à 15 TWh en 2030 et 21 à 32 TWh en 2035 dans les deux trajectoires de RTE.</desc>
<rect width="300" height="1269" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">Data centers : puissance</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">réservée et électricité</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#26262f">consommée</text>
<defs><pattern id="dtcm-hach" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="5" stroke="#184f95" stroke-width="2.4"/></pattern></defs>
<text x="0" y="118" font-size="13.5" font-weight="600" fill="#184f95">Puissance de raccordement réservée</text>
<text x="0" y="136" font-size="13.5" font-weight="600" fill="#184f95">auprès de RTE, en gigawatts (GW)</text>
<text x="0" y="164" font-size="13.5" fill="#26262f">Fin 2024</text>
<rect x="0.0" y="170.0" width="47.5" height="12" fill="url(#dtcm-hach)" stroke="#184f95" stroke-width="1"/>
<text x="53.5" y="181" font-size="13.5" font-weight="600" fill="#184f95">environ 5 GW</text>
<text x="0" y="210" font-size="13.5" fill="#26262f">Novembre 2025</text>
<rect x="0.0" y="216.0" width="58.0" height="12" fill="#184f95"/>
<rect x="58.0" y="216.0" width="72.2" height="12" fill="#9db7da"/>
<rect x="130.2" y="216.0" width="1.9" height="12" fill="#8a8781"/>
<text x="138.1" y="227" font-size="13.5" font-weight="600" fill="#184f95">14 GW</text>
<text x="0" y="256" font-size="13.5" fill="#26262f">Mai 2026</text>
<rect x="0.0" y="262.0" width="171.0" height="12" fill="url(#dtcm-hach)" stroke="#184f95" stroke-width="1"/>
<text x="177.0" y="273" font-size="13.5" font-weight="600" fill="#184f95">près de 18 GW</text>
<text x="0" y="302" font-size="13.5" fill="#26262f">Déjà raccordés au réseau de RTE</text>
<text x="0" y="320" font-size="13.5" fill="#26262f">en juin 2026 (huit sites, puissance</text>
<text x="0" y="338" font-size="13.5" fill="#26262f">cumulée)</text>
<rect x="0.0" y="344.0" width="7.6" height="12" fill="#55524f"/>
<text x="13.6" y="355" font-size="13.5" font-weight="600" fill="#55524f">0,8 GW</text>
<rect x="0" y="372" width="11" height="11" fill="url(#dtcm-hach)" stroke="#184f95" stroke-width="1"/>
<text x="16" y="382" font-size="13.5" fill="#55524f">Fin 2024 et mai 2026 : total,</text>
<text x="16" y="400" font-size="13.5" fill="#55524f">sans répartition</text>
<text x="0" y="432" font-size="13.5" font-weight="600" fill="#55524f">En novembre 2025 :</text>
<rect x="0" y="448" width="11" height="11" fill="#184f95"/>
<text x="16" y="458" font-size="13.5" fill="#55524f">mise en service prévue</text>
<text x="16" y="476" font-size="13.5" fill="#55524f">avant 2030 : 6,1 GW</text>
<rect x="0" y="492" width="11" height="11" fill="#9db7da"/>
<text x="16" y="502" font-size="13.5" fill="#55524f">à partir de 2030 : 7,6 GW</text>
<text x="0" y="528" font-size="13.5" fill="#55524f">Suspendu (trait gris en bout de</text>
<text x="0" y="546" font-size="13.5" fill="#55524f">barre) : 0,2 GW ; abandonné</text>
<text x="0" y="564" font-size="13.5" fill="#55524f">depuis 2023 : environ 0,9 GW</text>
<text x="0" y="606" font-size="13.5" font-weight="600" fill="#eb6834">Consommation d'électricité des</text>
<text x="0" y="624" font-size="13.5" font-weight="600" fill="#eb6834">data centers sur sites dédiés, en</text>
<text x="0" y="642" font-size="13.5" font-weight="600" fill="#eb6834">térawattheures par an (TWh)</text>
<text x="0" y="670" font-size="13.5" fill="#26262f">2024, mesurée (réseau de RTE)</text>
<rect x="0.0" y="676.0" width="4.3" height="12" fill="#eb6834"/>
<text x="10.3" y="687" font-size="13.5" font-weight="600" fill="#eb6834">0,8 TWh</text>
<text x="0" y="716" font-size="13.5" fill="#26262f">2025, mesurée (réseau de RTE)</text>
<rect x="0.0" y="722.0" width="5.4" height="12" fill="#eb6834"/>
<text x="11.4" y="733" font-size="13.5" font-weight="600" fill="#eb6834">près de 1 TWh</text>
<line x1="0" y1="752" x2="300" y2="752" stroke="#dcd8d3"/>
<text x="0" y="770" font-size="13.5" fill="#26262f">2024, estimée par RTE</text>
<text x="0" y="788" font-size="13.5" fill="#26262f">(tous sites dédiés)</text>
<rect x="0.0" y="794.0" width="21.7" height="12" fill="#f5b89c"/>
<rect x="21.7" y="794.5" width="5.4" height="11" fill="#ffffff" stroke="#eb6834" stroke-width="1"/>
<text x="33.1" y="805" font-size="13.5" font-weight="600" fill="#eb6834">4 à 5 TWh</text>
<text x="0" y="834" font-size="13.5" fill="#26262f">2030, deux trajectoires de RTE</text>
<text x="0" y="852" font-size="13.5" fill="#26262f">(tous sites dédiés)</text>
<rect x="0.0" y="858.0" width="54.3" height="12" fill="#f5b89c"/>
<rect x="54.3" y="858.5" width="27.1" height="11" fill="#ffffff" stroke="#eb6834" stroke-width="1"/>
<text x="87.4" y="869" font-size="13.5" font-weight="600" fill="#eb6834">10 à 15 TWh</text>
<text x="0" y="898" font-size="13.5" fill="#26262f">2035, deux trajectoires de RTE</text>
<text x="0" y="916" font-size="13.5" fill="#26262f">(tous sites dédiés)</text>
<rect x="0.0" y="922.0" width="114.0" height="12" fill="#f5b89c"/>
<rect x="114.0" y="922.5" width="59.7" height="11" fill="#ffffff" stroke="#eb6834" stroke-width="1"/>
<text x="179.7" y="933" font-size="13.5" font-weight="600" fill="#eb6834">21 à 32 TWh</text>
<text x="0" y="958" font-size="13.5" fill="#55524f">Plein : bas de la fourchette ;</text>
<text x="0" y="976" font-size="13.5" fill="#55524f">contour : jusqu'au haut.</text>
<line x1="0" y1="992.0" x2="300" y2="992.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="1013.0" font-size="13.5" fill="#55524f">RTE : Bilan prévisionnel 2025-2035</text>
<text class="pied-source" x="0" y="1030.0" font-size="13.5" fill="#55524f">(déc. 2025), Bilan électrique 2025</text>
<text class="pied-source" x="0" y="1047.0" font-size="13.5" fill="#55524f">(févr. 2026), page « Les data centers</text>
<text class="pied-source" x="0" y="1064.0" font-size="13.5" fill="#55524f">en chiffres clés » (1ᵉʳ juin 2026) ;</text>
<text class="pied-source" x="0" y="1081.0" font-size="13.5" fill="#55524f">répartition de novembre 2025 mesurée</text>
<text class="pied-source" x="0" y="1098.0" font-size="13.5" fill="#55524f">sur la figure 2.3 du Bilan</text>
<text class="pied-source" x="0" y="1115.0" font-size="13.5" fill="#55524f">prévisionnel (somme : 13,9 GW).</text>
<text class="pied-note" x="0" y="1136.0" font-size="13.5" fill="#55524f">Une puissance réservée n'est ni une</text>
<text class="pied-note" x="0" y="1153.0" font-size="13.5" fill="#55524f">puissance appelée ni une</text>
<text class="pied-note" x="0" y="1170.0" font-size="13.5" fill="#55524f">consommation : les deux panneaux ne se</text>
<text class="pied-note" x="0" y="1187.0" font-size="13.5" fill="#55524f">comparent pas, aucun rapport n'est</text>
<text class="pied-note" x="0" y="1204.0" font-size="13.5" fill="#55524f">calculé entre eux. Trajectoires :</text>
<text class="pied-note" x="0" y="1221.0" font-size="13.5" fill="#55524f">hypothèses de RTE, non des mesures.</text>
<text class="pied-licence" x="0" y="1242.0" font-size="13.5" fill="#6f6c66">Calcul Stéphane Lalut, CC BY 4.0,</text>
