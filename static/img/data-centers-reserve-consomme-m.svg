<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1193" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dtcm-t dtcm-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="dtcm-t">Data centers : puissance réservée et électricité consommée</title><desc id="dtcm-d">Deux panneaux, deux grandeurs. Puissance de raccordement réservée par les data centers auprès de RTE : environ 5 GW fin 2024, 14 GW en novembre 2025 (dont 6,1 GW pour une mise en service avant 2030, 7,6 GW à partir de 2030 et 0,2 GW suspendus), près de 18 GW en mai 2026 ; 0,8 GW déjà raccordés au réseau de RTE (huit sites) ; environ 0,9 GW abandonnés depuis 2023. Consommation des data centers sur sites dédiés : 0,8 TWh en 2024 et près de 1 TWh en 2025 mesurés sur le réseau de RTE ; 4 à 5 TWh estimés pour l'ensemble en 2024 ; 10 à 15 TWh en 2030 et 21 à 32 TWh en 2035 dans les deux trajectoires de RTE.</desc>
<rect width="300" height="1193" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">Data centers : puissance</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">réservée et électricité</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#26262f">consommée</text>
<text x="0" y="118" font-size="13.5" font-weight="600" fill="#184f95">Puissance de raccordement réservée</text>
<text x="0" y="136" font-size="13.5" font-weight="600" fill="#184f95">auprès de RTE, en gigawatts (GW)</text>
<text x="0" y="164" font-size="13.5" fill="#26262f">Fin 2024</text>
<rect x="0.0" y="170.0" width="47.5" height="12" fill="#184f95"/>
<text x="53.5" y="181" font-size="13.5" font-weight="600" fill="#184f95">environ 5 GW</text>
<text x="0" y="210" font-size="13.5" fill="#26262f">Novembre 2025</text>
<rect x="0.0" y="216.0" width="58.0" height="12" fill="#184f95"/>
<rect x="58.0" y="216.0" width="72.2" height="12" fill="#9db7da"/>
<rect x="130.2" y="216.0" width="1.9" height="12" fill="#8a8781"/>
<text x="138.1" y="227" font-size="13.5" font-weight="600" fill="#184f95">14 GW</text>
<text x="0" y="256" font-size="13.5" fill="#26262f">Mai 2026</text>
<rect x="0.0" y="262.0" width="171.0" height="12" fill="#184f95"/>
<text x="177.0" y="273" font-size="13.5" font-weight="600" fill="#184f95">près de 18 GW</text>
<text x="0" y="302" font-size="13.5" fill="#26262f">Déjà raccordés au réseau de RTE</text>
<text x="0" y="320" font-size="13.5" fill="#26262f">(huit sites)</text>
<rect x="0.7" y="326.7" width="6.2" height="10" fill="#ffffff" stroke="#184f95" stroke-width="1.4"/>
<text x="13.6" y="337" font-size="13.5" font-weight="600" fill="#55524f">0,8 GW</text>
<text x="0" y="364" font-size="13.5" font-weight="600" fill="#55524f">En novembre 2025 :</text>
<rect x="0" y="380" width="11" height="11" fill="#184f95"/>
<text x="16" y="390" font-size="13.5" fill="#55524f">mise en service prévue avant</text>
<text x="16" y="408" font-size="13.5" fill="#55524f">2030 : 6,1 GW</text>
<rect x="0" y="424" width="11" height="11" fill="#9db7da"/>
<text x="16" y="434" font-size="13.5" fill="#55524f">à partir de 2030 : 7,6 GW</text>
<text x="0" y="460" font-size="13.5" fill="#55524f">Suspendu (gris) : 0,2 GW ;</text>
<text x="0" y="478" font-size="13.5" fill="#55524f">abandonné depuis 2023 : environ</text>
<text x="0" y="496" font-size="13.5" fill="#55524f">0,9 GW</text>
<text x="0" y="538" font-size="13.5" font-weight="600" fill="#eb6834">Consommation d'électricité des</text>
<text x="0" y="556" font-size="13.5" font-weight="600" fill="#eb6834">data centers sur sites dédiés, en</text>
<text x="0" y="574" font-size="13.5" font-weight="600" fill="#eb6834">térawattheures par an (TWh)</text>
<text x="0" y="602" font-size="13.5" fill="#26262f">2024, mesurée (réseau de RTE)</text>
<rect x="0.0" y="608.0" width="4.3" height="12" fill="#eb6834"/>
<text x="10.3" y="619" font-size="13.5" font-weight="600" fill="#eb6834">0,8 TWh</text>
<text x="0" y="648" font-size="13.5" fill="#26262f">2025, mesurée (réseau de RTE)</text>
<rect x="0.0" y="654.0" width="5.4" height="12" fill="#eb6834"/>
<text x="11.4" y="665" font-size="13.5" font-weight="600" fill="#eb6834">près de 1 TWh</text>
<text x="0" y="694" font-size="13.5" fill="#26262f">2024, estimée par RTE</text>
<text x="0" y="712" font-size="13.5" fill="#26262f">(tous sites dédiés)</text>
<rect x="0.0" y="718.0" width="21.7" height="12" fill="#f5b89c"/>
<rect x="21.7" y="718" width="5.4" height="11" fill="#ffffff" stroke="#eb6834" stroke-width="1"/>
<text x="33.1" y="729" font-size="13.5" font-weight="600" fill="#eb6834">4 à 5 TWh</text>
<text x="0" y="758" font-size="13.5" fill="#26262f">2030, deux trajectoires de RTE</text>
<text x="0" y="776" font-size="13.5" fill="#26262f">(tous sites dédiés)</text>
<rect x="0.0" y="782.0" width="54.3" height="12" fill="#f5b89c"/>
<rect x="54.3" y="782" width="27.1" height="11" fill="#ffffff" stroke="#eb6834" stroke-width="1"/>
<text x="87.4" y="793" font-size="13.5" font-weight="600" fill="#eb6834">10 à 15 TWh</text>
<text x="0" y="822" font-size="13.5" fill="#26262f">2035, deux trajectoires de RTE</text>
<text x="0" y="840" font-size="13.5" fill="#26262f">(tous sites dédiés)</text>
<rect x="0.0" y="846.0" width="114.0" height="12" fill="#f5b89c"/>
<rect x="114.0" y="846" width="59.7" height="11" fill="#ffffff" stroke="#eb6834" stroke-width="1"/>
<text x="179.7" y="857" font-size="13.5" font-weight="600" fill="#eb6834">21 à 32 TWh</text>
<text x="0" y="882" font-size="13.5" fill="#55524f">Plein : bas de la fourchette ;</text>
<text x="0" y="900" font-size="13.5" fill="#55524f">contour : jusqu'au haut.</text>
<line x1="0" y1="916.0" x2="300" y2="916.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="937.0" font-size="13.5" fill="#55524f">RTE : Bilan prévisionnel 2025-2035</text>
<text class="pied-source" x="0" y="954.0" font-size="13.5" fill="#55524f">(déc. 2025), Bilan électrique 2025</text>
<text class="pied-source" x="0" y="971.0" font-size="13.5" fill="#55524f">(févr. 2026), page « Les data centers</text>
<text class="pied-source" x="0" y="988.0" font-size="13.5" fill="#55524f">en chiffres clés » (1er juin 2026) ;</text>
<text class="pied-source" x="0" y="1005.0" font-size="13.5" fill="#55524f">répartition de novembre 2025 mesurée</text>
<text class="pied-source" x="0" y="1022.0" font-size="13.5" fill="#55524f">sur la figure 2.3 du Bilan</text>
<text class="pied-source" x="0" y="1039.0" font-size="13.5" fill="#55524f">prévisionnel.</text>
<text class="pied-note" x="0" y="1060.0" font-size="13.5" fill="#55524f">Une puissance réservée n'est ni une</text>
<text class="pied-note" x="0" y="1077.0" font-size="13.5" fill="#55524f">puissance appelée ni une</text>
<text class="pied-note" x="0" y="1094.0" font-size="13.5" fill="#55524f">consommation : les deux panneaux ne se</text>
<text class="pied-note" x="0" y="1111.0" font-size="13.5" fill="#55524f">comparent pas, aucun rapport n'est</text>
<text class="pied-note" x="0" y="1128.0" font-size="13.5" fill="#55524f">calculé entre eux. Trajectoires :</text>
<text class="pied-note" x="0" y="1145.0" font-size="13.5" fill="#55524f">hypothèses de RTE, non des mesures.</text>
