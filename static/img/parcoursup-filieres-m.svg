<text class="pied-source" x="0" y="767.0" font-size="13.5" fill="#55524f">Ministère chargé de l'enseignement</text>
<text class="pied-source" x="0" y="784.0" font-size="13.5" fill="#55524f">supérieur, données ouvertes</text>
<text class="pied-source" x="0" y="801.0" font-size="13.5" fill="#55524f">Parcoursup, sessions 2023 à 2025</text>
<text class="pied-note" x="0" y="822.0" font-size="13.5" fill="#55524f">Lecture : −11 points signifie que la</text>
<text class="pied-note" x="0" y="839.0" font-size="13.5" fill="#55524f">moitié des classes préparatoires ont</text>
<text class="pied-note" x="0" y="856.0" font-size="13.5" fill="#55524f">perdu 11 points de taux d'accès ou</text>
<text class="pied-note" x="0" y="873.0" font-size="13.5" fill="#55524f">plus (par exemple, de 45 % à 34 %).</text>
<text class="pied-note" x="0" y="890.0" font-size="13.5" fill="#55524f">Une médiane nulle ne veut pas dire que</text>
<text class="pied-note" x="0" y="907.0" font-size="13.5" fill="#55524f">chaque formation est restée stable.</text>
<text class="pied-note" x="0" y="924.0" font-size="13.5" fill="#55524f">Les deux points d'une filière ne</text>
<text class="pied-note" x="0" y="941.0" font-size="13.5" fill="#55524f">portent pas tout à fait sur les mêmes</text>
<text class="pied-note" x="0" y="958.0" font-size="13.5" fill="#55524f">formations ; les 172 que le ministère</text>
<text class="pied-note" x="0" y="975.0" font-size="13.5" fill="#55524f">a classées dans une autre filière ne</text>
<text class="pied-note" x="0" y="992.0" font-size="13.5" fill="#55524f">sont pas dessinées. Ces données ne</text>
<text class="pied-note" x="0" y="1009.0" font-size="13.5" fill="#55524f">disent ni la cause d'une baisse, ni si</text>
<text class="pied-note" x="0" y="1026.0" font-size="13.5" fill="#55524f">elle se reproduira, ni les chances</text>
<text class="pied-note" x="0" y="1043.0" font-size="13.5" fill="#55524f">d'un candidat.</text>
