<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1091" role="img" font-variant-numeric="tabular-nums" aria-labelledby="psup-fm-t psup-fm-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="psup-fm-t">Variation médiane du taux d'accès selon la filière</title><desc id="psup-fm-d">Variation médiane du taux d'accès par filière, en points de pourcentage, de 2023 à 2024 puis de 2024 à 2025. Classes préparatoires : −2 de 2023 à 2024 (963 formations), −11 de 2024 à 2025 (974 formations). BTS : +1 de 2023 à 2024 (4 986 formations), −3 de 2024 à 2025 (4 799 formations). BUT : −1 de 2023 à 2024 (565 formations), −2 de 2024 à 2025 (813 formations). Licences accès santé (L.AS) : −3 de 2023 à 2024 (442 formations), −2 de 2024 à 2025 (481 formations). Soins infirmiers (IFSI) : +1 de 2023 à 2024 (340 formations), −2 de 2024 à 2025 (342 formations). Autres formations : 0 de 2023 à 2024 (1 002 formations), −1 de 2024 à 2025 (1 369 formations). Parcours accès santé (PASS) : −2 de 2023 à 2024 (268 formations), −1 de 2024 à 2025 (272 formations). Travail social (EFTS) : 0 de 2023 à 2024 (226 formations), −1 de 2024 à 2025 (227 formations). Licences (hors accès santé) : 0 de 2023 à 2024 (2 510 formations), 0 de 2024 à 2025 (2 718 formations). Écoles d'ingénieurs : +1 de 2023 à 2024 (424 formations), 0 de 2024 à 2025 (462 formations). Écoles de commerce : −1 de 2023 à 2024 (176 formations), 0 de 2024 à 2025 (187 formations). Ne sont pas dessinées les formations que le ministère a changé de filière d'une session à l'autre : 163 de 2023 à 2024, 172 de 2024 à 2025.</desc>
