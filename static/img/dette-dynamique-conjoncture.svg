<text class="pied-source" x="0" y="309.0" font-size="11" fill="#55524f">FMI, Moniteur des finances publiques d’octobre 2026 ; Commission européenne, AMECO, printemps 2026 ; OCDE,</text>
<text class="pied-source" x="0" y="323.0" font-size="11" fill="#55524f">Perspectives économiques n° 119 ; Eurostat gov_10a_main, mise à jour du 21/07/2026</text>
<text class="pied-note" x="0" y="337.0" font-size="11" fill="#55524f">Trois méthodes : la Commission et l'OCDE retirent aussi les mesures ponctuelles, le FMI non. Estimations de la</text>
