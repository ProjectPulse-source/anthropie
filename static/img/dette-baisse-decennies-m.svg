<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 733" role="img" font-variant-numeric="tabular-nums" aria-labelledby="bd-m-t bd-m-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="bd-m-t">France : ce qui a fait monter ou baisser le poids de la dette, décennie par décennie</title><desc id="bd-m-d">Pour chaque décennie, en points de PIB cumulés sur dix ans : effet des taux et de la croissance, contribution du solde primaire, autres ajustements, et leur somme, la variation du ratio de dette. 1996-2005 : +8,4, −2,5, +4,4 ; variation +10,4. 2006-2015 : +7,8, +22,4, −1,5 ; variation +28,8. 2016-2025 : −15,1, +30,6, +3,1 ; variation +18,6. Sur la dernière décennie, l'effet des taux et de la croissance fait baisser le ratio et les déficits primaires le font monter davantage.</desc>
<rect width="300" height="733" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">France : ce qui a fait monter</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">ou baisser le poids de la</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#26262f">dette, décennie par décennie</text>
<rect x="0" y="96.0" width="11" height="11" fill="#eb6834"/>
<text x="17" y="106.0" font-size="13.5" fill="#55524f">fait monter le ratio</text>
<rect x="0" y="116.0" width="11" height="11" fill="#8a8781"/>
<text x="17" y="126.0" font-size="13.5" fill="#55524f">le fait baisser</text>
<text x="0" y="145.0" font-size="13.5" fill="#96928f">En points de PIB cumulés sur dix ans</text>
<line x1="0" y1="157.0" x2="300" y2="157.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="0" y="179.0" font-size="15" font-weight="600" fill="#26262f">1996-2005 : +10,4 points</text>
<text x="0" y="197.0" font-size="13.5" fill="#184f95">57,8 → 68,2 % du PIB</text>
<line x1="192.0" y1="205.0" x2="192.0" y2="265.0" stroke="#8f8a84" stroke-width="1.2"/>
<text x="0" y="218.0" font-size="13.5" fill="#55524f">Taux et croissance</text>
<rect x="192.0" y="207.0" width="21.9" height="14" fill="#eb6834"/>
<text x="217.9" y="218.0" font-size="13.5" fill="#26262f" text-anchor="start">+8,4</text>
<text x="0" y="239.0" font-size="13.5" fill="#55524f">Solde primaire</text>
<rect x="185.6" y="228.0" width="6.4" height="14" fill="#8a8781"/>
<text x="181.6" y="239.0" font-size="13.5" fill="#26262f" text-anchor="end">−2,5</text>
<text x="0" y="260.0" font-size="13.5" fill="#55524f">Autres ajustements</text>
<rect x="192.0" y="249.0" width="11.4" height="14" fill="#eb6834"/>
<text x="207.4" y="260.0" font-size="13.5" fill="#26262f" text-anchor="start">+4,4</text>
<line x1="0" y1="280.0" x2="300" y2="280.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="0" y="302.0" font-size="15" font-weight="600" fill="#26262f">2006-2015 : +28,8 points</text>
<text x="0" y="320.0" font-size="13.5" fill="#184f95">68,2 → 97,0 % du PIB</text>
<line x1="192.0" y1="328.0" x2="192.0" y2="388.0" stroke="#8f8a84" stroke-width="1.2"/>
<text x="0" y="341.0" font-size="13.5" fill="#55524f">Taux et croissance</text>
<rect x="192.0" y="330.0" width="20.4" height="14" fill="#eb6834"/>
<text x="216.4" y="341.0" font-size="13.5" fill="#26262f" text-anchor="start">+7,8</text>
<text x="0" y="362.0" font-size="13.5" fill="#55524f">Solde primaire</text>
<rect x="192.0" y="351.0" width="58.2" height="14" fill="#eb6834"/>
<text x="254.2" y="362.0" font-size="13.5" fill="#26262f" text-anchor="start">+22,4</text>
<text x="0" y="383.0" font-size="13.5" fill="#55524f">Autres ajustements</text>
<rect x="188.2" y="372.0" width="3.8" height="14" fill="#8a8781"/>
<text x="184.2" y="383.0" font-size="13.5" fill="#26262f" text-anchor="end">−1,5</text>
<line x1="0" y1="403.0" x2="300" y2="403.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="0" y="425.0" font-size="15" font-weight="600" fill="#26262f">2016-2025 : +18,6 points</text>
<text x="0" y="443.0" font-size="13.5" fill="#184f95">97,0 → 115,6 % du PIB</text>
<line x1="192.0" y1="451.0" x2="192.0" y2="511.0" stroke="#8f8a84" stroke-width="1.2"/>
<text x="0" y="464.0" font-size="13.5" fill="#55524f">Taux et croissance</text>
<rect x="152.7" y="453.0" width="39.3" height="14" fill="#8a8781"/>
<text x="196.0" y="464.0" font-size="13.5" fill="#26262f" text-anchor="start">−15,1</text>
<text x="0" y="485.0" font-size="13.5" fill="#55524f">Solde primaire</text>
<rect x="192.0" y="474.0" width="79.5" height="14" fill="#eb6834"/>
<text x="188.0" y="485.0" font-size="13.5" fill="#26262f" text-anchor="end">+30,6</text>
<text x="0" y="506.0" font-size="13.5" fill="#55524f">Autres ajustements</text>
<rect x="192.0" y="495.0" width="8.0" height="14" fill="#eb6834"/>
<text x="204.0" y="506.0" font-size="13.5" fill="#26262f" text-anchor="start">+3,1</text>
<line x1="0" y1="524.0" x2="300" y2="524.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="545.0" font-size="13.5" fill="#55524f">Eurostat gov_10dd_edpt1 (dette, PIB),</text>
<text class="pied-source" x="0" y="562.0" font-size="13.5" fill="#55524f">gov_10a_main (B9, D41PAY), France,</text>
<text class="pied-source" x="0" y="579.0" font-size="13.5" fill="#55524f">1996-2025</text>
<text class="pied-note" x="0" y="600.0" font-size="13.5" fill="#55524f">Décomposition comptable, non causale :</text>
<text class="pied-note" x="0" y="617.0" font-size="13.5" fill="#55524f">les trois termes ne sont pas</text>
<text class="pied-note" x="0" y="634.0" font-size="13.5" fill="#55524f">indépendants. Variation calculée sur</text>
<text class="pied-note" x="0" y="651.0" font-size="13.5" fill="#55524f">les valeurs non arrondies ; la somme</text>
<text class="pied-note" x="0" y="668.0" font-size="13.5" fill="#55524f">des contributions affichées peut</text>
<text class="pied-note" x="0" y="685.0" font-size="13.5" fill="#55524f">différer de 0,1 point.</text>
<text class="pied-licence" x="0" y="706.0" font-size="13.5" fill="#96928f">Compilation Stéphane Lalut, CC BY 4.0</text>
<text class="pied-licence" x="0" y="723.0" font-size="13.5" fill="#96928f">· stephane-lalut.com</text>
</svg>
