<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 629" role="img" font-variant-numeric="tabular-nums" aria-labelledby="psup-t-t psup-t-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="psup-t-t">Comment les taux d'accès évoluent-ils d'une année sur l'autre ?</title><desc id="psup-t-d">Pour chaque tranche de taux d'accès une année, intervalle du 1er au 9e décile et médiane du taux d'accès des mêmes formations l'année suivante : de 2024 à 2025, puis de 2023 à 2024 (autres formations, autres effectifs). 100 % en 2024 (1 093 formations) : en 2025, de 80 à 100 %, médiane 100 %. 100 % en 2023 (962 formations) : en 2024, de 91 à 100 %, médiane 100 %. 90 à 99 % en 2024 (1 695 formations) : en 2025, de 59 à 100 %, médiane 91 %. 90 à 99 % en 2023 (1 701 formations) : en 2024, de 76 à 100 %, médiane 94 %. 75 à 89 % en 2024 (1 860 formations) : en 2025, de 49 à 92 %, médiane 74 %. 75 à 89 % en 2023 (1 779 formations) : en 2024, de 58 à 95 %, médiane 81 %. 60 à 74 % en 2024 (1 771 formations) : en 2025, de 43 à 83 %, médiane 63 %. 60 à 74 % en 2023 (1 657 formations) : en 2024, de 48 à 85 %, médiane 66 %. 40 à 59 % en 2024 (2 707 formations) : en 2025, de 32 à 67 %, médiane 47 %. 40 à 59 % en 2023 (2 588 formations) : en 2024, de 34 à 70 %, médiane 50 %. 20 à 39 % en 2024 (2 451 formations) : en 2025, de 17 à 45 %, médiane 29 %. 20 à 39 % en 2023 (2 262 formations) : en 2024, de 19 à 48 %, médiane 31 %. Moins de 20 % en 2024 (1 239 formations) : en 2025, de 5 à 22 %, médiane 12 %. Moins de 20 % en 2023 (1 116 formations) : en 2024, de 5 à 24 %, médiane 13 %.</desc>
<rect width="720" height="629" fill="#ffffff"/>
<text x="0" y="18" font-size="14" font-weight="600" fill="#26262f">Comment les taux d'accès évoluent-ils d'une année sur l'autre ?</text>
<text x="0" y="37" font-size="11" fill="#55524f">Taux d'accès l'année suivante, selon le taux de l'année de départ, toutes filières confondues</text>
