<text x="26.0" y="60.0" font-size="10.5" fill="#55524f">de 2024 à 2025 : la barre contient au moins huit formations sur dix (du 1er au 9e décile) ; le point est la médiane</text>
<rect x="0.0" y="72.0" width="20" height="4" fill="#8a8781"/>
<circle cx="10.0" cy="74.0" r="3" fill="#8a8781" stroke="#ffffff" stroke-width="1.2"/>
<text x="26.0" y="78.0" font-size="10.5" fill="#55524f">de 2023 à 2024 : même mesure un an plus tôt (autres effectifs)</text>
