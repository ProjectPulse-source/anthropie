<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 731" role="img" font-variant-numeric="tabular-nums" aria-labelledby="impm-t impm-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="impm-t">Facing an unexpected expense: income is not the whole story (France, 2025)</title><desc id="impm-d">Share of people who could not face an unexpected expense, by the type of household they live in, France, 2025. Above the poverty threshold: couple without children 14.0%, single adult 23.4%, couple with one child 18.6%, single parent 46.9%. Below the threshold: couple without children 50.1%, single adult 58.4%, couple with one child 71.9%, single parent 77.0%.</desc>
