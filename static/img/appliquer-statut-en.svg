<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 411" role="img" font-variant-numeric="tabular-nums" aria-labelledby="at-t at-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="at-t">Are the laws promulgated in France since 2017 still waiting for a measure?</title><desc id="at-d">Horizontal bars, one per session from 2017-2018 to 2024-2025, laws promulgated excluding treaties, by status at 5 October 2026: 2017-2018: 41 laws, 8 with at least one measure pending, 21 with all measures taken, 12 with no measure to take; 2018-2019: 49 laws, 13 with at least one measure pending, 11 with all measures taken, 25 with no measure to take; 2019-2020: 43 laws, 13 with at least one measure pending, 14 with all measures taken, 16 with no measure to take; 2020-2021: 51 laws, 21 with at least one measure pending, 11 with all measures taken, 19 with no measure to take; 2021-2022: 64 laws, 18 with at least one measure pending, 25 with all measures taken, 21 with no measure to take; 2022-2023: 44 laws, 15 with at least one measure pending, 19 with all measures taken, 10 with no measure to take; 2023-2024: 51 laws, 21 with at least one measure pending, 9 with all measures taken, 21 with no measure to take; 2024-2025: 56 laws, 21 with at least one measure pending, 14 with all measures taken, 20 with no measure to take, 1 with no schedule. The values are in the table below the figure.</desc>
