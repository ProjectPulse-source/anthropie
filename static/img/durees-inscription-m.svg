<line x1="290.0" y1="207.0" x2="290.0" y2="215.0" stroke="#c9c6bd"/>
<circle cx="10.0" cy="211.0" r="5.0" fill="#184f95"/>
<text x="0" y="243.0" font-size="13.5" font-weight="600" fill="#1a1a1f">Permis : tous les points</text>
<text x="0" y="260.0" font-size="13.5" fill="#45423e">2 ans sans infraction ; 3 ans après un</text>
<text x="0" y="277.0" font-size="13.5" fill="#45423e">délit ou une contravention de 4e ou 5e</text>
<text x="0" y="294.0" font-size="13.5" fill="#45423e">classe</text>
<line x1="4" y1="310.0" x2="296" y2="310.0" stroke="#e6e3dc"/>
<line x1="10.0" y1="306.0" x2="10.0" y2="314.0" stroke="#c9c6bd"/>
