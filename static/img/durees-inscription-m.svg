<line x1="290.0" y1="1201.0" x2="290.0" y2="1209.0" stroke="#c9c6bd"/>
<circle cx="124.5" cy="1205.0" r="5.0" fill="#184f95"/>
<circle cx="142.9" cy="1205.0" r="5.0" fill="#184f95"/>
<circle cx="290.0" cy="1205.0" r="5.0" fill="#184f95"/>
<line x1="10.0" y1="1221.0" x2="10.0" y2="1227.0" stroke="#55524f"/>
<text x="0.0" y="1242.0" font-size="13.5" fill="#55524f" text-anchor="start">6 mois</text>
<line x1="98.6" y1="1221.0" x2="98.6" y2="1227.0" stroke="#55524f"/>
<text x="98.6" y="1242.0" font-size="13.5" fill="#55524f" text-anchor="middle">2 ans</text>
<line x1="157.1" y1="1221.0" x2="157.1" y2="1227.0" stroke="#55524f"/>
<text x="157.1" y="1242.0" font-size="13.5" fill="#55524f" text-anchor="middle">5 ans</text>
<line x1="201.4" y1="1221.0" x2="201.4" y2="1227.0" stroke="#55524f"/>
<text x="201.4" y="1242.0" font-size="13.5" fill="#55524f" text-anchor="middle">10 ans</text>
<line x1="290.0" y1="1221.0" x2="290.0" y2="1227.0" stroke="#55524f"/>
<text x="300.0" y="1242.0" font-size="13.5" fill="#55524f" text-anchor="end">40 ans</text>
<line x1="0" y1="1257.0" x2="300" y2="1257.0" stroke="#c9c6bd"/>
<text class="pied-source" x="0" y="1278.0" font-size="13.5" fill="#55524f">Source : tableau de la page, établi</text>
<text class="pied-source" x="0" y="1295.0" font-size="13.5" fill="#55524f">d'après les textes qu'elle cite (code</text>
<text class="pied-source" x="0" y="1312.0" font-size="13.5" fill="#55524f">monétaire et financier, code de la</text>
<text class="pied-source" x="0" y="1329.0" font-size="13.5" fill="#55524f">consommation, code pénal et code de</text>
<text class="pied-source" x="0" y="1346.0" font-size="13.5" fill="#55524f">procédure pénale, code de la route,</text>
<text class="pied-source" x="0" y="1363.0" font-size="13.5" fill="#55524f">code des assurances, code de la santé</text>
<text class="pied-source" x="0" y="1380.0" font-size="13.5" fill="#55524f">publique, convention AERAS).</text>
<text class="pied-note" x="0" y="1401.0" font-size="13.5" fill="#55524f">Échelle logarithmique. Point plein :</text>
<text class="pied-note" x="0" y="1418.0" font-size="13.5" fill="#55524f">délai ; point creux : délai du</text>
<text class="pied-note" x="0" y="1435.0" font-size="13.5" fill="#55524f">bulletin n° 2 doublé en récidive.</text>
<text class="pied-note" x="0" y="1452.0" font-size="13.5" fill="#55524f">Chaque délai vaut dans les conditions</text>
<text class="pied-note" x="0" y="1469.0" font-size="13.5" fill="#55524f">du tableau, et ne court pas du même</text>
<text class="pied-note" x="0" y="1486.0" font-size="13.5" fill="#55524f">point de départ. Certains s'abrègent :</text>
<text class="pied-note" x="0" y="1503.0" font-size="13.5" fill="#55524f">démarche de la personne (stage de</text>
<text class="pied-note" x="0" y="1520.0" font-size="13.5" fill="#55524f">récupération de points, une fois par</text>
<text class="pied-note" x="0" y="1537.0" font-size="13.5" fill="#55524f">an ; régularisation d'un chèque ;</text>
<text class="pied-note" x="0" y="1554.0" font-size="13.5" fill="#55524f">requête en exclusion du bulletin n° 2,</text>
<text class="pied-note" x="0" y="1571.0" font-size="13.5" fill="#55524f">sauf exceptions), déclaration d'un</text>
<text class="pied-note" x="0" y="1588.0" font-size="13.5" fill="#55524f">tiers (paiement déclaré par</text>
<text class="pied-note" x="0" y="1605.0" font-size="13.5" fill="#55524f">l'établissement), délais plus courts</text>
<text class="pied-note" x="0" y="1622.0" font-size="13.5" fill="#55524f">que la convention AERAS peut fixer</text>
<text class="pied-note" x="0" y="1639.0" font-size="13.5" fill="#55524f">pour certaines pathologies. Les effets</text>
<text class="pied-note" x="0" y="1656.0" font-size="13.5" fill="#55524f">de la réhabilitation sont reportés en</text>
<text class="pied-note" x="0" y="1673.0" font-size="13.5" fill="#55524f">cas d'interdiction définitive, de</text>
<text class="pied-note" x="0" y="1690.0" font-size="13.5" fill="#55524f">suivi socio-judiciaire ou</text>
<text class="pied-note" x="0" y="1707.0" font-size="13.5" fill="#55524f">d'interdiction d'activité au contact</text>
<text class="pied-note" x="0" y="1724.0" font-size="13.5" fill="#55524f">de mineurs.</text>
