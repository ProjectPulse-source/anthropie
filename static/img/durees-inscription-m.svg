<line x1="10.0" y1="536.0" x2="10.0" y2="544.0" stroke="#c9c6bd"/>
<line x1="98.6" y1="536.0" x2="98.6" y2="544.0" stroke="#c9c6bd"/>
<line x1="157.1" y1="536.0" x2="157.1" y2="544.0" stroke="#c9c6bd"/>
<line x1="201.4" y1="536.0" x2="201.4" y2="544.0" stroke="#c9c6bd"/>
<line x1="290.0" y1="536.0" x2="290.0" y2="544.0" stroke="#c9c6bd"/>
<circle cx="157.1" cy="540.0" r="5.0" fill="#184f95"/>
