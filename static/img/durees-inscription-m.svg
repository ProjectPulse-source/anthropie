<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1772" role="img" font-variant-numeric="tabular-nums" aria-labelledby="durees-inscription-m-t durees-inscription-m-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="durees-inscription-m-t">Combien de temps une trace reste inscrite : de six mois à quarante ans</title><desc id="durees-inscription-m-d">Frise des durées d'inscription sur une échelle logarithmique de six mois à quarante ans. Permis : un point, 6 mois pour un point seul, sans nouveau retrait de points ; Permis : tous les points, 2 ans sans infraction entraînant un retrait de points ; 3 ans après un délit ou une contravention de 4ᵉ ou 5ᵉ classe ; hors permis probatoire ; Malus d'assurance auto, coefficient ramené à 1 au plus après 2 années consécutives sans sinistre ; Incident de crédit (FICP), 5 ans ; Interdiction d'émettre des chèques, 5 ans ; Prêt : cancer ou hépatite C, 5 ans après la fin du protocole thérapeutique, sans rechute ; prêts couverts par la convention AERAS, assurance prenant fin avant 71 ans ; Surendettement (FICP), la durée du plan ou des mesures, 7 ans au plus ; 5 ans si le plan est exécuté sans incident, après un rétablissement personnel ou une liquidation judiciaire ; Casier, bulletin n° 2 (réhabilitation), 3 ans (amende ou jours-amende), 5 ans (emprisonnement d'un an au plus ou autre peine non privative de liberté), 10 ans (emprisonnement de 10 ans au plus, ou plusieurs totalisant 5 ans au plus), sans nouvelle condamnation criminelle ou correctionnelle ; doublés en récidive légale (points creux) ; Casier, bulletin n° 1, 40 ans sans nouvelle condamnation criminelle ou correctionnelle, hors faits imprescriptibles et condamnations étrangères ; 3 ans pour une contravention ou une composition pénale, 4 pour une contravention dont la récidive constitue un délit.</desc>
<rect width="300" height="1772" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#1a1a1f">Combien de temps une trace</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#1a1a1f">reste inscrite : de six mois à</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#1a1a1f">quarante ans</text>
<text x="0" y="104.0" font-size="13.5" fill="#55524f">Même échelle logarithmique partout :</text>
<line x1="10.0" y1="114.0" x2="10.0" y2="120.0" stroke="#55524f"/>
<text x="0.0" y="135.0" font-size="13.5" fill="#55524f" text-anchor="start">6 mois</text>
<line x1="98.6" y1="114.0" x2="98.6" y2="120.0" stroke="#55524f"/>
<text x="98.6" y="135.0" font-size="13.5" fill="#55524f" text-anchor="middle">2 ans</text>
<line x1="157.1" y1="114.0" x2="157.1" y2="120.0" stroke="#55524f"/>
<text x="157.1" y="135.0" font-size="13.5" fill="#55524f" text-anchor="middle">5 ans</text>
<line x1="201.4" y1="114.0" x2="201.4" y2="120.0" stroke="#55524f"/>
<text x="201.4" y="135.0" font-size="13.5" fill="#55524f" text-anchor="middle">10 ans</text>
<line x1="290.0" y1="114.0" x2="290.0" y2="120.0" stroke="#55524f"/>
<text x="300.0" y="135.0" font-size="13.5" fill="#55524f" text-anchor="end">40 ans</text>
<text x="0" y="160.0" font-size="13.5" font-weight="600" fill="#1a1a1f">Permis : un point</text>
<text x="0" y="177.0" font-size="13.5" fill="#45423e">6 mois pour un point seul, sans</text>
<text x="0" y="194.0" font-size="13.5" fill="#45423e">nouveau retrait de points</text>
<line x1="4" y1="210.0" x2="296" y2="210.0" stroke="#e6e3dc"/>
<line x1="10.0" y1="206.0" x2="10.0" y2="214.0" stroke="#c9c6bd"/>
<line x1="98.6" y1="206.0" x2="98.6" y2="214.0" stroke="#c9c6bd"/>
<line x1="157.1" y1="206.0" x2="157.1" y2="214.0" stroke="#c9c6bd"/>
<line x1="201.4" y1="206.0" x2="201.4" y2="214.0" stroke="#c9c6bd"/>
<line x1="290.0" y1="206.0" x2="290.0" y2="214.0" stroke="#c9c6bd"/>
<circle cx="10.0" cy="210.0" r="5.0" fill="#184f95"/>
<text x="0" y="242.0" font-size="13.5" font-weight="600" fill="#1a1a1f">Permis : tous les points</text>
<text x="0" y="259.0" font-size="13.5" fill="#45423e">2 ans sans infraction entraînant un</text>
<text x="0" y="276.0" font-size="13.5" fill="#45423e">retrait de points ; 3 ans après</text>
<text x="0" y="293.0" font-size="13.5" fill="#45423e">un délit ou une contravention de 4ᵉ ou</text>
<text x="0" y="310.0" font-size="13.5" fill="#45423e">5ᵉ classe ; hors permis probatoire</text>
<line x1="4" y1="326.0" x2="296" y2="326.0" stroke="#e6e3dc"/>
<line x1="10.0" y1="322.0" x2="10.0" y2="330.0" stroke="#c9c6bd"/>
<line x1="98.6" y1="322.0" x2="98.6" y2="330.0" stroke="#c9c6bd"/>
<line x1="157.1" y1="322.0" x2="157.1" y2="330.0" stroke="#c9c6bd"/>
<line x1="201.4" y1="322.0" x2="201.4" y2="330.0" stroke="#c9c6bd"/>
<line x1="290.0" y1="322.0" x2="290.0" y2="330.0" stroke="#c9c6bd"/>
<circle cx="98.6" cy="326.0" r="5.0" fill="#184f95"/>
<circle cx="124.5" cy="326.0" r="5.0" fill="#184f95"/>
<text x="0" y="358.0" font-size="13.5" font-weight="600" fill="#1a1a1f">Malus d'assurance auto</text>
<text x="0" y="375.0" font-size="13.5" fill="#45423e">coefficient ramené à 1 au plus après</text>
<text x="0" y="392.0" font-size="13.5" fill="#45423e">2 années consécutives sans sinistre</text>
<line x1="4" y1="408.0" x2="296" y2="408.0" stroke="#e6e3dc"/>
<line x1="10.0" y1="404.0" x2="10.0" y2="412.0" stroke="#c9c6bd"/>
<line x1="98.6" y1="404.0" x2="98.6" y2="412.0" stroke="#c9c6bd"/>
<line x1="157.1" y1="404.0" x2="157.1" y2="412.0" stroke="#c9c6bd"/>
<line x1="201.4" y1="404.0" x2="201.4" y2="412.0" stroke="#c9c6bd"/>
<line x1="290.0" y1="404.0" x2="290.0" y2="412.0" stroke="#c9c6bd"/>
<circle cx="98.6" cy="408.0" r="5.0" fill="#184f95"/>
<text x="0" y="440.0" font-size="13.5" font-weight="600" fill="#1a1a1f">Incident de crédit (FICP)</text>
<text x="0" y="457.0" font-size="13.5" fill="#45423e">5 ans</text>
<line x1="4" y1="473.0" x2="296" y2="473.0" stroke="#e6e3dc"/>
<line x1="10.0" y1="469.0" x2="10.0" y2="477.0" stroke="#c9c6bd"/>
<line x1="98.6" y1="469.0" x2="98.6" y2="477.0" stroke="#c9c6bd"/>
<line x1="157.1" y1="469.0" x2="157.1" y2="477.0" stroke="#c9c6bd"/>
<line x1="201.4" y1="469.0" x2="201.4" y2="477.0" stroke="#c9c6bd"/>
<line x1="290.0" y1="469.0" x2="290.0" y2="477.0" stroke="#c9c6bd"/>
<circle cx="157.1" cy="473.0" r="5.0" fill="#184f95"/>
<text x="0" y="505.0" font-size="13.5" font-weight="600" fill="#1a1a1f">Interdiction d'émettre des</text>
<text x="0" y="523.0" font-size="13.5" font-weight="600" fill="#1a1a1f">chèques</text>
<text x="0" y="540.0" font-size="13.5" fill="#45423e">5 ans</text>
<line x1="4" y1="556.0" x2="296" y2="556.0" stroke="#e6e3dc"/>
<line x1="10.0" y1="552.0" x2="10.0" y2="560.0" stroke="#c9c6bd"/>
<line x1="98.6" y1="552.0" x2="98.6" y2="560.0" stroke="#c9c6bd"/>
<line x1="157.1" y1="552.0" x2="157.1" y2="560.0" stroke="#c9c6bd"/>
<line x1="201.4" y1="552.0" x2="201.4" y2="560.0" stroke="#c9c6bd"/>
<line x1="290.0" y1="552.0" x2="290.0" y2="560.0" stroke="#c9c6bd"/>
<circle cx="157.1" cy="556.0" r="5.0" fill="#184f95"/>
<text x="0" y="588.0" font-size="13.5" font-weight="600" fill="#1a1a1f">Prêt : cancer ou hépatite C</text>
<text x="0" y="605.0" font-size="13.5" fill="#45423e">5 ans après la fin du protocole</text>
<text x="0" y="622.0" font-size="13.5" fill="#45423e">thérapeutique, sans rechute ; prêts</text>
<text x="0" y="639.0" font-size="13.5" fill="#45423e">couverts par la convention AERAS,</text>
<text x="0" y="656.0" font-size="13.5" fill="#45423e">assurance prenant fin avant 71 ans</text>
<line x1="4" y1="672.0" x2="296" y2="672.0" stroke="#e6e3dc"/>
<line x1="10.0" y1="668.0" x2="10.0" y2="676.0" stroke="#c9c6bd"/>
<line x1="98.6" y1="668.0" x2="98.6" y2="676.0" stroke="#c9c6bd"/>
<line x1="157.1" y1="668.0" x2="157.1" y2="676.0" stroke="#c9c6bd"/>
<line x1="201.4" y1="668.0" x2="201.4" y2="676.0" stroke="#c9c6bd"/>
<line x1="290.0" y1="668.0" x2="290.0" y2="676.0" stroke="#c9c6bd"/>
<circle cx="157.1" cy="672.0" r="5.0" fill="#184f95"/>
<text x="0" y="704.0" font-size="13.5" font-weight="600" fill="#1a1a1f">Surendettement (FICP)</text>
<text x="0" y="721.0" font-size="13.5" fill="#45423e">la durée du plan ou des mesures,</text>
<text x="0" y="738.0" font-size="13.5" fill="#45423e">7 ans au plus ; 5 ans si le plan est</text>
<text x="0" y="755.0" font-size="13.5" fill="#45423e">exécuté sans incident, après un</text>
<text x="0" y="772.0" font-size="13.5" fill="#45423e">rétablissement personnel ou une</text>
<text x="0" y="789.0" font-size="13.5" fill="#45423e">liquidation judiciaire</text>
<line x1="4" y1="805.0" x2="296" y2="805.0" stroke="#e6e3dc"/>
<line x1="10.0" y1="801.0" x2="10.0" y2="809.0" stroke="#c9c6bd"/>
<line x1="98.6" y1="801.0" x2="98.6" y2="809.0" stroke="#c9c6bd"/>
<line x1="157.1" y1="801.0" x2="157.1" y2="809.0" stroke="#c9c6bd"/>
<line x1="201.4" y1="801.0" x2="201.4" y2="809.0" stroke="#c9c6bd"/>
<line x1="290.0" y1="801.0" x2="290.0" y2="809.0" stroke="#c9c6bd"/>
<circle cx="157.1" cy="805.0" r="5.0" fill="#184f95"/>
<circle cx="178.6" cy="805.0" r="5.0" fill="#184f95"/>
<text x="0" y="837.0" font-size="13.5" font-weight="600" fill="#1a1a1f">Casier, bulletin n° 2</text>
<text x="0" y="855.0" font-size="13.5" font-weight="600" fill="#1a1a1f">(réhabilitation)</text>
<text x="0" y="872.0" font-size="13.5" fill="#45423e">3 ans (amende ou jours-amende), 5 ans</text>
<text x="0" y="889.0" font-size="13.5" fill="#45423e">(emprisonnement d'un an au plus ou</text>
<text x="0" y="906.0" font-size="13.5" fill="#45423e">autre peine non privative de liberté),</text>
<text x="0" y="923.0" font-size="13.5" fill="#45423e">10 ans (emprisonnement de</text>
<text x="0" y="940.0" font-size="13.5" fill="#45423e">10 ans au plus, ou plusieurs</text>
<text x="0" y="957.0" font-size="13.5" fill="#45423e">totalisant 5 ans au plus), sans</text>
<text x="0" y="974.0" font-size="13.5" fill="#45423e">nouvelle condamnation criminelle ou</text>
<text x="0" y="991.0" font-size="13.5" fill="#45423e">correctionnelle ; doublés en récidive</text>
<text x="0" y="1008.0" font-size="13.5" fill="#45423e">légale (points creux)</text>
<line x1="4" y1="1024.0" x2="296" y2="1024.0" stroke="#e6e3dc"/>
<line x1="10.0" y1="1020.0" x2="10.0" y2="1028.0" stroke="#c9c6bd"/>
<line x1="98.6" y1="1020.0" x2="98.6" y2="1028.0" stroke="#c9c6bd"/>
<line x1="157.1" y1="1020.0" x2="157.1" y2="1028.0" stroke="#c9c6bd"/>
<line x1="201.4" y1="1020.0" x2="201.4" y2="1028.0" stroke="#c9c6bd"/>
<line x1="290.0" y1="1020.0" x2="290.0" y2="1028.0" stroke="#c9c6bd"/>
<circle cx="124.5" cy="1024.0" r="5.0" fill="#184f95"/>
<circle cx="157.1" cy="1024.0" r="5.0" fill="#184f95"/>
<circle cx="201.4" cy="1024.0" r="5.0" fill="#184f95"/>
<circle cx="168.8" cy="1038.0" r="4.5" fill="#ffffff" stroke="#184f95" stroke-width="1.6"/>
<circle cx="201.4" cy="1038.0" r="4.5" fill="#ffffff" stroke="#184f95" stroke-width="1.6"/>
<circle cx="245.7" cy="1038.0" r="4.5" fill="#ffffff" stroke="#184f95" stroke-width="1.6"/>
<text x="0" y="1070.0" font-size="13.5" font-weight="600" fill="#1a1a1f">Casier, bulletin n° 1</text>
<text x="0" y="1087.0" font-size="13.5" fill="#45423e">40 ans sans nouvelle condamnation</text>
<text x="0" y="1104.0" font-size="13.5" fill="#45423e">criminelle ou correctionnelle, hors</text>
<text x="0" y="1121.0" font-size="13.5" fill="#45423e">faits imprescriptibles et</text>
<text x="0" y="1138.0" font-size="13.5" fill="#45423e">condamnations étrangères ; 3 ans pour</text>
<text x="0" y="1155.0" font-size="13.5" fill="#45423e">une contravention ou une composition</text>
<text x="0" y="1172.0" font-size="13.5" fill="#45423e">pénale, 4 pour une contravention dont</text>
<text x="0" y="1189.0" font-size="13.5" fill="#45423e">la récidive constitue un délit</text>
<line x1="4" y1="1205.0" x2="296" y2="1205.0" stroke="#e6e3dc"/>
<line x1="10.0" y1="1201.0" x2="10.0" y2="1209.0" stroke="#c9c6bd"/>
