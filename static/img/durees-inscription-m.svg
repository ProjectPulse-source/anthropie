<text x="0" y="359.0" font-size="13.5" fill="#45423e">coefficient ramené à 1 au plus après</text>
<text x="0" y="376.0" font-size="13.5" fill="#45423e">2 années sans sinistre</text>
<line x1="4" y1="392.0" x2="296" y2="392.0" stroke="#e6e3dc"/>
<line x1="10.0" y1="388.0" x2="10.0" y2="396.0" stroke="#c9c6bd"/>
