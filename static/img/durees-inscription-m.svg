<text x="0" y="441.0" font-size="13.5" fill="#45423e">5 ans</text>
<line x1="4" y1="457.0" x2="296" y2="457.0" stroke="#e6e3dc"/>
<line x1="10.0" y1="453.0" x2="10.0" y2="461.0" stroke="#c9c6bd"/>
<line x1="98.6" y1="453.0" x2="98.6" y2="461.0" stroke="#c9c6bd"/>
<line x1="157.1" y1="453.0" x2="157.1" y2="461.0" stroke="#c9c6bd"/>
