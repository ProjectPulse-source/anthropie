<text class="pied-source" x="0" y="990.0" font-size="13.5" fill="#55524f">Source : tableau de la page, établi</text>
<text class="pied-source" x="0" y="1007.0" font-size="13.5" fill="#55524f">d'après les textes qu'elle cite (code</text>
<text class="pied-source" x="0" y="1024.0" font-size="13.5" fill="#55524f">monétaire et financier, code de la</text>
<text class="pied-source" x="0" y="1041.0" font-size="13.5" fill="#55524f">consommation, code pénal et code de</text>
<text class="pied-source" x="0" y="1058.0" font-size="13.5" fill="#55524f">procédure pénale, code de la route,</text>
<text class="pied-source" x="0" y="1075.0" font-size="13.5" fill="#55524f">code des assurances, code de la santé</text>
<text class="pied-source" x="0" y="1092.0" font-size="13.5" fill="#55524f">publique, convention AERAS).</text>
<text class="pied-note" x="0" y="1113.0" font-size="13.5" fill="#55524f">Échelle logarithmique. Point plein :</text>
<text class="pied-note" x="0" y="1130.0" font-size="13.5" fill="#55524f">délai ; point creux : délai doublé en</text>
<text class="pied-note" x="0" y="1147.0" font-size="13.5" fill="#55524f">récidive. Les délais ne courent pas du</text>
<text class="pied-note" x="0" y="1164.0" font-size="13.5" fill="#55524f">même point de départ (voir le</text>
<text class="pied-note" x="0" y="1181.0" font-size="13.5" fill="#55524f">tableau). Certains s'abrègent avant</text>
<text class="pied-note" x="0" y="1198.0" font-size="13.5" fill="#55524f">terme, par une démarche de la personne</text>
<text class="pied-note" x="0" y="1215.0" font-size="13.5" fill="#55524f">(régularisation d'un chèque, requête</text>
<text class="pied-note" x="0" y="1232.0" font-size="13.5" fill="#55524f">en exclusion devant le tribunal) ou</text>
<text class="pied-note" x="0" y="1249.0" font-size="13.5" fill="#55524f">par la déclaration d'un tiers</text>
<text class="pied-note" x="0" y="1266.0" font-size="13.5" fill="#55524f">(paiement déclaré par</text>
<text class="pied-note" x="0" y="1283.0" font-size="13.5" fill="#55524f">l'établissement).</text>
