<line x1="157.1" y1="618.0" x2="157.1" y2="626.0" stroke="#c9c6bd"/>
<line x1="201.4" y1="618.0" x2="201.4" y2="626.0" stroke="#c9c6bd"/>
<line x1="290.0" y1="618.0" x2="290.0" y2="626.0" stroke="#c9c6bd"/>
<circle cx="157.1" cy="622.0" r="5.0" fill="#184f95"/>
<text x="0" y="654.0" font-size="13.5" font-weight="600" fill="#1a1a1f">Surendettement (FICP)</text>
<text x="0" y="671.0" font-size="13.5" fill="#45423e">la durée du plan, 7 ans au plus ;</text>
<text x="0" y="688.0" font-size="13.5" fill="#45423e">5 ans si le plan est exécuté sans</text>
<text x="0" y="705.0" font-size="13.5" fill="#45423e">incident</text>
<line x1="4" y1="721.0" x2="296" y2="721.0" stroke="#e6e3dc"/>
<line x1="10.0" y1="717.0" x2="10.0" y2="725.0" stroke="#c9c6bd"/>
