<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1331" role="img" font-variant-numeric="tabular-nums" aria-labelledby="durees-inscription-m-t durees-inscription-m-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="durees-inscription-m-t">Combien de temps une trace reste inscrite : de six mois à quarante ans</title><desc id="durees-inscription-m-d">Frise des durées d'inscription sur une échelle logarithmique de six mois à quarante ans. Permis : un point : 6 mois pour un point seul ; Permis : tous les points : 2 ans sans infraction ; 3 ans après un délit ou une contravention de 4e ou 5e classe ; Malus d'assurance auto : coefficient ramené à 1 au plus après 2 années sans sinistre ; Incident de crédit (FICP) : 5 ans ; Interdiction d'émettre des chèques : 5 ans ; Prêt : cancer ou hépatite C : 5 ans après la fin du protocole thérapeutique ; Surendettement (FICP) : la durée du plan, 7 ans au plus ; 5 ans si le plan est exécuté sans incident ; Casier, bulletin n° 2 (réhabilitation) : 3, 5 ou 10 ans selon la peine ; doublés en récidive (points creux) ; Casier, bulletin n° 1 : 40 ans sans nouvelle condamnation criminelle ou correctionnelle.</desc>
<rect width="300" height="1331" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#1a1a1f">Combien de temps une trace</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#1a1a1f">reste inscrite : de six mois à</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#1a1a1f">quarante ans</text>
<text x="0" y="104.0" font-size="13.5" fill="#55524f">Même échelle logarithmique sur chaque</text>
<text x="0" y="122.0" font-size="13.5" fill="#55524f">ligne :</text>
<line x1="10.0" y1="132.0" x2="10.0" y2="138.0" stroke="#55524f"/>
<text x="0.0" y="153.0" font-size="13.5" fill="#55524f" text-anchor="start">6 mois</text>
<line x1="98.6" y1="132.0" x2="98.6" y2="138.0" stroke="#55524f"/>
<text x="98.6" y="153.0" font-size="13.5" fill="#55524f" text-anchor="middle">2 ans</text>
<line x1="157.1" y1="132.0" x2="157.1" y2="138.0" stroke="#55524f"/>
<text x="157.1" y="153.0" font-size="13.5" fill="#55524f" text-anchor="middle">5 ans</text>
<line x1="201.4" y1="132.0" x2="201.4" y2="138.0" stroke="#55524f"/>
<text x="201.4" y="153.0" font-size="13.5" fill="#55524f" text-anchor="middle">10 ans</text>
<line x1="290.0" y1="132.0" x2="290.0" y2="138.0" stroke="#55524f"/>
<text x="300.0" y="153.0" font-size="13.5" fill="#55524f" text-anchor="end">40 ans</text>
<text x="0" y="178.0" font-size="13.5" font-weight="600" fill="#1a1a1f">Permis : un point</text>
<text x="0" y="195.0" font-size="13.5" fill="#45423e">6 mois pour un point seul</text>
<line x1="4" y1="211.0" x2="296" y2="211.0" stroke="#e6e3dc"/>
<line x1="10.0" y1="207.0" x2="10.0" y2="215.0" stroke="#c9c6bd"/>
