<text x="0" y="589.0" font-size="13.5" fill="#45423e">5 ans après la fin du protocole</text>
<text x="0" y="606.0" font-size="13.5" fill="#45423e">thérapeutique</text>
<line x1="4" y1="622.0" x2="296" y2="622.0" stroke="#e6e3dc"/>
