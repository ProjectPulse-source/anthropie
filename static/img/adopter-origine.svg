<text x="0" y="265" font-size="9" fill="#52514e">Assemblée nationale (données ouvertes, dossiers législatifs) et Sénat (base Dosleg), 06/10/2026 ; Journal officiel</text>
<text x="0" y="277" font-size="9" fill="#52514e">Origine formelle au dépôt initial : elle ne mesure ni l&#x27;influence du Gouvernement ni les amendements. Traités exclus.</text>
