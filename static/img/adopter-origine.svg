<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 298" role="img" font-variant-numeric="tabular-nums" aria-labelledby="ao-t ao-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="ao-t">Qui est à l&#x27;origine des lois ordinaires promulguées ?</title><desc id="ao-d">Barres horizontales par législature : lois issues d&#x27;un projet du Gouvernement, d&#x27;une proposition déposée à l&#x27;Assemblée, d&#x27;une proposition déposée au Sénat. XIVe : 98 d&#x27;origine parlementaire sur 214 ; XVe : 108 sur 202 ; XVIe : 55 sur 83 ; XVIIe en cours.</desc>
<rect width="720" height="298" fill="#ffffff"/>
<text x="0.0" y="18.0" font-size="13" fill="#0A0A0E" text-anchor="start" font-weight="600">Qui est à l&#x27;origine des lois ordinaires promulguées ?</text>
<text x="0.0" y="36.0" font-size="12" fill="#52514e" text-anchor="start">nombre de lois, par législature de promulgation ; trait noir : la moitié des lois</text>
<rect x="0" y="49" width="11" height="11" fill="#c9c5c0"/>
<text x="16.0" y="58.0" font-size="10" fill="#52514e" text-anchor="start">projet du Gouvernement</text>
