<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" font-variant-numeric="tabular-nums" aria-labelledby="ao-t ao-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="ao-t">Qui est à l&#x27;origine des lois promulguées ?</title><desc id="ao-d">Barres à 100 % par législature de promulgation, champ étudié : part des lois issues d&#x27;une proposition déposée à l&#x27;Assemblée, d&#x27;une proposition déposée au Sénat, d&#x27;un projet du Gouvernement ; des pointillés marquent la moitié, un triangle la borne basse. XIVe (2012-2017) : 46 % d&#x27;origine parlementaire (98 lois sur 214) ; au moins 41 % (87 lois) ; toutes natures : 42 % (110 sur 260). XVe (2017-2022) : 53 % d&#x27;origine parlementaire (108 lois sur 202) ; au moins 51 % (103 lois) ; toutes natures : 46 % (114 sur 249). XVIe (2022-2024) : 66 % d&#x27;origine parlementaire (55 lois sur 83) ; toutes natures : 58 % (55 sur 95). XVIIe (depuis 2024), en cours : 80 % d&#x27;origine parlementaire (78 lois sur 97) ; toutes natures : 76 % (85 sur 112).</desc>
<rect width="720" height="405" fill="#ffffff"/>
<text x="0.0" y="18.0" font-size="13" fill="#0A0A0E" text-anchor="start" font-weight="600">Qui est à l&#x27;origine des lois promulguées ?</text>
<text x="0.0" y="36.0" font-size="12" fill="#52514e" text-anchor="start">part des lois du champ étudié, par législature de promulgation ; pointillés : la moitié</text>
<rect x="0" y="49" width="11" height="11" fill="#184f95"/>
<text x="16.0" y="58.0" font-size="10" fill="#52514e" text-anchor="start">proposition déposée à l&#x27;Assemblée</text>
<rect x="216" y="49" width="11" height="11" fill="#7fa3cf"/>
<text x="232.8" y="58.0" font-size="10" fill="#52514e" text-anchor="start">proposition déposée au Sénat</text>
<rect x="405" y="49" width="11" height="11" fill="#c9c5c0"/>
<text x="421.6" y="58.0" font-size="10" fill="#52514e" text-anchor="start">projet du Gouvernement</text>
<text x="0.0" y="99.0" font-size="10" fill="#0A0A0E" text-anchor="start">XIVe (2012-2017)</text>
<rect x="150.0" y="84" width="100.7" height="22" fill="#184f95"/>
<rect x="250.7" y="84" width="78.8" height="22" fill="#7fa3cf"/>
<rect x="329.5" y="84" width="212.5" height="22" fill="#c9c5c0"/>
<polygon points="309.4,107.0 303.4,115.4 315.4,115.4" fill="#0A0A0E"/>
<text x="550.0" y="94.0" font-size="10.5" fill="#0A0A0E" text-anchor="start" font-weight="600">46 % (au moins 41 %)</text>
<text x="550.0" y="108.0" font-size="10" fill="#52514e" text-anchor="start">toutes natures : 42 %</text>
<text x="0.0" y="149.0" font-size="10" fill="#0A0A0E" text-anchor="start">XVe (2017-2022)</text>
<rect x="150.0" y="134" width="149.4" height="22" fill="#184f95"/>
<rect x="299.4" y="134" width="60.2" height="22" fill="#7fa3cf"/>
<rect x="359.6" y="134" width="182.4" height="22" fill="#c9c5c0"/>
<polygon points="349.9,157.0 343.9,165.4 355.9,165.4" fill="#0A0A0E"/>
<text x="550.0" y="144.0" font-size="10.5" fill="#0A0A0E" text-anchor="start" font-weight="600">53 % (au moins 51 %)</text>
<text x="550.0" y="158.0" font-size="10" fill="#52514e" text-anchor="start">toutes natures : 46 %</text>
<text x="0.0" y="199.0" font-size="10" fill="#0A0A0E" text-anchor="start">XVIe (2022-2024)</text>
<rect x="150.0" y="184" width="151.1" height="22" fill="#184f95"/>
<rect x="301.1" y="184" width="108.6" height="22" fill="#7fa3cf"/>
<rect x="409.8" y="184" width="132.2" height="22" fill="#c9c5c0"/>
<text x="550.0" y="194.0" font-size="10.5" fill="#0A0A0E" text-anchor="start" font-weight="600">66 %</text>
<text x="550.0" y="208.0" font-size="10" fill="#52514e" text-anchor="start">toutes natures : 58 %</text>
<text x="0.0" y="249.0" font-size="10" fill="#0A0A0E" text-anchor="start">XVIIe (depuis 2024) *</text>
<rect x="150.0" y="234" width="194.0" height="22" fill="#184f95"/>
<rect x="344.0" y="234" width="121.2" height="22" fill="#7fa3cf"/>
<rect x="465.2" y="234" width="76.8" height="22" fill="#c9c5c0"/>
<text x="550.0" y="244.0" font-size="10.5" fill="#0A0A0E" text-anchor="start" font-weight="600">80 %</text>
<text x="550.0" y="258.0" font-size="10" fill="#52514e" text-anchor="start">toutes natures : 76 %</text>
<line x1="346.0" y1="76" x2="346.0" y2="266" stroke="#0A0A0E" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="150.0" y="278.0" font-size="9" fill="#898781" text-anchor="middle">0 %</text>
<text x="346.0" y="278.0" font-size="9" fill="#898781" text-anchor="middle">50 %</text>
<text x="542.0" y="278.0" font-size="9" fill="#898781" text-anchor="middle">100 %</text>
<polygon points="6.0,288.0 1.0,295.0 11.0,295.0" fill="#0A0A0E"/>
<text x="16.0" y="297.0" font-size="9.5" fill="#52514e" text-anchor="start">borne basse : origine établie par les deux sources</text>
<text x="550.0" y="297.0" font-size="9.5" fill="#52514e" text-anchor="start">* en cours au 06/10/2026</text>
<line x1="0" y1="326.0" x2="720" y2="326.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="341.0" font-size="11" fill="#52514e">Assemblée nationale (données ouvertes, dossiers législatifs) et Sénat (base Dosleg), 06/10/2026 ; Journal officiel</text>
<text class="pied-note" x="0" y="355.0" font-size="11" fill="#52514e">Champ : lois promulguées, hors lois autorisant un traité, lois de finances et de financement de la sécurité sociale,</text>
<text class="pied-note" x="0" y="369.0" font-size="11" fill="#52514e">lois organiques et lois constitutionnelles. Origine au dépôt initial, non l'influence. Toutes natures : même compte,</text>
<text class="pied-note" x="0" y="383.0" font-size="11" fill="#52514e">lois organiques, financières et constitutionnelles réintégrées, traités toujours exclus.</text>
