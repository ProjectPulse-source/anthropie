<text class="pied-source" x="0" y="435.0" font-size="11" fill="#52514e">Sources: European Commission, Debt Sustainability Monitor 2025 (France country fiche); French government, medium-term</text>
<text class="pied-source" x="0" y="449.0" font-size="11" fill="#52514e">fiscal-structural plan (October 2024) and debt report annexed to the 2027 draft budget.</text>
<text class="pied-note" x="0" y="463.0" font-size="11" fill="#52514e">Beyond 2030, outside the fan: the Commission's unchanged-policy projection for 2035 is 140.8% of GDP, with no new</text>
<text class="pied-note" x="0" y="477.0" font-size="11" fill="#52514e">measures after 2026. The bands are conditional projections based on historical economic shocks; they do not predict</text>
<text class="pied-note" x="0" y="491.0" font-size="11" fill="#52514e">future decisions or their consequences. Bands, from lightest to darkest: 10th to 90th, 20th to 80th and 40th to 60th</text>
<text class="pied-note" x="0" y="505.0" font-size="11" fill="#52514e">percentiles of the paths simulated by the Commission (8, 6 and 2 in 10). The three paths rest on different assumptions</text>
<text class="pied-note" x="0" y="519.0" font-size="11" fill="#52514e">and starting points. Starting points in 2025: Commission 116.3% (February 2026 release), 2027 draft budget 115.7%</text>
<text class="pied-note" x="0" y="533.0" font-size="11" fill="#52514e">(October 2026), 2024 commitment 114.7% (October 2024); the commitment gives no figure for 2026.</text>
