<text x="0.0" y="593.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">higher each year</text>
<line x1="160.0" x2="160.0" y1="600.0" y2="622.0" stroke="#9a9994"/>
<rect x="94.3" y="603.0" width="65.7" height="16" fill="#8a8984"/>
<text x="89.3" y="616.0" font-size="13.5" font-weight="600" text-anchor="end" fill="#1a1a1a">−5.7</text>
<text x="0.0" y="645.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">Nominal growth 0.5 percentage point</text>
<text x="0.0" y="663.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">lower each year</text>
<line x1="160.0" x2="160.0" y1="670.0" y2="692.0" stroke="#9a9994"/>
<rect x="160.0" y="673.0" width="69.0" height="16" fill="#eb6834"/>
<text x="234.0" y="686.0" font-size="13.5" font-weight="600" text-anchor="start" fill="#eb6834">+5.9</text>
<text x="160.0" y="716.0" font-size="13.5" font-weight="400" text-anchor="middle" fill="#52514e">0</text>
<line x1="0" y1="726.0" x2="300" y2="726.0" stroke="#d8d6d0"/>
<text class="pied-source" x="0" y="747.0" font-size="13.5" fill="#52514e">Author's calculations based on the</text>
<text class="pied-source" x="0" y="764.0" font-size="13.5" fill="#52514e">European Commission's baseline (Debt</text>
<text class="pied-source" x="0" y="781.0" font-size="13.5" fill="#52514e">Sustainability Monitor 2025, France</text>
<text class="pied-source" x="0" y="798.0" font-size="13.5" fill="#52514e">country fiche), engine tested against</text>
