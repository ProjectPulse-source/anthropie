<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 969" role="img" font-variant-numeric="tabular-nums" aria-labelledby="futurs-leviers-m-t futurs-leviers-m-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="futurs-leviers-m-t">Public debt in 2035: how far the primary balance, interest rates and growth move it</title><desc id="futurs-leviers-m-d">Effect on the debt-to-GDP ratio in 2035, in percentage points of GDP, relative to the Commission's baseline. Orange: debt rises; grey: debt falls; dotted outline: accounting calculation. Primary balance 1 percentage point of GDP higher every year, from 2028 to 2035: −8.2; market rates 0.2 percentage point lower (common funding assumption): −1.0; market rates 1 percentage point higher: +5.5; nominal growth 0.5 percentage point higher each year: −5.7; nominal growth 0.5 percentage point lower each year: +5.9.</desc>
<rect width="300" height="969" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#1a1a1a">Public debt in 2035: how far</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#1a1a1a">the primary balance, interest</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#1a1a1a">rates and growth move it</text>
<text x="0.0" y="90.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">Effect on the debt-to-GDP ratio in</text>
<text x="0.0" y="108.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">2035, in percentage points of GDP,</text>
<text x="0.0" y="126.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">relative to the Commission's baseline</text>
<text x="0.0" y="150.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">Orange: debt rises; grey: debt falls;</text>
<text x="0.0" y="168.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">dotted outline: accounting</text>
<text x="0.0" y="186.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">calculation.</text>
<text x="0.0" y="222.0" font-size="15" font-weight="600" text-anchor="start" fill="#1a1a1a">Primary balance</text>
<text x="0.0" y="247.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">Primary balance 1 percentage point</text>
<text x="0.0" y="265.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">of GDP higher every year,</text>
<text x="0.0" y="283.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">from 2028 to 2035</text>
<text x="0.0" y="301.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">Accounting calculation, ignoring any</text>
<text x="0.0" y="319.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">effect on growth or interest rates</text>
<line x1="160.0" x2="160.0" y1="326.0" y2="348.0" stroke="#9a9994"/>
<rect x="65.4" y="329.0" width="94.6" height="16" fill="#ffffff" stroke="#8a8984" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="60.4" y="342.0" font-size="13.5" font-weight="600" text-anchor="end" fill="#1a1a1a">−8.2</text>
<text x="0.0" y="378.0" font-size="15" font-weight="600" text-anchor="start" fill="#1a1a1a">Financing conditions</text>
<text x="0.0" y="403.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">Market rates 0.2 percentage point</text>
<text x="0.0" y="421.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">lower (common funding assumption)</text>
<line x1="160.0" x2="160.0" y1="428.0" y2="450.0" stroke="#9a9994"/>
<rect x="148.0" y="431.0" width="12.0" height="16" fill="#8a8984"/>
<text x="143.0" y="444.0" font-size="13.5" font-weight="600" text-anchor="end" fill="#1a1a1a">−1.0</text>
<text x="0.0" y="473.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">Market rates 1 percentage point</text>
<text x="0.0" y="491.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">higher</text>
<line x1="160.0" x2="160.0" y1="498.0" y2="520.0" stroke="#9a9994"/>
<rect x="160.0" y="501.0" width="63.7" height="16" fill="#eb6834"/>
<text x="228.7" y="514.0" font-size="13.5" font-weight="600" text-anchor="start" fill="#eb6834">+5.5</text>
<text x="0.0" y="550.0" font-size="15" font-weight="600" text-anchor="start" fill="#1a1a1a">Economic activity</text>
