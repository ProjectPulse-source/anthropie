<text class="pied-note" x="0" y="870.0" font-size="13.5" fill="#52514e">Sensitivities: one parameter changed</text>
<text class="pied-note" x="0" y="887.0" font-size="13.5" fill="#52514e">at a time, the others unchanged. These</text>
<text class="pied-note" x="0" y="904.0" font-size="13.5" fill="#52514e">are not forecasts, full policy</text>
