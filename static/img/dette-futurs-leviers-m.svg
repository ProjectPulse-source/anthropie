<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 915" role="img" font-variant-numeric="tabular-nums" aria-labelledby="futurs-leviers-m-t futurs-leviers-m-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="futurs-leviers-m-t">Dette publique en 2035 : ce que changent le solde, les taux et la croissance</title><desc id="futurs-leviers-m-d">Effet en 2035 sur le ratio dette/PIB, en points de PIB, par rapport à la référence de la Commission. Orange : la dette augmente ; gris : elle baisse ; contour pointillé : calcul comptable. Solde primaire supérieur d'un point de PIB chaque année, de 2028 à 2035 : −8,2 ; taux de marché plus bas de 0,2 point : −1,0 ; taux de marché plus hauts de 1 point : +5,5 ; croissance nominale plus forte de 0,5 point par an : −5,7 ; croissance nominale plus faible de 0,5 point par an : +5,9.</desc>
<rect width="300" height="915" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#1a1a1a">Dette publique en 2035 : ce</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#1a1a1a">que changent le solde, les</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#1a1a1a">taux et la croissance</text>
<text x="0.0" y="90.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">Effet en 2035 sur le ratio dette/PIB,</text>
<text x="0.0" y="108.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">en points de PIB, par rapport à la</text>
<text x="0.0" y="126.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">référence de la Commission</text>
<text x="0.0" y="150.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">Orange : la dette augmente ; gris :</text>
<text x="0.0" y="168.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">elle baisse ; contour pointillé :</text>
<text x="0.0" y="186.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">calcul comptable.</text>
<text x="0.0" y="222.0" font-size="15" font-weight="600" text-anchor="start" fill="#1a1a1a">Solde primaire</text>
<text x="0.0" y="247.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">Solde primaire supérieur d'un point</text>
<text x="0.0" y="265.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">de PIB chaque année, de 2028 à 2035</text>
<text x="0.0" y="283.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">Calcul comptable, hors effets sur la</text>
<text x="0.0" y="301.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#52514e">croissance et les taux</text>
<line x1="160.0" x2="160.0" y1="308.0" y2="330.0" stroke="#9a9994"/>
<rect x="65.4" y="311.0" width="94.6" height="16" fill="#ffffff" stroke="#8a8984" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="60.4" y="324.0" font-size="13.5" font-weight="600" text-anchor="end" fill="#1a1a1a">−8,2</text>
<text x="0.0" y="360.0" font-size="15" font-weight="600" text-anchor="start" fill="#1a1a1a">Conditions de financement</text>
<text x="0.0" y="385.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">Taux de marché plus bas de 0,2 point</text>
<line x1="160.0" x2="160.0" y1="392.0" y2="414.0" stroke="#9a9994"/>
<rect x="148.0" y="395.0" width="12.0" height="16" fill="#8a8984"/>
<text x="143.0" y="408.0" font-size="13.5" font-weight="600" text-anchor="end" fill="#1a1a1a">−1,0</text>
<text x="0.0" y="437.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">Taux de marché plus hauts de 1 point</text>
<line x1="160.0" x2="160.0" y1="444.0" y2="466.0" stroke="#9a9994"/>
<rect x="160.0" y="447.0" width="63.7" height="16" fill="#eb6834"/>
<text x="228.7" y="460.0" font-size="13.5" font-weight="600" text-anchor="start" fill="#b8420f">+5,5</text>
<text x="0.0" y="496.0" font-size="15" font-weight="600" text-anchor="start" fill="#1a1a1a">Activité économique</text>
<text x="0.0" y="521.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">Croissance nominale plus forte de</text>
<text x="0.0" y="539.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">0,5 point par an</text>
<line x1="160.0" x2="160.0" y1="546.0" y2="568.0" stroke="#9a9994"/>
<rect x="94.3" y="549.0" width="65.7" height="16" fill="#8a8984"/>
<text x="89.3" y="562.0" font-size="13.5" font-weight="600" text-anchor="end" fill="#1a1a1a">−5,7</text>
<text x="0.0" y="591.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">Croissance nominale plus faible de</text>
<text x="0.0" y="609.0" font-size="13.5" font-weight="400" text-anchor="start" fill="#1a1a1a">0,5 point par an</text>
<line x1="160.0" x2="160.0" y1="616.0" y2="638.0" stroke="#9a9994"/>
<rect x="160.0" y="619.0" width="69.0" height="16" fill="#eb6834"/>
<text x="234.0" y="632.0" font-size="13.5" font-weight="600" text-anchor="start" fill="#b8420f">+5,9</text>
<text x="160.0" y="662.0" font-size="13.5" font-weight="400" text-anchor="middle" fill="#52514e">0</text>
<line x1="0" y1="672.0" x2="300" y2="672.0" stroke="#d8d6d0"/>
<text class="pied-source" x="0" y="693.0" font-size="13.5" fill="#52514e">Calculs de l'auteur à partir de la</text>
<text class="pied-source" x="0" y="710.0" font-size="13.5" fill="#52514e">référence de la Commission européenne</text>
<text class="pied-source" x="0" y="727.0" font-size="13.5" fill="#52514e">(Debt Sustainability Monitor 2025,</text>
<text class="pied-source" x="0" y="744.0" font-size="13.5" fill="#52514e">fiche France), moteur testé contre la</text>
<text class="pied-source" x="0" y="761.0" font-size="13.5" fill="#52514e">Commission et contre la sensibilité</text>
<text class="pied-source" x="0" y="778.0" font-size="13.5" fill="#52514e">publiée par l'AFT.</text>
<text class="pied-note" x="0" y="799.0" font-size="13.5" fill="#52514e">Sensibilités : un seul paramètre</text>
<text class="pied-note" x="0" y="816.0" font-size="13.5" fill="#52514e">modifié à la fois, les autres</text>
<text class="pied-note" x="0" y="833.0" font-size="13.5" fill="#52514e">inchangés ; ni prévisions, ni</text>
<text class="pied-note" x="0" y="850.0" font-size="13.5" fill="#52514e">évaluations complètes de politiques,</text>
<text class="pied-note" x="0" y="867.0" font-size="13.5" fill="#52514e">ni classement coût-bénéfice.</text>
