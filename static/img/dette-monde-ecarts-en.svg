<title id="me-t">Thirty years of yield spreads over Germany, 1995-2025</title><desc id="me-d">10-year convergence yield minus Germany's, in percentage points. Circles: current euro-area members; squares: countries that stayed outside the euro. Italy: 5.36 in 1995, 0.31 in 1998; Sweden: 3.39 in 1995, 0.42 in 1998; Greece: 21.0 in 2012, Portugal: 9.05; in 2025, Hungary: 4.35, Italy: 1.00, Greece: 0.78, France: 0.76, Portugal: 0.48, Sweden: −0.15.</desc>
