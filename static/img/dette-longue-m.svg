<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 560" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dlm-t dlm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="dlm-t">La dette depuis 1978, en % du PIB</title><desc id="dlm-d">Elle part de 21,6 % du PIB en 1978, franchit 30 % en 1984, 60 % en 1996, 80 % en 2009, 100 % en 2020, et atteint 119,0 % au T2 2026. Des cercles évidés, non reliés à la courbe, portent la trajectoire du projet de loi de finances pour 2027, qui atteint 121,7 % en 2027 : une prévision, non une observation.</desc>
<rect width="300" height="560" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">La dette depuis 1978, en % du</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">PIB</text>
<line x1="34" y1="268.0" x2="286" y2="268.0" stroke="#c3c2b7"/>
