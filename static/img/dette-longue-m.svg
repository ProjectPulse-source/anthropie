<text x="286.0" y="287.0" font-size="13.5" fill="#898781" text-anchor="end">T2 2026</text>
<circle cx="286.0" cy="94.1" r="4.5" fill="#eb6834"/>
<text x="0" y="304" font-size="13.5" fill="#52514e">Seuils franchis (fin d'année) :</text>
<text x="0" y="325" font-size="13.5" fill="#52514e">1978</text>
<text x="140" y="325" font-size="13.5" font-weight="600" fill="#184f95" text-anchor="end">21,6 %</text>
<text x="154" y="325" font-size="13.5" fill="#52514e">1984</text>
<text x="294" y="325" font-size="13.5" font-weight="600" fill="#184f95" text-anchor="end">&gt; 30 %</text>
<text x="0" y="346" font-size="13.5" fill="#52514e">1996</text>
<text x="140" y="346" font-size="13.5" font-weight="600" fill="#184f95" text-anchor="end">&gt; 60 %</text>
<text x="154" y="346" font-size="13.5" fill="#52514e">2009</text>
<text x="294" y="346" font-size="13.5" font-weight="600" fill="#184f95" text-anchor="end">&gt; 80 %</text>
<text x="0" y="367" font-size="13.5" fill="#52514e">2020</text>
<text x="140" y="367" font-size="13.5" font-weight="600" fill="#184f95" text-anchor="end">&gt; 100 %</text>
<text x="154" y="367" font-size="13.5" fill="#52514e">T2 2026</text>
<text x="294" y="367" font-size="13.5" font-weight="600" fill="#184f95" text-anchor="end">119,0 %</text>
<line x1="0" y1="385.0" x2="300" y2="385.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="406.0" font-size="13.5" fill="#52514e">INSEE, dette de Maastricht,</text>
<text class="pied-source" x="0" y="423.0" font-size="13.5" fill="#52514e">1978-T2 2026</text>
<text class="pied-note" x="0" y="444.0" font-size="13.5" fill="#52514e">Dette au sens de Maastricht, toutes</text>
<text class="pied-note" x="0" y="461.0" font-size="13.5" fill="#52514e">administrations publiques.</text>
<text class="pied-note" x="0" y="478.0" font-size="13.5" fill="#52514e">« &gt; 80 % » : première fin d'année</text>
<text class="pied-note" x="0" y="495.0" font-size="13.5" fill="#52514e">au-delà du seuil ; en trimestriel, il</text>
<text class="pied-note" x="0" y="512.0" font-size="13.5" fill="#52514e">peut être franchi plus tôt.</text>
