<line x1="34" y1="180.3" x2="286" y2="180.3" stroke="#e1e0d9"/>
<text x="29" y="185.3" font-size="13.5" fill="#898781" text-anchor="end">60</text>
<line x1="34" y1="136.5" x2="286" y2="136.5" stroke="#e1e0d9"/>
<text x="29" y="141.5" font-size="13.5" fill="#898781" text-anchor="end">90</text>
<line x1="34" y1="92.6" x2="286" y2="92.6" stroke="#e1e0d9"/>
<text x="29" y="97.6" font-size="13.5" fill="#898781" text-anchor="end">120</text>
<text x="34.0" y="287.0" font-size="13.5" fill="#898781" text-anchor="start">1978</text>
