<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 918" role="img" font-variant-numeric="tabular-nums" aria-labelledby="qp-net-m-t qp-net-m-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="qp-net-m-t">Who receives more than they pay in? By decile, 2023</title><desc id="qp-net-m-d">Two panels. A: balance of public transfers by standard-of-living decile, in thousand euros per consumption unit, equal to what the group pays in minus what it receives: negative when it receives more than it pays in. On average, the first seven deciles receive more than they pay in, the first by 20.8; the last three pay in more than they receive, the last one by 58.4. B: share of people who are net beneficiaries, from 99% in the first decile to 18% in the last.</desc>
<rect width="300" height="918" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#2b2a28">Who receives more than they</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#2b2a28">pay in? By decile, 2023</text>
<text x="0.0" y="86.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">A · Balance = taxes minus transfers</text>
<text x="0.0" y="104.0" font-size="13.5" fill="#2b2a28" text-anchor="start" font-weight="600">received</text>
<text x="0.0" y="122.0" font-size="13.5" fill="#898781" text-anchor="start">Average, € thousand per CU · negative:</text>
<text x="0.0" y="140.0" font-size="13.5" fill="#898781" text-anchor="start">net beneficiary</text>
<rect x="0" y="150.0" width="12" height="12" fill="#184f95"/>
<text x="18.0" y="160.0" font-size="13.5" fill="#52514e" text-anchor="start">receives more than it pays in (left)</text>
<rect x="0" y="170.0" width="12" height="12" fill="#eb6834"/>
<text x="18.0" y="180.0" font-size="13.5" fill="#52514e" text-anchor="start">pays in more than it receives (right)</text>
