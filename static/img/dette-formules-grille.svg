<text x="186" y="193" font-size="10.5" fill="#26262f">flux et stock)</text>
<text x="372" y="154" font-size="10.5" fill="#55524f">Cumul 1996-2025 : 2 649 contre</text>
<text x="372" y="167" font-size="10.5" fill="#55524f">2 758 Md€, proche</text>
<text x="560" y="154" font-size="10.5" fill="#eb6834">Constat, pas d'inférence</text>
