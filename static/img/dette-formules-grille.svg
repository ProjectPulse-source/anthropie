<text x="0" y="214" font-size="10.5" font-weight="600" fill="#26262f">« 3 % de déficit, seuil à partir</text>
<text x="0" y="227" font-size="10.5" font-weight="600" fill="#26262f">duquel la dette n'augmente plus »</text>
<text x="0" y="240" font-size="10.5" fill="#55524f">F. Bayrou</text>
<text x="186" y="214" font-size="10.5" fill="#26262f">En euros, inexact : un déficit de</text>
