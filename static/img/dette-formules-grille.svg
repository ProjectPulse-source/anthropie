<text x="0" y="274" font-size="10.5" font-weight="600" fill="#26262f">« La France s'endette à des taux</text>
<text x="0" y="287" font-size="10.5" font-weight="600" fill="#26262f">supérieurs à ceux de la Grèce »</text>
