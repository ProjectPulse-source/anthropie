<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1055" role="img" font-variant-numeric="tabular-nums" aria-labelledby="a4m-t a4m-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="a4m-t">Engagements de responsabilité sur un texte (art. 49, al. 3)</title><desc id="a4m-d">Barres horizontales par législature : engagements sur un projet de loi de finances ou de financement de la sécurité sociale, et sur un autre projet ou une proposition. XIVe (2012-2017) : 6 engagements sur 2 textes, aucun sur un projet de loi de finances ou de financement de la sécurité sociale ; XVe (2017-2022) : 1 engagement sur 1 texte, aucun sur un projet de loi de finances ou de financement de la sécurité sociale ; XVIe (2022-2024) : 23 engagements sur 6 textes, dont 21 sur un projet de loi de finances ou de financement de la sécurité sociale ; XVIIe (depuis 2024), en cours : 8 engagements sur 3 textes, tous sur un projet de loi de finances ou de financement de la sécurité sociale, 1 motion de censure adoptée.</desc>
<rect width="300" height="1055" fill="#ffffff"/>
<text x="0.0" y="20.0" font-size="17" fill="#0A0A0E" text-anchor="start" font-weight="600">Engagements de responsabilité</text>
<text x="0.0" y="42.0" font-size="17" fill="#0A0A0E" text-anchor="start" font-weight="600">sur un texte (art. 49, al. 3)</text>
<text x="0.0" y="82.0" font-size="13.5" fill="#52514e" text-anchor="start">nombre d&#x27;engagements, par</text>
<text x="0.0" y="100.0" font-size="13.5" fill="#52514e" text-anchor="start">législature ; chaque engagement est</text>
<text x="0.0" y="118.0" font-size="13.5" fill="#52514e" text-anchor="start">compté une fois</text>
<rect x="0" y="131" width="13" height="13" fill="#184f95"/>
<text x="20.0" y="143.0" font-size="13.5" fill="#52514e" text-anchor="start">projet de loi de finances ou de</text>
<text x="20.0" y="161.0" font-size="13.5" fill="#52514e" text-anchor="start">financement de la sécurité</text>
<text x="20.0" y="179.0" font-size="13.5" fill="#52514e" text-anchor="start">sociale</text>
<rect x="0" y="189" width="13" height="13" fill="#c9c5c0"/>
<text x="20.0" y="201.0" font-size="13.5" fill="#52514e" text-anchor="start">autre projet ou proposition</text>
<text x="0.0" y="232.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">XIVe (2012-2017)</text>
<rect x="0.0" y="240" width="62.4" height="22" fill="#c9c5c0"/>
<text class="val" x="67.4" y="257.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">6</text>
<text class="val" x="0.0" y="281.0" font-size="13.5" fill="#52514e" text-anchor="start">6 engagements sur 2 textes</text>
<text class="val" x="0.0" y="300.0" font-size="13.5" fill="#52514e" text-anchor="start">aucun sur un projet de loi de</text>
<text class="val" x="0.0" y="319.0" font-size="13.5" fill="#52514e" text-anchor="start">finances ou de financement de la</text>
<text class="val" x="0.0" y="338.0" font-size="13.5" fill="#52514e" text-anchor="start">sécurité sociale</text>
<text x="0.0" y="362.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">XVe (2017-2022)</text>
<rect x="0.0" y="370" width="10.4" height="22" fill="#c9c5c0"/>
<text class="val" x="15.4" y="387.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">1</text>
<text class="val" x="0.0" y="411.0" font-size="13.5" fill="#52514e" text-anchor="start">1 engagement sur 1 texte</text>
<text class="val" x="0.0" y="430.0" font-size="13.5" fill="#52514e" text-anchor="start">aucun sur un projet de loi de</text>
<text class="val" x="0.0" y="449.0" font-size="13.5" fill="#52514e" text-anchor="start">finances ou de financement de la</text>
<text class="val" x="0.0" y="468.0" font-size="13.5" fill="#52514e" text-anchor="start">sécurité sociale</text>
<text x="0.0" y="492.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">XVIe (2022-2024)</text>
<rect x="0.0" y="500" width="218.4" height="22" fill="#184f95"/>
<rect x="218.4" y="500" width="20.8" height="22" fill="#c9c5c0"/>
<text class="val" x="244.2" y="517.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">23</text>
<text class="val" x="0.0" y="541.0" font-size="13.5" fill="#52514e" text-anchor="start">23 engagements sur 6 textes</text>
<text class="val" x="0.0" y="560.0" font-size="13.5" fill="#52514e" text-anchor="start">dont 21 sur un projet de loi de</text>
<text class="val" x="0.0" y="579.0" font-size="13.5" fill="#52514e" text-anchor="start">finances ou de financement de la</text>
<text class="val" x="0.0" y="598.0" font-size="13.5" fill="#52514e" text-anchor="start">sécurité sociale</text>
<text x="0.0" y="622.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">XVIIe (depuis 2024) *</text>
<rect x="0.0" y="630" width="83.2" height="22" fill="#184f95"/>
<text class="val" x="88.2" y="647.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">8</text>
<text class="val" x="0.0" y="671.0" font-size="13.5" fill="#52514e" text-anchor="start">8 engagements sur 3 textes</text>
<text class="val" x="0.0" y="690.0" font-size="13.5" fill="#52514e" text-anchor="start">tous sur un projet de loi de</text>
<text class="val" x="0.0" y="709.0" font-size="13.5" fill="#52514e" text-anchor="start">finances ou de financement de la</text>
<text class="val" x="0.0" y="728.0" font-size="13.5" fill="#52514e" text-anchor="start">sécurité sociale</text>
<text class="val" x="0.0" y="747.0" font-size="13.5" fill="#52514e" text-anchor="start">1 motion de censure adoptée</text>
<text x="0.0" y="773.0" font-size="13.5" fill="#52514e" text-anchor="start">* en cours au 06/10/2026</text>
<line x1="0" y1="795.0" x2="300" y2="795.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0.0" y="816.0" font-size="13.5" fill="#52514e" text-anchor="start">Assemblée nationale : dossiers</text>
<text class="pied-source" x="0.0" y="833.0" font-size="13.5" fill="#52514e" text-anchor="start">législatifs, bulletins statistiques,</text>
<text class="pied-source" x="0.0" y="850.0" font-size="13.5" fill="#52514e" text-anchor="start">fiche n° 64 (engagements de</text>
<text class="pied-source" x="0.0" y="867.0" font-size="13.5" fill="#52514e" text-anchor="start">responsabilité)</text>
<text class="pied-note" x="0.0" y="888.0" font-size="13.5" fill="#52514e" text-anchor="start">Catégories de l&#x27;art. 49, al. 3 : la</text>
<text class="pied-note" x="0.0" y="905.0" font-size="13.5" fill="#52514e" text-anchor="start">loi de programmation des finances</text>
<text class="pied-note" x="0.0" y="922.0" font-size="13.5" fill="#52514e" text-anchor="start">publiques est un « autre projet ».</text>
<text class="pied-note" x="0.0" y="939.0" font-size="13.5" fill="#52514e" text-anchor="start">Chaque engagement est compté une</text>
<text class="pied-note" x="0.0" y="956.0" font-size="13.5" fill="#52514e" text-anchor="start">fois ; un même projet peut en recevoir</text>
<text class="pied-note" x="0.0" y="973.0" font-size="13.5" fill="#52514e" text-anchor="start">plusieurs, y compris au cours d&#x27;une</text>
<text class="pied-note" x="0.0" y="990.0" font-size="13.5" fill="#52514e" text-anchor="start">même lecture. XVIIe en cours au</text>
<text class="pied-note" x="0.0" y="1007.0" font-size="13.5" fill="#52514e" text-anchor="start">06/10/2026.</text>
