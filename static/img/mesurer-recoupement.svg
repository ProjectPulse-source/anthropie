<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 351" role="img" font-variant-numeric="tabular-nums" aria-labelledby="mr-t mr-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="mr-t">Chômeurs au sens du BIT et inscrits en catégorie A, 2024</title><desc id="mr-d">Barre en trois segments, en milliers de personnes, moyenne 2024 (estimation Insee) : 863 chômeurs au sens du BIT non inscrits en catégorie A, 1 427 dans les deux à la fois, 1 466 inscrits en catégorie A non chômeurs au sens du BIT. Chômeurs au sens du BIT : 2 290, dont 62 % inscrits en catégorie A. Inscrits en catégorie A : 2 893, dont 49 % chômeurs au sens du BIT.</desc>
<rect width="720" height="351" fill="#ffffff"/>
<text x="0.0" y="18.0" font-size="13" fill="#0A0A0E" text-anchor="start" font-weight="600">Chômeurs au sens du BIT et inscrits en catégorie A, 2024</text>
<text x="0.0" y="36.0" font-size="12" fill="#52514e" text-anchor="start">deux définitions, des populations qui se recoupent en partie (en milliers de personnes)</text>
<rect x="0.0" y="118" width="165.4" height="46" fill="#c9cdd3"/>
<rect x="165.4" y="118" width="273.5" height="46" fill="#184f95"/>
<rect x="439.0" y="118" width="281.0" height="46" fill="#c9cdd3"/>
<text x="82.7" y="146.0" font-size="15" fill="#0A0A0E" text-anchor="middle" font-weight="600">863</text>
<text x="302.2" y="146.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600">1 427</text>
<text x="579.5" y="146.0" font-size="15" fill="#0A0A0E" text-anchor="middle" font-weight="600">1 466</text>
<path d="M1.0 112 v-8 H439.0 v8" fill="none" stroke="#52514e" stroke-width="1.5"/>
<text x="219.5" y="98.0" font-size="12" fill="#0A0A0E" text-anchor="middle" font-weight="600">Chômeurs au sens du BIT : 2 290, dont 62 % inscrits en A</text>
<path d="M165.4 170 v8 H719.0 v-8" fill="none" stroke="#52514e" stroke-width="1.5"/>
<text x="442.7" y="194.0" font-size="12" fill="#0A0A0E" text-anchor="middle" font-weight="600">Inscrits en catégorie A : 2 893, dont 49 % chômeurs au sens du BIT</text>
<text x="0.0" y="226.0" font-size="10" fill="#52514e" text-anchor="start">dont : non inscrits 524 ; inscrits en B ou C 240 ;</text>
<text x="0.0" y="239.0" font-size="10" fill="#52514e" text-anchor="start">inscrits en D ou E 99</text>
<text x="720.0" y="226.0" font-size="10" fill="#52514e" text-anchor="end">dont : halo autour du chômage 727 ;</text>
<text x="720.0" y="239.0" font-size="10" fill="#52514e" text-anchor="end">inactifs hors halo 503 ; en emploi 236</text>
<text x="302.2" y="226.0" font-size="10" fill="#184f95" text-anchor="middle" font-weight="600">dans les deux</text>
<line x1="0" y1="272.0" x2="720" y2="272.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="287.0" font-size="11" fill="#52514e">Insee Références, Emploi, chômage, revenus du travail, éd. 2026, dossier 1, figures 2 et 8 (appariement</text>
<text class="pied-source" x="0" y="301.0" font-size="11" fill="#52514e">Dares-Insee-France Travail)</text>
<text class="pied-note" x="0" y="315.0" font-size="11" fill="#52514e">Estimation de l'Insee, moyenne 2024, France hors Mayotte, 15-64 ans, logement ordinaire ; deux définitions</text>
<text class="pied-note" x="0" y="329.0" font-size="11" fill="#52514e">distinctes ; marge d'enquête non publiée.</text>
