<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 752" role="img" font-variant-numeric="tabular-nums" aria-labelledby="bd-m-t bd-m-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="bd-m-t">France: what pushed the weight of debt up or down, decade by decade</title><desc id="bd-m-d">For each decade, in points of GDP cumulated over ten years: effect of interest rates and growth, contribution of the primary balance, other adjustments, and their sum, the change in the debt ratio. 1996-2005: +8.4, −2.5, +4.4; change +10.4. 2006-2015: +7.8, +22.4, −1.5; change +28.8. 2016-2025: −15.1, +30.6, +3.1; change +18.6. Over the last decade, the interest-growth effect pulled the ratio down and primary deficits pushed it up by more.</desc>
<rect width="300" height="752" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">France: what pushed the weight</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">of debt up or down, decade by</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#26262f">decade</text>
<rect x="0" y="96.0" width="11" height="11" fill="#eb6834"/>
<text x="17" y="106.0" font-size="13.5" fill="#55524f">pushes the ratio up</text>
<rect x="0" y="116.0" width="11" height="11" fill="#8a8781"/>
<text x="17" y="126.0" font-size="13.5" fill="#55524f">pulls it down</text>
<text x="0" y="145.0" font-size="13.5" fill="#96928f">In points of GDP cumulated over ten</text>
<text x="0" y="164.0" font-size="13.5" fill="#96928f">years</text>
<line x1="0" y1="176.0" x2="300" y2="176.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="0" y="198.0" font-size="15" font-weight="600" fill="#26262f">1996-2005: +10.4 points</text>
<text x="0" y="216.0" font-size="13.5" fill="#184f95">57.8 → 68.2% of GDP</text>
<line x1="192.0" y1="224.0" x2="192.0" y2="284.0" stroke="#8f8a84" stroke-width="1.2"/>
<text x="0" y="237.0" font-size="13.5" fill="#55524f">Interest and growth</text>
<rect x="192.0" y="226.0" width="21.9" height="14" fill="#eb6834"/>
<text x="217.9" y="237.0" font-size="13.5" fill="#26262f" text-anchor="start">+8.4</text>
<text x="0" y="258.0" font-size="13.5" fill="#55524f">Primary balance</text>
<rect x="185.6" y="247.0" width="6.4" height="14" fill="#8a8781"/>
<text x="181.6" y="258.0" font-size="13.5" fill="#26262f" text-anchor="end">−2.5</text>
<text x="0" y="279.0" font-size="13.5" fill="#55524f">Other adjustments</text>
<rect x="192.0" y="268.0" width="11.4" height="14" fill="#eb6834"/>
<text x="207.4" y="279.0" font-size="13.5" fill="#26262f" text-anchor="start">+4.4</text>
<line x1="0" y1="299.0" x2="300" y2="299.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="0" y="321.0" font-size="15" font-weight="600" fill="#26262f">2006-2015: +28.8 points</text>
<text x="0" y="339.0" font-size="13.5" fill="#184f95">68.2 → 97.0% of GDP</text>
<line x1="192.0" y1="347.0" x2="192.0" y2="407.0" stroke="#8f8a84" stroke-width="1.2"/>
<text x="0" y="360.0" font-size="13.5" fill="#55524f">Interest and growth</text>
<rect x="192.0" y="349.0" width="20.4" height="14" fill="#eb6834"/>
<text x="216.4" y="360.0" font-size="13.5" fill="#26262f" text-anchor="start">+7.8</text>
<text x="0" y="381.0" font-size="13.5" fill="#55524f">Primary balance</text>
<rect x="192.0" y="370.0" width="58.2" height="14" fill="#eb6834"/>
<text x="254.2" y="381.0" font-size="13.5" fill="#26262f" text-anchor="start">+22.4</text>
<text x="0" y="402.0" font-size="13.5" fill="#55524f">Other adjustments</text>
<rect x="188.2" y="391.0" width="3.8" height="14" fill="#8a8781"/>
<text x="184.2" y="402.0" font-size="13.5" fill="#26262f" text-anchor="end">−1.5</text>
<line x1="0" y1="422.0" x2="300" y2="422.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="0" y="444.0" font-size="15" font-weight="600" fill="#26262f">2016-2025: +18.6 points</text>
<text x="0" y="462.0" font-size="13.5" fill="#184f95">97.0 → 115.6% of GDP</text>
<line x1="192.0" y1="470.0" x2="192.0" y2="530.0" stroke="#8f8a84" stroke-width="1.2"/>
<text x="0" y="483.0" font-size="13.5" fill="#55524f">Interest and growth</text>
<rect x="152.7" y="472.0" width="39.3" height="14" fill="#8a8781"/>
<text x="196.0" y="483.0" font-size="13.5" fill="#26262f" text-anchor="start">−15.1</text>
<text x="0" y="504.0" font-size="13.5" fill="#55524f">Primary balance</text>
<rect x="192.0" y="493.0" width="79.5" height="14" fill="#eb6834"/>
<text x="188.0" y="504.0" font-size="13.5" fill="#26262f" text-anchor="end">+30.6</text>
<text x="0" y="525.0" font-size="13.5" fill="#55524f">Other adjustments</text>
<rect x="192.0" y="514.0" width="8.0" height="14" fill="#eb6834"/>
<text x="204.0" y="525.0" font-size="13.5" fill="#26262f" text-anchor="start">+3.1</text>
<line x1="0" y1="543.0" x2="300" y2="543.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="564.0" font-size="13.5" fill="#55524f">Eurostat gov_10dd_edpt1 (debt, GDP),</text>
<text class="pied-source" x="0" y="581.0" font-size="13.5" fill="#55524f">gov_10a_main (B9, D41PAY), France,</text>
<text class="pied-source" x="0" y="598.0" font-size="13.5" fill="#55524f">1996-2025</text>
<text class="pied-note" x="0" y="619.0" font-size="13.5" fill="#55524f">An accounting decomposition, not a</text>
<text class="pied-note" x="0" y="636.0" font-size="13.5" fill="#55524f">causal one: the three terms are not</text>
<text class="pied-note" x="0" y="653.0" font-size="13.5" fill="#55524f">independent. Change computed on</text>
<text class="pied-note" x="0" y="670.0" font-size="13.5" fill="#55524f">unrounded values; the sum of the</text>
<text class="pied-note" x="0" y="687.0" font-size="13.5" fill="#55524f">contributions shown may differ by 0.1</text>
<text class="pied-note" x="0" y="704.0" font-size="13.5" fill="#55524f">points.</text>
