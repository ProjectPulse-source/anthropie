<title id="pvm-t">Article 19 exempts eight provisions from countersignature: act by act, what each article says</title><desc id="pvm-d">Matrix of twelve acts spread over the eight provisions of article 19, and four columns. A filled cell means that the article itself contains an exact quotation of the element. Three acts have neither an element required before the act nor another actor afterwards: appointing the Prime Minister, addressing Parliament by message and appointing the President of the Constitutional Council.</desc>
