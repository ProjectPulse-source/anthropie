<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">Heures de cours non assurées,</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">2024-2025 : pourquoi ?</text>
<text x="0" y="82" font-size="13.5" fill="#55524f">Au lycée général et technologique :</text>
<rect x="0" y="94" width="14" height="14" fill="#eb6834" opacity="1.0"/>
<text x="22" y="106" font-size="13.5" fill="#26262f">Absences individuelles</text>
<text x="300" y="106" font-size="15" font-weight="600" fill="#26262f" text-anchor="end">3,9</text>
<rect x="0" y="118" width="14" height="14" fill="#184f95" opacity="1.0"/>
<text x="22" y="130" font-size="13.5" fill="#26262f">Examens, commissions</text>
