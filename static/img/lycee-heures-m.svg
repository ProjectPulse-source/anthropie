<rect x="178.1" y="354" width="27.9" height="22" fill="#184f95" opacity="0.35" stroke="#ffffff" stroke-width="1"/>
<text x="212.0" y="370" font-size="15" font-weight="600" fill="#26262f">9,5 %</text>
<text x="0" y="408" font-size="13.5" fill="#55524f">Lycée GT : les quatre motifs arrondis</text>
<text x="0" y="426" font-size="13.5" fill="#55524f">totalisent 10,5 ; total publié par la</text>
