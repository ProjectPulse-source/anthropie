<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 669" role="img" font-variant-numeric="tabular-nums" aria-labelledby="lyc-hm-t lyc-hm-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="lyc-hm-t">Heures de cours non assurées, 2024-2025 : pourquoi ?</title><desc id="lyc-hm-d">Barres empilées, 2024-2025, en % des heures prévues. Lycée GT : 10,4 au total, dont absences individuelles 3,9, examens et commissions 1,9, fermeture 3,3, formation 1,4. Lycée professionnel : 9,5. Collège : 9,5, dont absences individuelles 4,7. Lycée GT : les quatre motifs arrondis totalisent 10,5 ; total publié par la DEPP : 10,4 (écart d'arrondi).</desc>
