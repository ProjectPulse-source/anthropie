<text x="231.3" y="238" font-size="15" font-weight="600" fill="#26262f">10,4 %</text>
<text x="0" y="280" font-size="15" font-weight="600" fill="#26262f">Lycée professionnel</text>
<rect x="0.0" y="288" width="85.8" height="22" fill="#eb6834" opacity="1.0" stroke="#ffffff" stroke-width="1"/>
<rect x="85.8" y="288" width="45.1" height="22" fill="#184f95" opacity="1.0" stroke="#ffffff" stroke-width="1"/>
<rect x="130.9" y="288" width="45.1" height="22" fill="#184f95" opacity="0.62" stroke="#ffffff" stroke-width="1"/>
