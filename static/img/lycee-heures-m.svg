<rect x="0" y="142" width="14" height="14" fill="#184f95" opacity="0.62"/>
<text x="22" y="154" font-size="13.5" fill="#26262f">Fermeture (examens surtout)</text>
<text x="300" y="154" font-size="15" font-weight="600" fill="#26262f" text-anchor="end">3,3</text>
<rect x="0" y="166" width="14" height="14" fill="#184f95" opacity="0.35"/>
<text x="22" y="178" font-size="13.5" fill="#26262f">Formation</text>
<text x="300" y="178" font-size="15" font-weight="600" fill="#26262f" text-anchor="end">1,4</text>
<text x="0" y="214" font-size="15" font-weight="600" fill="#26262f">Lycée général et technologique</text>
<rect x="0.0" y="222" width="83.7" height="22" fill="#eb6834" opacity="1.0" stroke="#ffffff" stroke-width="1"/>
