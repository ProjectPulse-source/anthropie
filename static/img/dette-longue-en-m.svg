<text x="286.0" y="265.0" font-size="13.5" fill="#898781" text-anchor="end">Q2 2026</text>
<circle cx="286.0" cy="72.1" r="4.5" fill="#eb6834"/>
<text x="0" y="282" font-size="13.5" fill="#52514e">Thresholds crossed (year-end):</text>
<text x="0" y="303" font-size="13.5" fill="#52514e">1978</text>
<text x="140" y="303" font-size="13.5" font-weight="600" fill="#184f95" text-anchor="end">21.6%</text>
<text x="154" y="303" font-size="13.5" fill="#52514e">1984</text>
<text x="294" y="303" font-size="13.5" font-weight="600" fill="#184f95" text-anchor="end">&gt; 30%</text>
<text x="0" y="324" font-size="13.5" fill="#52514e">1996</text>
<text x="140" y="324" font-size="13.5" font-weight="600" fill="#184f95" text-anchor="end">&gt; 60%</text>
<text x="154" y="324" font-size="13.5" fill="#52514e">2009</text>
<text x="294" y="324" font-size="13.5" font-weight="600" fill="#184f95" text-anchor="end">&gt; 80%</text>
<text x="0" y="345" font-size="13.5" fill="#52514e">2020</text>
<text x="140" y="345" font-size="13.5" font-weight="600" fill="#184f95" text-anchor="end">&gt; 100%</text>
