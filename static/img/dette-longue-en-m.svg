<text x="29" y="207.2" font-size="13.5" fill="#898781" text-anchor="end">30</text>
<line x1="34" y1="158.3" x2="286" y2="158.3" stroke="#e1e0d9"/>
<text x="29" y="163.3" font-size="13.5" fill="#898781" text-anchor="end">60</text>
<line x1="34" y1="114.5" x2="286" y2="114.5" stroke="#e1e0d9"/>
<text x="29" y="119.5" font-size="13.5" fill="#898781" text-anchor="end">90</text>
