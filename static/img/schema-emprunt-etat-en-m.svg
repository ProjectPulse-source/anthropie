<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1818" role="img" font-variant-numeric="tabular-nums" aria-labelledby="sem-t sem-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="sem-t">How the French State borrows, and who receives the interest</title><desc id="sem-d">Two-part diagram. Part one, the path of a bond: the French Treasury agency (Agence France Trésor) sells government bonds at auction to licensed banks, the primary dealers; they resell them to investors in France and abroad; from 2015 to 2022 (net purchases), the Banque de France bought some of them on that market, never directly from the State, paying with reserves credited to banks. Part two, what the State pays each year: coupons to every holder, the Banque de France included; the Banque de France in turn pays interest on the reserves banks place with it, at the ECB deposit rate, and passes its profits on to the State. At maturity, the State repays each bond from its cash or new borrowing.</desc>
<rect width="300" height="1818" fill="#ffffff"/>
<defs><marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#184f95"/></marker><marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">How the French State</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">borrows, and who receives</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#0A0A0E">the interest</text>
<text x="0" y="104.0" font-size="13.5" font-weight="600" fill="#184f95">1. The path of a bond</text>
<rect x="35.0" y="116.0" width="230.0" height="58.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="150.0" y="141.6" font-size="13" text-anchor="middle" fill="#0A0A0E" font-weight="600">The State</text>
<text x="150.0" y="157.6" font-size="12" text-anchor="middle" fill="#52514e">Agence France Trésor</text>
<rect x="35.0" y="208.0" width="230.0" height="58.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="150.0" y="233.6" font-size="13" text-anchor="middle" fill="#0A0A0E" font-weight="600">Primary dealers</text>
<text x="150.0" y="249.6" font-size="12" text-anchor="middle" fill="#52514e">licensed banks</text>
<rect x="35.0" y="300.0" width="230.0" height="58.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="150.0" y="317.6" font-size="13" text-anchor="middle" fill="#0A0A0E" font-weight="600">Investors</text>
<text x="150.0" y="333.6" font-size="12" text-anchor="middle" fill="#52514e">insurers, banks, funds, in</text>
<text x="150.0" y="349.6" font-size="12" text-anchor="middle" fill="#52514e">France and abroad</text>
<rect x="35.0" y="392.0" width="230.0" height="58.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="150.0" y="417.6" font-size="13" text-anchor="middle" fill="#0A0A0E" font-weight="600">Banque de France</text>
<text x="150.0" y="433.6" font-size="12" text-anchor="middle" fill="#52514e">for the Eurosystem</text>
<path d="M150.0,177.0 L150.0,205.0" fill="none" stroke="#184f95" stroke-width="2" marker-end="url(#fb)"/>
<circle cx="172.0" cy="191.0" r="9" fill="#184f95"/>
<text x="172.0" y="195.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">1</text>
<path d="M150.0,269.0 L150.0,297.0" fill="none" stroke="#184f95" stroke-width="2" marker-end="url(#fb)"/>
<circle cx="172.0" cy="283.0" r="9" fill="#184f95"/>
<text x="172.0" y="287.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">2</text>
<path d="M150.0,361.0 L150.0,389.0" fill="none" stroke="#184f95" stroke-width="2" marker-end="url(#fb)"/>
<circle cx="172.0" cy="375.0" r="9" fill="#184f95"/>
<text x="172.0" y="379.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">3</text>
<path d="M268.0,421.0 L287.0,421.0 L287.0,329.0 L268.0,329.0" fill="none" stroke="#898781" stroke-width="2" marker-end="url(#fg)"/>
<circle cx="287.0" cy="375.0" r="9" fill="#898781"/>
<text x="287.0" y="379.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">4</text>
<circle cx="9.0" cy="474.0" r="9" fill="#184f95"/>
<text x="9.0" y="478.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">1</text>
<text x="26.0" y="478.0" font-size="13.5" fill="#0A0A0E">The Agence France Trésor sells</text>
<text x="26.0" y="495.0" font-size="13.5" fill="#0A0A0E">government bonds, mostly at</text>
<text x="26.0" y="512.0" font-size="13.5" fill="#0A0A0E">auction. Only primary dealers</text>
<text x="26.0" y="529.0" font-size="13.5" fill="#0A0A0E">can buy there: the State</text>
<text x="26.0" y="546.0" font-size="13.5" fill="#0A0A0E">receives their money; that is</text>
<text x="26.0" y="563.0" font-size="13.5" fill="#0A0A0E">the borrowing.</text>
<circle cx="9.0" cy="582.0" r="9" fill="#184f95"/>
<text x="9.0" y="586.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">2</text>
<text x="26.0" y="586.0" font-size="13.5" fill="#0A0A0E">They keep them or resell them</text>
<text x="26.0" y="603.0" font-size="13.5" fill="#0A0A0E">to investors on the secondary</text>
<text x="26.0" y="620.0" font-size="13.5" fill="#0A0A0E">market.</text>
<circle cx="9.0" cy="639.0" r="9" fill="#184f95"/>
<text x="9.0" y="643.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">3</text>
<text x="26.0" y="643.0" font-size="13.5" fill="#0A0A0E">From 2015 to 2022 (net</text>
<text x="26.0" y="660.0" font-size="13.5" fill="#0A0A0E">purchases), the Banque de</text>
<text x="26.0" y="677.0" font-size="13.5" fill="#0A0A0E">France bought some on that</text>
<text x="26.0" y="694.0" font-size="13.5" fill="#0A0A0E">market for the Eurosystem (the</text>
<text x="26.0" y="711.0" font-size="13.5" fill="#0A0A0E">euro area central banks), then</text>
<text x="26.0" y="728.0" font-size="13.5" fill="#0A0A0E">replaced maturing bonds until</text>
<text x="26.0" y="745.0" font-size="13.5" fill="#0A0A0E">July 2023 or end-2024</text>
<text x="26.0" y="762.0" font-size="13.5" fill="#0A0A0E">depending on the programme;</text>
<text x="26.0" y="779.0" font-size="13.5" fill="#0A0A0E">never from the State itself:</text>
<text x="26.0" y="796.0" font-size="13.5" fill="#0A0A0E">the EU Treaty forbids it</text>
<text x="26.0" y="813.0" font-size="13.5" fill="#0A0A0E">(Article 123).</text>
<circle cx="9.0" cy="832.0" r="9" fill="#898781"/>
<text x="9.0" y="836.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">4</text>
<text x="26.0" y="836.0" font-size="13.5" fill="#0A0A0E">It paid in central bank money</text>
<text x="26.0" y="853.0" font-size="13.5" fill="#0A0A0E">created for the purchase:</text>
<text x="26.0" y="870.0" font-size="13.5" fill="#0A0A0E">reserves credited to the</text>
<text x="26.0" y="887.0" font-size="13.5" fill="#0A0A0E">seller's bank.</text>
<text x="0" y="928.0" font-size="13.5" font-weight="600" fill="#eb6834">2. Interest paid, and to whom</text>
<rect x="35.0" y="940.0" width="230.0" height="58.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="150.0" y="965.5" font-size="13" text-anchor="middle" fill="#0A0A0E" font-weight="600">The State</text>
<text x="150.0" y="981.5" font-size="12" text-anchor="middle" fill="#52514e">Agence France Trésor</text>
<rect x="35.0" y="1032.0" width="230.0" height="58.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="150.0" y="1049.5" font-size="13" text-anchor="middle" fill="#0A0A0E" font-weight="600">Investors</text>
<text x="150.0" y="1065.5" font-size="12" text-anchor="middle" fill="#52514e">insurers, banks, funds, in</text>
<text x="150.0" y="1081.5" font-size="12" text-anchor="middle" fill="#52514e">France and abroad</text>
<rect x="35.0" y="1124.0" width="230.0" height="58.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="150.0" y="1149.5" font-size="13" text-anchor="middle" fill="#0A0A0E" font-weight="600">Banque de France</text>
<text x="150.0" y="1165.5" font-size="12" text-anchor="middle" fill="#52514e">for the Eurosystem</text>
<rect x="35.0" y="1216.0" width="230.0" height="58.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="150.0" y="1241.5" font-size="13" text-anchor="middle" fill="#0A0A0E" font-weight="600">Banks</text>
<text x="150.0" y="1257.5" font-size="12" text-anchor="middle" fill="#52514e">holding the reserves</text>
<path d="M150.0,1001.0 L150.0,1029.0" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#fo)"/>
<circle cx="172.0" cy="1015.0" r="9" fill="#eb6834"/>
<text x="172.0" y="1019.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">5</text>
<path d="M32.0,969.0 L13.0,969.0 L13.0,1153.0 L32.0,1153.0" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#fo)"/>
<circle cx="13.0" cy="1061.0" r="9" fill="#eb6834"/>
<text x="13.0" y="1065.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">5</text>
<path d="M150.0,1185.0 L150.0,1213.0" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#fo)"/>
<circle cx="172.0" cy="1199.0" r="9" fill="#eb6834"/>
<text x="172.0" y="1203.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">6</text>
<path d="M268.0,1153.0 L287.0,1153.0 L287.0,969.0 L268.0,969.0" fill="none" stroke="#898781" stroke-width="2" marker-end="url(#fg)"/>
<circle cx="287.0" cy="1061.0" r="9" fill="#898781"/>
<text x="287.0" y="1065.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">7</text>
<circle cx="9.0" cy="1298.0" r="9" fill="#eb6834"/>
<text x="9.0" y="1302.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">5</text>
<text x="26.0" y="1302.0" font-size="13.5" fill="#0A0A0E">Each year, the State pays</text>
<text x="26.0" y="1319.0" font-size="13.5" fill="#0A0A0E">interest on its bonds to every</text>
<text x="26.0" y="1336.0" font-size="13.5" fill="#0A0A0E">holder, the Banque de France</text>
<text x="26.0" y="1353.0" font-size="13.5" fill="#0A0A0E">included. At maturity, it</text>
<text x="26.0" y="1370.0" font-size="13.5" fill="#0A0A0E">repays the bond from its cash</text>
<text x="26.0" y="1387.0" font-size="13.5" fill="#0A0A0E">or new borrowing: back to 1.</text>
<circle cx="9.0" cy="1406.0" r="9" fill="#eb6834"/>
<text x="9.0" y="1410.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">6</text>
<text x="26.0" y="1410.0" font-size="13.5" fill="#0A0A0E">The Banque de France pays the</text>
<text x="26.0" y="1427.0" font-size="13.5" fill="#0A0A0E">ECB deposit rate on reserves</text>
<text x="26.0" y="1444.0" font-size="13.5" fill="#0A0A0E">placed in its deposit facility</text>
<text x="26.0" y="1461.0" font-size="13.5" fill="#0A0A0E">(minimum reserves have not</text>
<text x="26.0" y="1478.0" font-size="13.5" fill="#0A0A0E">been remunerated since</text>
<text x="26.0" y="1495.0" font-size="13.5" fill="#0A0A0E">September 2023).</text>
<circle cx="9.0" cy="1514.0" r="9" fill="#898781"/>
<text x="9.0" y="1518.0" font-size="11" font-weight="600" text-anchor="middle" fill="#fff">7</text>
<text x="26.0" y="1518.0" font-size="13.5" fill="#0A0A0E">Depending on its results, it</text>
<text x="26.0" y="1535.0" font-size="13.5" fill="#0A0A0E">pays the State tax and a</text>
<text x="26.0" y="1552.0" font-size="13.5" fill="#0A0A0E">dividend. When reserves cost</text>
<text x="26.0" y="1569.0" font-size="13.5" fill="#0A0A0E">it more than its bonds earn,</text>
<text x="26.0" y="1586.0" font-size="13.5" fill="#0A0A0E">its results fall: it paid no</text>
<text x="26.0" y="1603.0" font-size="13.5" fill="#0A0A0E">dividend for the 2022 to 2025</text>
<text x="26.0" y="1620.0" font-size="13.5" fill="#0A0A0E">financial years.</text>
<line x1="0" y1="1643.0" x2="300" y2="1643.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="1664.0" font-size="13.5" fill="#52514e">Author's diagram; Agence France</text>
<text class="pied-source" x="0" y="1681.0" font-size="13.5" fill="#52514e">Trésor, Banque de France (annual</text>
<text class="pied-source" x="0" y="1698.0" font-size="13.5" fill="#52514e">accounts), ECB, Treaty on the</text>
<text class="pied-source" x="0" y="1715.0" font-size="13.5" fill="#52514e">Functioning of the EU (Art. 123).</text>
<text class="pied-note" x="0" y="1736.0" font-size="13.5" fill="#52514e">Simplified: the State is only part of</text>
<text class="pied-note" x="0" y="1753.0" font-size="13.5" fill="#52514e">general government, and the Banque de</text>
<text class="pied-note" x="0" y="1770.0" font-size="13.5" fill="#52514e">France is not part of it.</text>
<text class="pied-licence" x="0" y="1791.0" font-size="13.5" fill="#898781">Stéphane Lalut, CC BY 4.0</text>
<text class="pied-licence" x="0" y="1808.0" font-size="13.5" fill="#898781">· stephane-lalut.com</text>
</svg>
