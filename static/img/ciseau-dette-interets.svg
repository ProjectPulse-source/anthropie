<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="cz-t cz-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="cz-t">Le ciseau de la dette publique française : encours et charge d'intérêts, 1995-2026</title>
<desc id="cz-d">Deux courbes en pourcentage du PIB. En haut, la dette publique passe de 57,8 % du PIB en T4 1995 à 117,5 % au T1 2026. En bas, les intérêts versés par les administrations publiques passent de 3,5 % du PIB en 1995 à un creux de 1,3 % en 2020, puis remontent à 2,2 % en 2025.</desc>
<text x="46" y="22" font-size="13" fill="#52514e">Dette publique des administrations, en % du PIB (INSEE, trimestriel)</text>
<text x="46" y="288" font-size="13" fill="#52514e">Intérêts versés par les administrations, en % du PIB (Eurostat, annuel)</text>
