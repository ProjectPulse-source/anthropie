<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 738" role="img" font-variant-numeric="tabular-nums" aria-labelledby="csm-t csm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="csm-t">Local investment and transfers received, in % of GDP</title><desc id="csm-d">Two lines since 1995: local investment (gross fixed capital formation) hovers around 2% of GDP; from 2013 to 2017, it went from 2.4% to 1.9% of GDP and transfers received from 3.3% to 2.7%. The comparable transfer series stops in 2017.</desc>
<rect width="300" height="738" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">Local investment and transfers</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">received, in % of GDP</text>
<rect x="197.2" y="84" width="35.2" height="170" fill="#f3efe6"/>
<line x1="30" y1="229.7" x2="294" y2="229.7" stroke="#e1e0d9"/>
<text x="26" y="234.7" font-size="13.5" fill="#898781" text-anchor="end">2</text>
<line x1="30" y1="181.1" x2="294" y2="181.1" stroke="#e1e0d9"/>
<text x="26" y="186.1" font-size="13.5" fill="#898781" text-anchor="end">3</text>
<line x1="30" y1="132.6" x2="294" y2="132.6" stroke="#e1e0d9"/>
<text x="26" y="137.6" font-size="13.5" fill="#898781" text-anchor="end">4</text>
<line x1="30" y1="84.0" x2="294" y2="84.0" stroke="#e1e0d9"/>
<text x="26" y="89.0" font-size="13.5" fill="#898781" text-anchor="end">5</text>
<text x="30.0" y="272" font-size="13.5" fill="#898781" text-anchor="start">1995</text>
<text x="197.2" y="272" font-size="13.5" fill="#898781" text-anchor="middle">2014</text>
<text x="294.0" y="272" font-size="13.5" fill="#898781" text-anchor="end">2025</text>
<polyline points="30.0,197.0 38.8,190.9 47.6,187.7 56.4,192.7 65.2,185.0 74.0,173.1 82.8,170.2 91.6,155.6 100.4,151.3 109.2,152.9 118.0,158.6 126.8,158.0 135.6,165.0 144.4,163.1 153.2,151.4 162.0,100.6 170.8,160.9 179.6,166.3 188.4,165.8 197.2,173.4 206.0,182.9 214.8,191.9 223.6,196.7" fill="none" stroke="#8a8f98" stroke-width="2.6"/>
<polyline points="30.0,217.2 38.8,223.0 47.6,232.2 56.4,233.2 65.2,225.4 74.0,218.7 82.8,221.7 91.6,227.0 100.4,224.3 109.2,219.8 118.0,214.8 126.8,213.3 135.6,210.0 144.4,210.6 153.2,208.9 162.0,219.5 170.8,220.5 179.6,216.0 188.4,212.1 197.2,223.2 206.0,235.1 214.8,239.3 223.6,236.5 232.4,231.6 241.2,220.3 250.0,225.3 258.8,224.9 267.6,223.0 276.4,218.3 285.2,213.7 294.0,212.1" fill="none" stroke="#184f95" stroke-width="2.6"/>
<circle cx="223.6" cy="196.7" r="4" fill="#ffffff" stroke="#8a8f98" stroke-width="2"/>
<text x="0" y="300" font-size="15" font-weight="600" fill="#8a8f98">Transfers received: 3.3% → 2.7%</text>
<text x="0" y="320" font-size="15" font-weight="600" fill="#184f95">Investment: 2.4% → 1.9%</text>
<text x="0" y="339" font-size="13.5" fill="#52514e">From 2013 to 2017, in % of GDP. The</text>
<text x="0" y="358" font-size="13.5" fill="#52514e">transfer series stops in 2017: in 2018</text>
<text x="0" y="377" font-size="13.5" fill="#52514e">and 2021, some grants became shares of</text>
<text x="0" y="396" font-size="13.5" fill="#52514e">VAT, counted as taxes.</text>
<line x1="0" y1="410.0" x2="300" y2="410.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="431.0" font-size="13.5" fill="#52514e">Eurostat gov_10a_main, local</text>
<text class="pied-source" x="0" y="448.0" font-size="13.5" fill="#52514e">government (S1313): investment P51G,</text>
<text class="pied-source" x="0" y="465.0" font-size="13.5" fill="#52514e">current transfers received D73REC;</text>
<text class="pied-source" x="0" y="482.0" font-size="13.5" fill="#52514e">France. Data retrieved on 21 October</text>
<text class="pied-source" x="0" y="499.0" font-size="13.5" fill="#52514e">2026.</text>
<text class="pied-note" x="0" y="520.0" font-size="13.5" fill="#52514e">Transfers received: from central</text>
<text class="pied-note" x="0" y="537.0" font-size="13.5" fill="#52514e">government and social security, all</text>
<text class="pied-note" x="0" y="554.0" font-size="13.5" fill="#52514e">grants together; this is not the DGF</text>
<text class="pied-note" x="0" y="571.0" font-size="13.5" fill="#52514e">grant. Comparable series stops in</text>
<text class="pied-note" x="0" y="588.0" font-size="13.5" fill="#52514e">2017: in 2018 and again in 2021, some</text>
<text class="pied-note" x="0" y="605.0" font-size="13.5" fill="#52514e">grants were replaced by shares of VAT,</text>
<text class="pied-note" x="0" y="622.0" font-size="13.5" fill="#52514e">counted as taxes. This</text>
<text class="pied-note" x="0" y="639.0" font-size="13.5" fill="#52514e">reclassification changes the category</text>
<text class="pied-note" x="0" y="656.0" font-size="13.5" fill="#52514e">of the revenue; on its own, it does</text>
<text class="pied-note" x="0" y="673.0" font-size="13.5" fill="#52514e">not say whether resources rose or</text>
<text class="pied-note" x="0" y="690.0" font-size="13.5" fill="#52514e">fell.</text>
