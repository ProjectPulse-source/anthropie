<title id="ce-t">Subnational government debt and the share held by central government, in % of GDP</title><desc id="ce-d">Four small charts. France: between 7 and 10%. Germany: between 20 and 30%, carried by the Länder. Italy: rises, then falls back below 5%. Spain: from about 9% to more than 20%, more than half of it held by central government.</desc>
