<title id="ce-t">Subnational government debt and the share held by central government, in % of GDP</title><desc id="ce-d">Four small charts, from 2000 to 2025. France: 7.2% of GDP in 2000, 9.3% in 2025; share held by central government in 2025: 0.1 percentage points of GDP. Germany: 21.7% of GDP in 2000, 19.6% in 2025; share held by central government in 2025: 0.2 percentage points of GDP. Italy: 5.3% of GDP in 2000, 4.7% in 2025; share held by central government in 2025: 1.2 percentage points of GDP. Spain: 9.2% of GDP in 2000, 21.4% in 2025; share held by central government in 2025: 12.6 percentage points of GDP.</desc>
