<text class="pied-source" x="0" y="325.0" font-size="11" fill="#55524f">IEA (TIMSS 2023, rapport international) ; DEPP (PIRLS 2021, NI 23-21 ; test de positionnement de seconde, NI 26-22) ;</text>
