<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 544" role="img" font-variant-numeric="tabular-nums" aria-labelledby="rpm-t rpm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="rpm-t">The shared-initiative referendum, 2015-2026</title><desc id="rpm-d">Referrals to the Conseil constitutionnel: 7; meeting the statutory conditions: 1; support of one tenth of registered voters reached: 0; put to a referendum: 0. The bill that met the conditions collected 1,093,030 signatures of support for 4,717,396 required, 23.2% of the threshold.</desc>
<rect width="300" height="544" fill="#ffffff"/>
<text x="0.0" y="20.0" font-size="17" fill="#0A0A0E" text-anchor="start" font-weight="600">The shared-initiative</text>
<text x="0.0" y="42.0" font-size="17" fill="#0A0A0E" text-anchor="start" font-weight="600">referendum, 2015-2026</text>
<text x="0.0" y="82.0" font-size="13.5" fill="#52514e" text-anchor="start">Referrals</text>
<rect x="0" y="88" width="260.0" height="20" fill="#184f95"/>
<text class="val" x="268.0" y="103.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">7</text>
<text x="0.0" y="130.0" font-size="13.5" fill="#52514e" text-anchor="start">Met the statutory conditions</text>
<rect x="0" y="136" width="37.1" height="20" fill="#184f95"/>
<text class="val" x="45.1" y="151.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">1</text>
<text x="0.0" y="178.0" font-size="13.5" fill="#52514e" text-anchor="start">One tenth of voters&#x27; support reached</text>
<line x1="1" y1="184" x2="1" y2="204" stroke="#52514e" stroke-width="2"/>
<text class="val" x="8.0" y="199.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">0</text>
<text x="0.0" y="226.0" font-size="13.5" fill="#52514e" text-anchor="start">Put to a referendum</text>
<line x1="1" y1="232" x2="1" y2="252" stroke="#52514e" stroke-width="2"/>
<text class="val" x="8.0" y="247.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">0</text>
<text x="0.0" y="274.0" font-size="13.5" fill="#0A0A0E" text-anchor="start" font-weight="600">2019-1 RIP</text>
<rect x="0" y="282" width="298" height="14" fill="none" stroke="#52514e"/>
<rect x="0" y="282" width="69.0" height="14" fill="#8a8f98"/>
