<text class="val" x="0.0" y="334.0" font-size="13.5" fill="#52514e" text-anchor="start">Threshold: 4,717,396 (one tenth of</text>
<text class="val" x="0.0" y="353.0" font-size="13.5" fill="#52514e" text-anchor="start">registered voters)</text>
<text class="val" x="0.0" y="372.0" font-size="13.5" fill="#52514e" text-anchor="start">23.2% of the threshold</text>
<line x1="0" y1="386.0" x2="300" y2="386.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="407.0" font-size="13.5" fill="#52514e">Conseil constitutionnel, 'RIP'</text>
<text class="pied-source" x="0" y="424.0" font-size="13.5" fill="#52514e">decisions (DILA CONSTIT database, as</text>
<text class="pied-source" x="0" y="441.0" font-size="13.5" fill="#52514e">at 5 Oct. 2026); Constitution, art. 11</text>
<text class="pied-note" x="0" y="462.0" font-size="13.5" fill="#52514e">Three other bills tabled 'under</text>
<text class="pied-note" x="0" y="479.0" font-size="13.5" fill="#52514e">article 11' (Senate, National</text>
<text class="pied-note" x="0" y="496.0" font-size="13.5" fill="#52514e">Assembly) gave rise to no decision.</text>
