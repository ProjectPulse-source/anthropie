<text class="pied-note" x="0" y="455.0" font-size="13.5" fill="#55524f">Résidence du détenteur enregistré</text>
<text class="pied-note" x="0" y="472.0" font-size="13.5" fill="#55524f">(fonds, dépositaire), non de</text>
<text class="pied-note" x="0" y="489.0" font-size="13.5" fill="#55524f">l'épargnant final ; valeur nominale.</text>
<text class="pied-note" x="0" y="506.0" font-size="13.5" fill="#55524f">La part des non-résidents ne mesure</text>
<text class="pied-note" x="0" y="523.0" font-size="13.5" fill="#55524f">pas, à elle seule, le transfert net de</text>
<text class="pied-note" x="0" y="540.0" font-size="13.5" fill="#55524f">richesse vers l'étranger.</text>
