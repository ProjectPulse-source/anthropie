<title id="gdm-t">Qui détient la dette publique française</title><desc id="gdm-d">Parts de la dette des administrations publiques détenues par les non-résidents, par la Banque de France et par les autres résidents, de 1995 à 2025. Non-résidents : 38,8 % en 1995, 57,1 % au plus haut en 2014, 54,3 % en 2025. Banque de France : 1,7 % en 1995, 22,6 % en 2022, 16,5 % en 2025. Autres résidents : 29,2 % en 2025.</desc>
