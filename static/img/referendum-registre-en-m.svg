<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 599" role="img" font-variant-numeric="tabular-nums" aria-labelledby="rrm-t rrm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="rrm-t">National referendums in France since 1958</title><desc id="rrm-d">Timeline from 1958 to 2026 with nine national referendums: seven adopted and two rejected (1969 and 2005); no vote since 29 May 2005. Share of yes among valid votes: 1961: 75%; 1962 (apr.): 91%; 1962 (oct.): 62%; 1969: 48%; 1972: 68%; 1988: 80%; 1992: 51%; 2000: 73%; 2005: 45%.</desc>
<rect width="300" height="599" fill="#ffffff"/>
<text x="0.0" y="20.0" font-size="17" fill="#0A0A0E" text-anchor="start" font-weight="600">National referendums in France</text>
<text x="0.0" y="42.0" font-size="17" fill="#0A0A0E" text-anchor="start" font-weight="600">since 1958</text>
<text x="0.0" y="70.0" font-size="13.5" fill="#52514e" text-anchor="start">share of &#x27;yes&#x27; among valid votes</text>
<text x="0.0" y="126.0" font-size="13.5" fill="#52514e" text-anchor="start">1961</text>
<rect x="92" y="112" width="118.5" height="18" fill="#184f95"/>
<text class="val" x="216.5" y="126.0" font-size="13.5" fill="#0A0A0E" text-anchor="start" font-weight="600">75%</text>
<text x="0.0" y="152.0" font-size="13.5" fill="#52514e" text-anchor="start">1962 (apr.)</text>
<rect x="92" y="138" width="143.5" height="18" fill="#184f95"/>
<text class="val" x="241.5" y="152.0" font-size="13.5" fill="#0A0A0E" text-anchor="start" font-weight="600">91%</text>
<text x="0.0" y="178.0" font-size="13.5" fill="#52514e" text-anchor="start">1962 (oct.)</text>
<rect x="92" y="164" width="98.4" height="18" fill="#184f95"/>
<text class="val" x="196.4" y="178.0" font-size="13.5" fill="#0A0A0E" text-anchor="start" font-weight="600">62%</text>
<text x="0.0" y="204.0" font-size="13.5" fill="#52514e" text-anchor="start">1969</text>
<rect x="92" y="191" width="75.2" height="18" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
<text class="val" x="173.2" y="204.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="600">48%</text>
<text x="0.0" y="230.0" font-size="13.5" fill="#52514e" text-anchor="start">1972</text>
<rect x="92" y="216" width="107.9" height="18" fill="#184f95"/>
<text class="val" x="205.9" y="230.0" font-size="13.5" fill="#0A0A0E" text-anchor="start" font-weight="600">68%</text>
<text x="0.0" y="256.0" font-size="13.5" fill="#52514e" text-anchor="start">1988</text>
<rect x="92" y="242" width="126.4" height="18" fill="#184f95"/>
<text class="val" x="224.4" y="256.0" font-size="13.5" fill="#0A0A0E" text-anchor="start" font-weight="600">80%</text>
<text x="0.0" y="282.0" font-size="13.5" fill="#52514e" text-anchor="start">1992</text>
<rect x="92" y="268" width="80.7" height="18" fill="#184f95"/>
<text class="val" x="178.7" y="282.0" font-size="13.5" fill="#0A0A0E" text-anchor="start" font-weight="600">51%</text>
<text x="0.0" y="308.0" font-size="13.5" fill="#52514e" text-anchor="start">2000</text>
<rect x="92" y="294" width="115.7" height="18" fill="#184f95"/>
<text class="val" x="213.7" y="308.0" font-size="13.5" fill="#0A0A0E" text-anchor="start" font-weight="600">73%</text>
<text x="0.0" y="334.0" font-size="13.5" fill="#52514e" text-anchor="start">2005</text>
<rect x="92" y="321" width="71.6" height="18" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
<text class="val" x="169.6" y="334.0" font-size="13.5" fill="#52514e" text-anchor="start" font-weight="600">45%</text>
<line x1="171.0" y1="94" x2="171.0" y2="342" stroke="#8a8f98" stroke-dasharray="3 3"/>
<rect x="0" y="354" width="14" height="14" fill="#184f95"/>
<text x="20.0" y="366.0" font-size="13.5" fill="#52514e" text-anchor="start">adopted</text>
<rect x="110" y="354" width="14" height="14" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
<text x="130.0" y="366.0" font-size="13.5" fill="#52514e" text-anchor="start">rejected</text>
<text x="0.0" y="388.0" font-size="13.5" fill="#898781" text-anchor="start">50% of valid votes: - - -</text>
<text x="0.0" y="410.0" font-size="13.5" fill="#0A0A0E" text-anchor="start" font-weight="600">No vote since 29 May 2005</text>
<line x1="0" y1="424.0" x2="300" y2="424.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="445.0" font-size="13.5" fill="#52514e">Conseil constitutionnel, proclamations</text>
<text class="pied-source" x="0" y="462.0" font-size="13.5" fill="#52514e">of results (DILA CONSTIT database, as</text>
<text class="pied-source" x="0" y="479.0" font-size="13.5" fill="#52514e">at 5 Oct. 2026); Journal officiel</text>
<text class="pied-note" x="0" y="500.0" font-size="13.5" fill="#52514e">National referendums under articles 11</text>
<text class="pied-note" x="0" y="517.0" font-size="13.5" fill="#52514e">and 89 only (none was held under</text>
<text class="pied-note" x="0" y="534.0" font-size="13.5" fill="#52514e">article 88-5); excludes the vote of 28</text>
<text class="pied-note" x="0" y="551.0" font-size="13.5" fill="#52514e">Sept. 1958 and local consultations.</text>
