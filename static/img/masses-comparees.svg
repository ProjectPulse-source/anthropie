<text x="536.0" y="69.2" font-size="11" fill="#52514e"><tspan font-weight="600">Santé</tspan> 261</text>
<text x="536.0" y="82.2" font-size="10" fill="#898781">hôpital 109 · ambulatoire 92</text>
<text x="536.0" y="95.2" font-size="10" fill="#898781">produits médicaux 44 · autres 16</text>
<text x="536.0" y="108.2" font-size="10" fill="#898781">+26 % depuis 2020</text>
<text x="536.0" y="188.9" font-size="11" fill="#898781"><tspan font-weight="600">Enseignement</tspan> 149</text>
