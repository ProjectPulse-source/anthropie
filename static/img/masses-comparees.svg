<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 428" role="img" aria-labelledby="ma-t ma-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="ma-t">La charge d'intérêts face aux grands budgets publics, 1995-2024</title>
<desc id="ma-d">Quatre courbes en milliards d'euros courants, de 1995 à 2024. La santé et l'enseignement progressent régulièrement et restent les plus élevés. La charge d'intérêts baisse jusqu'au début des années 2020, puis remonte et repasse au-dessus du poste « ordre et sécurité ».</desc>
<text x="0" y="22" font-size="13" fill="#52514e">Milliards d'euros courants — la charge d'intérêts comparée à quelques grandes fonctions de dépense publique</text>
