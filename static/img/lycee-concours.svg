<title id="lyc-k-t">Part des postes pourvus aux concours externes d'enseignants, 2008-2025 et 2026</title><desc id="lyc-k-d">Courbes 2008-2025 de la part des postes pourvus. CAPES de mathématiques : 71,4 % en 2023, 75,2 en 2024, 71,4 en 2025. CAPES de physique-chimie : 72,7, 65,1, 73,7. Ensemble des concours externes (années publiées) : 86,7 % en 2015, 89,3 en 2025. Session 2026, hors série (deux concours, bac+3 et bac+5, ministère) : CAPES de mathématiques 93,1 %, de physique-chimie 97,8 %.</desc>
