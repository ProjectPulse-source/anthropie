<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" font-variant-numeric="tabular-nums" aria-labelledby="bs-t bs-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="bs-t">France : le solde primaire observé et celui qui aurait stabilisé la dette</title><desc id="bs-d">Deux courbes annuelles de 1996 à 2025, en % du PIB : le solde primaire observé, positif quatre fois (1998 à 2001), et le solde primaire qui aurait stabilisé le ratio de dette, qui va de −7,3 en 2021 à +6,1 en 2020. En 2025, le solde observé est de −2,9 et le solde stabilisant de +0,0.</desc>
<rect width="720" height="372" fill="#ffffff"/>
<text x="0" y="18" font-size="15" font-weight="600" fill="#26262f">France : le solde primaire observé et celui qui aurait stabilisé la dette</text>
