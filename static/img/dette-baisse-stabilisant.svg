<text x="233" y="45" font-size="11" fill="#55524f">solde qui aurait stabilisé le ratio cette année-là, hors autres ajustements</text>
<line x1="0" y1="324.0" x2="720" y2="324.0" stroke="#dcd8d3"/>
<text x="0" y="337.0" font-size="9" fill="#55524f">Eurostat gov_10dd_edpt1 (dette, PIB), gov_10a_main (B9, D41PAY), France, 1996-2025</text>
<text x="0" y="349.0" font-size="9" fill="#55524f">En % du PIB ; solde stabilisant = (taux implicite − croissance nominale) / (1 + croissance) × dette de l'année précédente, hors autres ajustements (flux-stock).</text>
