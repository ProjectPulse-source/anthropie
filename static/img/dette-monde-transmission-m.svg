<title id="mt-m-t">Pression de refinancement, 2025</title><desc id="mt-m-d">Chaque point est un pays : à droite, une plus grande part de la dette arrive à échéance dans l'année ; en haut, le rendement harmonisé à 10 ans dépasse davantage le taux implicite du stock. Si les conditions de financement restaient supérieures au coût de la dette remplacée, les refinancements pousseraient le coût moyen à la hausse. Sous zéro, l'indicateur est orienté dans l'autre sens. Repère, non prévision. France : 9,5 % de la dette à moins d'un an, écart de 1,36 point.</desc>
