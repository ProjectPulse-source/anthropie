<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 493" role="img" font-variant-numeric="tabular-nums" aria-labelledby="mp-t mp-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="mp-t">Prix de la dette et inflation récente : l'Europe en 2025</title><desc id="mp-d">Hors de la zone euro, le taux implicite est étroitement associé à l'inflation récente ; dans la zone euro, beaucoup moins : les pays baltes ont connu une forte inflation sans taux élevé. La Suède, hors euro, a le même taux implicite que l'Allemagne. Association observée sur une année, non causalité. Taux implicite : Hongrie 5,52 %, Roumanie 5,63 %, France 1,99 %, Allemagne 1,82 %, Suède 1,89 %.</desc>
