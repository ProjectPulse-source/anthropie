<text x="173.5" y="432.0" font-size="13.5" fill="#52514e" text-anchor="middle">2022</text>
<text x="245.9" y="432.0" font-size="13.5" fill="#52514e" text-anchor="start">2025</text>
<text x="298.0" y="626.0" font-size="13.5" fill="#0A0A0E" text-anchor="end" font-weight="600">3e trimestre 2026 : 2,4 M</text>
<text x="0.0" y="650.0" font-size="13.5" fill="#52514e" text-anchor="start">Bande : nouveau formulaire</text>
<text x="0.0" y="668.0" font-size="13.5" fill="#52514e" text-anchor="start">d&#x27;actualisation, 2022 ; pointillé :</text>
<text x="0.0" y="686.0" font-size="13.5" fill="#52514e" text-anchor="start">loi pour le plein emploi,</text>
<text x="0.0" y="704.0" font-size="13.5" fill="#52514e" text-anchor="start">1er janvier 2025.</text>
<text x="0.0" y="722.0" font-size="13.5" fill="#52514e" text-anchor="start">Les deux séries sautent au 1er</text>
<text x="0.0" y="740.0" font-size="13.5" fill="#52514e" text-anchor="start">trimestre 2025 et reculent au 2e</text>
<text x="0.0" y="758.0" font-size="13.5" fill="#52514e" text-anchor="start">(affectées par l&#x27;actualisation</text>
<text x="0.0" y="776.0" font-size="13.5" fill="#52514e" text-anchor="start">automatique de janvier à mars 2025) ;</text>
<text x="0.0" y="794.0" font-size="13.5" fill="#52514e" text-anchor="start">leur écart ne mesure pas l&#x27;effet de la</text>
<text x="0.0" y="812.0" font-size="13.5" fill="#52514e" text-anchor="start">réforme.</text>
<line x1="0" y1="824.0" x2="300" y2="824.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="845.0" font-size="13.5" fill="#52514e">Dares et France Travail, moyenne</text>
<text class="pied-source" x="0" y="862.0" font-size="13.5" fill="#52514e">trimestrielle des inscrits en fin de</text>
<text class="pied-source" x="0" y="879.0" font-size="13.5" fill="#52514e">mois, France hors Mayotte, données</text>
<text class="pied-source" x="0" y="896.0" font-size="13.5" fill="#52514e">CVS-CJO (série hors bénéficiaires du</text>
<text class="pied-source" x="0" y="913.0" font-size="13.5" fill="#52514e">RSA et hors jeunes en parcours depuis</text>
<text class="pied-source" x="0" y="930.0" font-size="13.5" fill="#52514e">2018)</text>
<text class="pied-note" x="0" y="951.0" font-size="13.5" fill="#52514e">Jeunes en parcours : en contrat</text>
<text class="pied-note" x="0" y="968.0" font-size="13.5" fill="#52514e">d'engagement jeune (CEJ), en parcours</text>
<text class="pied-note" x="0" y="985.0" font-size="13.5" fill="#52514e">contractualisé d'accompagnement vers</text>
<text class="pied-note" x="0" y="1002.0" font-size="13.5" fill="#52514e">l'emploi et l'autonomie (Pacea) ou en</text>
<text class="pied-note" x="0" y="1019.0" font-size="13.5" fill="#52514e">accompagnement individualisé des</text>
<text class="pied-note" x="0" y="1036.0" font-size="13.5" fill="#52514e">jeunes de France Travail (AIJ), selon</text>
<text class="pied-note" x="0" y="1053.0" font-size="13.5" fill="#52514e">la Dares. Champ et période différents</text>
<text class="pied-note" x="0" y="1070.0" font-size="13.5" fill="#52514e">de la figure du croisement 2024.</text>
<text class="pied-note" x="0" y="1087.0" font-size="13.5" fill="#52514e">Séries non labellisées depuis le</text>
<text class="pied-note" x="0" y="1104.0" font-size="13.5" fill="#52514e">01/01/2025 (label de 2021, valable</text>
<text class="pied-note" x="0" y="1121.0" font-size="13.5" fill="#52514e">jusqu'au 20/05/2026, suspendu par</text>
<text class="pied-note" x="0" y="1138.0" font-size="13.5" fill="#52514e">l'Autorité de la statistique publique).</text>
