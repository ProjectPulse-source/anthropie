<text x="245.9" y="158.0" font-size="13.5" fill="#52514e" text-anchor="start">2025</text>
<text x="298.0" y="352.0" font-size="13.5" fill="#0A0A0E" text-anchor="end" font-weight="600">3e trimestre 2026 : 3,4 M</text>
<text x="0.0" y="392.0" font-size="15.5" fill="#52514e" text-anchor="start" font-weight="600">Hors bénéficiaires du RSA</text>
<text x="0.0" y="410.0" font-size="15.5" fill="#52514e" text-anchor="start" font-weight="600">et hors jeunes en parcours</text>
<rect x="163.1" y="434.0" width="20.8" height="158.0" fill="#eeede8" opacity="0.6"/>
<line x1="52.0" y1="592.0" x2="288.0" y2="592.0" stroke="#e1e0d9"/>
