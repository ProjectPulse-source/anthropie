<text x="251.7" y="408.0" font-size="13.5" fill="#52514e" text-anchor="start">2025</text>
<text x="298.0" y="602.0" font-size="13.5" fill="#0A0A0E" text-anchor="end" font-weight="600">2e trimestre 2026 : 2,4 M</text>
<text x="0.0" y="626.0" font-size="13.5" fill="#52514e" text-anchor="start">Les deux séries sautent au 1er</text>
<text x="0.0" y="644.0" font-size="13.5" fill="#52514e" text-anchor="start">trimestre 2025 et reculent au 2e</text>
<text x="0.0" y="662.0" font-size="13.5" fill="#52514e" text-anchor="start">(actualisation automatique,</text>
<text x="0.0" y="680.0" font-size="13.5" fill="#52514e" text-anchor="start">janvier-mars 2025) ; leur écart ne</text>
<text x="0.0" y="698.0" font-size="13.5" fill="#52514e" text-anchor="start">mesure pas l&#x27;effet de la réforme.</text>
<line x1="0" y1="710.0" x2="300" y2="710.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="731.0" font-size="13.5" fill="#52514e">Dares et France Travail, moyenne</text>
<text class="pied-source" x="0" y="748.0" font-size="13.5" fill="#52514e">trimestrielle des inscrits en fin de</text>
<text class="pied-source" x="0" y="765.0" font-size="13.5" fill="#52514e">mois, France hors Mayotte, données</text>
<text class="pied-source" x="0" y="782.0" font-size="13.5" fill="#52514e">CVS-CJO (série « hors RSA » depuis</text>
<text class="pied-source" x="0" y="799.0" font-size="13.5" fill="#52514e">2018)</text>
<text class="pied-note" x="0" y="820.0" font-size="13.5" fill="#52514e">Champ et période différents de la</text>
<text class="pied-note" x="0" y="837.0" font-size="13.5" fill="#52514e">figure du croisement 2024.</text>
<text class="pied-note" x="0" y="854.0" font-size="13.5" fill="#52514e">Labellisation de l'ASP suspendue</text>
<text class="pied-note" x="0" y="871.0" font-size="13.5" fill="#52514e">depuis le 01/01/2025 (label de 2021,</text>
<text class="pied-note" x="0" y="888.0" font-size="13.5" fill="#52514e">qui courait jusqu'au 20/05/2026).</text>
