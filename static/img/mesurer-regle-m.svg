<text x="46.0" y="459.6" font-size="14.5" fill="#6f6c66" text-anchor="end">4,2 M</text>
<text x="107.5" y="607.0" font-size="14.5" fill="#6f6c66" text-anchor="middle">2020</text>
<text x="218.6" y="607.0" font-size="14.5" fill="#6f6c66" text-anchor="middle">2024</text>
<line x1="242.9" y1="434.0" x2="242.9" y2="592.0" stroke="#52514e" stroke-dasharray="3 3"/>
