<text x="46.0" y="294.7" font-size="14.5" fill="#6f6c66" text-anchor="end">2,6 M</text>
<line x1="52.0" y1="263.5" x2="288.0" y2="263.5" stroke="#e1e0d9"/>
<text x="46.0" y="267.5" font-size="14.5" fill="#6f6c66" text-anchor="end">3,0 M</text>
<line x1="52.0" y1="236.2" x2="288.0" y2="236.2" stroke="#e1e0d9"/>
<text x="46.0" y="240.2" font-size="14.5" fill="#6f6c66" text-anchor="end">3,4 M</text>
<line x1="52.0" y1="208.9" x2="288.0" y2="208.9" stroke="#e1e0d9"/>
<text x="46.0" y="212.9" font-size="14.5" fill="#6f6c66" text-anchor="end">3,8 M</text>
