<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 936" role="img" font-variant-numeric="tabular-nums" aria-labelledby="mgm-t mgm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="mgm-t">Inscrits en catégorie A : série publiée et série hors bénéficiaires du RSA et jeunes en parcours</title><desc id="mgm-d">Deux panneaux de 2018 à 2026, sur la même échelle : à gauche la catégorie A publiée, à droite la série hors bénéficiaires du RSA et hors jeunes en parcours. Une bande marque 2022 (nouveau formulaire d'actualisation), une ligne le 1er janvier 2025 (loi pour le plein emploi). Au 2e trimestre 2026, 3,3 M pour la catégorie A publiée et 2,4 M hors RSA.</desc>
<rect width="300" height="936" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">Inscrits en catégorie A :</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">série publiée et série hors</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#0A0A0E">bénéficiaires du RSA et jeunes</text>
<text x="0" y="86" font-size="17" font-weight="600" fill="#0A0A0E">en parcours</text>
<text x="0.0" y="142.0" font-size="15.5" fill="#184f95" text-anchor="start" font-weight="600">Catégorie A publiée</text>
