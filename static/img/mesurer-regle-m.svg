<text x="218.6" y="333.0" font-size="14.5" fill="#6f6c66" text-anchor="middle">2024</text>
<line x1="242.9" y1="160.0" x2="242.9" y2="318.0" stroke="#52514e" stroke-dasharray="3 3"/>
<polyline points="52.0,215.1 58.9,215.5 65.9,215.7 72.8,217.1 79.8,218.8 86.7,220.8 93.6,222.0 100.6,224.9 107.5,224.1 114.5,168.3 121.4,200.7 128.4,206.5 135.3,208.9 142.2,213.7 149.2,226.6 156.1,238.8 163.1,249.5 170.0,252.0 176.9,253.0 183.9,260.2 190.8,262.6 197.8,262.5 204.7,260.8 211.6,261.7 218.6,262.8 225.5,262.0 232.5,260.3 239.4,254.7 246.4,236.8 253.3,248.3 260.2,244.1 267.2,240.7 274.1,243.3 281.1,241.4 288.0,239.4" fill="none" stroke="#184f95" stroke-width="2.4"/>
