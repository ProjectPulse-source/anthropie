<text x="300" y="337" font-size="13.5" fill="#898781" text-anchor="end">+26%</text>
<line x1="0" y1="353" x2="14" y2="353" stroke="#898781" stroke-width="1.6"/>
<text x="20" y="358" font-size="13.5" fill="#52514e">Education</text>
<text x="238" y="358" font-size="13.5" font-weight="600" fill="#0A0A0E" text-anchor="end">149 bn</text>
<text x="300" y="358" font-size="13.5" fill="#898781" text-anchor="end">+24%</text>
<line x1="0" y1="374" x2="14" y2="374" stroke="#eb6834" stroke-width="2.6"/>
<text x="20" y="379" font-size="13.5" fill="#52514e">Interest due</text>
<text x="238" y="379" font-size="13.5" font-weight="600" fill="#0A0A0E" text-anchor="end">60 bn</text>
<text x="300" y="379" font-size="13.5" fill="#898781" text-anchor="end">+102%</text>
