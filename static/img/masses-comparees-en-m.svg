<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 610" role="img" font-variant-numeric="tabular-nums" aria-labelledby="mam-t mam-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="mam-t">Interest due against the main public budgets, 1995-2024</title><desc id="mam-d">Four curves in billion euros, from 1995 to 2024. Health and education rise steadily and stay the highest. Interest due falls until the early 2020s, then climbs back above the public order and safety function. In 2024: Interest due 60, Health 261, Education 149, Public order and safety 52; changes since 2020: Interest due +102%, Health +26%, Education +24%, Public order and safety +26%.</desc>
<rect width="300" height="610" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">Interest due against the main</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">public budgets, 1995-2024</text>
<line x1="34" y1="278.0" x2="292" y2="278.0" stroke="#c3c2b7"/>
<text x="29" y="283.0" font-size="13.5" fill="#898781" text-anchor="end">0</text>
