<text class="pied-source" x="0" y="439.0" font-size="13.5" fill="#52514e">Eurostat: interest due (gov_10a_main,</text>
<text class="pied-source" x="0" y="456.0" font-size="13.5" fill="#52514e">D41PAY) and general government</text>
<text class="pied-source" x="0" y="473.0" font-size="13.5" fill="#52514e">expenditure by function (gov_10a_exp,</text>
<text class="pied-source" x="0" y="490.0" font-size="13.5" fill="#52514e">COFOG), 1995-2024</text>
<text class="pied-note" x="0" y="511.0" font-size="13.5" fill="#52514e">Interest is a type of spending, the</text>
<text class="pied-note" x="0" y="528.0" font-size="13.5" fill="#52514e">other three are functions: not the</text>
<text class="pied-note" x="0" y="545.0" font-size="13.5" fill="#52514e">same breakdown, and no transfer from</text>
<text class="pied-note" x="0" y="562.0" font-size="13.5" fill="#52514e">one to the other is established.</text>
