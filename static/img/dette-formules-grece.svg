<title id="grec-t">Taux à dix ans : la France au-dessus ou au-dessous de la Grèce, mois par mois</title><desc id="grec-d">Barres mensuelles de janvier 2024 à septembre 2026 de l'écart entre le rendement à dix ans de la France et celui de la Grèce : négatif jusqu'au printemps 2025, positif à partir de août 2025 ; août 2025 3,42 contre 3,37 %, septembre 2025 3,51 contre 3,39 % ; Grèce de nouveau au-dessus de mars à mai 2026 ; septembre 2026 : +0,22 point.</desc>
