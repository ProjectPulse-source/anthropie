<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 988" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dcm-t dcm-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="dcm-t">Energy, 2000-2024: accounting decomposition of the change in consumption</title><desc id="dcm-d">Accounting decomposition of the change in primary energy consumption from 2000 to 2024, as % of 2000 consumption, with GDP at purchasing power parity; territorial consumption (energy embodied in imported goods not counted). World: population effect +35.6% (population: +32.4%), GDP-per-head effect +65.0% (GDP per head: +67.0%), energy-intensity effect −42.6% (energy per unit of GDP: −28.5%), total change +57.9%. European Union (27 countries): population effect +4.6% (population: +5.1%), GDP-per-head effect +27.6% (GDP per head: +35.6%), energy-intensity effect −50.1% (energy per unit of GDP: −42.4%), total change −17.9%. These terms measure neither causes nor what would have been consumed without the fall in intensity.</desc>
<rect width="300" height="988" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">Energy, 2000-2024: accounting</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">decomposition of the change in</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#26262f">consumption</text>
<text x="0" y="104" font-size="13.5" fill="#55524f">effects and change, as % of 2000</text>
<text x="0" y="122" font-size="13.5" fill="#55524f">consumption</text>
<text x="0" y="152" font-size="15" font-weight="600" fill="#26262f">World</text>
<text x="0" y="170" font-size="13.5" fill="#26262f">Population effect</text>
<text x="0" y="188" font-size="13.5" fill="#26262f">(population: +32.4%)</text>
<rect x="66.7" y="196" width="39.5" height="12" fill="#eb6834"/>
<text x="112.2" y="206" font-size="13.5" font-weight="600" fill="#26262f">+35.6%</text>
<text x="0" y="228" font-size="13.5" fill="#26262f">GDP-per-head effect</text>
<text x="0" y="246" font-size="13.5" fill="#26262f">(GDP per head: +67.0%)</text>
<rect x="66.7" y="254" width="72.2" height="12" fill="#eb6834"/>
<text x="144.9" y="264" font-size="13.5" font-weight="600" fill="#26262f">+65.0%</text>
<text x="0" y="286" font-size="13.5" fill="#26262f">Energy-intensity effect</text>
<text x="0" y="304" font-size="13.5" fill="#26262f">(energy per unit of GDP: −28.5%)</text>
<rect x="19.3" y="312" width="47.3" height="12" fill="#8a8781"/>
<text x="72.7" y="322" font-size="13.5" font-weight="600" fill="#26262f">−42.6%</text>
<text x="0" y="344" font-size="13.5" font-weight="600" fill="#26262f">Change in consumption</text>
<rect x="66.7" y="352" width="64.4" height="12" fill="#184f95"/>
<text x="137.0" y="362" font-size="13.5" font-weight="600" fill="#26262f">+57.9%</text>
<text x="0" y="396" font-size="15" font-weight="600" fill="#26262f">European Union (27 countries)</text>
<text x="0" y="414" font-size="13.5" fill="#26262f">Population effect</text>
<text x="0" y="432" font-size="13.5" fill="#26262f">(population: +5.1%)</text>
<rect x="66.7" y="440" width="5.1" height="12" fill="#eb6834"/>
<text x="77.7" y="450" font-size="13.5" font-weight="600" fill="#26262f">+4.6%</text>
<text x="0" y="472" font-size="13.5" fill="#26262f">GDP-per-head effect</text>
<text x="0" y="490" font-size="13.5" fill="#26262f">(GDP per head: +35.6%)</text>
<rect x="66.7" y="498" width="30.7" height="12" fill="#eb6834"/>
<text x="103.3" y="508" font-size="13.5" font-weight="600" fill="#26262f">+27.6%</text>
<text x="0" y="530" font-size="13.5" fill="#26262f">Energy-intensity effect</text>
<text x="0" y="548" font-size="13.5" fill="#26262f">(energy per unit of GDP: −42.4%)</text>
<rect x="11.0" y="556" width="55.6" height="12" fill="#8a8781"/>
<text x="72.7" y="566" font-size="13.5" font-weight="600" fill="#26262f">−50.1%</text>
<text x="0" y="588" font-size="13.5" font-weight="600" fill="#26262f">Change in consumption</text>
<rect x="46.7" y="596" width="19.9" height="12" fill="#184f95"/>
<text x="72.7" y="606" font-size="13.5" font-weight="600" fill="#26262f">−17.9%</text>
<line x1="0" y1="626.0" x2="300" y2="626.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="647.0" font-size="13.5" fill="#55524f">EIA, international data (energy, GDP</text>
<text class="pied-source" x="0" y="664.0" font-size="13.5" fill="#55524f">at purchasing power parity in constant</text>
<text class="pied-source" x="0" y="681.0" font-size="13.5" fill="#55524f">prices, population)</text>
<text class="pied-note" x="0" y="702.0" font-size="13.5" fill="#55524f">Territorial primary energy consumption</text>
<text class="pied-note" x="0" y="719.0" font-size="13.5" fill="#55524f">(energy embodied in imported goods not</text>
<text class="pied-note" x="0" y="736.0" font-size="13.5" fill="#55524f">counted); hydro and wind electricity</text>
<text class="pied-note" x="0" y="753.0" font-size="13.5" fill="#55524f">counted at its electrical content,</text>
<text class="pied-note" x="0" y="770.0" font-size="13.5" fill="#55524f">nuclear at the heat produced. The</text>
<text class="pied-note" x="0" y="787.0" font-size="13.5" fill="#55524f">intensity effect combines efficiency,</text>
<text class="pied-note" x="0" y="804.0" font-size="13.5" fill="#55524f">economic structure and the effect of</text>
<text class="pied-note" x="0" y="821.0" font-size="13.5" fill="#55524f">these conventions. Accounting</text>
<text class="pied-note" x="0" y="838.0" font-size="13.5" fill="#55524f">decomposition (Divisia index, GDP at</text>
<text class="pied-note" x="0" y="855.0" font-size="13.5" fill="#55524f">purchasing power parity): its terms</text>
<text class="pied-note" x="0" y="872.0" font-size="13.5" fill="#55524f">measure neither causes nor what would</text>
<text class="pied-note" x="0" y="889.0" font-size="13.5" fill="#55524f">have been consumed without the fall in</text>
<text class="pied-note" x="0" y="906.0" font-size="13.5" fill="#55524f">intensity. Effects rounded to one</text>
<text class="pied-note" x="0" y="923.0" font-size="13.5" fill="#55524f">decimal place: their sum may differ</text>
<text class="pied-note" x="0" y="940.0" font-size="13.5" fill="#55524f">from the total by 0.1 points.</text>
