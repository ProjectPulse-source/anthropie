<text x="0" y="416" font-size="13.5" fill="#55524f">moyennes 2015-2019 puis 2022-2025,</text>
<text x="0" y="434" font-size="13.5" fill="#55524f">en % du PIB potentiel</text>
<text x="0" y="456" font-size="15" font-weight="600" fill="#26262f">Commission : −1,1, puis −3,0</text>
<text x="0" y="478" font-size="15" font-weight="600" fill="#26262f">FMI : −0,5, puis −3,1</text>
<text x="0" y="500" font-size="15" font-weight="600" fill="#26262f">OCDE : −1,8, puis −3,4</text>
<line x1="0" y1="518.0" x2="300" y2="518.0" stroke="#dcd8d3"/>
<text x="0" y="539.0" font-size="13.5" fill="#55524f">FMI, Moniteur des finances publiques</text>
<text x="0" y="556.0" font-size="13.5" fill="#55524f">d’octobre 2026 ; Commission</text>
<text x="0" y="573.0" font-size="13.5" fill="#55524f">européenne, AMECO, printemps 2026 ;</text>
<text x="0" y="590.0" font-size="13.5" fill="#55524f">OCDE, Perspectives économiques n°</text>
<text x="0" y="607.0" font-size="13.5" fill="#55524f">119 ; Eurostat gov_10a_main, mise à</text>
<text x="0" y="624.0" font-size="13.5" fill="#55524f">jour du 21/07/2026</text>
<text x="0" y="645.0" font-size="13.5" fill="#55524f">Trois méthodes : la Commission et</text>
<text x="0" y="662.0" font-size="13.5" fill="#55524f">l'OCDE retirent aussi les mesures</text>
<text x="0" y="679.0" font-size="13.5" fill="#55524f">ponctuelles, le FMI non. Estimations</text>
<text x="0" y="696.0" font-size="13.5" fill="#55524f">de la production potentielle, non des</text>
<text x="0" y="713.0" font-size="13.5" fill="#55524f">mesures ; zones grises : 2015-2019 et</text>
<text x="0" y="730.0" font-size="13.5" fill="#55524f">2022-2025.</text>
