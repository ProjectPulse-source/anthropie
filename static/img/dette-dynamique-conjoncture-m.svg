<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 778" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dcsm-t dcsm-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="dcsm-t">Déficit primaire corrigé du cycle, trois estimations</title><desc id="dcsm-d">Courbes en % du PIB potentiel. Solde primaire corrigé du cycle selon le FMI, depuis 1996 ; solde primaire structurel selon la Commission européenne et solde primaire sous-jacent selon l'OCDE, depuis 2010 ; en gris, le solde primaire observé (Eurostat, % du PIB). Moyennes 2015-2019 puis 2022-2025 : Commission −1,1 puis −3,0, FMI −0,5 puis −3,1, OCDE −1,8 puis −3,4. Au-dessous de zéro, un déficit.</desc>
<rect width="300" height="778" fill="#ffffff"/>
