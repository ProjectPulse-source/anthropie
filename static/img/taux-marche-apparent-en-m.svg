<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 588" role="img" font-variant-numeric="tabular-nums" aria-labelledby="tmm-t tmm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="tmm-t">Market rate and average cost of the stock, 1996-2025</title><desc id="tmm-d">Two curves in percent per year. The 10-year rate goes from 6.3% in 1996 to -0.1% in 2020, then climbs back to 3.3% in 2025. The implicit rate, the average cost of the stock, goes from 6.5% to 1.2%, then rises only to 2.0% in 2025.</desc>
<rect width="300" height="588" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">Market rate and average cost</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">of the stock, 1996-2025</text>
<line x1="34" y1="253.0" x2="292" y2="253.0" stroke="#e1e0d9"/>
<text x="29" y="258.0" font-size="13.5" fill="#898781" text-anchor="end">0</text>
<line x1="34" y1="203.0" x2="292" y2="203.0" stroke="#e1e0d9"/>
<text x="29" y="208.0" font-size="13.5" fill="#898781" text-anchor="end">2</text>
<line x1="34" y1="153.0" x2="292" y2="153.0" stroke="#e1e0d9"/>
<text x="29" y="158.0" font-size="13.5" fill="#898781" text-anchor="end">4</text>
<line x1="34" y1="103.0" x2="292" y2="103.0" stroke="#e1e0d9"/>
<text x="29" y="108.0" font-size="13.5" fill="#898781" text-anchor="end">6</text>
<text x="34.0" y="297.0" font-size="13.5" fill="#898781" text-anchor="start">1996</text>
<text x="292.0" y="297.0" font-size="13.5" fill="#898781" text-anchor="end">2025</text>
