<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1001" role="img" font-variant-numeric="tabular-nums" aria-labelledby="cpm-t cpm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="cpm-t">Projet de loi de finances pour 2027 : ce qu'il demande aux collectivités</title><desc id="cpm-d">Montants pour 2027 des cinq mesures du projet de loi de finances déposé visant les collectivités, en milliards d'euros : Contribution progressive (art. 37) 2,5 ; FCTVA, taux abaissé (art. 35) 2,1 ; Contributions de ministères 0,7 ; TVA affectée, écrêtement (art. 36) 0,6 ; DILICO, reversement étalé (art. 84) 0,3. Leur somme arithmétique, 6,2, ne mesure pas un prélèvement net. L'Assemblée nationale avait supprimé la baisse du taux du FCTVA (art. 35) et la contribution progressive à l'effort budgétaire (art. 37), n'avait pas adopté l'écrêtement de la TVA affectée (art. 36) le 19 octobre 2026, puis a rejeté l'ensemble du texte le 4 novembre 2026 : les cinq mesures figurent dans le texte transmis au Sénat. État au 5 novembre 2026.</desc>
<rect width="300" height="1001" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">Projet de loi de finances pour</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">2027 : ce qu'il demande aux</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#0A0A0E">collectivités</text>
<text x="0" y="105" font-size="13.5" fill="#898781">milliards d&#x27;euros, montants du projet</text>
<text x="0" y="124" font-size="13.5" fill="#898781">déposé</text>
<text x="0" y="143" font-size="13.5" fill="#eb6834">En orange : dans le texte transmis au</text>
<text x="0" y="162" font-size="13.5" fill="#eb6834">Sénat</text>
<text x="0" y="188" font-size="15" font-weight="600" fill="#eb6834">2,5 Md€</text>
<text x="0" y="207" font-size="13.5" fill="#0A0A0E">Contribution progressive (art. 37)</text>
<text x="0" y="225" font-size="13.5" fill="#898781">texte transmis au Sénat ; Assemblée :</text>
<text x="0" y="243" font-size="13.5" fill="#898781">art. 37 supprimé en séance le</text>
<text x="0" y="261" font-size="13.5" fill="#898781">19 octobre 2026</text>
<text x="0" y="287" font-size="15" font-weight="600" fill="#eb6834">2,1 Md€</text>
<text x="0" y="306" font-size="13.5" fill="#0A0A0E">FCTVA, taux abaissé (art. 35)</text>
<text x="0" y="324" font-size="13.5" fill="#898781">texte transmis au Sénat ; Assemblée :</text>
<text x="0" y="342" font-size="13.5" fill="#898781">art. 35 supprimé en séance le</text>
<text x="0" y="360" font-size="13.5" fill="#898781">19 octobre 2026</text>
<text x="0" y="386" font-size="15" font-weight="600" fill="#eb6834">0,7 Md€</text>
<text x="0" y="405" font-size="13.5" fill="#0A0A0E">Contributions de ministères</text>
<text x="0" y="423" font-size="13.5" fill="#898781">texte transmis au Sénat ; Assemblée :</text>
<text x="0" y="441" font-size="13.5" fill="#898781">seconde partie, non examinée</text>
<text x="0" y="467" font-size="15" font-weight="600" fill="#eb6834">0,6 Md€</text>
<text x="0" y="486" font-size="13.5" fill="#0A0A0E">TVA affectée, écrêtement (art. 36)</text>
<text x="0" y="504" font-size="13.5" fill="#898781">texte transmis au Sénat ; Assemblée :</text>
<text x="0" y="522" font-size="13.5" fill="#898781">art. 36 non adopté en séance le</text>
<text x="0" y="540" font-size="13.5" fill="#898781">19 octobre 2026</text>
<text x="0" y="566" font-size="15" font-weight="600" fill="#eb6834">0,3 Md€</text>
<text x="0" y="585" font-size="13.5" fill="#0A0A0E">DILICO, reversement étalé (art. 84)</text>
<text x="0" y="603" font-size="13.5" fill="#898781">texte transmis au Sénat, examen le</text>
<text x="0" y="621" font-size="13.5" fill="#898781">2 décembre 2026 ; Assemblée : art. 84</text>
<text x="0" y="639" font-size="13.5" fill="#898781">supprimé en commission le</text>
<text x="0" y="657" font-size="13.5" fill="#898781">28 octobre 2026</text>
<line x1="0" y1="673.0" x2="300" y2="673.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="694.0" font-size="13.5" fill="#52514e">Projet de loi de finances pour 2027</text>
<text class="pied-source" x="0" y="711.0" font-size="13.5" fill="#52514e">(n° 3210) et avis n° 2026-5 du Haut</text>
<text class="pied-source" x="0" y="728.0" font-size="13.5" fill="#52514e">Conseil des finances publiques ;</text>
<text class="pied-source" x="0" y="745.0" font-size="13.5" fill="#52514e">état : Assemblée nationale, comptes</text>
<text class="pied-source" x="0" y="762.0" font-size="13.5" fill="#52514e">rendus des séances du 19 octobre 2026</text>
<text class="pied-source" x="0" y="779.0" font-size="13.5" fill="#52514e">et du 4 novembre 2026 ; commission des</text>
<text class="pied-source" x="0" y="796.0" font-size="13.5" fill="#52514e">finances, amendement II-CF2778</text>
<text class="pied-source" x="0" y="813.0" font-size="13.5" fill="#52514e">(art. 84), 28 octobre 2026 ; Sénat,</text>
<text class="pied-source" x="0" y="830.0" font-size="13.5" fill="#52514e">ordre du jour. État au</text>
<text class="pied-source" x="0" y="847.0" font-size="13.5" fill="#52514e">5 novembre 2026.</text>
<text class="pied-note" x="0" y="868.0" font-size="13.5" fill="#52514e">Somme arithmétique de montants</text>
<text class="pied-note" x="0" y="885.0" font-size="13.5" fill="#52514e">hétérogènes, chacun évalué par rapport</text>
<text class="pied-note" x="0" y="902.0" font-size="13.5" fill="#52514e">à la situation sans la mesure : elle</text>
<text class="pied-note" x="0" y="919.0" font-size="13.5" fill="#52514e">ne mesure pas un prélèvement net. Le</text>
<text class="pied-note" x="0" y="936.0" font-size="13.5" fill="#52514e">Sénat peut modifier chaque mesure</text>
<text class="pied-note" x="0" y="953.0" font-size="13.5" fill="#52514e">avant la loi définitive.</text>
