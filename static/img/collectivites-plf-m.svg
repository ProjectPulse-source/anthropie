<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 826" role="img" font-variant-numeric="tabular-nums" aria-labelledby="cpm-t cpm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="cpm-t">Projet de loi de finances pour 2027 : ce qu'il demandait aux collectivités</title><desc id="cpm-d">Montants pour 2027 des cinq mesures du projet de loi de finances déposé visant les collectivités, en milliards d'euros : Contribution progressive (art. 37) 2,5 ; FCTVA, taux abaissé (art. 35) 2,1 ; Contributions de ministères 0,7 ; TVA affectée, écrêtement (art. 36) 0,6 ; DILICO, reversement étalé (art. 84) 0,3. Leur somme arithmétique, 6,2, ne mesure pas un prélèvement net. Barres évidées : articles supprimés ou non adoptés par l'Assemblée nationale le 19 octobre 2026 ; barres pleines : mesures non encore examinées. État au 22 octobre 2026.</desc>
<rect width="300" height="826" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">Projet de loi de finances pour</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">2027 : ce qu'il demandait aux</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#0A0A0E">collectivités</text>
<text x="0" y="105" font-size="13.5" fill="#898781">milliards d&#x27;euros, montants du projet</text>
<text x="0" y="124" font-size="13.5" fill="#898781">déposé</text>
<text x="0" y="143" font-size="13.5" fill="#898781">En gris : supprimé ou non adopté en</text>
<text x="0" y="162" font-size="13.5" fill="#898781">séance</text>
<text x="0" y="181" font-size="13.5" fill="#eb6834">En orange : non encore examiné</text>
<text x="0" y="207" font-size="15" font-weight="600" fill="#898781">2,5 Md€</text>
<text x="0" y="226" font-size="13.5" fill="#0A0A0E">Contribution progressive (art. 37)</text>
<text x="0" y="244" font-size="13.5" fill="#898781">art. 37 supprimé par l&#x27;Assemblée</text>
<text x="0" y="262" font-size="13.5" fill="#898781">nationale le 19 octobre 2026</text>
<text x="0" y="288" font-size="15" font-weight="600" fill="#898781">2,1 Md€</text>
<text x="0" y="307" font-size="13.5" fill="#0A0A0E">FCTVA, taux abaissé (art. 35)</text>
<text x="0" y="325" font-size="13.5" fill="#898781">art. 35 supprimé par l&#x27;Assemblée</text>
<text x="0" y="343" font-size="13.5" fill="#898781">nationale le 19 octobre 2026</text>
<text x="0" y="369" font-size="15" font-weight="600" fill="#eb6834">0,7 Md€</text>
<text x="0" y="388" font-size="13.5" fill="#0A0A0E">Contributions de ministères</text>
<text x="0" y="406" font-size="13.5" fill="#898781">seconde partie, non examinée</text>
<text x="0" y="432" font-size="15" font-weight="600" fill="#898781">0,6 Md€</text>
<text x="0" y="451" font-size="13.5" fill="#0A0A0E">TVA affectée, écrêtement (art. 36)</text>
<text x="0" y="469" font-size="13.5" fill="#898781">art. 36 non adopté par l&#x27;Assemblée</text>
<text x="0" y="487" font-size="13.5" fill="#898781">nationale le 19 octobre 2026</text>
<text x="0" y="513" font-size="15" font-weight="600" fill="#eb6834">0,3 Md€</text>
<text x="0" y="532" font-size="13.5" fill="#0A0A0E">DILICO, reversement étalé (art. 84)</text>
<text x="0" y="550" font-size="13.5" fill="#898781">seconde partie, non examinée</text>
<line x1="0" y1="566.0" x2="300" y2="566.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="587.0" font-size="13.5" fill="#52514e">Projet de loi de finances pour 2027</text>
<text class="pied-source" x="0" y="604.0" font-size="13.5" fill="#52514e">(n° 3210) et avis n° 2026-5 du Haut</text>
<text class="pied-source" x="0" y="621.0" font-size="13.5" fill="#52514e">Conseil des finances publiques ;</text>
<text class="pied-source" x="0" y="638.0" font-size="13.5" fill="#52514e">état : Assemblée nationale, comptes</text>
<text class="pied-source" x="0" y="655.0" font-size="13.5" fill="#52514e">rendus des séances du 19 octobre 2026.</text>
<text class="pied-source" x="0" y="672.0" font-size="13.5" fill="#52514e">État au 22 octobre 2026.</text>
<text class="pied-note" x="0" y="693.0" font-size="13.5" fill="#52514e">Somme arithmétique de montants</text>
<text class="pied-note" x="0" y="710.0" font-size="13.5" fill="#52514e">hétérogènes, chacun évalué par rapport</text>
<text class="pied-note" x="0" y="727.0" font-size="13.5" fill="#52514e">à la situation sans la mesure : elle</text>
<text class="pied-note" x="0" y="744.0" font-size="13.5" fill="#52514e">ne mesure pas un prélèvement net. Une</text>
<text class="pied-note" x="0" y="761.0" font-size="13.5" fill="#52514e">disposition supprimée peut être</text>
<text class="pied-note" x="0" y="778.0" font-size="13.5" fill="#52514e">rétablie avant la loi définitive.</text>
