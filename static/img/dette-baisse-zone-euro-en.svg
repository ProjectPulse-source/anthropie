<text class="pied-source" x="0" y="339.0" font-size="11" fill="#55524f">Eurostat gov_10dd_edpt1 (debt, GDP), gov_10a_main (B9, D41PAY), 2016-2025; euro-area members at 1 January 2026,</text>
