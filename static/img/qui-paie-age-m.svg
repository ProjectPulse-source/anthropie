<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 636" role="img" font-variant-numeric="tabular-nums" aria-labelledby="qp-age-m-t qp-age-m-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="qp-age-m-t">Prélèvements et transferts publics par âge du ménage, 2023</title><desc id="qp-age-m-d">Barres par groupe d'âge du ménage, en 2023, en milliers d'euros par unité de consommation. Les transferts reçus passent de 18,2 pour les 18-29 ans à 47,8 pour les ménages dont l'âge moyen des adultes atteint 65 ans ou plus, tandis que les prélèvements passent de 23,2 à 14,6.</desc>
<rect width="300" height="636" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#2b2a28">Prélèvements et transferts</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#2b2a28">publics par âge du ménage,</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#2b2a28">2023</text>
<text x="0.0" y="108.0" font-size="13.5" fill="#898781" text-anchor="start">Milliers d'euros par UC · âge moyen</text>
<text x="0.0" y="126.0" font-size="13.5" fill="#898781" text-anchor="start">des adultes du ménage</text>
<rect x="0" y="138.0" width="12" height="12" fill="#eb6834"/>
<text x="18.0" y="148.0" font-size="13.5" fill="#52514e" text-anchor="start">Prélèvements versés (à gauche)</text>
<rect x="0" y="158.0" width="12" height="12" fill="#184f95"/>
<text x="18.0" y="168.0" font-size="13.5" fill="#52514e" text-anchor="start">Prestations en espèces, dont retraites</text>
<rect x="0" y="178.0" width="12" height="12" fill="#898781"/>
<text x="18.0" y="188.0" font-size="13.5" fill="#52514e" text-anchor="start">Services publics valorisés</text>
