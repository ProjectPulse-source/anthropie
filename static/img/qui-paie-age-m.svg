<rect x="142.9" y="299.0" width="58.0" height="13" fill="#898781"/>
<text x="0.0" y="332.0" font-size="13.5" fill="#898781" text-anchor="start">50-64 ans</text>
<rect x="0.0" y="338.0" width="122.6" height="13" fill="#eb6834"/>
<rect x="122.6" y="338.0" width="38.5" height="13" fill="#184f95"/>
<rect x="161.1" y="338.0" width="49.3" height="13" fill="#898781"/>
