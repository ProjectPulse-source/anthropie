<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 466" role="img" font-variant-numeric="tabular-nums" aria-labelledby="as-t as-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="as-t">Après le bac : où s'inscrivent les nouveaux bacheliers, selon l'origine sociale</title><desc id="as-d">Barres empilées à 100 %, une par catégorie socioprofessionnelle du parent. Nouveaux bacheliers 2023 inscrits dans l'enseignement supérieur : 55,2 % des enfants de cadres sont à l'université, 14,2 % en classes préparatoires, 9,9 % en sections de technicien supérieur, 20,7 % dans d'autres formations ; pour les enfants d'ouvriers, 43,4 %, 3,8 %, 46,0 % et 6,8 %. Toutes les valeurs sont dans le tableau qui suit la figure.</desc>
<rect width="720" height="466" fill="#ffffff"/>
