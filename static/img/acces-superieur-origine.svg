<text class="pied-source" x="0" y="397.0" font-size="11" fill="#55524f">MESRE-SIES, État de l'enseignement supérieur, de la recherche et de l'innovation en France n° 18, tableau 13.03 ;</text>
<text class="pied-source" x="0" y="411.0" font-size="11" fill="#55524f">France métropolitaine et DROM</text>
<text class="pied-note" x="0" y="425.0" font-size="11" fill="#55524f">Champ : bacheliers 2023 inscrits dans le supérieur à la rentrée suivante ; ceux qui ne poursuivent pas n'y figurent</text>
<text class="pied-note" x="0" y="439.0" font-size="11" fill="#55524f">pas. STS : apprentissage compris.</text>
<text class="pied-note" x="0" y="453.0" font-size="11" fill="#55524f">Origine : catégorie socioprofessionnelle du parent, renseignée pour 88,9 % des inscrits ; les autres ne sont pas</text>
<text class="pied-note" x="0" y="467.0" font-size="11" fill="#55524f">répartis par la source.</text>
<text class="pied-note" x="0" y="481.0" font-size="11" fill="#55524f">Une inscription observée n'est pas un choix : elle dépend aussi de la série du baccalauréat, des candidatures et des</text>
<text class="pied-note" x="0" y="495.0" font-size="11" fill="#55524f">admissions, que ce tableau ne croise pas.</text>
<text class="pied-note" x="0" y="509.0" font-size="11" fill="#55524f">Taux arrondis : leur somme peut différer de 100 %. Catégories dans l'ordre de la source, sans hiérarchie.</text>
