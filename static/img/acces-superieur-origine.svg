<text x="0" y="395.0" font-size="9" fill="#55524f">MESRE-SIES, État de l'enseignement supérieur, de la recherche et de l'innovation en France n° 18, tableau 13.03 ; France métropolitaine et DROM</text>
<text x="0" y="407.0" font-size="9" fill="#55524f">Champ : bacheliers 2023 inscrits dans le supérieur à la rentrée suivante ; ceux qui ne poursuivent pas n'y figurent pas. STS : apprentissage compris.</text>
<text x="0" y="419.0" font-size="9" fill="#55524f">Origine : catégorie socioprofessionnelle du parent, renseignée pour 88,9 % des inscrits ; les autres ne sont pas répartis par la source.</text>
<text x="0" y="431.0" font-size="9" fill="#55524f">Une inscription observée n'est pas un choix : elle dépend aussi de la série du baccalauréat, des candidatures et des admissions, que ce tableau ne croise pas.</text>
<text x="0" y="443.0" font-size="9" fill="#55524f">Taux arrondis : leur somme peut différer de 100 %. Catégories dans l'ordre de la source, sans hiérarchie.</text>
