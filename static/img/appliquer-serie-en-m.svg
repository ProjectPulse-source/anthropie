<title id="asm-t">The implementation rate of laws published by the French Senate, 2002-2003 to 2024-2025</title><desc id="asm-d">Points by session, grouped in six segments separated by changes of definition: 2002-2003: 9.7% (segment 1); 2003-2004: 14.4% (segment 1); 2004-2005: 16.4% (segment 1); 2005-2006: 30% (segment 1); 2006-2007: 32.1% (segment 1); 2007-2008: 24.6% (segment 1); 2008-2009: 27% (segment 1); 2010-2011: 64% (segment 2); 2011-2012: 66% (segment 3); 2012-2013: 64% (segment 4); 2013-2014: 55% (segment 4); 2014-2015: 62% (segment 4); 2015-2016: 71% (segment 4); 2016-2017: 73% (segment 4); 2017-2018: 78% (segment 5); 2018-2019: 72% (segment 5); 2019-2020: 62% (segment 5); 2020-2021: 57% (segment 5); 2021-2022: 65% (segment 5); 2022-2023: 64% (segment 5); 2023-2024: 59% (segment 5); 2024-2025: 66% (segment 6). For 2019-2020, the following report gives 60% (open circle). The values, their document and their definition are in the table below the figure.</desc>
