<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 886" role="img" font-variant-numeric="tabular-nums" aria-labelledby="amm-t amm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="amm-t">Implementing measures of French laws, by session of the law</title><desc id="amm-d">Horizontal bars, one per session from 2017-2018 to 2024-2025: measures with an identified published instrument, pending, classified as “not applicable”, incomplete status. In total 5,398 measures, 567 of them pending. By session: 2017-2018: 556 measures, 18 pending; 2018-2019: 933 measures, 47 pending; 2019-2020: 680 measures, 63 pending; 2020-2021: 777 measures, 90 pending; 2021-2022: 652 measures, 75 pending; 2022-2023: 549 measures, 62 pending; 2023-2024: 730 measures, 93 pending; 2024-2025: 521 measures, 119 pending. The values are in the table below the figure.</desc>
