<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 449" role="img" aria-labelledby="qp-mec-t qp-mec-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="qp-mec-t">Par quels canaux la charge de la dette peut-elle être répartie ?</title>
<desc id="qp-mec-d">Schéma sans quantités. Le service de la dette peut être assuré par quatre canaux, qui se combinent : prélèvements (contribuables), dépenses et prestations (usagers, bénéficiaires), inflation (détenteurs de créances et de revenus mal indexés), restructuration, cas extrême (porteurs des titres). Le refinancement reporte l'échéance sans désigner de perdant. En regard figure ce que la dette a financé.</desc>
<text x="0.0" y="22.0" font-size="13" fill="#52514e" text-anchor="start">Par quels canaux la charge de la dette peut-elle être répartie ?</text>
<defs><marker id="qp-fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs>
<rect x="1" y="150" width="200" height="74" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
<text x="13.0" y="170.0" font-size="12" fill="#2b2a28" text-anchor="start" font-weight="600">Service de la dette</text>
<text x="13.0" y="186.0" font-size="11" fill="#52514e" text-anchor="start">intérêts, et titres qui</text>
<text x="13.0" y="202.0" font-size="11" fill="#52514e" text-anchor="start">arrivent à échéance</text>
<rect x="300" y="44" width="418" height="50" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="312.0" y="64.0" font-size="12" fill="#2b2a28" text-anchor="start" font-weight="600">Prélèvements</text>
<text x="312.0" y="80.0" font-size="11" fill="#52514e" text-anchor="start">contribuables : impôts, cotisations</text>
<line x1="200" y1="187" x2="296" y2="69" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#qp-fl)"/>
<rect x="300" y="108" width="418" height="50" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="312.0" y="128.0" font-size="12" fill="#2b2a28" text-anchor="start" font-weight="600">Dépenses et prestations</text>
<text x="312.0" y="144.0" font-size="11" fill="#52514e" text-anchor="start">usagers, bénéficiaires : réduites, gelées, reportées</text>
<line x1="200" y1="187" x2="296" y2="133" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#qp-fl)"/>
<rect x="300" y="172" width="418" height="50" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="312.0" y="192.0" font-size="12" fill="#2b2a28" text-anchor="start" font-weight="600">Inflation</text>
<text x="312.0" y="208.0" font-size="11" fill="#52514e" text-anchor="start">détenteurs de créances et de revenus mal indexés</text>
<line x1="200" y1="187" x2="296" y2="197" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#qp-fl)"/>
<rect x="300" y="236" width="418" height="50" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="312.0" y="256.0" font-size="12" fill="#2b2a28" text-anchor="start" font-weight="600">Restructuration (cas extrême)</text>
<text x="312.0" y="272.0" font-size="11" fill="#52514e" text-anchor="start">porteurs des titres</text>
<line x1="200" y1="187" x2="296" y2="261" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#qp-fl)"/>
<rect x="1" y="44" width="200" height="70" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="13.0" y="64.0" font-size="12" fill="#2b2a28" text-anchor="start" font-weight="600">Refinancement</text>
<text x="13.0" y="80.0" font-size="11" fill="#52514e" text-anchor="start">reporte l'échéance ;</text>
<text x="13.0" y="96.0" font-size="11" fill="#52514e" text-anchor="start">ne désigne aucun perdant</text>
<line x1="100" y1="150" x2="100" y2="118" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#qp-fl)"/>
<rect x="1" y="316" width="717" height="52" rx="6" fill="#f7f7f4" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="13.0" y="336.0" font-size="12" fill="#2b2a28" text-anchor="start" font-weight="600">En regard : ce que la dette a financé</text>
<text x="13.0" y="352.0" font-size="11" fill="#52514e" text-anchor="start">services, prestations, investissements, soutien en crise — bénéfices présents et futurs</text>
<line x1="0" y1="392.0" x2="720" y2="392.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="0" y="405.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">Synthèse de l'auteur · schéma non quantitatif, flèches d'égale épaisseur</text>
<text x="0" y="417.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">Schéma de mécanismes possibles. Aucun poids relatif ni effet causal n'est mesuré ici.</text>
<text x="0" y="429.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#898781">Stéphane Lalut, CC BY 4.0 · stephane-lalut.com/qui-paie-la-dette-publique/</text>
</svg>
