<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">Taux de marché et coût moyen</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">du stock, 1996-2025</text>
<line x1="34" y1="253.0" x2="292" y2="253.0" stroke="#e1e0d9"/>
<text x="29" y="258.0" font-size="13.5" fill="#898781" text-anchor="end">0</text>
<line x1="34" y1="203.0" x2="292" y2="203.0" stroke="#e1e0d9"/>
<text x="29" y="208.0" font-size="13.5" fill="#898781" text-anchor="end">2</text>
<line x1="34" y1="153.0" x2="292" y2="153.0" stroke="#e1e0d9"/>
<text x="29" y="158.0" font-size="13.5" fill="#898781" text-anchor="end">4</text>
<line x1="34" y1="103.0" x2="292" y2="103.0" stroke="#e1e0d9"/>
<text x="29" y="108.0" font-size="13.5" fill="#898781" text-anchor="end">6</text>
<text x="34.0" y="297.0" font-size="13.5" fill="#898781" text-anchor="start">1996</text>
<text x="292.0" y="297.0" font-size="13.5" fill="#898781" text-anchor="end">2025</text>
