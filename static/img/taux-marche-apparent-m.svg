<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 605" role="img" font-variant-numeric="tabular-nums" aria-labelledby="tmm-t tmm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="tmm-t">Taux de marché et coût moyen du stock, 1996-2025</title><desc id="tmm-d">Deux courbes en pourcentage par an. Le taux à 10 ans passe de 6,3 % en 1996 à -0,1 % en 2020, puis remonte à 3,3 % en 2025. Le taux implicite, coût moyen du stock, passe de 6,5 % à 1,2 %, puis ne remonte qu'à 2,0 % en 2025.</desc>
