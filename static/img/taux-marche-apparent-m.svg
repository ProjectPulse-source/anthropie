<circle cx="292.0" cy="169.3" r="4" fill="#52514e"/>
<circle cx="292.0" cy="202.8" r="4" fill="#eb6834"/>
<line x1="0" y1="309" x2="18" y2="309" stroke="#52514e" stroke-width="1.6"/>
<text x="24" y="314" font-size="13.5" fill="#52514e">Taux à 10 ans 2025</text>
<text x="300" y="314" font-size="15" font-weight="600" fill="#52514e" text-anchor="end">3,3 %</text>
<line x1="0" y1="331" x2="18" y2="331" stroke="#eb6834" stroke-width="2.6"/>
<text x="24" y="336" font-size="13.5" fill="#52514e">Taux implicite 2025</text>
<text x="300" y="336" font-size="15" font-weight="600" fill="#eb6834" text-anchor="end">2,0 %</text>
<line x1="0" y1="362.0" x2="300" y2="362.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="383.0" font-size="13.5" fill="#52514e">Eurostat irt_lt_mcby_a (taux à 10 ans)</text>
<text class="pied-source" x="0" y="400.0" font-size="13.5" fill="#52514e">· taux implicite : Eurostat</text>
<text class="pied-source" x="0" y="417.0" font-size="13.5" fill="#52514e">gov_10a_main et INSEE, 1996-2025</text>
<text class="pied-note" x="0" y="438.0" font-size="13.5" fill="#52514e">Le taux à 10 ans est un indicateur de</text>
<text class="pied-note" x="0" y="455.0" font-size="13.5" fill="#52514e">référence, non le coût effectif des</text>
<text class="pied-note" x="0" y="472.0" font-size="13.5" fill="#52514e">émissions ; le taux implicite, coût</text>
<text class="pied-note" x="0" y="489.0" font-size="13.5" fill="#52514e">moyen de tout le stock, ne suit les</text>
<text class="pied-note" x="0" y="506.0" font-size="13.5" fill="#52514e">taux de marché qu'au fil des</text>
<text class="pied-note" x="0" y="523.0" font-size="13.5" fill="#52514e">renouvellements, et inclut</text>
<text class="pied-note" x="0" y="540.0" font-size="13.5" fill="#52514e">l'indexation des titres indexés sur</text>
<text class="pied-note" x="0" y="557.0" font-size="13.5" fill="#52514e">l'inflation.</text>
