<text x="0" y="358" font-size="15" font-weight="600" fill="#b8420f">Septembre 2025 : 3,51 / 3,39 %</text>
<text x="0" y="376" font-size="13.5" fill="#55524f">France / Grèce, moyenne du mois ;</text>
<text x="0" y="394" font-size="13.5" fill="#55524f">ligne pointillée : la séance</text>
<line x1="0" y1="408.0" x2="300" y2="408.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="429.0" font-size="13.5" fill="#55524f">Eurostat, rendements des emprunts</text>
<text class="pied-source" x="0" y="446.0" font-size="13.5" fill="#55524f">d'État à long terme, moyennes</text>
<text class="pied-source" x="0" y="463.0" font-size="13.5" fill="#55524f">mensuelles (irt_lt_mcby_m) ; calcul de</text>
<text class="pied-source" x="0" y="480.0" font-size="13.5" fill="#55524f">l'auteur</text>
<text class="pied-note" x="0" y="501.0" font-size="13.5" fill="#55524f">Moyennes mensuelles. Le</text>
<text class="pied-note" x="0" y="518.0" font-size="13.5" fill="#55524f">8 septembre 2025, la France empruntait</text>
<text class="pied-note" x="0" y="535.0" font-size="13.5" fill="#55524f">à dix ans à 3,49 % (Banque de France)</text>
<text class="pied-note" x="0" y="552.0" font-size="13.5" fill="#55524f">et la Grèce à 3,34 % (Banque de</text>
<text class="pied-note" x="0" y="569.0" font-size="13.5" fill="#55524f">Grèce) ; le 4, la même mesure pour les</text>
<text class="pied-note" x="0" y="586.0" font-size="13.5" fill="#55524f">deux pays donnait 3,50 % contre</text>
<text class="pied-note" x="0" y="603.0" font-size="13.5" fill="#55524f">3,44 %. Un prix de marché dit le coût</text>
<text class="pied-note" x="0" y="620.0" font-size="13.5" fill="#55524f">d'emprunt du moment, pas la solidité</text>
<text class="pied-note" x="0" y="637.0" font-size="13.5" fill="#55524f">relative de deux pays.</text>
