<text class="pied-source" x="0" y="521.0" font-size="11" fill="#55524f">DEPP (Notes d'Information, documents de travail) ; OCDE (PISA 2018 et 2025 ; 21st-Century Readers) ; IEA (PIRLS) ;</text>
<text class="pied-source" x="0" y="535.0" font-size="11" fill="#55524f">ministère de la Culture ; CREDOC</text>
<text class="pied-note" x="0" y="549.0" font-size="11" fill="#55524f">Seul le sens de l'évolution est montré, pas son ampleur. Plein : test publié par le producteur, ou, pour</text>
<text class="pied-note" x="0" y="563.0" font-size="11" fill="#55524f">PISA 2000-2012, test de l'auteur ; tirets : sans test. Ronds : bornes des intervalles, pas toutes les vagues</text>
<text class="pied-note" x="0" y="577.0" font-size="11" fill="#55524f">d'enquête. Dictée : copies corrigées par les professeurs des élèves en 1987, de façon centralisée à partir de 2007 ;</text>
<text class="pied-note" x="0" y="591.0" font-size="11" fill="#55524f">effet éventuel non directement estimable selon la DEPP. Évaluations nationales de 2026 : hors académie de Toulouse.</text>
<text class="pied-note" x="0" y="605.0" font-size="11" fill="#55524f">GT : voie générale et technologique. PISA, compréhension de l'écrit : recul de 2000 à 2006 non tracé. PISA, plaisir de</text>
<text class="pied-note" x="0" y="619.0" font-size="11" fill="#55524f">lire (indice) : 2000-2009 non tracé, hausse significative chez les garçons, sans évolution significative chez les</text>
<text class="pied-note" x="0" y="633.0" font-size="11" fill="#55524f">filles (OCDE). Vingt livres ou plus, hors bandes dessinées : même part en 2018 qu'en 2008, non tracée.</text>
