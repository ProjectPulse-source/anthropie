<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 844" role="img" font-variant-numeric="tabular-nums" aria-labelledby="form-t form-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="form-t">Eleven claims from 8 September 2025: what the figures settle, and what they do not</title><desc id="form-d">French National Assembly, debate of 8 September 2025, eleven claims in three groups (measuring, explaining, concluding). “No balanced budget for fifty-one years” (F. Bayrou): Accurate for general government: last surplus in 1974 (€0.2bn), a deficit every year since 1975. Excluding interest, the balance was positive for four years (1998 to 2001). A finding, no inference. “A euro of deficit is a euro of extra debt” (F. Bayrou): Not year by year: the gap exceeds 20% of the deficit in 13 years out of 30 (stock-flow adjustments). Cumulated 1996–2025: €2,649bn against €2,758bn, close. A finding, no inference. “A 3% deficit, the threshold at which debt stops rising” (F. Bayrou): In euros, inaccurate: a 3% deficit amounts to about €90bn a year. As a share of GDP, accurate if nominal growth exceeds about 2.74%: 3.58% in 2024, 1.90% in 2025 (known later). Decisive condition left unsaid. “France borrows at higher rates than Greece” (L. Wauquiez): Accurate on the day: 3.49% against 3.34% on 8 September 2025 (both central banks' sources). 2025 average: near-equal spreads over Germany; Greece above from March to May 2026. Risk judgement, not established. “Spending stable since 2017; it is falling revenue” (C. Chatelain): Accurate for 2017–2024: spending −0.5 pt of GDP, revenue −2.9 pts (May 2025 accounts). Since 2019: spending +1.9 pt. Accounting: supported; causal: not established. “€66bn in 2026” against “€75bn in 2026” (É. Ciotti, F. Bayrou): 75: consistent with the Court of Audit path; 66: no 2026 forecast found. 66 equals the official 2025 figure: an echo, not a proven borrowing. No inference. “€50bn created, over €100bn paid to creditors, double” (F. Bayrou): Interest accurate: projected by the Court, €67bn in 2025, €107bn in 2029. Same year: extra output in 2029 of €66–97bn; no longer double, but 1.1 to 1.6 times. “Entirely handed over”: not established. “Over €1,000bn of extra debt” since 2017 (B. Vallaud, M. Panot): Accurate under every variant tested: €1,064bn to €1,155bn. “Cost us”: measuring is not attributing. Attribution: not established. “€1,200bn since 2017, after 400 under François Hollande” (É. Ciotti): 400: accurate (359); 1,200: only just, from January 2017 (1,155), not from the election (1,064). Per year in GDP points: 1.6 against 1.7. Attribution to a term: not established. “Soon more on interest than on educating our children” (L. Wauquiez): General government: 40% in 2024, not before 2029; State: 83% in 2025. State ceilings for 2026: 92% (programme including other spending). For the State, supported, not decisive. “The burden left to our children grows by €18m an hour” (P. Christophe): Understated for debt: €20.9m an hour. Close to the 2025 planned deficit: about 18.4. A distributional question: not established.</desc>
