<text x="0" y="402" font-size="15" font-weight="600" fill="#26262f">2021</text>
<rect x="0" y="410" width="30.3" height="26" fill="#184f95"/>
<rect x="30.3" y="410" width="165.5" height="26" fill="#eb6834"/>
<text x="201.8" y="429" font-size="16" font-weight="600" fill="#26262f">19,4</text>
<text x="0" y="454" font-size="13.5" fill="#55524f">lexicales 3 · autres 16,4</text>
<line x1="0" y1="480.0" x2="300" y2="480.0" stroke="#dcd8d3"/>
<text x="0" y="501.0" font-size="13.5" fill="#55524f">DEPP, Note d'Information 22.37 (dictée</text>
<text x="0" y="518.0" font-size="13.5" fill="#55524f">de 67 mots, 1987, 2007, 2015, 2021 ;</text>
<text x="0" y="535.0" font-size="13.5" fill="#55524f">secteur public) ; NI 08.38 pour</text>
<text x="0" y="552.0" font-size="13.5" fill="#55524f">1987-2007</text>
<text x="0" y="573.0" font-size="13.5" fill="#55524f">Erreurs lexicales : orthographe des</text>
<text x="0" y="590.0" font-size="13.5" fill="#55524f">mots eux-mêmes. Autres erreurs :</text>
<text x="0" y="607.0" font-size="13.5" fill="#55524f">grammaire (accords, conjugaison),</text>
<text x="0" y="624.0" font-size="13.5" fill="#55524f">ponctuation, oublis (total moins</text>
<text x="0" y="641.0" font-size="13.5" fill="#55524f">lexicales).</text>
