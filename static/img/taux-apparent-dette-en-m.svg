<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 486" role="img" font-variant-numeric="tabular-nums" aria-labelledby="tam-t tam-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="tam-t">The implicit interest rate, 1996-2025</title><desc id="tam-d">A single curve, in percent per year. The implicit rate on the debt stock falls from 6.5% in 1996 to 1.2% in 2020, its lowest point in the series, then climbs back to 2.0% in 2025. The decline runs for nearly twenty-five years; the rebound only for the last few.</desc>
<rect width="300" height="486" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">The implicit interest rate,</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">1996-2025</text>
<line x1="34" y1="294.0" x2="286" y2="294.0" stroke="#c3c2b7"/>
<text x="29" y="299.0" font-size="13.5" fill="#898781" text-anchor="end">0</text>
<line x1="34" y1="236.9" x2="286" y2="236.9" stroke="#e1e0d9"/>
<text x="29" y="241.9" font-size="13.5" fill="#898781" text-anchor="end">2</text>
<line x1="34" y1="179.7" x2="286" y2="179.7" stroke="#e1e0d9"/>
<text x="29" y="184.7" font-size="13.5" fill="#898781" text-anchor="end">4</text>
<line x1="34" y1="122.6" x2="286" y2="122.6" stroke="#e1e0d9"/>
<text x="29" y="127.6" font-size="13.5" fill="#898781" text-anchor="end">6</text>
<text x="34.0" y="313.0" font-size="13.5" fill="#898781" text-anchor="start">1996</text>
<text x="286.0" y="313.0" font-size="13.5" fill="#898781" text-anchor="end">2025</text>
