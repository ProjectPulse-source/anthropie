<circle cx="34.0" cy="108.6" r="4" fill="#eb6834"/>
<text x="40.0" y="98.6" font-size="15" font-weight="600" fill="#0A0A0E" text-anchor="start">6.5%</text>
<circle cx="242.6" cy="258.6" r="4" fill="#eb6834"/>
<text x="242.6" y="280.6" font-size="15" font-weight="600" fill="#0A0A0E" text-anchor="middle">1.2%</text>
<circle cx="286.0" cy="236.6" r="4" fill="#eb6834"/>
<text x="286.0" y="224.6" font-size="15" font-weight="600" fill="#0A0A0E" text-anchor="end">2.0%</text>
<line x1="0" y1="328.0" x2="300" y2="328.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="349.0" font-size="13.5" fill="#52514e">Computed on Eurostat (gov_10a_main)</text>
<text class="pied-source" x="0" y="366.0" font-size="13.5" fill="#52514e">and INSEE series, 1996-2025</text>
<text class="pied-note" x="0" y="387.0" font-size="13.5" fill="#52514e">Implicit rate = a year's interest /</text>
<text class="pied-note" x="0" y="404.0" font-size="13.5" fill="#52514e">debt outstanding at the end of the</text>
<text class="pied-note" x="0" y="421.0" font-size="13.5" fill="#52514e">previous year, not today's borrowing</text>
<text class="pied-note" x="0" y="438.0" font-size="13.5" fill="#52514e">rate.</text>
