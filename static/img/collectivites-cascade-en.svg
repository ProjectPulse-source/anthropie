<title id="cc-t">Local government balance, 2013-2017: the same change, in euros and in percentage points of GDP</title><desc id="cc-d">Two waterfalls, same items, same order. In billions of current euros: balance of −8.3 in 2013; transfers received −8.9, taxes +18.2, other revenue +1.6, investment +7.5, other spending −8.7; balance of 1.4 in 2017. In percentage points of GDP: balance of −0.39; transfers −0.64, taxes +0.39, other revenue −0.12, investment +0.50, other spending +0.32; balance of 0.06. Nominal GDP rose by 8.1%.</desc>
