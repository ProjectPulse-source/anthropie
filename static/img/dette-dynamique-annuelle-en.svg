<title id="da-t">Year by year: what pushed the ratio up or down, 1996-2025</title><desc id="da-d">Stacked bars per year, in points of GDP: in orange the contribution of primary deficits, in blue the net effect of interest rates and growth, in grey stock-flow adjustments; the black dot is the actual change in the ratio. Primary deficits drive the rise from 2008 to 2025; the interest-growth effect turns sharply negative in 2021-2023, when nominal GDP growth, driven in part by inflation, accelerates.</desc>
