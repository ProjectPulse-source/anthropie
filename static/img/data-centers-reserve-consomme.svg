<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 569" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dtc-t dtc-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="dtc-t">Data centers : puissance réservée sur le réseau et électricité consommée</title><desc id="dtc-d">Deux panneaux, deux grandeurs. Puissance de raccordement réservée par les data centers auprès de RTE : environ 5 GW fin 2024, 14 GW en novembre 2025 (dont 6,1 GW pour une mise en service avant 2030, 7,6 GW à partir de 2030 et 0,2 GW suspendus), près de 18 GW en mai 2026 ; 0,8 GW déjà raccordés au réseau de RTE (huit sites) ; environ 0,9 GW abandonnés depuis 2023. Consommation des data centers sur sites dédiés : 0,8 TWh en 2024 et près de 1 TWh en 2025 mesurés sur le réseau de RTE ; 4 à 5 TWh estimés pour l'ensemble en 2024 ; 10 à 15 TWh en 2030 et 21 à 32 TWh en 2035 dans les deux trajectoires de RTE.</desc>
<rect width="720" height="569" fill="#ffffff"/>
<text x="0" y="18" font-size="14" font-weight="600" fill="#26262f">Data centers : puissance réservée sur le réseau et électricité consommée</text>
<text x="0" y="50" font-size="12" font-weight="600" fill="#184f95">Puissance de raccordement réservée auprès de RTE, en gigawatts (GW)</text>
<text x="0" y="81" font-size="11" fill="#26262f">Fin 2024</text>
<rect x="250.0" y="68.0" width="82.5" height="18" fill="#184f95"/>
<text x="338.5" y="81" font-size="11" font-weight="600" fill="#184f95">environ 5 GW</text>
<text x="0" y="115" font-size="11" fill="#26262f">Novembre 2025</text>
<rect x="250.0" y="102.0" width="100.7" height="18" fill="#184f95"/>
<rect x="350.7" y="102.0" width="125.4" height="18" fill="#9db7da"/>
<rect x="476.1" y="102.0" width="3.3" height="18" fill="#8a8781"/>
<text x="485.4" y="115" font-size="11" font-weight="600" fill="#184f95">14 GW</text>
<text x="0" y="149" font-size="11" fill="#26262f">Mai 2026</text>
<rect x="250.0" y="136.0" width="297.0" height="18" fill="#184f95"/>
<text x="553.0" y="149" font-size="11" font-weight="600" fill="#184f95">près de 18 GW</text>
<text x="0" y="183" font-size="11" fill="#26262f">Déjà raccordés au réseau de RTE</text>
<text x="0" y="195" font-size="11" fill="#26262f">(huit sites)</text>
<rect x="250.7" y="170.7" width="11.8" height="16" fill="#ffffff" stroke="#184f95" stroke-width="1.4"/>
<text x="269.2" y="183" font-size="11" font-weight="600" fill="#55524f">0,8 GW</text>
<text x="0" y="225" font-size="11" font-weight="600" fill="#55524f">En novembre 2025 :</text>
<rect x="250" y="216" width="10" height="10" fill="#184f95"/>
<text x="264" y="225" font-size="11" fill="#55524f">mise en service prévue avant 2030 : 6,1 GW</text>
<rect x="515" y="216" width="10" height="10" fill="#9db7da"/>
<text x="529" y="225" font-size="11" fill="#55524f">à partir de 2030 : 7,6 GW</text>
<text x="250" y="242" font-size="11" fill="#55524f">Suspendu (gris) : 0,2 GW ; abandonné depuis 2023 : environ 0,9 GW</text>
<text x="0" y="280" font-size="12" font-weight="600" fill="#eb6834">Consommation d'électricité des data centers sur sites dédiés, en térawattheures par an (TWh)</text>
<text x="0" y="311" font-size="11" fill="#26262f">2024, mesurée (réseau de RTE)</text>
<rect x="250.0" y="298.0" width="7.5" height="18" fill="#eb6834"/>
<text x="263.5" y="311" font-size="11" font-weight="600" fill="#eb6834">0,8 TWh</text>
<text x="0" y="345" font-size="11" fill="#26262f">2025, mesurée (réseau de RTE)</text>
<rect x="250.0" y="332.0" width="9.4" height="18" fill="#eb6834"/>
<text x="265.4" y="345" font-size="11" font-weight="600" fill="#eb6834">près de 1 TWh</text>
<text x="0" y="379" font-size="11" fill="#26262f">2024, estimée par RTE</text>
<text x="0" y="391" font-size="11" fill="#26262f">(tous sites dédiés)</text>
<rect x="250.0" y="366.0" width="37.7" height="18" fill="#f5b89c"/>
<rect x="287.7" y="366" width="9.4" height="17" fill="#ffffff" stroke="#eb6834" stroke-width="1"/>
<text x="303.1" y="379" font-size="11" font-weight="600" fill="#eb6834">4 à 5 TWh</text>
<text x="0" y="413" font-size="11" fill="#26262f">2030, deux trajectoires de RTE</text>
<text x="0" y="425" font-size="11" fill="#26262f">(tous sites dédiés)</text>
<rect x="250.0" y="400.0" width="94.3" height="18" fill="#f5b89c"/>
<rect x="344.3" y="400" width="47.1" height="17" fill="#ffffff" stroke="#eb6834" stroke-width="1"/>
<text x="397.4" y="413" font-size="11" font-weight="600" fill="#eb6834">10 à 15 TWh</text>
<text x="0" y="447" font-size="11" fill="#26262f">2035, deux trajectoires de RTE</text>
<text x="0" y="459" font-size="11" fill="#26262f">(tous sites dédiés)</text>
<rect x="250.0" y="434.0" width="198.0" height="18" fill="#f5b89c"/>
<rect x="448.0" y="434" width="103.7" height="17" fill="#ffffff" stroke="#eb6834" stroke-width="1"/>
<text x="557.7" y="447" font-size="11" font-weight="600" fill="#eb6834">21 à 32 TWh</text>
<text x="250" y="474" font-size="11" fill="#55524f">Plein : bas de la fourchette ; contour : jusqu'au haut.</text>
<line x1="0" y1="490.0" x2="720" y2="490.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="505.0" font-size="11" fill="#55524f">RTE : Bilan prévisionnel 2025-2035 (déc. 2025), Bilan électrique 2025 (févr. 2026), page « Les data centers en</text>
<text class="pied-source" x="0" y="519.0" font-size="11" fill="#55524f">chiffres clés » (1er juin 2026) ; répartition de novembre 2025 mesurée sur la figure 2.3 du Bilan prévisionnel.</text>
<text class="pied-note" x="0" y="533.0" font-size="11" fill="#55524f">Une puissance réservée n'est ni une puissance appelée ni une consommation : les deux panneaux ne se comparent pas,</text>
<text class="pied-note" x="0" y="547.0" font-size="11" fill="#55524f">aucun rapport n'est calculé entre eux. Trajectoires : hypothèses de RTE, non des mesures.</text>
