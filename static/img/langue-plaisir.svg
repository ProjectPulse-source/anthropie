<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" role="img" font-variant-numeric="tabular-nums" aria-labelledby="lan-p-t lan-p-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="lan-p-t">Élèves qui déclarent ne pas lire pour leur plaisir, selon la classe (2023)</title><desc id="lan-p-d">Barres, part des élèves qui déclarent ne pas lire pour leur plaisir en 2023 : Sixième 12 % ; Quatrième 28 % ; Seconde générale et techno. 32 % ; Seconde professionnelle 49 % ; Première année de CAP 47 %.</desc>
<rect width="720" height="306" fill="#ffffff"/>
<text x="0" y="18" font-size="14" font-weight="600" fill="#26262f">Élèves qui déclarent ne pas lire pour leur plaisir, selon la classe (2023)</text>
<text x="0" y="62" font-size="11.5" fill="#26262f">Sixième</text>
<rect x="200" y="48" width="90.9" height="22" fill="#eb6834"/>
<text x="298.9" y="64" font-size="12" font-weight="600" fill="#26262f">12 %</text>
<text x="0" y="102" font-size="11.5" fill="#26262f">Quatrième</text>
<rect x="200" y="88" width="208.1" height="22" fill="#eb6834"/>
<text x="416.1" y="104" font-size="12" font-weight="600" fill="#26262f">28 %</text>
<text x="0" y="142" font-size="11.5" fill="#26262f">Seconde générale et techno.</text>
<rect x="200" y="128" width="236.0" height="22" fill="#eb6834"/>
<text x="444.0" y="144" font-size="12" font-weight="600" fill="#26262f">32 %</text>
<text x="0" y="182" font-size="11.5" fill="#26262f">Seconde professionnelle</text>
<rect x="200" y="168" width="357.4" height="22" fill="#eb6834"/>
<text x="565.4" y="184" font-size="12" font-weight="600" fill="#26262f">49 %</text>
<text x="0" y="222" font-size="11.5" fill="#26262f">Première année de CAP</text>
<rect x="200" y="208" width="345.3" height="22" fill="#eb6834"/>
<text x="553.3" y="224" font-size="12" font-weight="600" fill="#26262f">47 %</text>
<line x1="0" y1="256.0" x2="720" y2="256.0" stroke="#dcd8d3"/>
<text x="0" y="269.0" font-size="9" fill="#55524f">DEPP, Note d'Information 25.66, figure 1.1 web (questionnaires des évaluations nationales, septembre 2023)</text>
<text x="0" y="281.0" font-size="9" fill="#55524f">Une seule enquête : l'écart entre classes compare des élèves différents la même année, ce n'est pas une évolution dans le temps.</text>
<text x="0" y="293.0" font-size="9" fill="#96928f">Calcul Stéphane Lalut, CC BY 4.0 · stephane-lalut.com/les-eleves-maitrisent-ils-moins-bien-la-langue-francaise/</text>
