<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1016" role="img" font-variant-numeric="tabular-nums" aria-labelledby="atm-t atm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="atm-t">Les lois promulguées d'octobre 2017 à septembre 2025 attendent-elles encore une mesure ?</title><desc id="atm-d">Barres horizontales, une par session de 2017-2018 à 2024-2025, lois promulguées hors conventions, par statut au 05/10/2026 : 2017-2018 : 41 lois, dont 8 avec au moins une mesure en attente, 21 toutes mesures prises, 12 sans mesure à prendre ; 2018-2019 : 49 lois, dont 13 avec au moins une mesure en attente, 11 toutes mesures prises, 25 sans mesure à prendre ; 2019-2020 : 43 lois, dont 13 avec au moins une mesure en attente, 14 toutes mesures prises, 16 sans mesure à prendre ; 2020-2021 : 51 lois, dont 21 avec au moins une mesure en attente, 11 toutes mesures prises, 19 sans mesure à prendre ; 2021-2022 : 64 lois, dont 18 avec au moins une mesure en attente, 25 toutes mesures prises, 21 sans mesure à prendre ; 2022-2023 : 44 lois, dont 15 avec au moins une mesure en attente, 19 toutes mesures prises, 10 sans mesure à prendre ; 2023-2024 : 51 lois, dont 21 avec au moins une mesure en attente, 9 toutes mesures prises, 21 sans mesure à prendre ; 2024-2025 : 56 lois, dont 21 avec au moins une mesure en attente, 14 toutes mesures prises, 20 sans mesure à prendre, 1 sans échéancier. Les valeurs sont dans le tableau sous la figure.</desc>
<rect width="300" height="1016" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">Les lois promulguées</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">d'octobre 2017</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#0A0A0E">à septembre 2025</text>
<text x="0" y="86" font-size="17" font-weight="600" fill="#0A0A0E">attendent-elles encore</text>
<text x="0" y="108" font-size="17" font-weight="600" fill="#0A0A0E">une mesure ?</text>
<text x="0" y="148" font-size="13.5" fill="#52514e">nombre de lois par session ; statuts</text>
<text x="0" y="166" font-size="13.5" fill="#52514e">administratifs à la date du relevé</text>
<text x="0" y="184" font-size="13.5" fill="#52514e">(05/10/2026)</text>
<rect x="0" y="198" width="12" height="12" fill="#eb6834"/>
