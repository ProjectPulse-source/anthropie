<line x1="0" y1="712.0" x2="300" y2="712.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="733.0" font-size="13.5" fill="#52514e">Baromètre de l'application des lois</text>
<text class="pied-source" x="0" y="750.0" font-size="13.5" fill="#52514e">(Assemblée nationale, LexImpact ;</text>
<text class="pied-source" x="0" y="767.0" font-size="13.5" fill="#52514e">données DILA), état au 05/10/2026</text>
<text class="pied-note" x="0" y="788.0" font-size="13.5" fill="#52514e">Lois promulguées par session (1er</text>
<text class="pied-note" x="0" y="805.0" font-size="13.5" fill="#52514e">oct.-30 sept.), hors conventions.</text>
<text class="pied-note" x="0" y="822.0" font-size="13.5" fill="#52514e">Statuts tirés des étiquettes du</text>
<text class="pied-note" x="0" y="839.0" font-size="13.5" fill="#52514e">baromètre : « en attente » ne veut pas</text>
<text class="pied-note" x="0" y="856.0" font-size="13.5" fill="#52514e">dire « en retard » ; « sans mesure à</text>
<text class="pied-note" x="0" y="873.0" font-size="13.5" fill="#52514e">prendre » dépend de l'étiquette « sans</text>
<text class="pied-note" x="0" y="890.0" font-size="13.5" fill="#52514e">objet » et ne prouve pas que la loi ne</text>
<text class="pied-note" x="0" y="907.0" font-size="13.5" fill="#52514e">prévoyait aucune mesure.</text>
