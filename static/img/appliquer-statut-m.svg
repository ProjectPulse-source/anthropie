<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 955" role="img" font-variant-numeric="tabular-nums" aria-labelledby="atm-t atm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="atm-t">Les lois promulguées depuis 2017 attendent-elles encore une mesure ?</title><desc id="atm-d">Barres horizontales, une par session de 2017-2018 à 2024-2025, lois promulguées hors conventions, par statut au 05/10/2026 : 2017-2018 : 41 lois, dont 8 avec au moins une mesure en attente, 21 toutes mesures prises, 12 sans mesure à prendre; 2018-2019 : 49 lois, dont 13 avec au moins une mesure en attente, 11 toutes mesures prises, 25 sans mesure à prendre; 2019-2020 : 43 lois, dont 13 avec au moins une mesure en attente, 14 toutes mesures prises, 16 sans mesure à prendre; 2020-2021 : 51 lois, dont 21 avec au moins une mesure en attente, 11 toutes mesures prises, 19 sans mesure à prendre; 2021-2022 : 64 lois, dont 18 avec au moins une mesure en attente, 25 toutes mesures prises, 21 sans mesure à prendre; 2022-2023 : 44 lois, dont 15 avec au moins une mesure en attente, 19 toutes mesures prises, 10 sans mesure à prendre; 2023-2024 : 51 lois, dont 21 avec au moins une mesure en attente, 9 toutes mesures prises, 21 sans mesure à prendre; 2024-2025 : 56 lois, dont 21 avec au moins une mesure en attente, 14 toutes mesures prises, 20 sans mesure à prendre, 1 sans échéancier. Les valeurs sont dans le tableau sous la figure.</desc>
<rect width="300" height="955" fill="#ffffff"/>
