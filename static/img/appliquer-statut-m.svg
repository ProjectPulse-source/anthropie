<text class="pied-source" x="0" y="777.0" font-size="13.5" fill="#52514e">Baromètre de l'application des lois</text>
<text class="pied-source" x="0" y="794.0" font-size="13.5" fill="#52514e">(Assemblée nationale, LexImpact ;</text>
<text class="pied-source" x="0" y="811.0" font-size="13.5" fill="#52514e">échéanciers du Gouvernement publiés</text>
<text class="pied-source" x="0" y="828.0" font-size="13.5" fill="#52514e">par la DILA), état au 05/10/2026</text>
<text class="pied-note" x="0" y="849.0" font-size="13.5" fill="#52514e">Lois promulguées par session</text>
<text class="pied-note" x="0" y="866.0" font-size="13.5" fill="#52514e">(1er oct.-30 sept.), hors conventions.</text>
<text class="pied-note" x="0" y="883.0" font-size="13.5" fill="#52514e">Statuts tirés des étiquettes du</text>
<text class="pied-note" x="0" y="900.0" font-size="13.5" fill="#52514e">baromètre : « en attente » ne veut pas</text>
<text class="pied-note" x="0" y="917.0" font-size="13.5" fill="#52514e">dire « en retard » ; « sans mesure à</text>
<text class="pied-note" x="0" y="934.0" font-size="13.5" fill="#52514e">prendre » dépend de l'étiquette « sans</text>
<text class="pied-note" x="0" y="951.0" font-size="13.5" fill="#52514e">objet » et ne prouve pas que la loi ne</text>
<text class="pied-note" x="0" y="968.0" font-size="13.5" fill="#52514e">prévoyait aucune mesure.</text>
