<text class="pied-source" x="0" y="715.0" font-size="13.5" fill="#52514e">Baromètre de l'application des lois</text>
<text class="pied-source" x="0" y="732.0" font-size="13.5" fill="#52514e">(Assemblée nationale, LexImpact ;</text>
<text class="pied-source" x="0" y="749.0" font-size="13.5" fill="#52514e">données DILA), état au 05/10/2026</text>
<text class="pied-note" x="0" y="770.0" font-size="13.5" fill="#52514e">Lois promulguées par session (1er</text>
<text class="pied-note" x="0" y="787.0" font-size="13.5" fill="#52514e">oct.-30 sept.), hors conventions.</text>
<text class="pied-note" x="0" y="804.0" font-size="13.5" fill="#52514e">Statuts tirés des étiquettes du</text>
<text class="pied-note" x="0" y="821.0" font-size="13.5" fill="#52514e">baromètre : « en attente » ne veut pas</text>
<text class="pied-note" x="0" y="838.0" font-size="13.5" fill="#52514e">dire « en retard » ; « sans mesure à</text>
<text class="pied-note" x="0" y="855.0" font-size="13.5" fill="#52514e">prendre » dépend de l'étiquette « sans</text>
<text class="pied-note" x="0" y="872.0" font-size="13.5" fill="#52514e">objet ».</text>
