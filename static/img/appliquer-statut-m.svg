<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">2017 attendent-elles encore</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#0A0A0E">une mesure ?</text>
<text x="0" y="104" font-size="13.5" fill="#52514e">nombre de lois par session ; statuts</text>
<text x="0" y="122" font-size="13.5" fill="#52514e">administratifs à la date du relevé</text>
<text x="0" y="140" font-size="13.5" fill="#52514e">(05/10/2026)</text>
<rect x="0" y="154" width="12" height="12" fill="#eb6834"/>
<text x="17" y="165" font-size="13.5" fill="#52514e">au moins une mesure en attente</text>
<rect x="0" y="173" width="12" height="12" fill="#184f95"/>
