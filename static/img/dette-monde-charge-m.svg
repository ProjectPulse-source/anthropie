<title id="mc-m-t">Même dette, coût différent : l'UE en 2025</title><desc id="mc-m-d">Chaque point est un pays. Les pointillés relient les faux jumeaux désignés par la règle publiée : dette voisine, part des recettes consacrée aux intérêts très différente. Deux droites de moindres carrés, une par groupe, sur leur plage observée. Intérêts en % des recettes : Hongrie 8,8 %, Slovénie 2,7 %, France 4,2 %, Italie 8,0 %.</desc>
