<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1891" role="img" font-variant-numeric="tabular-nums" aria-labelledby="pvm-t pvm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="pvm-t">L’article 19 dispense de contreseing huit dispositions : acte par acte, ce que dit chaque article</title><desc id="pvm-d">Matrice de douze actes répartis entre les huit dispositions de l'article 19, et quatre colonnes. Une case pleine signifie que l'article lui-même contient une citation exacte de l'élément. Trois actes n'y ont ni élément exigé avant l'acte ni autre acteur pour la suite : nommer le Premier ministre, adresser un message au Parlement et désigner le président du Conseil constitutionnel.</desc>
