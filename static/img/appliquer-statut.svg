<text class="pied-source" x="0" y="347.0" font-size="11" fill="#52514e">Baromètre de l'application des lois (Assemblée nationale, LexImpact ; données DILA), état au 05/10/2026</text>
<text class="pied-note" x="0" y="361.0" font-size="11" fill="#52514e">Lois promulguées par session (1er oct.-30 sept.), hors conventions. Statuts tirés des étiquettes du baromètre : « en</text>
