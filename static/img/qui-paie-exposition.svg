<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 659" role="img" font-variant-numeric="tabular-nums" aria-labelledby="qp-exp-t qp-exp-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="qp-exp-t">Un même effort de 10 milliards d'euros : qui le supporterait selon la décision prise ?</title>
<desc id="qp-exp-d">Deux panneaux. A : pour un effort de 10 milliards d'euros réparti au prorata de chaque poste, la part du revenu disponible net que représenterait ce montant pour chaque dixième de niveau de vie, en 2023. Une baisse des dépenses d'enseignement pèse 2,75 % du revenu du premier dixième et 0,21 % du dernier ; une hausse des impôts sur les revenus et le patrimoine, 1,14 % du dernier ; les pensions restent entre 0,43 et 0,78 %. B : le rapport entre la décision la plus lourde et la plus légère pour un même groupe, en base 1. Il vaut ×5,5 au dernier dixième et au moins autant au premier, et descend à ×1,4 en D7-D8 : c'est là que le levier retenu différencie le moins les ménages.</desc>
<text x="0.0" y="22.0" font-size="13" fill="#2b2a28" text-anchor="start" font-weight="600">Un même effort de 10 milliards d'euros : qui le supporterait, selon la décision prise ?</text>
<text x="0.0" y="48.0" font-size="12" fill="#2b2a28" text-anchor="start" font-weight="600">A · Montant imputé au groupe, en % de son revenu disponible net</text>
<text x="0.0" y="64.0" font-size="11" fill="#898781" text-anchor="start">Effort réparti au prorata des montants existants de chaque poste · dixièmes de niveau de vie, 2023</text>
<text x="0.0" y="78.0" font-size="11" fill="#898781" text-anchor="start">Décisions comparées : impôts sur les revenus et le patrimoine · pensions de retraite · dépenses d'enseignement</text>
