<text x="369.7" y="552.0" font-size="11" fill="#52514e" text-anchor="middle">le levier choisi y différencie le moins les ménages</text>
<line x1="0" y1="566.0" x2="720" y2="566.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="0" y="579.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">Insee, comptes nationaux distribués, tableau CND.101 (millésime 2023, base 2020) · France, dixièmes de niveau de vie usuel</text>
<text x="0" y="591.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">Profil d'exposition, non une simulation : ni comportement, ni effet en retour. Une baisse de service valorisé n'est pas une perte de revenu monétaire.</text>
<text x="0" y="603.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">Point D1 des impôts écarté : l'impôt sur le revenu du premier vingtième y pèse 60 % du poste quand les vingtièmes voisins sont à zéro, et varie de 1 à 2,9 selon le millésime.</text>
<text x="0" y="615.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">D1 porte « ≥ » : l'écart y est calculé sur les deux leviers conservés — c'est une borne inférieure, un troisième point ne pourrait que l'élever.</text>
<text x="0" y="627.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">Le creux se situe en D7 ou D8 sur les quatre millésimes 2020-2023, et dans la même zone avec trois mesures de dispersion.</text>
<text x="0" y="639.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#898781">Compilation Stéphane Lalut, CC BY 4.0 · stephane-lalut.com/qui-paie-la-dette-publique/</text>
