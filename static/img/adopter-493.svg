<title id="a4-t">Engagements de responsabilité sur un texte (art. 49, al. 3)</title><desc id="a4-d">Barres horizontales par législature : engagements sur un projet de loi de finances ou de financement de la sécurité sociale, et sur un autre projet ou une proposition. XIVe (2012-2017) : 6 engagements sur 2 textes, aucun sur un projet de loi de finances ou de financement de la sécurité sociale ; XVe (2017-2022) : 1 engagement sur 1 texte, aucun sur un projet de loi de finances ou de financement de la sécurité sociale ; XVIe (2022-2024) : 23 engagements sur 6 textes, dont 21 sur un projet de loi de finances ou de financement de la sécurité sociale ; XVIIe (depuis 2024), en cours : 8 engagements sur 3 textes, tous sur un projet de loi de finances ou de financement de la sécurité sociale, 1 motion de censure adoptée.</desc>
