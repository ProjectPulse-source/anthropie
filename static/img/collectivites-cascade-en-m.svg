<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 830" role="img" font-variant-numeric="tabular-nums" aria-labelledby="ccm-t ccm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="ccm-t">Local balance 2013-2017, in euros and in percentage points of GDP</title><desc id="ccm-d">Two waterfalls, same items, same order. In billions of current euros: balance of −8.3 in 2013; transfers received −8.9, taxes +18.2, other revenue +1.6, investment +7.5, other spending −8.7; balance of 1.4 in 2017. In percentage points of GDP: balance of −0.39; transfers −0.64, taxes +0.39, other revenue −0.12, investment +0.50, other spending +0.32; balance of 0.06. Nominal GDP rose by 8.1%.</desc>
<rect width="300" height="830" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">Local balance 2013-2017, in</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">euros and in percentage points</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#0A0A0E">of GDP</text>
<text x="0" y="92" font-size="15" font-weight="600" fill="#0A0A0E">Contribution to the change in the</text>
<text x="0" y="114" font-size="15" font-weight="600" fill="#0A0A0E">balance</text>
<text x="120" y="138" font-size="13.5" fill="#898781" text-anchor="end">€ billion</text>
<text x="300" y="138" font-size="13.5" fill="#898781" text-anchor="end">percentage points of GDP</text>
<rect x="0" y="146" width="300" height="46" fill="#f3efe6"/>
<text x="4" y="161" font-size="13.5" fill="#0A0A0E" font-weight="600">Balance 2013, starting point</text>
<text x="116" y="180" font-size="15" font-weight="600" fill="#0A0A0E" text-anchor="end">−8.3</text>
<text x="296" y="180" font-size="15" font-weight="600" fill="#0A0A0E" text-anchor="end">−0.39</text>
<text x="0" y="209" font-size="13.5" fill="#52514e">Transfers received</text>
<text x="120" y="228" font-size="15" font-weight="600" fill="#eb6834" text-anchor="end">−8.9</text>
<text x="300" y="228" font-size="15" font-weight="600" fill="#eb6834" text-anchor="end">−0.64</text>
<text x="0" y="251" font-size="13.5" fill="#52514e">Taxes</text>
<text x="120" y="270" font-size="15" font-weight="600" fill="#184f95" text-anchor="end">+18.2</text>
<text x="300" y="270" font-size="15" font-weight="600" fill="#184f95" text-anchor="end">+0.39</text>
<text x="0" y="293" font-size="13.5" fill="#52514e">Other revenue</text>
<text x="120" y="312" font-size="15" font-weight="600" fill="#184f95" text-anchor="end">+1.6</text>
<text x="300" y="312" font-size="15" font-weight="600" fill="#eb6834" text-anchor="end">−0.12</text>
<text x="0" y="334" font-size="13.5" font-style="italic" fill="#898781">Spending: sign reversed, a fall</text>
<text x="0" y="352" font-size="13.5" font-style="italic" fill="#898781">improves the balance.</text>
<text x="0" y="375" font-size="13.5" fill="#52514e">Investment (lower spending)</text>
<text x="120" y="394" font-size="15" font-weight="600" fill="#184f95" text-anchor="end">+7.5</text>
<text x="300" y="394" font-size="15" font-weight="600" fill="#184f95" text-anchor="end">+0.50</text>
<text x="0" y="417" font-size="13.5" fill="#52514e">Other spending (higher in euros, lower</text>
<text x="0" y="436" font-size="13.5" fill="#52514e">as a share of GDP)</text>
<text x="120" y="455" font-size="15" font-weight="600" fill="#eb6834" text-anchor="end">−8.7</text>
<text x="300" y="455" font-size="15" font-weight="600" fill="#184f95" text-anchor="end">+0.32</text>
<rect x="0" y="463" width="300" height="46" fill="#f3efe6"/>
<text x="4" y="478" font-size="13.5" fill="#0A0A0E" font-weight="600">Balance 2017, end point</text>
<text x="116" y="497" font-size="15" font-weight="600" fill="#0A0A0E" text-anchor="end">1.4</text>
<text x="296" y="497" font-size="15" font-weight="600" fill="#0A0A0E" text-anchor="end">0.06</text>
<line x1="0" y1="519.0" x2="300" y2="519.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="540.0" font-size="13.5" fill="#52514e">Eurostat gov_10a_main, local</text>
<text class="pied-source" x="0" y="557.0" font-size="13.5" fill="#52514e">government (S1313), France; percentage</text>
<text class="pied-source" x="0" y="574.0" font-size="13.5" fill="#52514e">points computed on the GDP of the same</text>
<text class="pied-source" x="0" y="591.0" font-size="13.5" fill="#52514e">accounts. Data retrieved on 19 October</text>
<text class="pied-source" x="0" y="608.0" font-size="13.5" fill="#52514e">2026.</text>
<text class="pied-note" x="0" y="629.0" font-size="13.5" fill="#52514e">Values: each item's contribution to</text>
<text class="pied-note" x="0" y="646.0" font-size="13.5" fill="#52514e">the change in the balance; for</text>
<text class="pied-note" x="0" y="663.0" font-size="13.5" fill="#52514e">spending, the opposite of its change.</text>
<text class="pied-note" x="0" y="680.0" font-size="13.5" fill="#52514e">Other spending rose by €8.7 billion</text>
<text class="pied-note" x="0" y="697.0" font-size="13.5" fill="#52514e">(negative contribution) and fell by</text>
<text class="pied-note" x="0" y="714.0" font-size="13.5" fill="#52514e">0.32 percentage points of GDP</text>
<text class="pied-note" x="0" y="731.0" font-size="13.5" fill="#52514e">(positive contribution): nominal GDP</text>
<text class="pied-note" x="0" y="748.0" font-size="13.5" fill="#52514e">rose by 8.1%. An accounting reading:</text>
<text class="pied-note" x="0" y="765.0" font-size="13.5" fill="#52514e">the items add up to the balance; they</text>
<text class="pied-note" x="0" y="782.0" font-size="13.5" fill="#52514e">do not say what decided it.</text>
