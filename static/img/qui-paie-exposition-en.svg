<text x="369.7" y="538.0" font-size="11" fill="#52514e" text-anchor="middle">D7-D8: minimum dispersion across the three levers</text>
<text x="369.7" y="552.0" font-size="11" fill="#52514e" text-anchor="middle">where the lever chosen differentiates households least</text>
<line x1="0" y1="566.0" x2="720" y2="566.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="0" y="579.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">Insee, distributional national accounts, table CND.101 (2023 vintage, base 2020) · France, standard-of-living deciles</text>
<text x="0" y="591.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">An exposure profile, not a simulation: no behaviour, no feedback effect. A cut in a valued public service is not a loss of cash income.</text>
<text x="0" y="603.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">D1 tax point excluded: income tax of the first twentieth makes up 60% of the item while the neighbouring twentieths are at zero, and varies from 1 to 2.9 by vintage.</text>
<text x="0" y="615.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">D1 carries “≥”: the gap there is computed on the two levers kept — a lower bound, which a third point could only raise.</text>
<text x="0" y="627.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#52514e">The trough lies in D7 or D8 in all four vintages 2020-2023, and in the same zone with three measures of dispersion.</text>
<text x="0" y="639.0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#898781">Compiled by Stéphane Lalut, CC BY 4.0 · stephane-lalut.com/en/who-really-pays-public-debt/</text>
</svg>
