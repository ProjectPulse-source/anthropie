<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 659" role="img" font-variant-numeric="tabular-nums" aria-labelledby="qp-exp-t qp-exp-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="qp-exp-t">The same €10 billion adjustment: who would bear it, depending on the decision taken?</title>
<desc id="qp-exp-d">Two panels. A: for a 10 billion euro adjustment allocated pro rata to each item, the share of net disposable income this amount would represent for each standard-of-living decile, in 2023. A cut in education spending weighs 2.75% of the income of the first decile and 0.21% of the last; a rise in taxes on income and wealth, 1.14% of the last; pensions stay between 0.43 and 0.78%. B: the ratio of the heaviest to the lightest decision for the same group, base 1. It is ×5.5 in the last decile and at least as much in the first, and falls to ×1.4 in D7-D8: that is where the lever chosen differentiates households least.</desc>
<text x="0.0" y="22.0" font-size="13" fill="#52514e" text-anchor="start">The same €10 billion adjustment: who would bear it, depending on the decision taken?</text>
<text x="0.0" y="48.0" font-size="12" fill="#2b2a28" text-anchor="start" font-weight="600">A · Amount allocated to the group, as a % of its net disposable income</text>
<text x="0.0" y="64.0" font-size="11" fill="#898781" text-anchor="start">Adjustment allocated pro rata to the existing amounts of each item · standard-of-living deciles, 2023</text>
<text x="0.0" y="78.0" font-size="11" fill="#898781" text-anchor="start">Decisions compared: taxes on income and wealth · retirement pensions · education spending</text>
