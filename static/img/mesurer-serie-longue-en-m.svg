<title id="mlm-t">ILO unemployment and category A registrants in France, 2012-2025</title><desc id="mlm-d">Two annual lines from 2012 to 2025, in millions. Unemployed under the ILO definition: 2012 2.9; 2013 3.0; 2014 3.0; 2015 3.1; 2016 3.0; 2017 2.8; 2018 2.7; 2019 2.5; 2020 2.4; 2021 2.4; 2022 2.2; 2023 2.3; 2024 2.3; 2025 2.4. Category A registrants: 2012 3.2; 2013 3.5; 2014 3.7; 2015 3.8; 2016 3.8; 2017 3.7; 2018 3.7; 2019 3.6; 2020 3.9; 2021 3.6; 2022 3.1; 2023 3.0; 2024 3.0; 2025 3.3. Markers: 1, unemployment insurance reform (November 2019 to December 2021); 2, Labour Force Survey redesigned in 2021; 3, new monthly updating form in 2022; 4, form of October-November 2024 and full employment act in 2025.</desc>
