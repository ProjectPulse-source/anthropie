<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 334" role="img" font-variant-numeric="tabular-nums" aria-labelledby="rp-t rp-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="rp-t">Le référendum d&#x27;initiative partagée, de 2015 au 5 octobre 2026</title><desc id="rp-d">sept saisines du Conseil constitutionnel ; une conforme ; 1 093 030 soutiens recueillis pour 4 717 396 requis ; aucun référendum.</desc>
<rect width="720" height="334" fill="#ffffff"/>
<text x="0.0" y="18.0" font-size="13" fill="#0A0A0E" text-anchor="start" font-weight="600">Le référendum d&#x27;initiative partagée, de 2015 au 5 octobre 2026</text>
<text x="0.0" y="36.0" font-size="12" fill="#52514e" text-anchor="start">propositions de loi soumises au Conseil constitutionnel, et ce qu&#x27;elles sont devenues</text>
<text x="250.0" y="84.0" font-size="11" fill="#52514e" text-anchor="end">Saisines du Conseil</text>
<rect x="260" y="66" width="300.0" height="26" fill="#184f95"/>
<text x="568.0" y="84.0" font-size="13" fill="#0A0A0E" text-anchor="start" font-weight="600">7</text>
<text x="250.0" y="122.0" font-size="11" fill="#52514e" text-anchor="end">Jugées conformes</text>
<rect x="260" y="104" width="42.9" height="26" fill="#184f95"/>
<text x="310.9" y="122.0" font-size="13" fill="#0A0A0E" text-anchor="start" font-weight="600">1</text>
<text x="250.0" y="160.0" font-size="11" fill="#52514e" text-anchor="end">Soutien d&#x27;un dixième des inscrits réuni</text>
<line x1="260" y1="142" x2="260" y2="168" stroke="#52514e" stroke-width="2"/>
<text x="268.0" y="160.0" font-size="13" fill="#0A0A0E" text-anchor="start" font-weight="600">0</text>
<text x="250.0" y="198.0" font-size="11" fill="#52514e" text-anchor="end">Soumises au référendum</text>
<line x1="260" y1="180" x2="260" y2="206" stroke="#52514e" stroke-width="2"/>
<text x="268.0" y="198.0" font-size="13" fill="#0A0A0E" text-anchor="start" font-weight="600">0</text>
<rect x="260" y="226" width="300" height="12" fill="none" stroke="#52514e"/>
<rect x="260" y="226" width="69.5" height="12" fill="#8a8f98"/>
<text x="250.0" y="236.0" font-size="10" fill="#52514e" text-anchor="end">2019-1 RIP</text>
<text x="260.0" y="254.0" font-size="10" fill="#0A0A0E" text-anchor="start" font-weight="600">Soutiens recueillis : 1 093 030</text>
<text x="260.0" y="268.0" font-size="10" fill="#52514e" text-anchor="start">Seuil : 4 717 396 (un dixième des inscrits)</text>
<line x1="0" y1="288" x2="720" y2="288" stroke="#e1e0d9"/>
<text x="0" y="301" font-size="9" fill="#52514e">Conseil constitutionnel, décisions « RIP » (stock CONSTIT, arrêté au 05/10/2026) ; Constitution, art. 11</text>
<text x="0" y="313" font-size="9" fill="#52514e">Deux autres propositions déposées à l&#x27;Assemblée « en application de l&#x27;article 11 » n&#x27;ont fait l&#x27;objet d&#x27;aucune décision.</text>
<text x="0" y="325" font-size="9" fill="#898781">Compilation Stéphane Lalut, CC BY 4.0 · stephane-lalut.com/un-president-peut-il-recourir-au-referendum/</text>
