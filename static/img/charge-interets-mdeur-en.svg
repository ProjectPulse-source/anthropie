<text x="45.0" y="259.0" font-size="11" fill="#898781" text-anchor="end">20</text>
<line x1="52.0" y1="204.0" x2="588.0" y2="204.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="45.0" y="208.0" font-size="11" fill="#898781" text-anchor="end">40</text>
<line x1="52.0" y1="152.9" x2="588.0" y2="152.9" stroke="#e1e0d9" stroke-width="1"/>
<text x="45.0" y="156.9" font-size="11" fill="#898781" text-anchor="end">60</text>
<line x1="52.0" y1="101.9" x2="588.0" y2="101.9" stroke="#e1e0d9" stroke-width="1"/>
<text x="45.0" y="105.9" font-size="11" fill="#898781" text-anchor="end">80</text>
