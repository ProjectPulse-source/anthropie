<title id="ch-t">Interest paid in billion euros, 1995-2025</title>
<desc id="ch-d">One curve in billion euros, from 1995 to 2025. Interest paid falls to its trough in 2020, then climbs steeply to 66.6 billion in 2025.</desc>
