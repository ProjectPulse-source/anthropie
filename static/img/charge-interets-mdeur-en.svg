<text x="303.2" y="324.0" font-size="11" fill="#898781" text-anchor="middle">2010</text>
<text x="470.8" y="324.0" font-size="11" fill="#898781" text-anchor="middle">2020</text>
<text x="588.0" y="324.0" font-size="11" fill="#898781" text-anchor="middle">2027</text>
