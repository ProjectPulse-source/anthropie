<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 388" role="img" aria-labelledby="ch-t ch-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="ch-t">Interest paid in billion euros, 1995-2025</title>
<desc id="ch-d">One curve in billion euros, from 1995 to 2025. Interest paid falls to its trough in 2020, then climbs steeply to 66.6 billion in 2025. A dotted extension shows the Government's forecast in the 2027 budget bill: 91 billion in 2027. A forecast, not an observation.</desc>
<text x="0" y="22" font-size="13" font-weight="600" fill="#0A0A0E">Interest paid by general government, billion euros, current prices</text>
