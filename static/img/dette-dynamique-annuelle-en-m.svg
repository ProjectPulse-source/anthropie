<title id="dam-t">Each year, what pushed the debt-to-GDP ratio up or held it back</title><desc id="dam-d">Stacked bars per year, in points of GDP: in orange the primary balance contribution (deficit as plus, surplus as minus), in blue the net effect of interest rates and growth, in grey stock-flow adjustments; the black dot is the actual change in the ratio. The two largest rises are in 2009 (+14.2 points) and 2020 (+16.7). From 2021 to 2023, the interest-growth effect takes 16.8 points off the ratio, as nominal GDP growth, price rises included, accelerates.</desc>
