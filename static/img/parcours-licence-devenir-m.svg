<text x="0" y="589.0" font-size="14" font-weight="600" fill="#26262f">Ensemble</text>
<rect x="0.0" y="595.0" width="147.3" height="18" fill="#184f95" stroke="#ffffff" stroke-width="1"/>
<rect x="147.3" y="595.0" width="76.2" height="18" fill="#8a8781" stroke="#ffffff" stroke-width="1"/>
