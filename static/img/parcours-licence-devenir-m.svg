<rect x="0" y="623.0" width="10" height="10" fill="#184f95"/>
<text x="15" y="633.0" font-size="13.5" fill="#26262f">Passés <tspan font-weight="600">49,1</tspan></text>
<rect x="132" y="623.0" width="10" height="10" fill="#8a8781"/>
<text x="147" y="633.0" font-size="13.5" fill="#26262f">Recommencent <tspan font-weight="600">25,4</tspan></text>
<rect x="0" y="642.0" width="10" height="10" fill="#c9c5c0"/>
<text x="15" y="652.0" font-size="13.5" fill="#26262f">Réorientés <tspan font-weight="600">10,8</tspan></text>
<rect x="132" y="642.0" width="10" height="10" fill="#eb6834"/>
<text x="147" y="652.0" font-size="13.5" fill="#26262f">Non retrouvés <tspan font-weight="600">14,7</tspan></text>
<line x1="0" y1="681.0" x2="300" y2="681.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="702.0" font-size="13.5" fill="#55524f">MESRE-SIES, Note Flash n° 29,</text>
<text class="pied-source" x="0" y="719.0" font-size="13.5" fill="#55524f">novembre 2025, tableaux nationaux,</text>
<text class="pied-source" x="0" y="736.0" font-size="13.5" fill="#55524f">feuille « Devenir cohorte 2023 »</text>
<text class="pied-source" x="0" y="753.0" font-size="13.5" fill="#55524f">(SISE, SCOLARITE, SIFA)</text>
<text class="pied-note" x="0" y="774.0" font-size="13.5" fill="#55524f">Passés : inscrits en 2ᵉ ou 3ᵉ année de</text>
<text class="pied-note" x="0" y="791.0" font-size="13.5" fill="#55524f">licence, ou entrés en études de santé</text>
<text class="pied-note" x="0" y="808.0" font-size="13.5" fill="#55524f">depuis une licence accès santé.</text>
<text class="pied-note" x="0" y="825.0" font-size="13.5" fill="#55524f">Recommencent : changements de</text>
<text class="pied-note" x="0" y="842.0" font-size="13.5" fill="#55524f">discipline ou d'établissement compris.</text>
<text class="pied-note" x="0" y="863.0" font-size="13.5" fill="#55524f">Non retrouvés : absents des fichiers</text>
<text class="pied-note" x="0" y="880.0" font-size="13.5" fill="#55524f">d'inscription (« sortie de</text>
<text class="pied-note" x="0" y="897.0" font-size="13.5" fill="#55524f">l'enseignement supérieur » pour le</text>
<text class="pied-note" x="0" y="914.0" font-size="13.5" fill="#55524f">SIES) ; en général, ils ne sont plus</text>
<text class="pied-note" x="0" y="931.0" font-size="13.5" fill="#55524f">étudiants, mais une faible part peut</text>
<text class="pied-note" x="0" y="948.0" font-size="13.5" fill="#55524f">être inscrite à l'étranger ou hors du</text>
<text class="pied-note" x="0" y="965.0" font-size="13.5" fill="#55524f">champ suivi.</text>
<text class="pied-note" x="0" y="986.0" font-size="13.5" fill="#55524f">Origine : profession du parent</text>
<text class="pied-note" x="0" y="1003.0" font-size="13.5" fill="#55524f">référent, en quatre classes du SIES :</text>
<text class="pied-note" x="0" y="1020.0" font-size="13.5" fill="#55524f">très favorisée (cadres, enseignants…),</text>
<text class="pied-note" x="0" y="1037.0" font-size="13.5" fill="#55524f">favorisée (professions</text>
<text class="pied-note" x="0" y="1054.0" font-size="13.5" fill="#55524f">intermédiaires), assez défavorisée</text>
<text class="pied-note" x="0" y="1071.0" font-size="13.5" fill="#55524f">(employés…), défavorisée (ouvriers…).</text>
<text class="pied-note" x="0" y="1092.0" font-size="13.5" fill="#55524f">Situation d'inscription un an après,</text>
<text class="pied-note" x="0" y="1109.0" font-size="13.5" fill="#55524f">non un diplôme. Le tableau ne croise</text>
<text class="pied-note" x="0" y="1126.0" font-size="13.5" fill="#55524f">pas l'origine sociale et le niveau</text>
<text class="pied-note" x="0" y="1143.0" font-size="13.5" fill="#55524f">scolaire à l'entrée.</text>
<text class="pied-note" x="0" y="1164.0" font-size="13.5" fill="#55524f">Taux arrondis : leur somme peut</text>
<text class="pied-note" x="0" y="1181.0" font-size="13.5" fill="#55524f">différer de 100 %. Origine non</text>
<text class="pied-note" x="0" y="1198.0" font-size="13.5" fill="#55524f">renseignée (3,8 % des inscrits) : pas</text>
<text class="pied-note" x="0" y="1215.0" font-size="13.5" fill="#55524f">de barre, comprise dans l'ensemble.</text>
