<text x="147" y="313.0" font-size="13.5" fill="#26262f">Recommencent <tspan font-weight="600">24,1</tspan></text>
<rect x="0" y="322.0" width="10" height="10" fill="#c9c5c0"/>
<text x="15" y="332.0" font-size="13.5" fill="#26262f">Réorientés <tspan font-weight="600">10,9</tspan></text>
<rect x="132" y="322.0" width="10" height="10" fill="#eb6834"/>
<text x="147" y="332.0" font-size="13.5" fill="#26262f">Non retrouvés <tspan font-weight="600">14,5</tspan></text>
<text x="0" y="373.0" font-size="14" fill="#26262f">Assez défavorisée</text>
<rect x="0.0" y="379.0" width="140.0" height="18" fill="#184f95" stroke="#ffffff" stroke-width="1"/>
<rect x="140.0" y="379.0" width="78.8" height="18" fill="#8a8781" stroke="#ffffff" stroke-width="1"/>
<rect x="218.8" y="379.0" width="33.0" height="18" fill="#c9c5c0" stroke="#ffffff" stroke-width="1"/>
<rect x="251.7" y="379.0" width="48.3" height="18" fill="#eb6834" stroke="#ffffff" stroke-width="1"/>
<rect x="0" y="407.0" width="10" height="10" fill="#184f95"/>
<text x="15" y="417.0" font-size="13.5" fill="#26262f">Passés <tspan font-weight="600">46,7</tspan></text>
<rect x="132" y="407.0" width="10" height="10" fill="#8a8781"/>
<text x="147" y="417.0" font-size="13.5" fill="#26262f">Recommencent <tspan font-weight="600">26,3</tspan></text>
