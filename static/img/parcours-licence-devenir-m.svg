<text x="0" y="477.0" font-size="14" fill="#26262f">Défavorisée</text>
<rect x="0.0" y="483.0" width="119.2" height="18" fill="#184f95" stroke="#ffffff" stroke-width="1"/>
<rect x="119.2" y="483.0" width="96.7" height="18" fill="#8a8781" stroke="#ffffff" stroke-width="1"/>
<rect x="215.9" y="483.0" width="31.8" height="18" fill="#c9c5c0" stroke="#ffffff" stroke-width="1"/>
<rect x="247.7" y="483.0" width="52.3" height="18" fill="#eb6834" stroke="#ffffff" stroke-width="1"/>
