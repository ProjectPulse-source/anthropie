<line x1="0" y1="681.0" x2="300" y2="681.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="702.0" font-size="13.5" fill="#55524f">MESRE-SIES, Note Flash n° 29, novembre</text>
<text class="pied-source" x="0" y="719.0" font-size="13.5" fill="#55524f">2025, tableaux nationaux, feuille</text>
<text class="pied-source" x="0" y="736.0" font-size="13.5" fill="#55524f">« Devenir cohorte 2023 » (SISE,</text>
<text class="pied-source" x="0" y="753.0" font-size="13.5" fill="#55524f">SCOLARITE, SIFA)</text>
<text class="pied-note" x="0" y="774.0" font-size="13.5" fill="#55524f">Passés : inscrits en 2ᵉ ou 3ᵉ année de</text>
<text class="pied-note" x="0" y="791.0" font-size="13.5" fill="#55524f">licence, ou entrés en études de santé</text>
<text class="pied-note" x="0" y="808.0" font-size="13.5" fill="#55524f">depuis une licence accès santé.</text>
<text class="pied-note" x="0" y="825.0" font-size="13.5" fill="#55524f">Recommencent : changements de</text>
<text class="pied-note" x="0" y="842.0" font-size="13.5" fill="#55524f">discipline compris. Non retrouvés :</text>
<text class="pied-note" x="0" y="859.0" font-size="13.5" fill="#55524f">absents des fichiers d'inscription</text>
<text class="pied-note" x="0" y="876.0" font-size="13.5" fill="#55524f">(« sortie de l'enseignement</text>
<text class="pied-note" x="0" y="893.0" font-size="13.5" fill="#55524f">supérieur » pour le SIES) ; certains</text>
<text class="pied-note" x="0" y="910.0" font-size="13.5" fill="#55524f">étudient à l'étranger ou hors du champ</text>
<text class="pied-note" x="0" y="927.0" font-size="13.5" fill="#55524f">suivi. Situation d'inscription un an</text>
<text class="pied-note" x="0" y="944.0" font-size="13.5" fill="#55524f">après, non un diplôme. Le tableau ne</text>
<text class="pied-note" x="0" y="961.0" font-size="13.5" fill="#55524f">croise pas l'origine sociale et le</text>
<text class="pied-note" x="0" y="978.0" font-size="13.5" fill="#55524f">niveau scolaire à l'entrée. Taux</text>
<text class="pied-note" x="0" y="995.0" font-size="13.5" fill="#55524f">arrondis : leur somme peut différer de</text>
<text class="pied-note" x="0" y="1012.0" font-size="13.5" fill="#55524f">100 %. Origine non renseignée (3,8 %</text>
<text class="pied-note" x="0" y="1029.0" font-size="13.5" fill="#55524f">des inscrits) : pas de barre, comprise</text>
<text class="pied-note" x="0" y="1046.0" font-size="13.5" fill="#55524f">dans l'ensemble.</text>
