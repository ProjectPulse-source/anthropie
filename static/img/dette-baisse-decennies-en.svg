<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" role="img" font-variant-numeric="tabular-nums" aria-labelledby="bd-t bd-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="bd-t">France: what pushed the debt up or down, decade by decade</title><desc id="bd-d">Three groups of three bars, in points of GDP cumulated over ten years: effect of interest rates and growth, primary deficits, other adjustments (stock-flow). 1996-2005: +8.4, −2.5, +4.4; debt +10.4. 2006-2015: +7.8, +22.4, −1.5; debt +28.8. 2016-2025: −15.1, +30.6, +3.1; debt +18.6. Over the last decade, the interest-growth effect pulled the ratio down and primary deficits pushed it up by more.</desc>
