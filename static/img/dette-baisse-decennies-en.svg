<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 291" role="img" font-variant-numeric="tabular-nums" aria-labelledby="bd-t bd-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="bd-t">France: what pushed the weight of debt up or down, decade by decade</title><desc id="bd-d">For each decade, in points of GDP cumulated over ten years: effect of interest rates and growth, contribution of the primary balance, other adjustments, and their sum, the change in the debt ratio. 1996-2005: +8.4, −2.5, +4.4; change +10.4. 2006-2015: +7.8, +22.4, −1.5; change +28.8. 2016-2025: −15.1, +30.6, +3.1; change +18.6. Over the last decade, the interest-growth effect pulled the ratio down and primary deficits pushed it up by more.</desc>
<rect width="720" height="291" fill="#ffffff"/>
<text x="0" y="18" font-size="15" font-weight="600" fill="#26262f">France: what pushed the weight of debt up or down, decade by decade</text>
<rect x="0" y="36" width="10" height="10" fill="#eb6834"/>
<text x="14" y="45" font-size="11" fill="#55524f">pushes the ratio up</text>
<rect x="146" y="36" width="10" height="10" fill="#8a8781"/>
<text x="160" y="45" font-size="11" fill="#55524f">pulls it down</text>
<rect x="256" y="36" width="10" height="10" fill="#184f95"/>
<text x="270" y="45" font-size="11" fill="#55524f">change in the ratio (sum of the three)</text>
<text x="0" y="64" font-size="11" fill="#96928f">In points of GDP cumulated over ten years</text>
<text x="221.2" y="88" font-size="12" font-weight="600" fill="#26262f" text-anchor="middle">Interest and growth</text>
<text x="363.8" y="88" font-size="12" font-weight="600" fill="#26262f" text-anchor="middle">Primary balance</text>
<text x="506.2" y="88" font-size="12" font-weight="600" fill="#26262f" text-anchor="middle">Other adjustments</text>
<text x="648.8" y="88" font-size="12" font-weight="600" fill="#26262f" text-anchor="middle">Change in the ratio</text>
<line x1="200.8" y1="96" x2="200.8" y2="216" stroke="#8f8a84" stroke-width="1.2"/>
<line x1="343.3" y1="96" x2="343.3" y2="216" stroke="#8f8a84" stroke-width="1.2"/>
<line x1="485.8" y1="96" x2="485.8" y2="216" stroke="#8f8a84" stroke-width="1.2"/>
<line x1="628.3" y1="96" x2="628.3" y2="216" stroke="#8f8a84" stroke-width="1.2"/>
<text x="0" y="113" font-size="12.5" font-weight="600" fill="#26262f">1996-2005</text>
<text x="0" y="128" font-size="11" fill="#184f95">57.8 → 68.2% of GDP</text>
<rect x="200.8" y="106" width="17.2" height="16" fill="#eb6834"/>
<text x="222.1" y="118" font-size="11" font-weight="600" fill="#26262f" text-anchor="start">+8.4</text>
<rect x="338.3" y="106" width="5.0" height="16" fill="#8a8781"/>
<text x="334.3" y="118" font-size="11" font-weight="600" fill="#26262f" text-anchor="end">−2.5</text>
<rect x="485.8" y="106" width="9.0" height="16" fill="#eb6834"/>
<text x="498.8" y="118" font-size="11" font-weight="600" fill="#26262f" text-anchor="start">+4.4</text>
<rect x="628.3" y="106" width="21.2" height="16" fill="#184f95"/>
<text x="653.5" y="118" font-size="11" font-weight="600" fill="#26262f" text-anchor="start">+10.4</text>
<line x1="0" y1="136.0" x2="720" y2="136.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="0" y="153" font-size="12.5" font-weight="600" fill="#26262f">2006-2015</text>
<text x="0" y="168" font-size="11" fill="#184f95">68.2 → 97.0% of GDP</text>
<rect x="200.8" y="146" width="16.0" height="16" fill="#eb6834"/>
<text x="220.9" y="158" font-size="11" font-weight="600" fill="#26262f" text-anchor="start">+7.8</text>
<rect x="343.3" y="146" width="45.7" height="16" fill="#eb6834"/>
<text x="393.1" y="158" font-size="11" font-weight="600" fill="#26262f" text-anchor="start">+22.4</text>
<rect x="482.9" y="146" width="3.0" height="16" fill="#8a8781"/>
<text x="478.9" y="158" font-size="11" font-weight="600" fill="#26262f" text-anchor="end">−1.5</text>
<rect x="628.3" y="146" width="58.8" height="16" fill="#184f95"/>
<text x="624.3" y="158" font-size="11" font-weight="600" fill="#26262f" text-anchor="end">+28.8</text>
<line x1="0" y1="176.0" x2="720" y2="176.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="0" y="193" font-size="12.5" font-weight="600" fill="#26262f">2016-2025</text>
<text x="0" y="208" font-size="11" fill="#184f95">97.0 → 115.6% of GDP</text>
<rect x="170.0" y="186" width="30.8" height="16" fill="#8a8781"/>
<text x="204.8" y="198" font-size="11" font-weight="600" fill="#26262f" text-anchor="start">−15.1</text>
<rect x="343.3" y="186" width="62.5" height="16" fill="#eb6834"/>
<text x="339.3" y="198" font-size="11" font-weight="600" fill="#26262f" text-anchor="end">+30.6</text>
<rect x="485.8" y="186" width="6.3" height="16" fill="#eb6834"/>
<text x="496.1" y="198" font-size="11" font-weight="600" fill="#26262f" text-anchor="start">+3.1</text>
<rect x="628.3" y="186" width="37.9" height="16" fill="#184f95"/>
<text x="670.3" y="198" font-size="11" font-weight="600" fill="#26262f" text-anchor="start">+18.6</text>
<line x1="0" y1="226.0" x2="720" y2="226.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="241.0" font-size="11" fill="#55524f">Eurostat gov_10dd_edpt1 (debt, GDP), gov_10a_main (B9, D41PAY), France, 1996-2025</text>
<text class="pied-note" x="0" y="255.0" font-size="11" fill="#55524f">An accounting decomposition, not a causal one: the three terms are not independent. Change computed on unrounded</text>
<text class="pied-note" x="0" y="269.0" font-size="11" fill="#55524f">values; the sum of the contributions shown may differ by 0.1 point.</text>
