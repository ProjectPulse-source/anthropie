<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 677" role="img" font-variant-numeric="tabular-nums" aria-labelledby="durees-inscription-t durees-inscription-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="durees-inscription-t">Combien de temps une trace reste inscrite : de six mois à quarante ans</title><desc id="durees-inscription-d">Frise des durées d'inscription sur une échelle logarithmique de six mois à quarante ans. Permis : un point : 6 mois pour un point seul ; Permis : tous les points : 2 ans sans infraction ; 3 ans après un délit ou une contravention de 4e ou 5e classe ; Malus d'assurance auto : coefficient ramené à 1 au plus après 2 années sans sinistre ; Incident de crédit (FICP) : 5 ans ; Interdiction d'émettre des chèques : 5 ans ; Prêt : cancer ou hépatite C : 5 ans après la fin du protocole thérapeutique ; Surendettement (FICP) : la durée du plan, 7 ans au plus ; 5 ans si le plan est exécuté sans incident ; Casier, bulletin n° 2 (réhabilitation) : 3, 5 ou 10 ans selon la peine ; doublés en récidive (points creux) ; Casier, bulletin n° 1 : 40 ans sans nouvelle condamnation criminelle ou correctionnelle.</desc>
<rect width="720" height="677" fill="#ffffff"/>
<text x="0" y="22" font-size="17" font-weight="600" fill="#1a1a1f">Combien de temps une trace reste inscrite : de six mois à quarante ans</text>
<line x1="300.0" y1="44" x2="300.0" y2="530" stroke="#e6e3dc"/>
<text x="300.0" y="545" font-size="11" fill="#55524f" text-anchor="middle">6 mois</text>
<line x1="361.7" y1="44" x2="361.7" y2="530" stroke="#e6e3dc"/>
<text x="361.7" y="545" font-size="11" fill="#55524f" text-anchor="middle">1 an</text>
<line x1="423.4" y1="44" x2="423.4" y2="530" stroke="#e6e3dc"/>
<text x="423.4" y="545" font-size="11" fill="#55524f" text-anchor="middle">2 ans</text>
<line x1="504.9" y1="44" x2="504.9" y2="530" stroke="#e6e3dc"/>
<text x="504.9" y="545" font-size="11" fill="#55524f" text-anchor="middle">5 ans</text>
<line x1="566.6" y1="44" x2="566.6" y2="530" stroke="#e6e3dc"/>
<text x="566.6" y="545" font-size="11" fill="#55524f" text-anchor="middle">10 ans</text>
<line x1="628.3" y1="44" x2="628.3" y2="530" stroke="#e6e3dc"/>
<text x="628.3" y="545" font-size="11" fill="#55524f" text-anchor="middle">20 ans</text>
<line x1="690.0" y1="44" x2="690.0" y2="530" stroke="#e6e3dc"/>
<text x="690.0" y="545" font-size="11" fill="#55524f" text-anchor="middle">40 ans</text>
<text x="0" y="56.0" font-size="13" font-weight="600" fill="#1a1a1f">Permis : un point</text>
<text x="0" y="70.0" font-size="11" fill="#45423e">6 mois pour un point seul</text>
<circle cx="300.0" cy="60.0" r="5.5" fill="#184f95"/>
<text x="0" y="110.0" font-size="13" font-weight="600" fill="#1a1a1f">Permis : tous les points</text>
<text x="0" y="124.0" font-size="11" fill="#45423e">2 ans sans infraction ; 3 ans après un délit</text>
<text x="0" y="137.0" font-size="11" fill="#45423e">ou une contravention de 4e ou 5e classe</text>
<circle cx="423.4" cy="114.0" r="5.5" fill="#184f95"/>
<circle cx="459.5" cy="114.0" r="5.5" fill="#184f95"/>
<text x="0" y="164.0" font-size="13" font-weight="600" fill="#1a1a1f">Malus d'assurance auto</text>
<text x="0" y="178.0" font-size="11" fill="#45423e">coefficient ramené à 1 au plus après 2 années</text>
<text x="0" y="191.0" font-size="11" fill="#45423e">sans sinistre</text>
<circle cx="423.4" cy="168.0" r="5.5" fill="#184f95"/>
<text x="0" y="218.0" font-size="13" font-weight="600" fill="#1a1a1f">Incident de crédit (FICP)</text>
<text x="0" y="232.0" font-size="11" fill="#45423e">5 ans</text>
<circle cx="504.9" cy="222.0" r="5.5" fill="#184f95"/>
<text x="0" y="272.0" font-size="13" font-weight="600" fill="#1a1a1f">Interdiction d'émettre des chèques</text>
<text x="0" y="286.0" font-size="11" fill="#45423e">5 ans</text>
<circle cx="504.9" cy="276.0" r="5.5" fill="#184f95"/>
<text x="0" y="326.0" font-size="13" font-weight="600" fill="#1a1a1f">Prêt : cancer ou hépatite C</text>
<text x="0" y="340.0" font-size="11" fill="#45423e">5 ans après la fin du protocole thérapeutique</text>
<circle cx="504.9" cy="330.0" r="5.5" fill="#184f95"/>
<text x="0" y="380.0" font-size="13" font-weight="600" fill="#1a1a1f">Surendettement (FICP)</text>
<text x="0" y="394.0" font-size="11" fill="#45423e">la durée du plan, 7 ans au plus ; 5 ans si le</text>
<text x="0" y="407.0" font-size="11" fill="#45423e">plan est exécuté sans incident</text>
<circle cx="504.9" cy="384.0" r="5.5" fill="#184f95"/>
<circle cx="534.9" cy="384.0" r="5.5" fill="#184f95"/>
<text x="0" y="434.0" font-size="13" font-weight="600" fill="#1a1a1f">Casier, bulletin n° 2 (réhabilitation)</text>
<text x="0" y="448.0" font-size="11" fill="#45423e">3, 5 ou 10 ans selon la peine ; doublés en</text>
<text x="0" y="461.0" font-size="11" fill="#45423e">récidive (points creux)</text>
<circle cx="459.5" cy="438.0" r="5.5" fill="#184f95"/>
<circle cx="504.9" cy="438.0" r="5.5" fill="#184f95"/>
<circle cx="566.6" cy="438.0" r="5.5" fill="#184f95"/>
<circle cx="521.2" cy="452.0" r="5.0" fill="#ffffff" stroke="#184f95" stroke-width="1.6"/>
<circle cx="566.6" cy="452.0" r="5.0" fill="#ffffff" stroke="#184f95" stroke-width="1.6"/>
<circle cx="628.3" cy="452.0" r="5.0" fill="#ffffff" stroke="#184f95" stroke-width="1.6"/>
<text x="0" y="488.0" font-size="13" font-weight="600" fill="#1a1a1f">Casier, bulletin n° 1</text>
<text x="0" y="502.0" font-size="11" fill="#45423e">40 ans sans nouvelle condamnation criminelle</text>
<text x="0" y="515.0" font-size="11" fill="#45423e">ou correctionnelle</text>
<circle cx="690.0" cy="492.0" r="5.5" fill="#184f95"/>
<line x1="0" y1="556.0" x2="720" y2="556.0" stroke="#c9c6bd"/>
<text class="pied-source" x="0" y="571.0" font-size="11" fill="#55524f">Source : tableau de la page, établi d'après les textes qu'elle cite (code monétaire et financier, code de la</text>
<text class="pied-source" x="0" y="585.0" font-size="11" fill="#55524f">consommation, code pénal et code de procédure pénale, code de la route, code des assurances, code de la santé</text>
<text class="pied-source" x="0" y="599.0" font-size="11" fill="#55524f">publique, convention AERAS).</text>
<text class="pied-note" x="0" y="613.0" font-size="11" fill="#55524f">Échelle logarithmique. Point plein : délai ; point creux : délai doublé en récidive. Les délais ne courent pas du même</text>
<text class="pied-note" x="0" y="627.0" font-size="11" fill="#55524f">point de départ (voir le tableau). Certains s'abrègent avant terme, par une démarche de la personne (régularisation</text>
<text class="pied-note" x="0" y="641.0" font-size="11" fill="#55524f">d'un chèque, requête en exclusion devant le tribunal) ou par la déclaration d'un tiers (paiement déclaré par</text>
<text class="pied-note" x="0" y="655.0" font-size="11" fill="#55524f">l'établissement).</text>
<text class="pied-licence" x="0" y="669.0" font-size="11" fill="#55524f">Figure Stéphane Lalut, CC BY 4.0 · stephane-lalut.com/combien-de-temps-une-erreur-reste-inscrite/</text>
</svg>