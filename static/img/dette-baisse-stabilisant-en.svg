<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" font-variant-numeric="tabular-nums" aria-labelledby="bs-t bs-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="bs-t">France: the observed primary balance and the one that would have stabilised the debt</title><desc id="bs-d">Two annual lines from 1996 to 2025, in % of GDP: the observed primary balance, positive four times (1998 to 2001), and the primary balance that would have stabilised the debt ratio, ranging from −7.3 in 2021 to +6.1 in 2020. In 2025, the observed balance was −2.9 and the stabilising balance +0.0.</desc>
