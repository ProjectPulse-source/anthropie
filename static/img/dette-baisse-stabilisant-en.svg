<line x1="0" y1="41" x2="18" y2="41" stroke="#eb6834" stroke-width="2.6"/>
<text x="23" y="45" font-size="11" fill="#55524f">observed primary balance</text>
<line x1="175" y1="41" x2="193" y2="41" stroke="#8a8781" stroke-width="2.2"/>
<text x="198" y="45" font-size="11" fill="#55524f">balance that would have stabilised the ratio that year, excluding other adjustments</text>
<text x="0" y="66" font-size="11" fill="#26262f">In 2025, the gap between the two lines (dotted): 2.9 points of GDP.</text>
<line x1="0" y1="322.0" x2="720" y2="322.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="337.0" font-size="11" fill="#55524f">Eurostat gov_10dd_edpt1 (debt, GDP), gov_10a_main (B9, D41PAY), France, 1996-2025</text>
<text class="pied-note" x="0" y="351.0" font-size="11" fill="#55524f">In % of GDP; stabilising balance = (implicit interest rate − nominal growth) / (1 + growth) × debt-to-GDP ratio at the</text>
<text class="pied-note" x="0" y="365.0" font-size="11" fill="#55524f">end of the previous year, excluding other adjustments (stock-flow). An accounting marker for the year, not a target.</text>
