<line x1="0" y1="324.0" x2="720" y2="324.0" stroke="#dcd8d3"/>
<text x="0" y="337.0" font-size="9" fill="#55524f">Eurostat gov_10dd_edpt1 (debt, GDP), gov_10a_main (B9, D41PAY), France, 1996-2025</text>
<text x="0" y="349.0" font-size="9" fill="#55524f">In % of GDP; stabilising balance = (implicit interest rate − nominal growth) / (1 + growth) × previous year's debt, excluding other adjustments (stock-flow).</text>
