<text x="34" y="156.7" font-size="11" fill="#96928f" text-anchor="end">+2%</text>
<line x1="40" y1="129.8" x2="710" y2="129.8" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="34" y="133.8" font-size="11" fill="#96928f" text-anchor="end">+4%</text>
