<text x="34" y="149.2" font-size="10" fill="#96928f" text-anchor="end">+2%</text>
<line x1="40" y1="119.5" x2="710" y2="119.5" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="34" y="122.5" font-size="10" fill="#96928f" text-anchor="end">+4%</text>
<line x1="40" y1="92.8" x2="710" y2="92.8" stroke="#dcd8d3" stroke-width="0.6"/>
