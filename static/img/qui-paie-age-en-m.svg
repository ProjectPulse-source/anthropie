<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 636" role="img" font-variant-numeric="tabular-nums" aria-labelledby="qp-age-m-t qp-age-m-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="qp-age-m-t">Taxes and contributions, and public transfers, by household age, 2023</title><desc id="qp-age-m-d">Bars by household age group, in 2023, in thousand euros per consumption unit. Transfers received rise from 18.2 for the 18-29 group to 47.8 for households whose adults are 65 or over on average, while taxes and contributions go from 23.2 to 14.6.</desc>
