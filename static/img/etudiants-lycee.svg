<text class="pied-note" x="0" y="339.0" font-size="11" fill="#55524f">Risque important : au moins 7 symptômes sur les 10 de l'ADRS, échelle de repérage de la dépression de l'adolescent.</text>
<text class="pied-note" x="0" y="353.0" font-size="11" fill="#55524f">Trois enquêtes (2018, 2022, 2024), reliées en tirets, auprès d'élèves différents à chaque fois.</text>
