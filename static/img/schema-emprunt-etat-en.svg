<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 745" role="img" aria-labelledby="se-t se-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="se-t">How the French State borrows, and who receives the interest</title><desc id="se-d">Two-part diagram. Part one, the path of a bond: the French Treasury agency (Agence France Trésor) sells government bonds at auction to licensed banks, the primary dealers; they resell them to investors in France and abroad; from 2015 to 2022 (net purchases), the Banque de France bought some of them on that market, never directly from the State, paying with reserves credited to banks. Part two, what the State pays each year: coupons to every holder, the Banque de France included; the Banque de France in turn pays interest on the reserves banks place with it, at the ECB deposit rate, and passes its profits on to the State. At maturity, the State repays each bond from its cash or new borrowing.</desc>
<rect width="720" height="745" fill="#ffffff"/>
<defs><marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#184f95"/></marker><marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs>
<text x="0" y="18" font-size="13" font-weight="600" fill="#0A0A0E">How the French State borrows, and who receives the interest</text>
<text x="0" y="50" font-size="12" font-weight="600" fill="#184f95">1. The path of a bond</text>
<rect x="0.0" y="64.0" width="150.0" height="84.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="75.0" y="102.7" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">The State</text>
<text x="75.0" y="117.7" font-size="11" text-anchor="middle" fill="#52514e">Agence France Trésor</text>
<rect x="190.0" y="64.0" width="150.0" height="84.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="265.0" y="102.7" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">Primary dealers</text>
<text x="265.0" y="117.7" font-size="11" text-anchor="middle" fill="#52514e">licensed banks</text>
<rect x="380.0" y="64.0" width="150.0" height="84.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="455.0" y="95.2" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">Investors</text>
<text x="455.0" y="110.2" font-size="11" text-anchor="middle" fill="#52514e">insurers, banks, funds,</text>
<text x="455.0" y="125.2" font-size="11" text-anchor="middle" fill="#52514e">in France and abroad</text>
<rect x="570.0" y="64.0" width="150.0" height="84.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="645.0" y="102.7" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">Banque de France</text>
<text x="645.0" y="117.7" font-size="11" text-anchor="middle" fill="#52514e">for the Eurosystem</text>
<path d="M153.0,94.0 L187.0,94.0" fill="none" stroke="#184f95" stroke-width="2" marker-end="url(#fb)"/>
<circle cx="170.0" cy="77.0" r="9" fill="#184f95"/>
<text x="170.0" y="81.0" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
<path d="M343.0,94.0 L377.0,94.0" fill="none" stroke="#184f95" stroke-width="2" marker-end="url(#fb)"/>
<circle cx="360.0" cy="77.0" r="9" fill="#184f95"/>
<text x="360.0" y="81.0" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
<path d="M533.0,94.0 L567.0,94.0" fill="none" stroke="#184f95" stroke-width="2" marker-end="url(#fb)"/>
<circle cx="550.0" cy="77.0" r="9" fill="#184f95"/>
<text x="550.0" y="81.0" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
<path d="M567.0,126.0 L533.0,126.0" fill="none" stroke="#898781" stroke-width="2" marker-end="url(#fg)"/>
<circle cx="550.0" cy="143.0" r="9" fill="#898781"/>
<text x="550.0" y="147.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">4</text>
<circle cx="8.0" cy="176.0" r="8" fill="#184f95"/>
<text x="8.0" y="180.0" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">1</text>
<text x="24.0" y="180.0" font-size="12" fill="#0A0A0E">The Agence France Trésor sells government bonds, mostly at auction. Only primary dealers can buy</text>
<text x="24.0" y="196.0" font-size="12" fill="#0A0A0E">there: the State receives their money; that is the borrowing.</text>
<circle cx="8.0" cy="214.0" r="8" fill="#184f95"/>
<text x="8.0" y="218.0" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">2</text>
<text x="24.0" y="218.0" font-size="12" fill="#0A0A0E">They keep them or resell them to investors on the secondary market.</text>
<circle cx="8.0" cy="236.0" r="8" fill="#184f95"/>
<text x="8.0" y="240.0" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">3</text>
<text x="24.0" y="240.0" font-size="12" fill="#0A0A0E">From 2015 to 2022 (net purchases), the Banque de France bought some on that market for the</text>
<text x="24.0" y="256.0" font-size="12" fill="#0A0A0E">Eurosystem (the euro area central banks), then replaced maturing bonds until July 2023 or end-2024</text>
<text x="24.0" y="272.0" font-size="12" fill="#0A0A0E">depending on the programme; never from the State itself: the EU Treaty forbids it (Article 123).</text>
<circle cx="8.0" cy="290.0" r="8" fill="#898781"/>
<text x="8.0" y="294.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">4</text>
<text x="24.0" y="294.0" font-size="12" fill="#0A0A0E">It paid in central bank money created for the purchase: reserves credited to the seller's bank.</text>
<text x="0" y="324.0" font-size="12" font-weight="600" fill="#b8420f">2. Interest paid each year, and to whom</text>
<rect x="0.0" y="392.0" width="170.0" height="62.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="85.0" y="419.7" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">The State</text>
<text x="85.0" y="434.7" font-size="11" text-anchor="middle" fill="#52514e">Agence France Trésor</text>
<rect x="275.0" y="340.0" width="170.0" height="62.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="360.0" y="360.2" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">Investors</text>
<text x="360.0" y="375.2" font-size="11" text-anchor="middle" fill="#52514e">insurers, banks, funds, in</text>
<text x="360.0" y="390.2" font-size="11" text-anchor="middle" fill="#52514e">France and abroad</text>
<rect x="275.0" y="444.0" width="170.0" height="62.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="360.0" y="471.7" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">Banque de France</text>
<text x="360.0" y="486.7" font-size="11" text-anchor="middle" fill="#52514e">for the Eurosystem</text>
<rect x="550.0" y="444.0" width="170.0" height="62.0" rx="6" fill="#f6f5f1" stroke="#e1e0d9"/>
<text x="635.0" y="471.7" font-size="12" text-anchor="middle" fill="#0A0A0E" font-weight="600">Banks</text>
<text x="635.0" y="486.7" font-size="11" text-anchor="middle" fill="#52514e">holding the reserves</text>
<path d="M173.0,410.0 L272.0,371.0" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#fo)"/>
<path d="M173.0,436.0 L272.0,464.0" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#fo)"/>
<circle cx="222.5" cy="423.0" r="9" fill="#eb6834"/>
<text x="222.5" y="427.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">5</text>
<path d="M448.0,464.0 L547.0,464.0" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#fo)"/>
<circle cx="497.5" cy="452.0" r="9" fill="#eb6834"/>
<text x="497.5" y="456.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">6</text>
<path d="M305.0,509.0 L305.0,528.0 L85.0,528.0 L85.0,457.0" fill="none" stroke="#898781" stroke-width="2" marker-end="url(#fg)"/>
<circle cx="195.0" cy="528.0" r="9" fill="#898781"/>
<text x="195.0" y="532.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">7</text>
<circle cx="8.0" cy="562.0" r="8" fill="#eb6834"/>
<text x="8.0" y="566.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">5</text>
<text x="24.0" y="566.0" font-size="12" fill="#0A0A0E">Each year, the State pays interest on its bonds to every holder, the Banque de France included. At</text>
<text x="24.0" y="582.0" font-size="12" fill="#0A0A0E">maturity, it repays the bond from its cash or new borrowing: back to 1.</text>
<circle cx="8.0" cy="600.0" r="8" fill="#eb6834"/>
<text x="8.0" y="604.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">6</text>
<text x="24.0" y="604.0" font-size="12" fill="#0A0A0E">The Banque de France pays the ECB deposit rate on reserves placed in its deposit facility (minimum</text>
<text x="24.0" y="620.0" font-size="12" fill="#0A0A0E">reserves have not been remunerated since September 2023).</text>
<circle cx="8.0" cy="638.0" r="8" fill="#898781"/>
<text x="8.0" y="642.0" font-size="11" font-weight="600" text-anchor="middle" fill="#0A0A0E">7</text>
<text x="24.0" y="642.0" font-size="12" fill="#0A0A0E">Depending on its results, it pays the State tax and a dividend. When reserves cost it more than its</text>
<text x="24.0" y="658.0" font-size="12" fill="#0A0A0E">bonds earn, its results fall: it paid no dividend for the 2022 to 2025 financial years.</text>
<line x1="0" y1="680.0" x2="720" y2="680.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="695.0" font-size="11" fill="#52514e">Author's diagram; Agence France Trésor, Banque de France (annual accounts), ECB, Treaty on the Functioning of the EU</text>
<text class="pied-source" x="0" y="709.0" font-size="11" fill="#52514e">(Art. 123).</text>
<text class="pied-note" x="0" y="723.0" font-size="11" fill="#52514e">Simplified: the State is only part of general government, and the Banque de France is not part of it.</text>
<text class="pied-licence" x="0" y="737.0" font-size="11" fill="#6f6c66">Stéphane Lalut, CC BY 4.0 · stephane-lalut.com/en/who-really-pays-public-debt/</text>
</svg>