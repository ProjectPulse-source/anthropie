<text x="550.0" y="158.0" font-size="10" fill="#52514e" text-anchor="start">all kinds: 46%</text>
<text x="0.0" y="199.0" font-size="10" fill="#0A0A0E" text-anchor="start">16th (2022-2024)</text>
