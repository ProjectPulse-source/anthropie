<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" font-variant-numeric="tabular-nums" aria-labelledby="ao-t ao-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="ao-t">Who initiated the laws promulgated in France?</title><desc id="ao-d">100% bars by legislature of promulgation, scope studied: share of the laws arising from a private member&#x27;s bill tabled in the National Assembly, from one tabled in the Senate, from a Government bill; a dotted line marks half, a triangle the lower bound. 14th (2012-2017): 46% of parliamentary origin (98 laws out of 214); at least 41% (87 laws); all kinds: 42% (110 out of 260). 15th (2017-2022): 53% of parliamentary origin (108 laws out of 202); at least 51% (103 laws); all kinds: 46% (114 out of 249). 16th (2022-2024): 66% of parliamentary origin (55 laws out of 83); all kinds: 58% (55 out of 95). 17th (since 2024), ongoing: 80% of parliamentary origin (78 laws out of 97); all kinds: 76% (85 out of 112).</desc>
<rect width="720" height="405" fill="#ffffff"/>
