<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 465" role="img" font-variant-numeric="tabular-nums" aria-labelledby="bc-t bc-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="bc-t">Seven countries with debt above 90% of GDP at end-2015: what moved their ratio in ten years</title><desc id="bc-d">Countries with debt above 90% of GDP at end-2015. For each country, in points of GDP cumulated over 2016-2025: the interest-growth effect, the contribution of the primary balance (a surplus pulls the ratio down, a deficit pushes it up), other adjustments, and the change in the ratio, their sum. Cyprus: interest and growth −49.4, primary balance −23.1, other adjustments +13.3, change −59.3. Portugal: interest and growth −33.8, primary balance −15.6, other adjustments +7.5, change −41.9. Greece: interest and growth −31.2, primary balance −15.3, other adjustments +12.2, change −34.3. Spain: interest and growth −22.7, primary balance +19.1, other adjustments +1.5, change −2.0. Italy: interest and growth −5.9, primary balance +11.7, other adjustments −4.0, change +1.7. Belgium: interest and growth −23.6, primary balance +17.0, other adjustments +9.0, change +2.4. France: interest and growth −15.0, primary balance +30.6, other adjustments +3.1, change +18.7. The interest-growth effect pulls the ratio down everywhere; in the three countries where the ratio fell markedly, it weighs about twice as much as their primary surpluses.</desc>
