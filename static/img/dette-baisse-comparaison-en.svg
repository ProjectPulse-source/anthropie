<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 465" role="img" font-variant-numeric="tabular-nums" aria-labelledby="bc-t bc-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="bc-t">Seven countries with debt above 90% of GDP at end-2015: what moved their ratio in ten years</title><desc id="bc-d">Countries with debt above 90% of GDP at end-2015. For each country, in points of GDP cumulated over 2016-2025: the interest-growth effect, the contribution of the primary balance (a surplus pulls the ratio down, a deficit pushes it up), other adjustments, and the change in the ratio, their sum. Cyprus: interest and growth −46.2, primary balance −23.3, other adjustments +12.9, change −56.6. Portugal: interest and growth −33.3, primary balance −15.5, other adjustments +7.4, change −41.4. Greece: interest and growth −30.4, primary balance −15.2, other adjustments +12.1, change −33.5. Spain: interest and growth −22.5, primary balance +19.1, other adjustments +1.5, change −1.8. Belgium: interest and growth −23.8, primary balance +17.0, other adjustments +9.0, change +2.2. Italy: interest and growth −5.3, primary balance +11.6, other adjustments −4.0, change +2.3. France: interest and growth −15.1, primary balance +30.6, other adjustments +3.1, change +18.6. The interest-growth effect pulls the ratio down everywhere; in the three countries where the ratio fell markedly, it weighs about twice as much as their primary surpluses.</desc>
