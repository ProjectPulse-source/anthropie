<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" role="img" font-variant-numeric="tabular-nums" aria-labelledby="bc-t bc-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="bc-t">Seven countries with debt above 90% of GDP at end-2015: ten years on</title><desc id="bc-d">For each country, three bars in points of GDP cumulated over 2016-2025: the interest-growth effect, the contribution of the primary balance (a surplus pulls the debt down, a deficit pushes it up) and other adjustments. Cyprus: interest-growth −46.2, primary balance −23.3, other adjustments +12.9, debt −56.6. Portugal: interest-growth −33.3, primary balance −15.5, other adjustments +7.4, debt −41.4. Greece: interest-growth −30.4, primary balance −15.2, other adjustments +12.1, debt −33.5. Spain: interest-growth −22.5, primary balance +19.1, other adjustments +1.5, debt −1.8. Belgium: interest-growth −23.8, primary balance +17.0, other adjustments +9.0, debt +2.2. Italy: interest-growth −5.3, primary balance +11.6, other adjustments −4.0, debt +2.3. France: interest-growth −15.1, primary balance +30.6, other adjustments +3.1, debt +18.6. The interest-growth effect is favourable everywhere, but of very different size; the ratio fell by more than 15 points where the primary balance was in surplus on average.</desc>
