<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 742" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dam-t dam-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="dam-t">Chaque année, ce qui a poussé ou freiné le ratio dette/PIB</title><desc id="dam-d">Barres empilées par année, en points de PIB : en orange la contribution du solde primaire (déficit en plus, excédent en moins), en bleu l'effet net des taux et de la croissance, en gris les ajustements flux-stock ; le point noir est la variation effective du ratio. Les deux plus fortes hausses sont en 2009 (+14,2 points) et en 2020 (+16,7). De 2021 à 2023, l'effet taux-croissance retire 16,8 points au ratio, quand la croissance du PIB nominal, hausse des prix comprise, s'accélère.</desc>
