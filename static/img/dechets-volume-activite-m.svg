<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1045" role="img" font-variant-numeric="tabular-nums" aria-labelledby="drm-t drm-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="drm-t">Déchets radioactifs : le volume ne dit pas où est la radioactivité</title><desc id="drm-d">Pour chacune des cinq catégories des bilans de l'Andra, part du volume des déchets radioactifs et part de la radioactivité déclarée, fin 2021 (dernière édition qui déclare l'activité), et filière de stockage ; 88,4 % de cette radioactivité est déclarée comme un maximum. HA : 0,25 % du volume, 97,2 % de la radioactivité. MA-VL : 2,2 %, 2,7 %. FA-VL : 5,9 %, 0,01 %. FMA-VC : 55,7 %, 0,12 %. TFA : 35,9 %, &lt; 0,01 %.</desc>
<rect width="300" height="1045" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">Déchets radioactifs : le</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">volume ne dit pas où est la</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#26262f">radioactivité</text>
<text x="0" y="86" font-size="13.5" fill="#55524f">Part du volume et de la radioactivité</text>
<text x="0" y="104" font-size="13.5" fill="#55524f">déclarée, fin 2021</text>
<text x="0" y="156" font-size="15" font-weight="600" fill="#26262f">Haute activité (HA)</text>
<rect x="0" y="166" width="1.5" height="12" fill="#8a8781"/>
<text x="7.5" y="176" font-size="13.5" font-weight="600" fill="#26262f">0,25 % volume</text>
<rect x="0" y="186" width="145.8" height="12" fill="#eb6834"/>
<text x="151.8" y="196" font-size="13.5" font-weight="600" fill="#b8420f">97,2 % radioactivité</text>
<text x="0" y="214" font-size="13.5" fill="#55524f">stockage géologique profond en</text>
<text x="0" y="232" font-size="13.5" fill="#55524f">projet (Cigéo)</text>
<text x="0" y="262" font-size="15" font-weight="600" fill="#26262f">Moyenne activité, vie longue</text>
<text x="0" y="281" font-size="15" font-weight="600" fill="#26262f">(MA-VL)</text>
<rect x="0" y="291" width="3.4" height="12" fill="#8a8781"/>
<text x="9.4" y="301" font-size="13.5" font-weight="600" fill="#26262f">2,2 % volume</text>
<rect x="0" y="311" width="4.0" height="12" fill="#eb6834"/>
<text x="10.0" y="321" font-size="13.5" font-weight="600" fill="#b8420f">2,7 % radioactivité</text>
<text x="0" y="339" font-size="13.5" fill="#55524f">stockage géologique profond en</text>
<text x="0" y="357" font-size="13.5" fill="#55524f">projet (Cigéo)</text>
<text x="0" y="387" font-size="15" font-weight="600" fill="#26262f">Faible activité, vie longue</text>
<text x="0" y="406" font-size="15" font-weight="600" fill="#26262f">(FA-VL)</text>
<rect x="0" y="416" width="8.8" height="12" fill="#8a8781"/>
<text x="14.8" y="426" font-size="13.5" font-weight="600" fill="#26262f">5,9 % volume</text>
<rect x="0" y="436" width="1.5" height="12" fill="#eb6834"/>
<text x="7.5" y="446" font-size="13.5" font-weight="600" fill="#b8420f">0,01 % radioactivité</text>
<text x="0" y="464" font-size="13.5" fill="#55524f">stockage à l'étude</text>
<text x="0" y="494" font-size="15" font-weight="600" fill="#26262f">Faible et moyenne activité, vie</text>
<text x="0" y="513" font-size="15" font-weight="600" fill="#26262f">courte (FMA-VC)</text>
<rect x="0" y="523" width="83.6" height="12" fill="#8a8781"/>
<text x="89.6" y="533" font-size="13.5" font-weight="600" fill="#26262f">55,7 % volume</text>
<rect x="0" y="543" width="1.5" height="12" fill="#eb6834"/>
<text x="7.5" y="553" font-size="13.5" font-weight="600" fill="#b8420f">0,12 % radioactivité</text>
<text x="0" y="571" font-size="13.5" fill="#184f95">stockage en surface en service</text>
<text x="0" y="589" font-size="13.5" fill="#184f95">(Aube, depuis 1992)</text>
<text x="0" y="619" font-size="15" font-weight="600" fill="#26262f">Très faible activité (TFA)</text>
<rect x="0" y="629" width="53.9" height="12" fill="#8a8781"/>
<text x="59.9" y="639" font-size="13.5" font-weight="600" fill="#26262f">35,9 % volume</text>
<rect x="0" y="649" width="1.5" height="12" fill="#eb6834"/>
<text x="7.5" y="659" font-size="13.5" font-weight="600" fill="#b8420f">&lt; 0,01 % radioactivité</text>
<text x="0" y="677" font-size="13.5" fill="#184f95">stockage en service (Cires, depuis</text>
<text x="0" y="695" font-size="13.5" fill="#184f95">2003)</text>
<line x1="0" y1="717.0" x2="300" y2="717.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="738.0" font-size="13.5" fill="#55524f">Andra, Inventaire national (données</text>
<text class="pied-source" x="0" y="755.0" font-size="13.5" fill="#55524f">ouvertes, data.gouv.fr) ; filières :</text>
<text class="pied-source" x="0" y="772.0" font-size="13.5" fill="#55524f">Andra, Les Essentiels 2026</text>
<text class="pied-note" x="0" y="793.0" font-size="13.5" fill="#55524f">Volume en équivalent conditionné et</text>
<text class="pied-note" x="0" y="810.0" font-size="13.5" fill="#55524f">radioactivité déclarée, tous deux à</text>
<text class="pied-note" x="0" y="827.0" font-size="13.5" fill="#55524f">fin 2021, cinq catégories des bilans</text>
<text class="pied-note" x="0" y="844.0" font-size="13.5" fill="#55524f">de l'Andra, qui laissent de côté</text>
<text class="pied-note" x="0" y="861.0" font-size="13.5" fill="#55524f">notamment les résidus miniers</text>
<text class="pied-note" x="0" y="878.0" font-size="13.5" fill="#55524f">d'uranium et les résidus historiques</text>
<text class="pied-note" x="0" y="895.0" font-size="13.5" fill="#55524f">de conversion de l'uranium à Malvési ;</text>
<text class="pied-note" x="0" y="912.0" font-size="13.5" fill="#55524f">88,4 % de cette radioactivité est</text>
<text class="pied-note" x="0" y="929.0" font-size="13.5" fill="#55524f">déclarée comme un maximum (signe « &lt; »</text>
<text class="pied-note" x="0" y="946.0" font-size="13.5" fill="#55524f">de l'inventaire), non comme une</text>
<text class="pied-note" x="0" y="963.0" font-size="13.5" fill="#55524f">mesure exacte. Le graphe ne mesure pas</text>
<text class="pied-note" x="0" y="980.0" font-size="13.5" fill="#55524f">le risque sanitaire et ne classe ni</text>
<text class="pied-note" x="0" y="997.0" font-size="13.5" fill="#55524f">les risques ni les coûts.</text>
<text class="pied-licence" x="0" y="1018.0" font-size="13.5" fill="#6f6c66">Calcul Stéphane Lalut, CC BY 4.0</text>
<text class="pied-licence" x="0" y="1035.0" font-size="13.5" fill="#6f6c66">· stephane-lalut.com</text>
</svg>
