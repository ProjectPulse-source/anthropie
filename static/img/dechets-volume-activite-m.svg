<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 890" role="img" font-variant-numeric="tabular-nums" aria-labelledby="drm-t drm-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="drm-t">Déchets radioactifs : le volume ne dit pas où est la radioactivité</title><desc id="drm-d">Pour chaque catégorie, part du volume des déchets radioactifs et part de leur radioactivité déclarée, fin 2021 (dernière édition qui déclare l'activité), et filière de stockage. HA : 0,25 % du volume, 97,1 % de la radioactivité. MA-VL : 2,2 %, 2,7 %. FA-VL : 5,9 %, 0,01 %. FMA-VC : 55,7 %, 0,12 %. TFA : 35,9 %, &lt; 0,01 %.</desc>
<rect width="300" height="890" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">Déchets radioactifs : le</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">volume ne dit pas où est la</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#26262f">radioactivité</text>
<text x="0" y="120" font-size="15" font-weight="600" fill="#26262f">Haute activité (HA)</text>
<rect x="0" y="130" width="1.5" height="12" fill="#8a8781"/>
<text x="7.5" y="140" font-size="13.5" font-weight="600" fill="#26262f">0,25 % volume</text>
<rect x="0" y="150" width="145.7" height="12" fill="#eb6834"/>
<text x="151.7" y="160" font-size="13.5" font-weight="600" fill="#eb6834">97,1 % radioactivité</text>
<text x="0" y="178" font-size="13.5" fill="#55524f">stockage géologique profond en</text>
<text x="0" y="196" font-size="13.5" fill="#55524f">projet (Cigéo)</text>
<text x="0" y="226" font-size="15" font-weight="600" fill="#26262f">Moyenne activité, vie longue</text>
<text x="0" y="245" font-size="15" font-weight="600" fill="#26262f">(MA-VL)</text>
<rect x="0" y="255" width="3.4" height="12" fill="#8a8781"/>
<text x="9.4" y="265" font-size="13.5" font-weight="600" fill="#26262f">2,2 % volume</text>
<rect x="0" y="275" width="4.0" height="12" fill="#eb6834"/>
<text x="10.0" y="285" font-size="13.5" font-weight="600" fill="#eb6834">2,7 % radioactivité</text>
<text x="0" y="303" font-size="13.5" fill="#55524f">stockage géologique profond en</text>
<text x="0" y="321" font-size="13.5" fill="#55524f">projet (Cigéo)</text>
<text x="0" y="351" font-size="15" font-weight="600" fill="#26262f">Faible activité, vie longue</text>
<text x="0" y="370" font-size="15" font-weight="600" fill="#26262f">(FA-VL)</text>
<rect x="0" y="380" width="8.8" height="12" fill="#8a8781"/>
<text x="14.8" y="390" font-size="13.5" font-weight="600" fill="#26262f">5,9 % volume</text>
<rect x="0" y="400" width="1.5" height="12" fill="#eb6834"/>
<text x="7.5" y="410" font-size="13.5" font-weight="600" fill="#eb6834">0,01 % radioactivité</text>
<text x="0" y="428" font-size="13.5" fill="#55524f">stockage à l'étude</text>
<text x="0" y="458" font-size="15" font-weight="600" fill="#26262f">Faible et moyenne activité, vie</text>
<text x="0" y="477" font-size="15" font-weight="600" fill="#26262f">courte (FMA-VC)</text>
<rect x="0" y="487" width="83.6" height="12" fill="#8a8781"/>
<text x="89.6" y="497" font-size="13.5" font-weight="600" fill="#26262f">55,7 % volume</text>
<rect x="0" y="507" width="1.5" height="12" fill="#eb6834"/>
<text x="7.5" y="517" font-size="13.5" font-weight="600" fill="#eb6834">0,12 % radioactivité</text>
<text x="0" y="535" font-size="13.5" fill="#184f95">stockage en surface en service</text>
<text x="0" y="553" font-size="13.5" fill="#184f95">(Aube, depuis 1992)</text>
<text x="0" y="583" font-size="15" font-weight="600" fill="#26262f">Très faible activité (TFA)</text>
<rect x="0" y="593" width="53.9" height="12" fill="#8a8781"/>
<text x="59.9" y="603" font-size="13.5" font-weight="600" fill="#26262f">35,9 % volume</text>
<rect x="0" y="613" width="1.5" height="12" fill="#eb6834"/>
<text x="7.5" y="623" font-size="13.5" font-weight="600" fill="#eb6834">&lt; 0,01 % radioactivité</text>
<text x="0" y="641" font-size="13.5" fill="#184f95">stockage en service (Cires, depuis</text>
<text x="0" y="659" font-size="13.5" fill="#184f95">2003)</text>
<line x1="0" y1="681.0" x2="300" y2="681.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="702.0" font-size="13.5" fill="#55524f">Andra, Inventaire national (données</text>
<text class="pied-source" x="0" y="719.0" font-size="13.5" fill="#55524f">ouvertes, data.gouv.fr) ; filières :</text>
<text class="pied-source" x="0" y="736.0" font-size="13.5" fill="#55524f">Andra, Les Essentiels 2026</text>
<text class="pied-note" x="0" y="757.0" font-size="13.5" fill="#55524f">Volume en équivalent conditionné et</text>
<text class="pied-note" x="0" y="774.0" font-size="13.5" fill="#55524f">radioactivité déclarée, cinq</text>
<text class="pied-note" x="0" y="791.0" font-size="13.5" fill="#55524f">catégories des bilans de l'Andra, même</text>
<text class="pied-note" x="0" y="808.0" font-size="13.5" fill="#55524f">année. La radioactivité ne mesure à</text>
<text class="pied-note" x="0" y="825.0" font-size="13.5" fill="#55524f">elle seule ni le risque sanitaire ni</text>
<text class="pied-note" x="0" y="842.0" font-size="13.5" fill="#55524f">le coût de gestion.</text>
<text class="pied-licence" x="0" y="863.0" font-size="13.5" fill="#96928f">Calcul Stéphane Lalut, CC BY 4.0 ·</text>
<text class="pied-licence" x="0" y="880.0" font-size="13.5" fill="#96928f">stephane-lalut.com</text>
</svg>
