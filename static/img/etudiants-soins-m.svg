<line x1="0" y1="492.0" x2="300" y2="492.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="513.0" font-size="13.5" fill="#55524f">Assurance maladie, cartographie des</text>
<text class="pied-source" x="0" y="530.0" font-size="13.5" fill="#55524f">pathologies et des dépenses :</text>
<text class="pied-source" x="0" y="547.0" font-size="13.5" fill="#55524f">traitements antidépresseurs et</text>
<text class="pied-source" x="0" y="564.0" font-size="13.5" fill="#55524f">régulateurs de l'humeur « hors</text>
<text class="pied-source" x="0" y="581.0" font-size="13.5" fill="#55524f">pathologies »</text>
<text class="pied-note" x="0" y="602.0" font-size="13.5" fill="#55524f">C'est-à-dire sans diagnostic</text>
<text class="pied-note" x="0" y="619.0" font-size="13.5" fill="#55524f">psychiatrique repéré par une</text>
<text class="pied-note" x="0" y="636.0" font-size="13.5" fill="#55524f">hospitalisation ou une affection de</text>
<text class="pied-note" x="0" y="653.0" font-size="13.5" fill="#55524f">longue durée récente. Ces séries ne</text>
<text class="pied-note" x="0" y="670.0" font-size="13.5" fill="#55524f">distinguent pas les étudiants des</text>
<text class="pied-note" x="0" y="687.0" font-size="13.5" fill="#55524f">autres jeunes.</text>
