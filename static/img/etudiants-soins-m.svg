<text x="0" y="64" font-size="17" font-weight="600" fill="#26262f">de l'humeur, 2015-2024</text>
<text x="0" y="86" font-size="13.5" fill="#55524f">Part des 20-24 ans du même sexe</text>
<text x="0" y="104" font-size="13.5" fill="#55524f">traités, hors pathologie psychiatrique</text>
<text x="0" y="122" font-size="13.5" fill="#55524f">repérée, en %</text>
