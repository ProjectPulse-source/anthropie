<title id="mp-m-t">Prix de la dette et inflation récente, 2025</title><desc id="mp-m-d">Hors de la zone euro, le taux implicite est étroitement associé à l'inflation récente ; dans la zone euro, beaucoup moins : les pays baltes ont connu une forte inflation sans taux élevé. La Suède, hors euro, a le même taux implicite que l'Allemagne. Association observée sur une année, non causalité. Taux implicite : Hongrie 5,53 %, Roumanie 5,65 %, France 2,02 %, Allemagne 1,84 %, Suède 1,84 %.</desc>
