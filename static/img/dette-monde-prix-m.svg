<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 702" role="img" font-variant-numeric="tabular-nums" aria-labelledby="mp-m-t mp-m-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="mp-m-t">Prix de la dette et inflation récente, 2025</title><desc id="mp-m-d">Hors de la zone euro, le taux implicite est étroitement associé à l'inflation récente ; dans la zone euro, beaucoup moins : les pays baltes ont connu une forte inflation sans taux élevé. La Suède, hors euro, a le même taux implicite que l'Allemagne. Association observée sur une année, non causalité. Taux implicite : Hongrie 5,52 %, Roumanie 5,63 %, France 1,99 %, Allemagne 1,82 %, Suède 1,89 %.</desc>
