<text x="459.0" y="320.0" font-size="13" font-weight="600" text-anchor="end" fill="#1a1a1a">−5.7</text>
<text x="0.0" y="350.0" font-size="12" font-weight="400" text-anchor="start" fill="#1a1a1a">Nominal growth 0.5 percentage point lower each year</text>
<rect x="550.0" y="340.0" width="89.2" height="18" fill="#eb6834"/>
<text x="645.2" y="354.0" font-size="13" font-weight="600" text-anchor="start" fill="#b8420f">+5.9</text>
<text x="400.0" y="398.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">−10</text>
