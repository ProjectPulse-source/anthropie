<text x="700.0" y="398.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">+10</text>
<line x1="0" y1="414.0" x2="720" y2="414.0" stroke="#d8d6d0"/>
<text class="pied-source" x="0" y="429.0" font-size="11" fill="#52514e">Author's calculations based on the European Commission's baseline (Debt Sustainability Monitor 2025, France country</text>
<text class="pied-source" x="0" y="443.0" font-size="11" fill="#52514e">fiche), engine tested against the Commission and against the sensitivity published by the French Treasury (AFT).</text>
<text class="pied-note" x="0" y="457.0" font-size="11" fill="#52514e">Sensitivities: one parameter changed at a time, the others unchanged. These are not forecasts, full policy assessments</text>
<text class="pied-note" x="0" y="471.0" font-size="11" fill="#52514e">or a cost-benefit ranking.</text>
