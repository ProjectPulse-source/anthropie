<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 493" role="img" font-variant-numeric="tabular-nums" aria-labelledby="futurs-leviers-t futurs-leviers-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="futurs-leviers-t">Public debt in 2035: how far the primary balance, interest rates and growth move it</title><desc id="futurs-leviers-d">Effect on the debt-to-GDP ratio in 2035, in percentage points of GDP, relative to the Commission's baseline. Orange: debt rises; grey: debt falls; dotted outline: accounting calculation. Primary balance 1 percentage point of GDP higher every year, from 2028 to 2035: −8.2; market rates 0.2 percentage point lower: −1.0; market rates 1 percentage point higher: +5.5; nominal growth 0.5 percentage point higher each year: −5.7; nominal growth 0.5 percentage point lower each year: +5.9.</desc>
<rect width="720" height="493" fill="#ffffff"/>
<text x="0.0" y="22.0" font-size="17" font-weight="600" text-anchor="start" fill="#1a1a1a">Public debt in 2035: how far the primary balance, interest rates and growth move it</text>
<text x="0.0" y="44.0" font-size="13" font-weight="400" text-anchor="start" fill="#52514e">Effect on the debt-to-GDP ratio in 2035, in percentage points of GDP, relative to the Commission's baseline</text>
<text x="0.0" y="62.0" font-size="13" font-weight="400" text-anchor="start" fill="#52514e">Orange: debt rises; grey: debt falls; dotted outline: accounting calculation.</text>
<line x1="400.0" x2="400.0" y1="76" y2="380" stroke="#e6e5e1"/>
<line x1="475.0" x2="475.0" y1="76" y2="380" stroke="#e6e5e1"/>
<line x1="550.0" x2="550.0" y1="76" y2="380" stroke="#9a9994"/>
<line x1="625.0" x2="625.0" y1="76" y2="380" stroke="#e6e5e1"/>
<line x1="700.0" x2="700.0" y1="76" y2="380" stroke="#e6e5e1"/>
<text x="0.0" y="94.0" font-size="13" font-weight="600" text-anchor="start" fill="#1a1a1a">Primary balance</text>
<text x="0.0" y="116.0" font-size="12" font-weight="400" text-anchor="start" fill="#1a1a1a">Primary balance 1 percentage point of GDP higher every year,</text>
<text x="0.0" y="131.0" font-size="12" font-weight="400" text-anchor="start" fill="#1a1a1a">from 2028 to 2035</text>
<rect x="427.7" y="106.0" width="122.3" height="18" fill="#ffffff" stroke="#8a8984" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="0.0" y="146.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">Accounting calculation, ignoring any effect on growth or</text>
<text x="0.0" y="161.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">interest rates</text>
<text x="433.7" y="120.0" font-size="13" font-weight="600" text-anchor="start" fill="#1a1a1a">−8.2</text>
<text x="0.0" y="196.0" font-size="13" font-weight="600" text-anchor="start" fill="#1a1a1a">Financing conditions</text>
<text x="0.0" y="218.0" font-size="12" font-weight="400" text-anchor="start" fill="#1a1a1a">Market rates 0.2 percentage point lower</text>
<rect x="534.5" y="208.0" width="15.5" height="18" fill="#8a8984"/>
<text x="528.5" y="222.0" font-size="13" font-weight="600" text-anchor="end" fill="#1a1a1a">−1.0</text>
<text x="0.0" y="252.0" font-size="12" font-weight="400" text-anchor="start" fill="#1a1a1a">Market rates 1 percentage point higher</text>
<rect x="550.0" y="242.0" width="82.4" height="18" fill="#eb6834"/>
<text x="638.4" y="256.0" font-size="13" font-weight="600" text-anchor="start" fill="#b8420f">+5.5</text>
<text x="0.0" y="294.0" font-size="13" font-weight="600" text-anchor="start" fill="#1a1a1a">Economic activity</text>
<text x="0.0" y="316.0" font-size="12" font-weight="400" text-anchor="start" fill="#1a1a1a">Nominal growth 0.5 percentage point higher each year</text>
