<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 421" role="img" aria-labelledby="qp-age-t qp-age-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="qp-age-t">Prélèvements et transferts publics par âge du ménage, 2023</title>
<desc id="qp-age-d">Barres par groupe d'âge du ménage, en 2023, en milliers d'euros par unité de consommation. Les transferts reçus passent de 18,2 pour les 18-29 ans à 47,8 pour les ménages dont l'âge moyen des adultes atteint 65 ans ou plus, tandis que les prélèvements passent de 23,2 à 14,6.</desc>
<text x="0.0" y="22.0" font-size="13" fill="#52514e" text-anchor="start">Prélèvements et transferts publics par âge du ménage, 2023, en milliers d'euros par UC</text>
