<text class="pied-source" x="0" y="515.0" font-size="13.5" fill="#55524f">Eurostat gov_10dd_edpt1 (debt, GDP),</text>
<text class="pied-source" x="0" y="532.0" font-size="13.5" fill="#55524f">gov_10a_main (B9, D41PAY), France,</text>
<text class="pied-source" x="0" y="549.0" font-size="13.5" fill="#55524f">1996-2025</text>
<text class="pied-note" x="0" y="570.0" font-size="13.5" fill="#55524f">In % of GDP; stabilising balance =</text>
<text class="pied-note" x="0" y="587.0" font-size="13.5" fill="#55524f">(implicit interest rate − nominal</text>
<text class="pied-note" x="0" y="604.0" font-size="13.5" fill="#55524f">growth) / (1 + growth) × debt-to-GDP</text>
<text class="pied-note" x="0" y="621.0" font-size="13.5" fill="#55524f">ratio at the end of the previous year,</text>
<text class="pied-note" x="0" y="638.0" font-size="13.5" fill="#55524f">excluding other adjustments</text>
<text class="pied-note" x="0" y="655.0" font-size="13.5" fill="#55524f">(stock-flow). An accounting marker for</text>
<text class="pied-note" x="0" y="672.0" font-size="13.5" fill="#55524f">the year, not a target.</text>
