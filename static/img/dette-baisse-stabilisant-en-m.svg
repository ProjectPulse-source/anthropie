<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 720" role="img" font-variant-numeric="tabular-nums" aria-labelledby="bs-m-t bs-m-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="bs-m-t">France: the observed primary balance and the one that would have stabilised the debt</title><desc id="bs-m-d">Two annual lines from 1996 to 2025, in % of GDP: the observed primary balance, positive four times (1998 to 2001), and the primary balance that would have stabilised the debt ratio, ranging from −7.3 in 2021 to +6.1 in 2020. In 2025, the observed balance was −2.9 and the stabilising balance +0.0: a gap of 2.9 points of GDP.</desc>
<rect width="300" height="720" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">France: the observed primary</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">balance and the one that would</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#26262f">have stabilised the debt</text>
<line x1="0" y1="100.0" x2="16" y2="100.0" stroke="#eb6834" stroke-width="2.6"/>
<text x="22" y="105.0" font-size="13.5" fill="#55524f">observed primary balance</text>
<line x1="0" y1="119.0" x2="16" y2="119.0" stroke="#8a8781" stroke-width="2.2"/>
<text x="22" y="124.0" font-size="13.5" fill="#55524f">balance that would have stabilised</text>
<text x="22" y="143.0" font-size="13.5" fill="#55524f">the ratio that year, excluding</text>
<text x="22" y="162.0" font-size="13.5" fill="#55524f">other adjustments</text>
<line x1="46" y1="380.0" x2="294" y2="380.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="41" y="385.0" font-size="13.5" fill="#96928f" text-anchor="end">−8%</text>
<line x1="46" y1="330.0" x2="294" y2="330.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="41" y="335.0" font-size="13.5" fill="#96928f" text-anchor="end">−4%</text>
<line x1="46" y1="280.0" x2="294" y2="280.0" stroke="#dcd8d3" stroke-width="1.4"/>
<text x="41" y="285.0" font-size="13.5" fill="#96928f" text-anchor="end">0%</text>
<line x1="46" y1="230.0" x2="294" y2="230.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="41" y="235.0" font-size="13.5" fill="#96928f" text-anchor="end">+4%</text>
<line x1="46" y1="180.0" x2="294" y2="180.0" stroke="#dcd8d3" stroke-width="0.6"/>
<text x="41" y="185.0" font-size="13.5" fill="#96928f" text-anchor="end">+8%</text>
