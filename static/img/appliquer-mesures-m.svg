<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 864" role="img" font-variant-numeric="tabular-nums" aria-labelledby="amm-t amm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="amm-t">Les mesures d'application des lois, par session de la loi</title><desc id="amm-d">Barres horizontales, une par session de 2017-2018 à 2024-2025 : mesures avec un acte publié identifié, en attente, indiquées sans objet, statut incomplet. Au total 5 398 mesures, dont 567 en attente. Par session : 2017-2018 : 556 mesures, dont 18 en attente; 2018-2019 : 933 mesures, dont 47 en attente; 2019-2020 : 680 mesures, dont 63 en attente; 2020-2021 : 777 mesures, dont 90 en attente; 2021-2022 : 652 mesures, dont 75 en attente; 2022-2023 : 549 mesures, dont 62 en attente; 2023-2024 : 730 mesures, dont 93 en attente; 2024-2025 : 521 mesures, dont 119 en attente. Les valeurs sont dans le tableau sous la figure.</desc>
