<title id="ml-t">Chômeurs au sens du BIT et inscrits en catégorie A, 2012-2025</title><desc id="ml-d">Deux courbes annuelles de 2012 à 2025, en millions. Chômeurs au sens du BIT : 2012 2,9 ; 2013 3,0 ; 2014 3,0 ; 2015 3,1 ; 2016 3,0 ; 2017 2,8 ; 2018 2,7 ; 2019 2,5 ; 2020 2,4 ; 2021 2,4 ; 2022 2,2 ; 2023 2,3 ; 2024 2,3 ; 2025 2,4. Inscrits en catégorie A : 2012 3,2 ; 2013 3,5 ; 2014 3,7 ; 2015 3,8 ; 2016 3,8 ; 2017 3,7 ; 2018 3,7 ; 2019 3,6 ; 2020 3,9 ; 2021 3,6 ; 2022 3,1 ; 2023 3,0 ; 2024 3,0 ; 2025 3,3. Repères : 1, réforme de l&#x27;assurance chômage (novembre 2019 à décembre 2021) ; 2, enquête Emploi rénovée en 2021 ; 3, nouveau formulaire d&#x27;actualisation en 2022 ; 4, formulaire d&#x27;octobre-novembre 2024 et loi pour le plein emploi en 2025.</desc>
