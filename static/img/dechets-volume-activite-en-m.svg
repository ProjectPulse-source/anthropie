<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1009" role="img" font-variant-numeric="tabular-nums" aria-labelledby="drm-t drm-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="drm-t">Radioactive waste: volume does not show where the radioactivity is</title><desc id="drm-d">For each of the five categories of Andra's balances, share of the volume of radioactive waste and share of declared radioactivity, end-2021 (latest edition declaring activity), and disposal route; 88.4% of this radioactivity is declared as an upper bound. HA: 0.25% of volume, 97.2% of radioactivity. MA-VL: 2.2%, 2.7%. FA-VL: 5.9%, 0.01%. FMA-VC: 55.7%, 0.12%. TFA: 35.9%, &lt; 0.01%.</desc>
<rect width="300" height="1009" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#26262f">Radioactive waste: volume does</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#26262f">not show where the</text>
<text x="0" y="64" font-size="17" font-weight="600" fill="#26262f">radioactivity is</text>
<text x="0" y="86" font-size="13.5" fill="#55524f">Share of volume and of declared</text>
<text x="0" y="104" font-size="13.5" fill="#55524f">radioactivity, end-2021</text>
<text x="0" y="156" font-size="15" font-weight="600" fill="#26262f">High-level (HA)</text>
<rect x="0" y="166" width="1.5" height="12" fill="#8a8781"/>
<text x="7.5" y="176" font-size="13.5" font-weight="600" fill="#26262f">0.25% volume</text>
<rect x="0" y="186" width="145.8" height="12" fill="#eb6834"/>
<text x="151.8" y="196" font-size="13.5" font-weight="600" fill="#b8420f">97.2% radioactivity</text>
<text x="0" y="214" font-size="13.5" fill="#55524f">deep geological disposal planned</text>
<text x="0" y="232" font-size="13.5" fill="#55524f">(Cigéo)</text>
<text x="0" y="262" font-size="15" font-weight="600" fill="#26262f">Intermediate-level, long-lived</text>
<text x="0" y="281" font-size="15" font-weight="600" fill="#26262f">(MA-VL)</text>
<rect x="0" y="291" width="3.4" height="12" fill="#8a8781"/>
<text x="9.4" y="301" font-size="13.5" font-weight="600" fill="#26262f">2.2% volume</text>
<rect x="0" y="311" width="4.0" height="12" fill="#eb6834"/>
<text x="10.0" y="321" font-size="13.5" font-weight="600" fill="#b8420f">2.7% radioactivity</text>
<text x="0" y="339" font-size="13.5" fill="#55524f">deep geological disposal planned</text>
<text x="0" y="357" font-size="13.5" fill="#55524f">(Cigéo)</text>
<text x="0" y="387" font-size="15" font-weight="600" fill="#26262f">Low-level, long-lived (FA-VL)</text>
<rect x="0" y="397" width="8.8" height="12" fill="#8a8781"/>
<text x="14.8" y="407" font-size="13.5" font-weight="600" fill="#26262f">5.9% volume</text>
<rect x="0" y="417" width="1.5" height="12" fill="#eb6834"/>
<text x="7.5" y="427" font-size="13.5" font-weight="600" fill="#b8420f">0.01% radioactivity</text>
<text x="0" y="445" font-size="13.5" fill="#55524f">disposal under study</text>
<text x="0" y="475" font-size="15" font-weight="600" fill="#26262f">Low- and intermediate-level,</text>
<text x="0" y="494" font-size="15" font-weight="600" fill="#26262f">short-lived (FMA-VC)</text>
<rect x="0" y="504" width="83.6" height="12" fill="#8a8781"/>
<text x="89.6" y="514" font-size="13.5" font-weight="600" fill="#26262f">55.7% volume</text>
<rect x="0" y="524" width="1.5" height="12" fill="#eb6834"/>
<text x="7.5" y="534" font-size="13.5" font-weight="600" fill="#b8420f">0.12% radioactivity</text>
<text x="0" y="552" font-size="13.5" fill="#184f95">near-surface disposal in operation</text>
<text x="0" y="570" font-size="13.5" fill="#184f95">(Aube, since 1992)</text>
<text x="0" y="600" font-size="15" font-weight="600" fill="#26262f">Very-low-level (TFA)</text>
<rect x="0" y="610" width="53.9" height="12" fill="#8a8781"/>
<text x="59.9" y="620" font-size="13.5" font-weight="600" fill="#26262f">35.9% volume</text>
<rect x="0" y="630" width="1.5" height="12" fill="#eb6834"/>
<text x="7.5" y="640" font-size="13.5" font-weight="600" fill="#b8420f">&lt; 0.01% radioactivity</text>
<text x="0" y="658" font-size="13.5" fill="#184f95">disposal in operation (Cires, since</text>
<text x="0" y="676" font-size="13.5" fill="#184f95">2003)</text>
<line x1="0" y1="698.0" x2="300" y2="698.0" stroke="#dcd8d3"/>
<text class="pied-source" x="0" y="719.0" font-size="13.5" fill="#55524f">Andra, National Inventory (open data,</text>
<text class="pied-source" x="0" y="736.0" font-size="13.5" fill="#55524f">data.gouv.fr); disposal routes: Andra,</text>
<text class="pied-source" x="0" y="753.0" font-size="13.5" fill="#55524f">Les Essentiels 2026</text>
<text class="pied-note" x="0" y="774.0" font-size="13.5" fill="#55524f">Volume in conditioned equivalent and</text>
<text class="pied-note" x="0" y="791.0" font-size="13.5" fill="#55524f">declared radioactivity, both at</text>
<text class="pied-note" x="0" y="808.0" font-size="13.5" fill="#55524f">end-2021, five categories of Andra's</text>
<text class="pied-note" x="0" y="825.0" font-size="13.5" fill="#55524f">balances, which leave out, among</text>
<text class="pied-note" x="0" y="842.0" font-size="13.5" fill="#55524f">others, uranium mining residues and</text>
<text class="pied-note" x="0" y="859.0" font-size="13.5" fill="#55524f">the historical conversion residues at</text>
<text class="pied-note" x="0" y="876.0" font-size="13.5" fill="#55524f">Malvési; 88.4% of this radioactivity</text>
<text class="pied-note" x="0" y="893.0" font-size="13.5" fill="#55524f">is declared as an upper bound</text>
<text class="pied-note" x="0" y="910.0" font-size="13.5" fill="#55524f">(“&lt;” sign in the inventory), not as an</text>
<text class="pied-note" x="0" y="927.0" font-size="13.5" fill="#55524f">exact measurement. The chart does not</text>
<text class="pied-note" x="0" y="944.0" font-size="13.5" fill="#55524f">measure health risk and ranks neither</text>
<text class="pied-note" x="0" y="961.0" font-size="13.5" fill="#55524f">risks nor costs.</text>
