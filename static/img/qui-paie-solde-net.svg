<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 509" role="img" font-variant-numeric="tabular-nums" aria-labelledby="qp-net-t qp-net-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="qp-net-t">Contributeurs nets et bénéficiaires nets par dixième, 2023</title>
<desc id="qp-net-d">Deux panneaux. A : transferts nets par dixième de niveau de vie, en milliers d'euros par unité de consommation ; en moyenne, les sept premiers dixièmes reçoivent plus qu'ils ne versent, les trois derniers versent plus qu'ils ne reçoivent, le dernier de 58,4. B : part de personnes bénéficiaires nettes, de 99 % dans le premier dixième à 18 % dans le dernier.</desc>
<text x="0.0" y="22.0" font-size="13" fill="#2b2a28" text-anchor="start" font-weight="600">Qui verse plus qu'il ne reçoit ? Solde des transferts publics par dixième de niveau de vie, 2023</text>
