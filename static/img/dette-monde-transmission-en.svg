<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 488" role="img" font-variant-numeric="tabular-nums" aria-labelledby="mt-t mt-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="mt-t">Refinancing pressure: maturities and rate gap, 2025</title><desc id="mt-d">Each dot is a country: further right, a larger share of the debt falls due within the year; higher up, the harmonised 10-year yield exceeds the implicit interest rate on the stock by more. If financing conditions stayed above the cost of the debt being replaced, refinancing would push the average cost up. Below zero, the indicator points the other way. A marker, not a forecast.</desc>
