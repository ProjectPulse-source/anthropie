<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 629" role="img" aria-labelledby="pv-t pv-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="pv-t">The eight provisions of article 19 of the French Constitution, act by act: what the text of each article requires beforehand, whom it brings in afterwards</title><desc id="pv-d">Matrix of twelve acts spread over the eight provisions of article 19, and four columns. A filled cell means that the article itself contains an exact quotation of the element. Three acts have neither an element required before the act nor another actor afterwards: appointing the Prime Minister, addressing Parliament by message and appointing the President of the Constitutional Council.</desc>
<rect width="720" height="629" fill="#ffffff"/>
