<line x1="0" y1="408.0" x2="720" y2="408.0" stroke="#e1e0d9"/>
<text x="0" y="421.0" font-size="9" fill="#52514e">Constitution of 4 October 1958, arts. 8, 11, 12, 16, 18, 19, 54, 56, 61 (Légifrance; English translation: Conseil constitutionnel)</text>
<text x="0" y="433.0" font-size="9" fill="#52514e">Filled cell: exact quotation of the article (list on the page). Empty cell: nothing in that article; says nothing of others or of practice.</text>
