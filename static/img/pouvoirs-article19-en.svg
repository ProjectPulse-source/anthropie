<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 454" role="img" aria-labelledby="pv-t pv-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="pv-t">The eight provisions that article 19 of the French Constitution exempts from countersignature: what their text requires or brings in</title><desc id="pv-d">Matrix of 8 rows and 4 columns. A filled cell means that the article itself contains an exact quotation of the element; only two rows have no prior condition, no other authority and no shared power: Appointing the Prime Minister and Addressing Parliament by message.</desc>
<rect width="720" height="454" fill="#ffffff"/>
<text x="0.0" y="18.0" font-size="13" fill="#0A0A0E" text-anchor="start" font-weight="600">The eight provisions that article 19 exempts from countersignature</text>
<text x="0.0" y="36.0" font-size="12" fill="#52514e" text-anchor="start">what the text of each article requires or brings in</text>
<text x="378.5" y="75.0" font-size="10" fill="#52514e" text-anchor="middle">Recommendation</text>
<text x="378.5" y="88.0" font-size="10" fill="#52514e" text-anchor="middle">or consultation</text>
<text x="378.5" y="101.0" font-size="10" fill="#52514e" text-anchor="middle">required before</text>
<text x="378.5" y="114.0" font-size="10" fill="#52514e" text-anchor="middle">the act</text>
<text x="475.5" y="88.0" font-size="10" fill="#52514e" text-anchor="middle">Another actor</text>
<text x="475.5" y="101.0" font-size="10" fill="#52514e" text-anchor="middle">steps in for</text>
<text x="475.5" y="114.0" font-size="10" fill="#52514e" text-anchor="middle">what follows</text>
<text x="572.5" y="75.0" font-size="10" fill="#52514e" text-anchor="middle">Other</text>
<text x="572.5" y="88.0" font-size="10" fill="#52514e" text-anchor="middle">authorities hold</text>
<text x="572.5" y="101.0" font-size="10" fill="#52514e" text-anchor="middle">a power of the</text>
<text x="572.5" y="114.0" font-size="10" fill="#52514e" text-anchor="middle">same kind</text>
<text x="669.5" y="75.0" font-size="10" fill="#52514e" text-anchor="middle">Other written</text>
<text x="669.5" y="88.0" font-size="10" fill="#52514e" text-anchor="middle">limit: time,</text>
<text x="669.5" y="101.0" font-size="10" fill="#52514e" text-anchor="middle">subject or</text>
<text x="669.5" y="114.0" font-size="10" fill="#52514e" text-anchor="middle">effect</text>
<rect x="0" y="126.0" width="720" height="34" fill="#f7f5f0"/>
<text x="0.0" y="147.0" font-size="11" fill="#0A0A0E" text-anchor="start">Appointing the Prime Minister</text>
<text x="320.0" y="147.0" font-size="10" fill="#898781" text-anchor="end">art. 8, para. 1</text>
