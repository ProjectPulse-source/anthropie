<text x="320.0" y="317.0" font-size="10" fill="#898781" text-anchor="end">art. 54</text>
<circle cx="378.5" cy="313.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="475.5" cy="313.0" r="7" fill="#184f95"/>
