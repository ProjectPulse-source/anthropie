<text x="0.0" y="37.0" font-size="12" fill="#52514e" text-anchor="start">act by act, what the text of each article requires or brings in</text>
<text x="405.0" y="66.0" font-size="11" fill="#52514e" text-anchor="middle">Required</text>
<text x="405.0" y="79.0" font-size="11" fill="#52514e" text-anchor="middle">before the</text>
<text x="405.0" y="92.0" font-size="11" fill="#52514e" text-anchor="middle">act</text>
<text x="495.0" y="79.0" font-size="11" fill="#52514e" text-anchor="middle">Another actor</text>
<text x="495.0" y="92.0" font-size="11" fill="#52514e" text-anchor="middle">afterwards</text>
<text x="585.0" y="92.0" font-size="11" fill="#52514e" text-anchor="middle">Shared power</text>
<text x="675.0" y="79.0" font-size="11" fill="#52514e" text-anchor="middle">Other written</text>
<text x="675.0" y="92.0" font-size="11" fill="#52514e" text-anchor="middle">limit</text>
