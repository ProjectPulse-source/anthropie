<text class="pied-source" x="0" y="537.0" font-size="11" fill="#52514e">Constitution of 4 October 1958, arts. 8, 11, 12, 16, 18, 19, 54, 56, 61 (Légifrance; English translation: Conseil</text>
<text class="pied-source" x="0" y="551.0" font-size="11" fill="#52514e">constitutionnel)</text>
<text class="pied-note" x="0" y="565.0" font-size="11" fill="#52514e">Filled cell: exact quotation of the article (list and justification on the page). Empty cell: nothing in that article;</text>
<text class="pied-note" x="0" y="579.0" font-size="11" fill="#52514e">says nothing of other articles or of practice. “Required before”: recommendation, consultation or act of another</text>
<text class="pied-note" x="0" y="593.0" font-size="11" fill="#52514e">actor; “another actor”: an institution, authority or electorate to which the article assigns a distinct intervention</text>
<text class="pied-note" x="0" y="607.0" font-size="11" fill="#52514e">after the act, even an optional one; practical arrangements for carrying out the act are not counted.</text>
