<circle cx="675.0" cy="119.0" r="6.5" fill="none" stroke="#898781" stroke-width="1.5"/>
<text x="0.0" y="153.0" font-size="12" fill="#0A0A0E" text-anchor="start">Mettre fin aux fonctions du Premier ministre</text>
