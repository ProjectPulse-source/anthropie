<circle cx="585.0" cy="329.0" r="6.5" fill="none" stroke="#898781" stroke-width="1.5"/>
<circle cx="675.0" cy="329.0" r="7" fill="#184f95"/>
<line x1="0" y1="344.0" x2="720" y2="344.0" stroke="#e1e0d9"/>
<rect x="0" y="344.0" width="720" height="43.0" fill="#f7f5f0"/>
<text x="0.0" y="363.0" font-size="12" fill="#0A0A0E" text-anchor="start">Saisir le Conseil constitutionnel d&#x27;un</text>
<text x="0.0" y="376.0" font-size="12" fill="#0A0A0E" text-anchor="start">traité</text>
<text x="352.0" y="369.5" font-size="11" fill="#898781" text-anchor="end">art. 54</text>
<circle cx="405.0" cy="365.5" r="6.5" fill="none" stroke="#898781" stroke-width="1.5"/>
<circle cx="495.0" cy="365.5" r="7" fill="#184f95"/>
<circle cx="585.0" cy="365.5" r="7" fill="#184f95"/>
<circle cx="675.0" cy="365.5" r="7" fill="#184f95"/>
<line x1="0" y1="387.0" x2="720" y2="387.0" stroke="#e1e0d9"/>
<text x="0.0" y="406.0" font-size="12" fill="#0A0A0E" text-anchor="start">Nommer trois membres du Conseil</text>
<text x="0.0" y="419.0" font-size="12" fill="#0A0A0E" text-anchor="start">constitutionnel</text>
<text x="352.0" y="412.5" font-size="11" fill="#898781" text-anchor="end">art. 56</text>
<circle cx="405.0" cy="408.5" r="7" fill="#184f95"/>
<circle cx="495.0" cy="408.5" r="6.5" fill="none" stroke="#898781" stroke-width="1.5"/>
<circle cx="585.0" cy="408.5" r="7" fill="#184f95"/>
<circle cx="675.0" cy="408.5" r="7" fill="#184f95"/>
<rect x="0" y="430.0" width="720" height="43.0" fill="#f7f5f0"/>
<text x="0.0" y="449.0" font-size="12" fill="#0A0A0E" text-anchor="start">Désigner le président du Conseil</text>
<text x="0.0" y="462.0" font-size="12" fill="#0A0A0E" text-anchor="start">constitutionnel</text>
<text x="352.0" y="455.5" font-size="11" fill="#898781" text-anchor="end">art. 56</text>
