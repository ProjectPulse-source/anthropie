<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="pv-t pv-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="pv-t">Les huit dispositions que l’article 19 dispense de contreseing : ce que leur texte exige ou fait intervenir</title><desc id="pv-d">Matrice de 8 lignes et 4 colonnes. Une case pleine signifie que l&#x27;article lui-même contient une citation exacte de l&#x27;élément ; seules deux lignes n&#x27;ont ni condition préalable, ni autre autorité, ni pouvoir partagé : Nommer le Premier ministre et Adresser un message au Parlement.</desc>
<rect width="720" height="440" fill="#ffffff"/>
<text x="0.0" y="18.0" font-size="13" fill="#0A0A0E" text-anchor="start" font-weight="600">Les huit dispositions que l’article 19 dispense de contreseing</text>
<text x="0.0" y="36.0" font-size="12" fill="#52514e" text-anchor="start">ce que le texte de chaque article exige ou fait intervenir</text>
<text x="378.5" y="61.0" font-size="10" fill="#52514e" text-anchor="middle">Proposition ou</text>
<text x="378.5" y="74.0" font-size="10" fill="#52514e" text-anchor="middle">consultation</text>
<text x="378.5" y="87.0" font-size="10" fill="#52514e" text-anchor="middle">exigée avant</text>
<text x="378.5" y="100.0" font-size="10" fill="#52514e" text-anchor="middle">l&#x27;acte</text>
<text x="475.5" y="61.0" font-size="10" fill="#52514e" text-anchor="middle">Une autre</text>
<text x="475.5" y="74.0" font-size="10" fill="#52514e" text-anchor="middle">autorité</text>
<text x="475.5" y="87.0" font-size="10" fill="#52514e" text-anchor="middle">intervient pour</text>
<text x="475.5" y="100.0" font-size="10" fill="#52514e" text-anchor="middle">la suite</text>
<text x="572.5" y="61.0" font-size="10" fill="#52514e" text-anchor="middle">D&#x27;autres</text>
<text x="572.5" y="74.0" font-size="10" fill="#52514e" text-anchor="middle">autorités</text>
<text x="572.5" y="87.0" font-size="10" fill="#52514e" text-anchor="middle">disposent aussi</text>
<text x="572.5" y="100.0" font-size="10" fill="#52514e" text-anchor="middle">de ce pouvoir</text>
<text x="669.5" y="87.0" font-size="10" fill="#52514e" text-anchor="middle">Limite écrite de</text>
<text x="669.5" y="100.0" font-size="10" fill="#52514e" text-anchor="middle">temps ou d&#x27;objet</text>
<rect x="0" y="112.0" width="720" height="34" fill="#f7f5f0"/>
<text x="0.0" y="133.0" font-size="11" fill="#0A0A0E" text-anchor="start">Nommer le Premier ministre</text>
<text x="320.0" y="133.0" font-size="10" fill="#898781" text-anchor="end">art. 8, al. 1</text>
<circle cx="378.5" cy="129.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="475.5" cy="129.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="572.5" cy="129.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="669.5" cy="129.0" r="7" fill="#184f95"/>
<text x="0.0" y="167.0" font-size="11" fill="#0A0A0E" text-anchor="start">Soumettre un projet de loi au référendum</text>
<text x="320.0" y="167.0" font-size="10" fill="#898781" text-anchor="end">art. 11</text>
<circle cx="378.5" cy="163.0" r="7" fill="#184f95"/>
<circle cx="475.5" cy="163.0" r="7" fill="#184f95"/>
<circle cx="572.5" cy="163.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="669.5" cy="163.0" r="7" fill="#184f95"/>
<rect x="0" y="180.0" width="720" height="34" fill="#f7f5f0"/>
<text x="0.0" y="201.0" font-size="11" fill="#0A0A0E" text-anchor="start">Dissoudre l&#x27;Assemblée nationale</text>
<text x="320.0" y="201.0" font-size="10" fill="#898781" text-anchor="end">art. 12</text>
<circle cx="378.5" cy="197.0" r="7" fill="#184f95"/>
<circle cx="475.5" cy="197.0" r="7" fill="#184f95"/>
<circle cx="572.5" cy="197.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="669.5" cy="197.0" r="7" fill="#184f95"/>
<text x="0.0" y="235.0" font-size="11" fill="#0A0A0E" text-anchor="start">Exercer les pouvoirs exceptionnels</text>
<text x="320.0" y="235.0" font-size="10" fill="#898781" text-anchor="end">art. 16</text>
<circle cx="378.5" cy="231.0" r="7" fill="#184f95"/>
<circle cx="475.5" cy="231.0" r="7" fill="#184f95"/>
<circle cx="572.5" cy="231.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="669.5" cy="231.0" r="7" fill="#184f95"/>
<rect x="0" y="248.0" width="720" height="34" fill="#f7f5f0"/>
<text x="0.0" y="269.0" font-size="11" fill="#0A0A0E" text-anchor="start">Adresser un message au Parlement</text>
<text x="320.0" y="269.0" font-size="10" fill="#898781" text-anchor="end">art. 18</text>
<circle cx="378.5" cy="265.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="475.5" cy="265.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="572.5" cy="265.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="669.5" cy="265.0" r="7" fill="#184f95"/>
<text x="0.0" y="303.0" font-size="11" fill="#0A0A0E" text-anchor="start">Saisir le Conseil constitutionnel d&#x27;un traité</text>
<text x="320.0" y="303.0" font-size="10" fill="#898781" text-anchor="end">art. 54</text>
<circle cx="378.5" cy="299.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="475.5" cy="299.0" r="7" fill="#184f95"/>
<circle cx="572.5" cy="299.0" r="7" fill="#184f95"/>
<circle cx="669.5" cy="299.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<rect x="0" y="316.0" width="720" height="34" fill="#f7f5f0"/>
<text x="0.0" y="337.0" font-size="11" fill="#0A0A0E" text-anchor="start">Nommer au Conseil constitutionnel</text>
<text x="320.0" y="337.0" font-size="10" fill="#898781" text-anchor="end">art. 56</text>
<circle cx="378.5" cy="333.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="475.5" cy="333.0" r="7" fill="#184f95"/>
<circle cx="572.5" cy="333.0" r="7" fill="#184f95"/>
<circle cx="669.5" cy="333.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="0.0" y="371.0" font-size="11" fill="#0A0A0E" text-anchor="start">Déférer une loi au Conseil constitutionnel</text>
<text x="320.0" y="371.0" font-size="10" fill="#898781" text-anchor="end">art. 61</text>
<circle cx="378.5" cy="367.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="475.5" cy="367.0" r="7" fill="#184f95"/>
<circle cx="572.5" cy="367.0" r="7" fill="#184f95"/>
<circle cx="669.5" cy="367.0" r="6.5" fill="none" stroke="#e1e0d9" stroke-width="1.5"/>
<line x1="0" y1="394.0" x2="720" y2="394.0" stroke="#e1e0d9"/>
<text x="0" y="407.0" font-size="9" fill="#52514e">Constitution du 4 octobre 1958, art. 8, 11, 12, 16, 18, 19, 54, 56, 61, versions en vigueur lues sur Légifrance</text>
<text x="0" y="419.0" font-size="9" fill="#52514e">Case pleine : citation exacte de l’article (liste sur la page). Case vide : rien dans cet article ; ni autres articles, ni pratique.</text>
<text x="0" y="431.0" font-size="9" fill="#898781">Compilation Stéphane Lalut, CC BY 4.0 · stephane-lalut.com/pouvoirs-du-president-de-la-republique/</text>
</svg>