<circle cx="495.0" cy="269.0" r="7" fill="#184f95"/>
<circle cx="585.0" cy="269.0" r="6.5" fill="none" stroke="#898781" stroke-width="1.5"/>
<circle cx="675.0" cy="269.0" r="7" fill="#184f95"/>
