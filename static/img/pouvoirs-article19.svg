<text x="0.0" y="492.0" font-size="12" fill="#0A0A0E" text-anchor="start">Déférer une loi au Conseil constitutionnel</text>
<text x="352.0" y="492.0" font-size="11" fill="#898781" text-anchor="end">art. 61</text>
<circle cx="405.0" cy="488.0" r="6.5" fill="none" stroke="#898781" stroke-width="1.5"/>
<circle cx="495.0" cy="488.0" r="7" fill="#184f95"/>
<circle cx="585.0" cy="488.0" r="7" fill="#184f95"/>
<circle cx="675.0" cy="488.0" r="7" fill="#184f95"/>
<line x1="0" y1="509.0" x2="720" y2="509.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="524.0" font-size="11" fill="#52514e">Constitution du 4 octobre 1958, art. 8, 11, 12, 16, 18, 19, 54, 56, 61, versions en vigueur lues sur Légifrance</text>
<text class="pied-note" x="0" y="538.0" font-size="11" fill="#52514e">Case pleine : citation exacte de l’article (liste et justification sur la page). Case vide : rien dans cet article ;</text>
<text class="pied-note" x="0" y="552.0" font-size="11" fill="#52514e">ne dit rien des autres articles ni de la pratique. « Exigé avant » : proposition, consultation ou acte d’un autre</text>
<text class="pied-note" x="0" y="566.0" font-size="11" fill="#52514e">acteur ; « autre acteur » : institution, autorité ou corps électoral à qui l’article attribue une intervention</text>
<text class="pied-note" x="0" y="580.0" font-size="11" fill="#52514e">distincte après l’acte, même facultative ; les modalités matérielles d’exécution ne comptent pas.</text>
