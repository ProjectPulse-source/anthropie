<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 602" role="img" aria-labelledby="pv-t pv-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="pv-t">Les huit dispositions de l’article 19, acte par acte : ce que le texte de chaque article exige avant, qui il fait intervenir ensuite</title><desc id="pv-d">Matrice de douze actes répartis entre les huit dispositions de l&#x27;article 19, et quatre colonnes. Une case pleine signifie que l&#x27;article lui-même contient une citation exacte de l&#x27;élément. Trois actes n&#x27;y ont ni élément exigé avant l&#x27;acte ni autre acteur pour la suite : nommer le Premier ministre, adresser un message au Parlement et désigner le président du Conseil constitutionnel.</desc>
<rect width="720" height="602" fill="#ffffff"/>
<text x="0.0" y="18.0" font-size="14" fill="#0A0A0E" text-anchor="start" font-weight="600">L’article 19 dispense de contreseing huit dispositions</text>
<text x="0.0" y="37.0" font-size="12" fill="#52514e" text-anchor="start">acte par acte, ce que le texte de chaque article exige ou fait intervenir</text>
<text x="405.0" y="79.0" font-size="11" fill="#52514e" text-anchor="middle">Exigé avant</text>
<text x="405.0" y="92.0" font-size="11" fill="#52514e" text-anchor="middle">l&#x27;acte</text>
<text x="495.0" y="79.0" font-size="11" fill="#52514e" text-anchor="middle">Autre acteur</text>
<text x="495.0" y="92.0" font-size="11" fill="#52514e" text-anchor="middle">pour la suite</text>
<text x="585.0" y="79.0" font-size="11" fill="#52514e" text-anchor="middle">Pouvoir</text>
<text x="585.0" y="92.0" font-size="11" fill="#52514e" text-anchor="middle">partagé</text>
<text x="675.0" y="79.0" font-size="11" fill="#52514e" text-anchor="middle">Autre cadre</text>
<text x="675.0" y="92.0" font-size="11" fill="#52514e" text-anchor="middle">écrit</text>
<rect x="0" y="104.0" width="720" height="30.0" fill="#f7f5f0"/>
<text x="0.0" y="123.0" font-size="12" fill="#0A0A0E" text-anchor="start">Nommer le Premier ministre</text>
<text x="352.0" y="123.0" font-size="11" fill="#898781" text-anchor="end">art. 8, al. 1</text>
