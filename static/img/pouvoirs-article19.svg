<rect x="0" y="164.0" width="720" height="30.0" fill="#f7f5f0"/>
<text x="0.0" y="183.0" font-size="12" fill="#0A0A0E" text-anchor="start">Référendum sur un projet de loi</text>
<text x="352.0" y="183.0" font-size="11" fill="#898781" text-anchor="end">art. 11</text>
