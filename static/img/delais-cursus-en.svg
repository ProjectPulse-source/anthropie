<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 331" role="img" font-variant-numeric="tabular-nums" aria-labelledby="dc-t dc-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="dc-t">Training a general practitioner in France, and the length of a presidential term</title><desc id="dc-d">Two bars on the same scale. Above, the general practice curriculum: 3 years of first cycle, 3 years of second cycle, then 4 years of general practice residency, the last under supervised autonomy: 10 years from the first year and 9 from admission to the second year. Below, a presidential term of 5 years. Comparison of scale only.</desc>
<rect width="720" height="331" fill="#ffffff"/>
<text x="0.0" y="18.0" font-size="13" fill="#0A0A0E" text-anchor="start" font-weight="600">Training a general practitioner in France, and the length of a presidential term</text>
<text x="0.0" y="36.0" font-size="12" fill="#52514e" text-anchor="start">in years, minimum durations written in the texts in force</text>
<text x="0.0" y="91.0" font-size="11" fill="#0A0A0E" text-anchor="start" font-weight="600">General practice</text>
<rect x="120.0" y="70" width="177.0" height="32" fill="#c9cdd3" stroke="#ffffff" stroke-width="2"/>
<text x="208.5" y="90.0" font-size="10" fill="#0A0A0E" text-anchor="middle">1st cycle</text>
<rect x="297.0" y="70" width="177.0" height="32" fill="#c9cdd3" stroke="#ffffff" stroke-width="2"/>
<text x="385.5" y="90.0" font-size="10" fill="#0A0A0E" text-anchor="middle">2nd cycle</text>
<rect x="474.0" y="70" width="177.0" height="32" fill="#7fa3cf" stroke="#ffffff" stroke-width="2"/>
<rect x="651.0" y="70" width="59.0" height="32" fill="#184f95" stroke="#ffffff" stroke-width="2"/>
<rect x="475.0" y="70" width="234.0" height="32" fill="none" stroke="#184f95" stroke-width="1.5"/>
<text x="562.5" y="90.0" font-size="10" fill="#0A0A0E" text-anchor="middle">General practice residency</text>
<text x="592.0" y="64.0" font-size="10" fill="#184f95" text-anchor="middle" font-weight="600">General practice residency: 4 years</text>
<text x="710.0" y="116.0" font-size="9.5" fill="#184f95" text-anchor="end">last year: supervised autonomy</text>
<path d="M179.0 127 V132 H710.0 V127" fill="none" stroke="#52514e"/>
<text x="183.0" y="145.0" font-size="10" fill="#52514e" text-anchor="start">9 years from admission to the 2nd year</text>
<text x="0.0" y="189.0" font-size="11" fill="#0A0A0E" text-anchor="start" font-weight="600">Presidential term</text>
<rect x="120.0" y="168" width="295.0" height="32" fill="#8a8f98"/>
<text x="267.5" y="188.0" font-size="10" fill="#ffffff" text-anchor="middle">5 years</text>
