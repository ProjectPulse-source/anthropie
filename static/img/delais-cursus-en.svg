<text class="pied-source" x="0" y="253.0" font-size="11" fill="#52514e">Order of 8 April 2013, art. 1; Education Code, art. L632-2; Law no. 2022-1616, art. 37; Constitution, art. 6</text>
<text class="pied-note" x="0" y="267.0" font-size="11" fill="#52514e">Minimum durations, without repeating a year, interruption or alternative-entry route, for students who entered</text>
<text class="pied-note" x="0" y="281.0" font-size="11" fill="#52514e">residency from the 2023 academic year. Comparison of scale only: neither the effect of a policy nor the date of its</text>
