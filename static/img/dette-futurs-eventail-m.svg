<text class="pied-note" x="0" y="756.0" font-size="13.5" fill="#52514e">Les bandes sont des projections</text>
<text class="pied-note" x="0" y="773.0" font-size="13.5" fill="#52514e">conditionnelles fondées sur des chocs</text>
<text class="pied-note" x="0" y="790.0" font-size="13.5" fill="#52514e">historiques, non des prévisions.</text>
<text class="pied-note" x="0" y="807.0" font-size="13.5" fill="#52514e">Bandes, de la plus claire à la plus</text>
<text class="pied-note" x="0" y="824.0" font-size="13.5" fill="#52514e">foncée : du 10e au 90e, du 20e au 80e</text>
<text class="pied-note" x="0" y="841.0" font-size="13.5" fill="#52514e">et du 40e au 60e centile des</text>
<text class="pied-note" x="0" y="858.0" font-size="13.5" fill="#52514e">trajectoires simulées par la</text>
<text class="pied-note" x="0" y="875.0" font-size="13.5" fill="#52514e">Commission (8, 6 et 2 sur 10). Départs</text>
<text class="pied-note" x="0" y="892.0" font-size="13.5" fill="#52514e">en 2025 : Commission 116,3 %, PLF 2027</text>
<text class="pied-note" x="0" y="909.0" font-size="13.5" fill="#52514e">115,7 %, engagement de 2024 114,7 % ;</text>
<text class="pied-note" x="0" y="926.0" font-size="13.5" fill="#52514e">l'engagement ne donne pas de valeur</text>
<text class="pied-note" x="0" y="943.0" font-size="13.5" fill="#52514e">pour 2026.</text>
