<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 991" role="img" font-variant-numeric="tabular-nums" aria-labelledby="futurs-eventail-m-t futurs-eventail-m-d" font-family="Inter, &#x27;Helvetica Neue&#x27;, Arial, sans-serif">
<title id="futurs-eventail-m-t">La dette publique en 2030 : plusieurs futurs, sous quelles hypothèses ?</title><desc id="futurs-eventail-m-d">Éventail des trajectoires de dette simulées par la Commission européenne de 2025 à 2030 : en 2030, 10e centile 118,1 %, 90e centile 136,2 % ; référence de la Commission 126,5 % en 2030 et 140,8 % en 2035 ; prévision du PLF 2027 : 120,9 % en 2030 ; engagement d'octobre 2024 : 115,8 % en 2029. Bandes, de la plus claire à la plus foncée : du 10e au 90e, du 20e au 80e et du 40e au 60e centile des trajectoires simulées par la Commission (8, 6 et 2 sur 10). Départs en 2025 : Commission 116,3 %, PLF 2027 115,7 %, engagement de 2024 114,7 %.</desc>
