<title id="mc-t">Même dette, charge différente : les 27 pays de l'UE en 2025</title><desc id="mc-d">Chaque point est un pays. Les pointillés relient les faux jumeaux désignés par la règle publiée : dette voisine, charge très différente. Deux droites de moindres carrés, une par groupe, sur leur plage observée. Charge : Hongrie 8,9 %, Slovénie 2,7 %, France 4,3 %, Italie 8,0 %.</desc>
