<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 493" role="img" font-variant-numeric="tabular-nums" aria-labelledby="mt-t mt-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="mt-t">Pression de refinancement : échéances et écart de taux, 2025</title><desc id="mt-d">Chaque point est un pays : à droite, une plus grande part de la dette arrive à échéance dans l'année ; en haut, le rendement harmonisé à 10 ans dépasse davantage le taux implicite du stock. Si les conditions de financement restaient supérieures au coût de la dette remplacée, les refinancements pousseraient le coût moyen à la hausse. Sous zéro, l'indicateur est orienté dans l'autre sens. Repère, non prévision. France : 9,5 % de la dette à moins d'un an, écart de 1,36 point.</desc>
