<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 902" role="img" font-variant-numeric="tabular-nums" aria-labelledby="alm-t alm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="alm-t">Les lois qui n'appellent aucune mesure d'application, par session</title><desc id="alm-d">Barres horizontales, une par session : lois d'application directe pour les deux sources, lois classées différemment par le baromètre et par le Sénat, lois qui appellent des mesures. Par session : 2017-2018 : 41 lois, 11 directes pour les deux sources, 3 classées différemment; 2018-2019 : 49 lois, 22 directes pour les deux sources, 3 classées différemment; 2019-2020 : 43 lois, 15 directes pour les deux sources, 1 classées différemment; 2020-2021 : 51 lois, 17 directes pour les deux sources, 3 classées différemment; 2021-2022 : 64 lois, 15 directes pour les deux sources, 9 classées différemment; 2022-2023 : 44 lois, 10 directes pour les deux sources, 1 classées différemment; 2023-2024 : 51 lois, 21 directes pour les deux sources, 0 classées différemment; 2024-2025 : 56 lois, 19 directes pour les deux sources, 6 classées différemment. En 2018-2019, le baromètre compte 25 lois d'application directe sur 49. Les valeurs sont dans le tableau sous la figure.</desc>
<rect width="300" height="902" fill="#ffffff"/>
