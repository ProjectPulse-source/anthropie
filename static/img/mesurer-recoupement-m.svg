<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 555" role="img" font-variant-numeric="tabular-nums" aria-labelledby="mrm-t mrm-d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="mrm-t">Chômeurs au sens du BIT et inscrits en catégorie A, 2024</title><desc id="mrm-d">Barre en trois segments, en milliers de personnes, moyenne 2024 (estimation Insee) : 863 chômeurs au sens du BIT non inscrits en catégorie A, 1 427 dans les deux à la fois, 1 466 inscrits en catégorie A non chômeurs au sens du BIT. Chômeurs au sens du BIT : 2 290, dont 62 % inscrits en catégorie A. Inscrits en catégorie A : 2 893, dont 49 % chômeurs au sens du BIT.</desc>
<rect width="300" height="555" fill="#ffffff"/>
<text x="0" y="20" font-size="17" font-weight="600" fill="#0A0A0E">Chômeurs au sens du BIT et</text>
<text x="0" y="42" font-size="17" font-weight="600" fill="#0A0A0E">inscrits en catégorie A, 2024</text>
<text x="0.0" y="72.0" font-size="13.5" fill="#898781" text-anchor="start">En milliers de personnes, moyenne 2024</text>
<text x="0.0" y="106.0" font-size="13.5" fill="#52514e" text-anchor="start">Chômeurs BIT non inscrits en A</text>
<rect x="0" y="114" width="129.5" height="22" fill="#c9cdd3"/>
<text x="135.5" y="130.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">863</text>
<text x="0.0" y="160.0" font-size="13.5" fill="#52514e" text-anchor="start">Dans les deux à la fois</text>
<rect x="0" y="168" width="214.1" height="22" fill="#184f95"/>
<text x="220.1" y="184.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">1 427</text>
<text x="0.0" y="214.0" font-size="13.5" fill="#52514e" text-anchor="start">Inscrits en A non chômeurs BIT</text>
<rect x="0" y="222" width="220.0" height="22" fill="#c9cdd3"/>
<text x="226.0" y="238.0" font-size="15" fill="#0A0A0E" text-anchor="start" font-weight="600">1 466</text>
<text x="0.0" y="274.0" font-size="13.5" fill="#0A0A0E" text-anchor="start" font-weight="600">Chômeurs BIT : 2 290,</text>
<text x="0.0" y="292.0" font-size="13.5" fill="#52514e" text-anchor="start">dont 62 % inscrits en A</text>
<text x="0.0" y="314.0" font-size="13.5" fill="#0A0A0E" text-anchor="start" font-weight="600">Inscrits en A : 2 893,</text>
<text x="0.0" y="332.0" font-size="13.5" fill="#52514e" text-anchor="start">dont 49 % chômeurs BIT</text>
<line x1="0" y1="346.0" x2="300" y2="346.0" stroke="#e1e0d9"/>
<text class="pied-source" x="0" y="367.0" font-size="13.5" fill="#52514e">Insee Références, Emploi, chômage,</text>
<text class="pied-source" x="0" y="384.0" font-size="13.5" fill="#52514e">revenus du travail, éd. 2026, dossier</text>
<text class="pied-source" x="0" y="401.0" font-size="13.5" fill="#52514e">1, figures 2 et 8 (appariement</text>
<text class="pied-source" x="0" y="418.0" font-size="13.5" fill="#52514e">Dares-Insee-France Travail)</text>
<text class="pied-note" x="0" y="439.0" font-size="13.5" fill="#52514e">Estimation de l'Insee, moyenne 2024,</text>
<text class="pied-note" x="0" y="456.0" font-size="13.5" fill="#52514e">France hors Mayotte, 15-64 ans,</text>
<text class="pied-note" x="0" y="473.0" font-size="13.5" fill="#52514e">logement ordinaire ; deux définitions</text>
<text class="pied-note" x="0" y="490.0" font-size="13.5" fill="#52514e">distinctes ; marge d'enquête non</text>
<text class="pied-note" x="0" y="507.0" font-size="13.5" fill="#52514e">publiée.</text>
