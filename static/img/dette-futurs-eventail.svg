<circle cx="58.0" cy="359.3" r="3" fill="#ffffff" stroke="#b8703f" stroke-width="1.5"/>
<circle cx="214.8" cy="337.4" r="3" fill="#ffffff" stroke="#b8703f" stroke-width="1.5"/>
<circle cx="293.2" cy="342.3" r="3" fill="#ffffff" stroke="#b8703f" stroke-width="1.5"/>
<circle cx="371.6" cy="346.0" r="3" fill="#ffffff" stroke="#b8703f" stroke-width="1.5"/>
<text x="371.6" y="366.0" font-size="12" font-weight="400" text-anchor="middle" fill="#b8703f">Engagement d'octobre 2024</text>
<text x="371.6" y="380.0" font-size="12" font-weight="400" text-anchor="middle" fill="#b8703f">115,8 % en 2029</text>
<text x="460.0" y="101.5" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">90e centile — 136,2 %</text>
<text x="460.0" y="219.6" font-size="12" font-weight="600" text-anchor="start" fill="#184f95">Commission, politique inchangée</text>
<text x="460.0" y="235.6" font-size="12" font-weight="600" text-anchor="start" fill="#184f95">126,5 % en 2030</text>
<text x="460.0" y="251.6" font-size="12" font-weight="400" text-anchor="start" fill="#184f95">sans nouvelles mesures après 2026</text>
<text x="460.0" y="277.9" font-size="12" font-weight="600" text-anchor="start" fill="#eb6834">Prévision du PLF 2027</text>
<text x="460.0" y="293.9" font-size="12" font-weight="600" text-anchor="start" fill="#eb6834">120,9 % en 2030</text>
<text x="460.0" y="321.8" font-size="12" font-weight="400" text-anchor="start" fill="#52514e">10e centile — 118,1 %</text>
<line x1="0" y1="420.0" x2="720" y2="420.0" stroke="#d8d6d0"/>
<text class="pied-source" x="0" y="435.0" font-size="11" fill="#52514e">Sources : Commission européenne, Debt Sustainability Monitor 2025 (fiche France) ; Gouvernement, plan budgétaire et</text>
<text class="pied-source" x="0" y="449.0" font-size="11" fill="#52514e">structurel à moyen terme (octobre 2024) et rapport sur la dette annexé au PLF 2027.</text>
<text class="pied-note" x="0" y="463.0" font-size="11" fill="#52514e">Au-delà de 2030, hors de l'éventail : projection à politique inchangée de la Commission en 2035, 140,8 % du PIB, sans</text>
<text class="pied-note" x="0" y="477.0" font-size="11" fill="#52514e">nouvelles mesures après 2026. Les bandes sont des projections conditionnelles fondées sur des chocs économiques</text>
<text class="pied-note" x="0" y="491.0" font-size="11" fill="#52514e">historiques ; elles ne prédisent ni les décisions futures ni leurs conséquences. Bandes, de la plus claire à la plus</text>
<text class="pied-note" x="0" y="505.0" font-size="11" fill="#52514e">foncée : du 10e au 90e, du 20e au 80e et du 40e au 60e centile des trajectoires simulées par la Commission (8, 6 et 2</text>
<text class="pied-note" x="0" y="519.0" font-size="11" fill="#52514e">sur 10). Les trois trajectoires reposent sur des hypothèses et des points de départ différents. Départs en 2025 :</text>
<text class="pied-note" x="0" y="533.0" font-size="11" fill="#52514e">Commission 116,3 % (février 2026), PLF 2027 115,7 % (octobre 2026), engagement de 2024 114,7 % (octobre 2024) ;</text>
<text class="pied-note" x="0" y="547.0" font-size="11" fill="#52514e">l'engagement ne donne pas de valeur pour 2026.</text>
