<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 569" role="img" font-variant-numeric="tabular-nums" aria-labelledby="futurs-eventail-t futurs-eventail-d" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title id="futurs-eventail-t">La dette publique en 2030 : plusieurs futurs, sous quelles hypothèses ?</title><desc id="futurs-eventail-d">Éventail des trajectoires de dette simulées par la Commission européenne de 2025 à 2030 : en 2030, 10e centile 118,1 %, 90e centile 136,2 % ; référence de la Commission 126,5 % en 2030 et 140,8 % en 2035 ; prévision du PLF 2027 : 120,9 % en 2030 ; engagement d'octobre 2024 : 115,8 % en 2029. Bandes, de la plus claire à la plus foncée : du 10e au 90e, du 20e au 80e et du 40e au 60e centile des trajectoires simulées par la Commission (8, 6 et 2 sur 10). Départs en 2025 : Commission 116,3 %, PLF 2027 115,7 %, engagement de 2024 114,7 %.</desc>
<rect width="720" height="569" fill="#ffffff"/>
<text x="0.0" y="22.0" font-size="17" font-weight="600" text-anchor="start" fill="#1a1a1a">La dette publique en 2030 : plusieurs futurs, sous quelles hypothèses ?</text>
<text x="0.0" y="44.0" font-size="13" font-weight="400" text-anchor="start" fill="#52514e">Dette publique française, en % du PIB</text>
<line x1="54" x2="450" y1="355.7" y2="355.7" stroke="#e6e5e1"/>
<text x="46.0" y="359.7" font-size="12" font-weight="400" text-anchor="end" fill="#52514e">115 %</text>
<line x1="54" x2="450" y1="294.9" y2="294.9" stroke="#e6e5e1"/>
<text x="46.0" y="298.9" font-size="12" font-weight="400" text-anchor="end" fill="#52514e">120 %</text>
<line x1="54" x2="450" y1="234.1" y2="234.1" stroke="#e6e5e1"/>
<text x="46.0" y="238.1" font-size="12" font-weight="400" text-anchor="end" fill="#52514e">125 %</text>
<line x1="54" x2="450" y1="173.3" y2="173.3" stroke="#e6e5e1"/>
<text x="46.0" y="177.3" font-size="12" font-weight="400" text-anchor="end" fill="#52514e">130 %</text>
<line x1="54" x2="450" y1="112.5" y2="112.5" stroke="#e6e5e1"/>
<text x="46.0" y="116.5" font-size="12" font-weight="400" text-anchor="end" fill="#52514e">135 %</text>
<text x="58.0" y="400.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">2025</text>
<text x="136.4" y="400.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">2026</text>
<text x="214.8" y="400.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">2027</text>
<text x="293.2" y="400.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">2028</text>
<text x="371.6" y="400.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">2029</text>
<text x="450.0" y="400.0" font-size="12" font-weight="400" text-anchor="middle" fill="#52514e">2030</text>
<polygon points="58.0,339.5 136.4,263.5 214.8,220.9 293.2,178.7 371.6,140.7 450.0,97.5 450.0,317.8 371.6,332.5 293.2,344.2 214.8,358.2 136.4,368.6 58.0,339.5" fill="#184f95" fill-opacity="0.13" stroke="none"/>
<polygon points="58.0,339.5 136.4,287.1 214.8,251.1 293.2,215.5 371.6,179.9 450.0,143.1 450.0,284.6 371.6,304.7 293.2,321.4 214.8,339.2 136.4,352.2 58.0,339.5" fill="#184f95" fill-opacity="0.18" stroke="none"/>
<polygon points="58.0,339.5 136.4,311.9 214.8,285.8 293.2,255.3 371.6,228.1 450.0,197.4 450.0,239.1 371.6,264.8 293.2,286.4 214.8,311.5 136.4,331.0 58.0,339.5" fill="#184f95" fill-opacity="0.28" stroke="none"/>
<polyline points="58.0,339.5 136.4,318.4 214.8,294.7 293.2,268.2 371.6,243.5 450.0,215.6" fill="none" stroke="#184f95" stroke-width="2.5" stroke-dasharray="6 4"/>
<polyline points="58.0,347.2 136.4,303.4 214.8,274.2 293.2,265.7 371.6,271.8 450.0,283.9" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-dasharray="10 4"/>
<circle cx="58.0" cy="347.2" r="3.5" fill="#eb6834"/>
<circle cx="136.4" cy="303.4" r="3.5" fill="#eb6834"/>
<circle cx="214.8" cy="274.2" r="3.5" fill="#eb6834"/>
<circle cx="293.2" cy="265.7" r="3.5" fill="#eb6834"/>
