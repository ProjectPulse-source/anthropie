  dgt_bas: {valeur: 3.5, unite: "Md€", source: "Sénat, rapport d'information n° 760 (2025-2026), Imposition des hauts patrimoines, 17 juin 2026 : note de la direction générale du Trésor à la commission des finances, rendement après effets de comportement", piece_sha256: "42802bfbad021b2096133551810a0d881654ea36e089594c7e07f09e29510081"}
