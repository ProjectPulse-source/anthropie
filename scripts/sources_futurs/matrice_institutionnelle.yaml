# Matrice institutionnelle du volet « Quels futurs ? » — SOURCE (écrite à la main, sans aucun montant saisi).
# Lue par scripts/update_dette_futurs.py, qui résout les jetons {…}, contrôle la structure et écrit le bloc « matrice » de
# data/dette_futurs.json et le tableau complet static/dette_futurs_matrice.csv. Ne pas éditer ces sorties.
#
# Matière : D:\PRO\06_PROMOTION\RECHERCHE_QUELS_FUTURS_DETTE_2026-11-09\MATRICE_INSTITUTIONNELLE.md (v4) et
# NOTE_LECTURES_P0.md ; arbitrages PRO-20261109-095636 et PRO-20261109-104650.
#
# Règles (contrôlées par le générateur, arrêt sinon) :
#  - chaque opération a les sept champs, en FR et en EN, et un statut par champ ;
#  - statuts : lu | calc | site | infere | non_etabli ; issue : reduite | deplacee | aggravee | conditionnelle |
#    non_determinee ; robustesse : calculee | mecanisme_documente | non_determinee ;
#  - aucun montant, pourcentage ou nombre de points écrit en clair dans un texte : uniquement des jetons {…}.
#    Jetons disponibles : ceux du générateur (calculs, AFT, jeux du site) et ceux du bloc « valeurs » ci-dessous ;
#  - un « valeurs » est une donnée TRANSCRITE d'une source lue, vérifiée contre la pièce archivée (empreinte) hors dépôt.

valeurs:
  zucman_mecanique: {valeur: 19.4, unite: "Md€", source: "EU Tax Observatory (Parrinello, Varaschin, Zucman), mars 2025, tableau 1, p. 4", piece_sha256: "c578b166f38fab108079f58c3649d854f66dd097891374836b83d1bcfdd94e13"}
